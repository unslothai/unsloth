  <text x="60" y="116" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">Release aliases and nightly aliases now move independently.</text>
  <rect x="60" y="170" width="500" height="170" rx="16" fill="#14532d"/>
  <text x="92" y="220" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="24" font-weight="700">Versioned v* release</text>
  <text x="92" y="266" fill="#dcfce7" font-family="Arial, sans-serif" font-size="24">latest  ·  studio</text>
  <text x="92" y="304" fill="#bbf7d0" font-family="Arial, sans-serif" font-size="19">release-labelled digest</text>
  <rect x="640" y="170" width="500" height="170" rx="16" fill="#1e3a8a"/>
