  <rect x="60" y="430" width="1080" height="112" rx="16" fill="#1e293b"/>
  <text x="92" y="478" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="23">Pulling :studio keeps the latest release stable while :nightly follows main.</text>
