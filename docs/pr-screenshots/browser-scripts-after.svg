  <text x="120" y="405" fill="#86efac" font-family="Arial, sans-serif" font-size="22" font-weight="700">browser_evaluate runs without a prompt</text>
  <text x="120" y="449" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="18">The default remains Ask every time; Always allow is an explicit global opt-in for trusted pages.</text>
