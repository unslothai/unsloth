server {
    listen 80;
    server_name _;
    root /ragflow/web/dist;
    client_max_body_size 1g;
    client_body_timeout 600s;

    # Production TLS terminates at the trusted edge. These headers are
    # emitted by the same-origin application proxy and are release gates.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # rag-platform-default ^/api/v1/admin(?:/|$) 9381
    # rag-platform-default ^/(?:v1|api)(?:/|$) 9380
    location ~ ^/(v1|api) {
        proxy_pass http://127.0.0.1:$rag_platform_service_port;
        include proxy.conf;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header X-Accel-Buffering "no" always;
        include /etc/nginx/security-headers.conf;
    }

    # External provider redirects do not carry the /api prefix.
    location ~ ^/connectors/ {
        proxy_pass http://127.0.0.1:$rag_platform_service_port;
        include proxy.conf;
        proxy_cache off;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}
