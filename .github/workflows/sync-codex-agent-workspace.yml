name: Sync Codex agent workspace with upstream

on:
  push:
    branches:
      - feat/codex-agent-workspace
    paths:
      - .github/workflows/sync-codex-agent-workspace.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current upstream main and resolve the audited conflict
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PhilipJohnBasile"
          git config user.email "1419847+PhilipJohnBasile@users.noreply.github.com"
          git remote add upstream https://github.com/unslothai/unsloth.git
          git fetch --no-tags upstream main

          set +e
          git merge --no-ff --no-commit upstream/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf '%s\n' "${conflicts[@]}" | tee /tmp/conflicted-files.txt
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "studio/frontend/src/features/chat/api/chat-adapter.ts" ]; then
              echo "Unexpected merge conflicts; refusing automatic resolution."
              tar --exclude=.git -czf /tmp/codex-agent-merge-conflicts.tar.gz .
              echo "conflicted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            python - <<'PY'
          from pathlib import Path

          path = Path("studio/frontend/src/features/chat/api/chat-adapter.ts")
          source = path.read_text(encoding="utf-8")
          conflict = '''<<<<<<< HEAD
          import type { ChatModelSummary } from "../types/runtime";
          =======
          import { modelReadsSamplingSeed, type ChatModelRow } from "../types/runtime";
          import { loadFallbackNotice } from "../utils/mmproj-fallback";
          >>>>>>> upstream/main'''
          replacement = '''import {
            modelReadsSamplingSeed,
            type ChatModelRow,
            type ChatModelSummary,
          } from "../types/runtime";'''
          if source.count(conflict) != 1:
              raise SystemExit("Expected audited chat-adapter import conflict was not found exactly once")
          source = source.replace(conflict, replacement)
          path.write_text(source, encoding="utf-8")
          PY
            git add studio/frontend/src/features/chat/api/chat-adapter.ts
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U | tee /tmp/conflicted-files.txt
            tar --exclude=.git -czf /tmp/codex-agent-merge-conflicts.tar.gz .
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "conflicted=false" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        if: steps.merge.outputs.conflicted == 'false'
        working-directory: studio/frontend
        run: npm ci --no-fund --no-audit

      - name: Validate merged frontend integration
        if: steps.merge.outputs.conflicted == 'false'
        working-directory: studio/frontend
        run: |
          npm run typecheck
          node --experimental-strip-types --test \
            tests/project-folder-workspace.test.ts \
            tests/project-slash-commands.test.ts \
            tests/agent-workspace-ui.test.ts

      - name: Commit and push the upstream merge
        if: steps.merge.outputs.conflicted == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-codex-agent-workspace.yml
          git diff --check
          git commit -m "Merge upstream main into Codex agent workspace"
          git push origin HEAD:feat/codex-agent-workspace

      - name: Upload unexpected conflict workspace
        if: steps.merge.outputs.conflicted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-agent-merge-conflicts
          path: |
            /tmp/conflicted-files.txt
            /tmp/codex-agent-merge-conflicts.tar.gz
          retention-days: 1

      - name: Fail on unresolved conflicts
        if: steps.merge.outputs.conflicted == 'true'
        run: exit 1
