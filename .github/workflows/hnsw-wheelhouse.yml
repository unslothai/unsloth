# Mirrors the HNSW pair from PyPI for PyPI-blocked networks; studio/hnsw_prebuilt_pins.json stays the
# trust anchor (the installer checks the same sha256 whichever host served the bytes).
name: HNSW wheelhouse

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "release tag to publish under"
        default: "HNSW-Wheels"
      publish:
        description: "upload to the release (otherwise artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hnsw-wheelhouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Download and verify the catalog wheels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Download every catalog wheel and verify size + sha256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.request

          catalog = json.loads(pathlib.Path("studio/hnsw_prebuilt_pins.json").read_text(encoding = "utf-8"))
          out = pathlib.Path("wheelhouse")
          sums, names = [], []
          for package, entry in sorted(catalog["packages"].items()):
              for wheel in entry["wheels"]:
                  name = wheel["filename"]
                  if "/" in name or "\\" in name or not name.endswith(".whl"):
                      raise SystemExit(f"refusing catalog filename {name!r}")
                  for attempt in range(4):
                      try:
                          with urllib.request.urlopen(wheel["url"], timeout = 120) as response:
                              data = response.read()
                          break
                      except OSError as exc:
                          if attempt == 3:
                              raise
                          print(f"retry {name}: {exc}")
                          time.sleep(5 * (attempt + 1))
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != wheel["sha256"] or len(data) != int(wheel["size"]):
                      raise SystemExit(f"{name}: sha256 {digest} size {len(data)} differ from the catalog")
                  (out / name).write_bytes(data)
                  sums.append(f"{digest}  {name}")
                  names.append(name)
          (out / "index.txt").write_text("\n".join(sorted(names)) + "\n", encoding = "ascii")
          (out / "SHA256SUMS").write_text("\n".join(sorted(sums, key = lambda s: s.split()[1])) + "\n", encoding = "ascii")
          print(f"{len(names)} wheels verified")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hnsw-wheelhouse
          path: |
            wheelhouse/*.whl
            wheelhouse/index.txt
            wheelhouse/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish the wheelhouse
    needs: mirror
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: hnsw-wheelhouse
          path: wheelhouse

      # --latest=false: installers and the Desktop updater resolve the latest release.
      - name: Create or update the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "HNSW wheelhouse" \
              --latest=false \
              --notes "Byte-identical copies of the usearch and numkong wheels Unsloth Studio installs for HNSW search over large knowledge bases. Studio checks every wheel against the sha256 committed in studio/hnsw_prebuilt_pins.json; SHA256SUMS lists them."
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            wheelhouse/*.whl wheelhouse/index.txt wheelhouse/SHA256SUMS
