name: Runner pool probe

# Measures queue wait per runner label: identical no-op cells dispatched together.
on:
  pull_request:
    paths:
      - .github/workflows/runner-pool-probe.yml

# Latest-only: cancels a superseded ten-runner matrix. Four cells are macOS against an
# account-wide cap of five concurrent macOS jobs, so the scarce resource is slots.
# The saving is small: a dispatched cell is one echo, median 4s and longest 6s.
# `timeout-minutes` below is the cutoff for a cell that hangs.
# Labels are compared only within one dispatch, so cancelling loses no comparison.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.label }})
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-latest
          - windows-2022
          - macos-latest
          - macos-15
          - macos-26
          - macos-15-intel
    steps:
      - name: Report
        shell: bash
        run: echo "label=${{ matrix.label }} runner=$RUNNER_NAME arch=$(uname -m)"
