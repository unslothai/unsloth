  # Staging repos dispatch on upstream-main to seed caches (scripts/pr_review/staging_ci.py).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # PRs run latest-only; on main running runs are never killed (see studio-backend-ci.yml).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Frontend build + bundle sanity
    runs-on: ubuntu-latest
    env:
      # A release published mid-run puts an update card over the controls the scripts click.
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
    # Must stay above the browser install step's own 33m bound so the step timeout fires first.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # FIXME: drop once @assistant-ui and assistant-stream leave 0.x (0.minor bumps break).
      - name: '@assistant-ui must be pinned exactly (no caret/tilde)'
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          if grep -nE '"(@assistant-ui/[a-z-]+|assistant-stream)":[[:space:]]*"[\^~]' studio/frontend/package.json; then
            echo "::error file=studio/frontend/package.json::These packages must be pinned to exact versions until they leave 0.x. Drop the leading ^ or ~."
            exit 1
          fi
          echo "All assistant-ui packages are pinned exactly."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      # node 22 bundles npm 10.x, which predates allowScripts; fail if the gate is missing.
      - name: Upgrade npm to 11.x (allowScripts enforcement)
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          V=$(npm -v)
          case "$V" in
            11.1[6-9].*|11.[2-9][0-9].*|1[2-9].*) echo "npm $V has allowScripts" ;;
            *) echo "::error::npm $V lacks allowScripts (need >=11.16)"; exit 1 ;;
          esac

      # Must run BEFORE npm ci, where a compromised tarball's install scripts run.
      - name: Lockfile supply-chain audit (pre-install scan)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: allowScripts pins must match the lockfile
        working-directory: ${{ github.workspace }}
        run: |
          python3 tests/studio/test_sync_allow_scripts_pins.py
          python3 scripts/sync_allow_scripts_pins.py --check

      - name: Lockfile must agree with package.json (npm ci is strict)
        # --strict-allow-scripts: any unreviewed install script hard-fails the job.
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: npm ci must not have modified the working tree
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --quiet -- studio/frontend; then
            echo "::error::npm ci modified files; commit the updated lockfile"
            git status -- studio/frontend
            exit 1
          fi

      # Runs first to fail typing regressions within minutes; it checks the 200-turn over 40-turn
      # chat ratio, not timing; slow runners pass.
      - name: Chromium for the long-chat typing gate
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 10
        env:
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python3 -m pip install 'playwright>=1.45,<2'
          python3 -m playwright install chromium
          if [ "$RUNNER_OS" = Linux ] && ! python3 -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            bash .github/scripts/retry-with-apt-lock.sh python3 -m playwright install-deps chromium
          fi

      # Also runs the area matrix (Linux only, tests/studio/_area_matrix.py): the real chat page from
      # the same build with its API answered in-process, every interactive area (menus, dialogs,
      # pickers, panes, sidebar, message controls, typing, scrolling) under the default appearance and
      # every appearance mode, at 40 and 200 turns. Fails when an area restyles more as the chat grows
      # or a mode makes an area cost over 4x the default, and when a popup trigger is not measured.
      # First, a static lint of the built CSS fails on a new non-subject :has() rule (`X:has(...) Y`),
      # which restyles the whole thread whenever an ancestor of it changes (tests/studio/_has_lint.py).
      - name: Browser gate for long-chat typing cost
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 15
        run: python3 tests/studio/playwright_long_thread_gate.py

      # A key added only to en.ts silently falls back to English.
      - name: Locale parity
        run: npm run i18n:check:strict

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck through bun check
        # `npm run typecheck` uses `bun check` when a Bun that has it is on PATH. Runners ship no
        # Bun, so the step above only proves the tsc path; UNSLOTH_TYPECHECK=bun forbids a silent
        # fallback to tsc here. Pinned binary, SHA-256 verified before it runs (value from the
        # release's SHASUMS256.txt). Bun 1.4.3 is the first release with `bun check`; it was
        # admitted before the usual 7-day release-age wait, by explicit maintainer decision.
        run: |
          set -euo pipefail
          BUN_VERSION="1.4.3"
          BUN_SHA256="3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18"
          # Release assets 504 in bursts; no --retry-delay, so 8 curl retries last ~4 minutes.
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 8 --retry-connrefused --retry-all-errors \
            -o "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          PATH="$RUNNER_TEMP/bun/bun-linux-x64:$PATH" UNSLOTH_TYPECHECK=bun npm run typecheck

      # Unit tests and the dependency-removal scan need neither a browser nor the build, so they run
      # in the background, alongside the build and the render/structure browser groups below;
      # "Collect the background lanes" waits for both, prints their logs and fails on either. The
      # browser checks that measure frames, stalls or pacing run only after that wait.
      - name: Start unit tests and the dependency-removal check in the background
        id: lanes
        working-directory: ${{ github.workspace }}
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          LANES="$RUNNER_TEMP/lanes"
          rm -rf "$LANES"
          mkdir -p "$LANES"
          # <name>.rc renamed into place (no partial reads); setsid: lanes outlive this shell.
          start_lane() {
            local name=$1
            { echo 'set -eo pipefail'; cat; } > "$LANES/$name.sh"
            echo "$name" >> "$LANES/names"
            setsid nohup bash -c 'bash "$1" > "$2.log" 2>&1; echo $? > "$2.rc.tmp"; mv "$2.rc.tmp" "$2.rc"' \
              _ "$LANES/$name.sh" "$LANES/$name" < /dev/null > /dev/null 2>&1 &
            echo "started $name"
          }
          # Own vite cache: render groups' servers write node_modules/.vite while this runs.
          start_lane unit_tests <<'SH'
          export VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-unit-tests"
          cd studio/frontend
          timeout --kill-after=30s 20m npm test
          SH
          # Pull requests only. Fetch the base commit with an explicit refspec so origin/<base> exists.
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            start_lane dependency_removal <<'SH'
          python3 scripts/check_frontend_dep_removal.py --base "origin/$BASE_REF" --enumerate-dead
          python3 tests/studio/test_frontend_dep_removal.py
          SH
          fi


      - name: Build
        run: npm run build

      - name: Built bundle must not contain Unsloth's unstable_Provider call site
        run: |
          set -e
          # `ls | head` takes head's status, so check JS is non-empty explicitly.
          JS=$(ls dist/assets/index-*.js 2>/dev/null | head -1)
          if [ ! -f "$JS" ]; then
            echo "::error::no dist/assets/index-*.js to scan, so the build produced no main bundle"
            exit 1
          fi
          # `|| true`: grep -c prints 0 and exits 1 on no match; `|| echo 0` would add a second line.
          HITS=$(grep -c 'unstable_Provider:' "$JS" || true)
          echo "main bundle: $JS"
          echo "unstable_Provider: hits=${HITS:-0} (assistant-ui internals contribute up to 3)"
          if [ "${HITS:-0}" -gt 3 ]; then
            echo "::error file=studio/frontend/src/features/chat/runtime-provider.tsx::Unsloth bundle still passes unstable_Provider through useRemoteThreadListRuntime; this is the 2026.5.1 chat-history regression. Pass adapters directly into useLocalRuntime instead."
            exit 1
          fi

      - name: Bundle size budget (75 MB)
        run: |
          SIZE=$(du -sb dist | cut -f1)
          BUDGET=$((75 * 1024 * 1024))
          echo "dist size: $SIZE bytes ($((SIZE/1024/1024)) MB), budget: $BUDGET bytes (75 MB)"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::studio/frontend/dist/ exceeded the 75 MB budget. Drop dead deps (e.g. the unused next dep) or split chunks."
            exit 1
          fi

      # Entry chunk plus everything Vite preloads before first paint.
      - name: Startup bundle budget
        run: npm run bundle:check

      # Smokes go last: a red smoke would otherwise skip the build gates.
      # No --with-deps: download the engine, probe launch, and run apt only if libraries are missing.
      - name: Pin the Playwright version so the browser cache has a key
        id: pw
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install 'playwright>=1.45,<2' pytest
          echo "version=$(python3 -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
          # Browser builds differ per OS release; one restored onto another release exits at launch.
          echo "os=$(. /etc/os-release && echo "${ID}-${VERSION_ID}")" >> "$GITHUB_OUTPUT"

      # Key identical to the chromium-only shards in studio-ui-smoke.yml, so both share one entry.
      - name: Restore the Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.os }}-${{ steps.pw.outputs.version }}-c-v2

      - name: Restore the apt archive cache (chromium's .deb set)
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: apt-archives-${{ runner.os }}-${{ steps.pw.outputs.os }}-c-v1

      - name: Install Chromium for browser smokes
        working-directory: ${{ github.workspace }}
        # 2 x (2 x 420s + 125s lock wait) = 1930s; a test checks it fits the step timeout.
        timeout-minutes: 33
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '420'
          # apt's own retries multiply stalled transfers inside the attempt budget.
          APT_ACQUIRE_RETRIES: '0'
        run: |
          # No --with-deps: it runs its own unbounded `apt-get update`.
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            bash .github/scripts/retry-with-apt-lock.sh \
              python3 -m playwright install chromium
          fi

          # Probe whether the system libraries are actually missing before running apt.
          probe() {
            python3 - "$@" <<'PY'
          import sys
          from playwright.sync_api import sync_playwright

          missing = []
          with sync_playwright() as p:
              for name in sys.argv[1:]:
                  try:
                      browser = getattr(p, name).launch()
                      browser.close()
                  except Exception as exc:
                      missing.append(f"{name}: {type(exc).__name__}")
          if missing:
              print("engines that will not start: " + "; ".join(missing))
              sys.exit(1)
          print("chromium launches; system libraries are present")
          PY
          }

          if probe chromium; then
            echo "::notice::skipped playwright install-deps; the runner image already has the libraries"
          else
            echo "system libraries are missing, installing them"
            # Reuse last run's .debs; apt re-fetches any that do not match its index.
            if [ -d "${{ github.workspace }}/.apt-archives" ]; then
              sudo cp "${{ github.workspace }}"/.apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
              echo "seeded $(ls "${{ github.workspace }}"/.apt-archives/*.deb 2>/dev/null | wc -l) cached .deb files"
            fi
            bash .github/scripts/retry-with-apt-lock.sh \
              python3 -m playwright install-deps chromium
            mkdir -p "${{ github.workspace }}/.apt-archives"
            sudo cp /var/cache/apt/archives/*.deb "${{ github.workspace }}/.apt-archives/" 2>/dev/null || true
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/.apt-archives" || true
            # Fail loudly here rather than as an opaque per-test timeout later.
            probe chromium
          fi

      # Main only; not under always(); immutable keys mean failed installs are never saved.
      - name: Save the Playwright browser cache
        if: (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/upstream-main' && github.repository != 'unslothai/unsloth')) && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}

      - name: Save the apt archive cache
        if: (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/upstream-main' && github.repository != 'unslothai/unsloth')) && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # Imports the harnesses (hence playwright), so it sits after the install.
      - name: Dev-server lifecycle tests
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pytest tests/studio/test_playwright_server_lifecycle.py \
            tests/studio/test_autoscroll_harness_contract.py \
            tests/studio/test_heavy_thread_harness_contract.py \
            tests/studio/test_heavy_thread_measurement_integrity.py \
            tests/studio/test_heavy_thread_gap_contract.py \
            tests/studio/test_code_block_flicker_contract.py \
            tests/studio/test_css_culprit.py \
            tests/studio/test_area_matrix.py \
            tests/studio/test_webkit_leg.py \
            tests/studio/test_webkit_leg_ci.py \
            tests/studio/test_firefox_leg.py \
            tests/studio/test_firefox_leg_ci.py \
            tests/studio/test_appearance_coverage.py \
            tests/studio/test_has_lint.py -q

      # Render/DOM checks need only the page to settle, not timings; two groups run in turn beside
      # the lanes, each under timeout(1) with --kill-after outlasting the harness stop so Vite is
      # not orphaned; frame/pacing serial after lanes.
      - name: Browser render and structure checks (two groups, one after the other)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 25
        run: |
          mkdir -p logs
          # For the pinned chat persistence check's in-process API.
          python3 -m pip install fastapi httpx pyjwt argon2-cffi cryptography huggingface_hub python-multipart structlog
          group_pids=()
          # Groups write to files, so output is printed here on every exit, including cancel.
          cleanup() {
            trap '' INT TERM
            for pid in "${group_pids[@]}"; do
              kill -TERM "$pid" 2>/dev/null || true
            done
            cat logs/playwright-render-a.log logs/playwright-render-b.log 2>/dev/null || true
            for pid in "${group_pids[@]}"; do
              wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          stop_check() {
            if [ -n "$check_pid" ]; then
              kill -TERM "$check_pid" 2>/dev/null || true
              wait "$check_pid" 2>/dev/null || true
            fi
          }
          # run_check NAME BOUND CMD...: one port per check, so no two harnesses ever share one.
          run_check() {
            local name=$1 bound=$2 status=0
            shift 2
            port=$((port + 1))
            echo "::group::$name"
            SMOKE_PORT="$port" PW_PORT="$port" timeout --kill-after=30s "$bound" "$@" &
            check_pid=$!
            wait "$check_pid" || status=$?
            check_pid=
            echo "$name: exit $status"
            echo "::endgroup::"
            [ "$status" -eq 0 ] || { echo "::error title=Browser check $name::$name exited $status"; group_failed=1; }
          }

          (
            group_failed=0 check_pid= port=5600
            trap stop_check EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            # Default cache: fixture and pinned-chat servers cannot repoint it; run serially.
            unset VITE_TEST_CACHE_DIR
            # Structure, not timings: a long thread mounts only the rows near the reader, and
            # scrolling, jumping, copying and a streamed reply must not show it.
            run_check thread_window 10m python3 tests/studio/playwright_thread_window.py
            # Render counts, not timings: a search keystroke or a quant probe answer in the model
            # picker's On Device tab must not re-render every row, and the rows must still navigate.
            run_check model_picker_renders 8m python3 tests/studio/playwright_model_picker_renders.py
            run_check titlebar_blur 5m python3 tests/studio/playwright_titlebar_blur.py
            run_check library_suggested_order 5m python3 tests/studio/playwright_library_suggested_order.py
            # The `plain` case is the positive control and must keep its controls.
            run_check link_definition_probe 10m python3 tests/studio/playwright_link_definition_probe.py
            # Node suite runs no effects: observer, re-arming, cleanup need this browser check.
            run_check progressive_rows 5m python3 tests/studio/playwright_progressive_rows.py
            run_check user_message_time 5m python3 tests/studio/playwright_user_message_time.py
            run_check pinned_chat_persistence 3m python3 tests/studio/playwright_pinned_chat_persistence.py
            exit "$group_failed"
          ) > logs/playwright-render-a.log 2>&1 &
          group_pids+=("$!")
          # One browser at a time: both groups at once, beside the background lanes, overloaded the
          # 4 vCPUs (30 s Playwright timeouts); the lanes still overlap, which is the saving.
          a_rc=0
          wait "${group_pids[0]}" || a_rc=$?
          group_pids=()
          (
            group_failed=0 check_pid= port=5700
            trap stop_check EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            export VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-frontend-render"
            run_check chat_query 4m python3 tests/studio/playwright_chat_query.py
            run_check mcp_app_bridge 10m env PW_BROWSER=chromium \
              python3 tests/studio/playwright_mcp_app_bridge_smoke.py
            # Lost responses, spent grants, old backends: saved folder must match the choice.
            run_check project_folders 10m python3 tests/studio/playwright_project_folders.py \
              --out "$RUNNER_TEMP/project-folders"
            run_check browser_agent_select 5m python3 tests/studio/playwright_browser_agent_select.py
            run_check server_source_folders 10m env SMOKE_OUT="$RUNNER_TEMP/server-source-folders" \
              python3 tests/studio/playwright_server_source_folders.py
            run_check browser_agent_read 5m python3 tests/studio/playwright_browser_agent_read.py
            run_check long_chat_renders 5m python3 tests/studio/playwright_long_chat_renders.py
            # A drag step moves one node; the other nodes of the graph must not re-render.
            run_check recipe_drag_renders 5m python3 tests/studio/playwright_recipe_drag_renders.py
            # Render counts, not timings: a thumbnail arriving or a page appending to the Images or
            # Video strip must not re-render every card's menu, and a card's own menu must delete it.
            run_check gallery_strip_renders 8m python3 tests/studio/playwright_gallery_strip_renders.py
            run_check tool_activity 10m env PW_ENGINE=chromium \
              python3 tests/studio/playwright_tool_activity.py --json
            exit "$group_failed"
          ) > logs/playwright-render-b.log 2>&1 &
          group_pids+=("$!")

          failed=0
          [ "$a_rc" = 0 ] || failed=1
          for pid in "${group_pids[@]}"; do
            wait "$pid" || failed=1
          done
          group_pids=()
          exit "$failed"

      - name: Print the background lane logs (cancelled run)
        if: ${{ cancelled() && steps.lanes.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        run: |
          for f in "$RUNNER_TEMP"/lanes/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$(basename "$f")"; cat "$f"; echo "::endgroup::"
          done

      - name: Collect the background lanes (unit tests, dependency-removal check)
        if: ${{ !cancelled() && steps.lanes.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 15
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          LANES="$RUNNER_TEMP/lanes"
          # Fail closed: a lane that never registered is a failure, not an empty pass.
          expected="unit_tests"
          [ "$EVENT_NAME" = pull_request ] && expected="$expected dependency_removal"
          for name in $expected; do
            grep -qx "$name" "$LANES/names" 2>/dev/null || { echo "::error title=$name::the $name lane never started"; exit 1; }
          done
          show() {
            for name in $(cat "$LANES/names"); do
              echo "::group::$name (exit $(cat "$LANES/$name.rc" 2>/dev/null || echo 'none: still running'))"
              cat "$LANES/$name.log" 2>/dev/null || true
              echo "::endgroup::"
            done
            mkdir -p logs
            for name in $(cat "$LANES/names"); do
              cp "$LANES/$name.log" "logs/playwright-lane-$name.log" 2>/dev/null || true
            done
          }
          # A step timeout or a cancel still prints whatever the lanes had written.
          trap 'trap "" INT TERM; show; exit 143' TERM
          trap 'trap "" INT TERM; show; exit 130' INT
          for name in $(cat "$LANES/names"); do
            while [ ! -f "$LANES/$name.rc" ]; do sleep 5; done
          done
          trap - INT TERM
          show
          failed=0
          for name in $(cat "$LANES/names"); do
            rc=$(cat "$LANES/$name.rc")
            [ "$rc" = 0 ] || { echo "::error title=$name::$name exited $rc"; failed=1; }
          done
          exit "$failed"

      # Fixed-wait hover and pointer checks run alone so CPU contention cannot flip them.
      - name: Icon tooltips follow the pointer between neighbours
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: python3 tests/studio/playwright_tooltip_switch.py chromium

      - name: Browser check for the reply stats card
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: python3 tests/studio/playwright_message_timing_card.py

      # The page mounts one still-modal menu as a control.
      - name: Browser checks for the non-modal dropdown wrapper
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/playwright_nonmodal_menus.py

      # Step bound is the smaller one, leaving 25 min for earlier steps; a job timeout cancels and
      # skips the failure-only upload, so a hung check leaves no log.
      - name: Browser smoke groups for data settings and frontend controls
        working-directory: ${{ github.workspace }}
        timeout-minutes: 15
        run: |
          mkdir -p logs
          group_pids=()
          # Groups write to files, so logs reach the step only here, on every exit. A cancel is
          # SIGINT, then SIGTERM ~7.5 s later, then SIGKILL: ignore the second signal so cleanup is
          # not cut short, then print logs before waiting on teardown, which may outlast SIGKILL.
          cleanup() {
            trap '' INT TERM
            for pid in "${group_pids[@]}"; do
              kill -TERM "$pid" 2>/dev/null || true
            done
            cat logs/playwright-frontend-data.log logs/playwright-frontend-controls.log 2>/dev/null || true
            for pid in "${group_pids[@]}"; do
              wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          stop_check() {
            if [ -n "$check_pid" ]; then
              kill -TERM "$check_pid" 2>/dev/null || true
              wait "$check_pid" 2>/dev/null || true
            fi
          }
          run_check() {
            local name=$1 status=0
            shift
            echo "::group::$name"
            "$@" &
            check_pid=$!
            wait "$check_pid" || status=$?
            check_pid=
            echo "$name: exit $status"
            echo "::endgroup::"
            [ "$status" -eq 0 ] || { echo "::error title=Browser smoke $name::$name exited $status"; group_failed=1; }
          }

          (
            group_failed=0 check_pid=
            trap stop_check EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            export VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-frontend-data"
            run_check data_settings python3 tests/studio/playwright_data_settings.py
            exit "$group_failed"
          ) > logs/playwright-frontend-data.log 2>&1 &
          group_pids+=("$!")
          (
            group_failed=0 check_pid=
            trap stop_check EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            export VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-frontend-controls"
            run_check settings_tabs python3 tests/studio/playwright_settings_tabs.py
            run_check settings_tabs_blocked env PW_CHUNK_FAIL=data PW_PORT=5400 \
              PW_OUT=logs/settings_tabs_blocked_report.json \
              python3 tests/studio/playwright_settings_tabs.py
            run_check find_in_page python3 tests/studio/playwright_find_in_page.py
            run_check keyboard_shortcuts python3 tests/studio/playwright_keyboard_shortcuts.py
            run_check strip_ansi env PW_BROWSER=chromium \
              python3 tests/studio/playwright_strip_ansi_smoke.py
            # --kill-after outlasts the harness's 20 s stop so its Vite server is not orphaned.
            run_check composer_icons timeout --kill-after=30s 180s \
              python3 tests/studio/playwright_composer_icons.py chromium
            run_check research_review python3 tests/studio/playwright_research_review.py
            exit "$group_failed"
          ) > logs/playwright-frontend-controls.log 2>&1 &
          group_pids+=("$!")

          failed=0
          for pid in "${group_pids[@]}"; do
            wait "$pid" || failed=1
          done
          group_pids=()
          exit "$failed"

      # Each harness owns its vite server; backgrounding npm here would orphan the node child.
      - name: Browser smoke for chat autoscroll
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/playwright_chat_autoscroll.py

      - name: Browser smoke for research freeze
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/playwright_research_freeze.py

      # A gate, not a measurement: released and streamdown variants are positive controls that MUST
      # flicker, since neither collapsing means the detector stopped seeing. Chromium only on a PR,
      # the engine whose content-visibility fallback the index.css override exists for.
      - name: Browser smoke for code block flicker
        working-directory: ${{ github.workspace }}
        env:
          SMOKE_FLICKER_ENGINES: chromium
        run: python3 tests/studio/playwright_code_block_flicker.py

      # Two small sizes and one Chromium repeat render each content kind; the full run is too slow
      # for PRs.
      - name: Browser smoke for heavy-thread interaction cost
        working-directory: ${{ github.workspace }}
        env:
          SMOKE_HEAVY_CHARS: '25000,100000'
          SMOKE_HEAVY_ENGINES: chromium
          SMOKE_HEAVY_REPEATS: '1'
          PW_ART_DIR: logs/playwright_heavy_thread
        run: python3 tests/studio/playwright_heavy_thread.py

      # A failure means the click that dismissed a menu also reached the control under it.
      - name: Browser check for non-modal menu dismissal
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/probe_dismiss_guard.py --label ci --engine chromium

      # Reports, does not gate, for now. The budgets inside are calibrated on a
      # developer machine, and this measures a CPU-bound render on a shared runner
      # under 6x throttling, so a budget set from one box is a flake waiting to
      # happen. Tighten it from observed runs here and drop continue-on-error, the
      # way the startup profile did.
      - name: Browser smoke for chat stream pacing
        id: stream_pacing
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: python3 tests/studio/playwright_stream_pacing.py

      # Also check the stream-pacing outcome: continue-on-error makes failure() false for it.
      - name: Upload browser smoke artifacts
        if: failure() || steps.stream_pacing.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: studio-frontend-smoke-artifacts
          path: |
            logs/playwright-*
            logs/settings_tabs_report.json
            logs/settings_tabs_blocked_report.json
            logs/data_settings*
            logs/nonmodal_menus_report.json
            logs/pw/
          retention-days: 3
          if-no-files-found: ignore

      - name: Biome (non-blocking until accumulated drift is cleared)
        continue-on-error: true
        run: npm run biome:check

      - name: Upload built dist
        # Failures only: keeping ~35MB per green run made artifacts the second-largest family, ~3.5GB.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: studio-frontend-dist
          path: studio/frontend/dist
          retention-days: 1

  # WebKit leg of the long-chat gate (tests/studio/_webkit_leg.py), in parallel with the build job so
  # its WebKit install and run stay off that job's critical path. Times opening and closing the
  # browser pane, Settings, shortcuts, palette, composer menu, sidebar and a thread scroll at 1 and 150
  # turns in Playwright WebKit with a macOS and a Linux user agent (Safari, the macOS app, the Linux
  # desktop app): fails when the long chat is over 2.5x the short one and over 200 ms, or has a frame
  # over 250 ms and over 2.5x the short chat's, beyond the known costs pinned in that file.
  webkit:
    name: Long-chat gate (WebKit)
    runs-on: ubuntu-latest
    env:
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
    timeout-minutes: 40
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Upgrade npm to 11.x (allowScripts enforcement)
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          V=$(npm -v)
          case "$V" in
            11.1[6-9].*|11.[2-9][0-9].*|1[2-9].*) echo "npm $V has allowScripts" ;;
            *) echo "::error::npm $V lacks allowScripts (need >=11.16)"; exit 1 ;;
          esac

      # Must run BEFORE npm ci, where a compromised tarball's install scripts run.
      - name: Lockfile supply-chain audit (pre-install scan)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Install dependencies
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: WebKit for the long-chat gate
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 10
        env:
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python3 -m pip install 'playwright>=1.45,<2'
          python3 -m playwright install webkit
          if ! python3 -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.webkit.launch().close(); p.stop()"; then
            bash .github/scripts/retry-with-apt-lock.sh python3 -m playwright install-deps webkit
          fi

      - name: Long-chat production build
        run: npx vite build --config vite.long-thread.config.ts

      - name: Browser gate for long-chat cost in WebKit
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 20
        env:
          LONG_THREAD_WEBKIT: '1'
        run: python3 tests/studio/_webkit_leg.py

  # Firefox leg of the long-chat gate (tests/studio/_firefox_leg.py: the WebKit leg's timing in
  # Playwright Firefox), in parallel like the WebKit job. Times opening and closing Settings, the
  # composer and tools menus, chat options, the palette, search, the browser pane and typing at 1 and
  # 150 turns, default look and Liquid 3D: fails when the long chat is over 2.5x the short one and over
  # 200 ms, or has a frame over 250 ms and over 2.5x the short chat's (a dialog or menu used to cost
  # Firefox about 250 ms more at 150 turns, which the Chromium and WebKit legs could not see).
  firefox:
    name: Long-chat gate (Firefox)
    runs-on: ubuntu-latest
    env:
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
    timeout-minutes: 40
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Upgrade npm to 11.x (allowScripts enforcement)
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          V=$(npm -v)
          case "$V" in
            11.1[6-9].*|11.[2-9][0-9].*|1[2-9].*) echo "npm $V has allowScripts" ;;
            *) echo "::error::npm $V lacks allowScripts (need >=11.16)"; exit 1 ;;
          esac

      # Must run BEFORE npm ci, where a compromised tarball's install scripts run.
      - name: Lockfile supply-chain audit (pre-install scan)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Install dependencies
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: Firefox for the long-chat gate
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 10
        env:
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python3 -m pip install 'playwright>=1.45,<2'
          python3 -m playwright install firefox
          if ! python3 -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.firefox.launch().close(); p.stop()"; then
            bash .github/scripts/retry-with-apt-lock.sh python3 -m playwright install-deps firefox
          fi

      - name: Long-chat production build
        run: npx vite build --config vite.long-thread.config.ts

      - name: Browser gate for long-chat cost in Firefox
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 20
        env:
          LONG_THREAD_FIREFOX: '1'
        run: python3 tests/studio/_firefox_leg.py

  # Own job: the build job runs close to its timeout. Exit 3 (base cannot build) only warns.
  long-chat-ab:
    name: Long-chat cost against the base build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Upgrade npm to 11.x (allowScripts enforcement)
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          V=$(npm -v)
          case "$V" in
            11.1[6-9].*|11.[2-9][0-9].*|1[2-9].*) echo "npm $V has allowScripts" ;;
            *) echo "::error::npm $V lacks allowScripts (need >=11.16)"; exit 1 ;;
          esac

      # Must run BEFORE npm ci, where a compromised tarball's install scripts run.
      - name: Lockfile supply-chain audit (pre-install scan)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Install dependencies
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: Chromium
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 10
        env:
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python3 -m pip install 'playwright>=1.45,<2'
          python3 -m playwright install chromium
          if ! python3 -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            bash .github/scripts/retry-with-apt-lock.sh python3 -m playwright install-deps chromium
          fi

      - name: Long-chat cost against the base build
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 20
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Use the merge ref's first parent; pull_request.base.sha would charge the PR with later
          # main merges.
          BASE_SHA="$EVENT_BASE_SHA"
          if [ "$(git cat-file -p HEAD | grep -c '^parent ')" = 2 ]; then
            BASE_SHA=$(git cat-file -p HEAD | awk '$1 == "parent" {print $2; exit}')
          fi
          echo "long-chat A/B base: $BASE_SHA (event base $EVENT_BASE_SHA)"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          ab() {
            rc=0
            python3 tests/studio/long_thread_ab.py --base-ref "$BASE_SHA" --head-ref HEAD --reps 5 "$@" || rc=$?
            if [ "$rc" = 3 ]; then echo "::warning::base build not comparable with this node_modules; long-chat A/B skipped"; exit 0; fi
            [ "$rc" = 0 ] || exit "$rc"
          }
          ab --areas stream,type,thread_scroll
          ab --areas stream_scroll --tall 6 --stream-ms 10
          ab --areas wheel_sweep

  # Windows-only: reads sources, module URLs. .gitattributes pins LF for substring asserts.
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Frontend unit tests (Windows)
    runs-on: windows-latest
    env:
      # A release published mid-run puts an update card over the controls the scripts click.
      UNSLOTH_DISABLE_UPDATE_CHECK: '1'
    # The steps measured ~15m30s, so 15 always cut off the Firefox step.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # Same pre-install scan as ubuntu: the jobs run concurrently.
      - name: Lockfile supply-chain audit (pre-install scan)
        working-directory: ${{ github.workspace }}
        run: python scripts/lockfile_supply_chain_audit.py

      # --ignore-scripts: a platform gate, so no install scripts run at all.
      - run: npm ci --ignore-scripts --no-fund --no-audit

      # Runs first in every frontend lane so a long-chat typing regression fails within minutes;
      # ratio, not timing: selector matching per keystroke, 200-turn over 40-turn chat, plus :has()
      # budget; slow runners pass.
      - name: Chromium for the long-chat typing gate
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 10
        env:
          APT_ACQUIRE_RETRIES: '0'
        run: |
          python -m pip install 'playwright>=1.45,<2'
          python -m playwright install chromium
          if [ "$RUNNER_OS" = Linux ] && ! python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); p.chromium.launch().close(); p.stop()"; then
            bash .github/scripts/retry-with-apt-lock.sh python -m playwright install-deps chromium
          fi

      - name: Browser gate for long-chat typing cost
        working-directory: ${{ github.workspace }}
        shell: bash
        timeout-minutes: 15
        run: python tests/studio/playwright_long_thread_gate.py

      - name: Unit tests
        run: npm test

      - name: Install alignment test browsers
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: |
          python -m pip install 'playwright>=1.45,<2'
          python -m playwright install chromium firefox

      - name: Composer icon alignment
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: python tests/studio/playwright_composer_icons.py chromium firefox

      - name: Data settings deletion choices in Chromium and Firefox
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs
          PW_ENGINE=chromium PW_PORT=5420 PW_OUT=logs/data_settings_report.json \
            VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-data-chromium" \
            python tests/studio/playwright_data_settings.py > logs/data_settings_chromium.log 2>&1 &
          chromium_pid=$!
          PW_ENGINE=firefox PW_PORT=5421 PW_OUT=logs/data_settings_firefox_report.json \
            VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-data-firefox" \
            python tests/studio/playwright_data_settings.py > logs/data_settings_firefox.log 2>&1 &
          firefox_pid=$!
          failed=0
          wait "$chromium_pid" || failed=1
          wait "$firefox_pid" || failed=1
          for engine in chromium firefox; do
            echo "::group::Data settings: $engine"
            cat "logs/data_settings_$engine.log" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload alignment failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-composer-icons
          path: |
            logs/playwright-composer-icons
            logs/data_settings*
          retention-days: 1
          if-no-files-found: ignore
