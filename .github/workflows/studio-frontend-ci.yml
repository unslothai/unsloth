# Frontend PR gate. biome is non-blocking until its backlog reaches zero.

name: Frontend CI

on:
  pull_request:
    # ready_for_review: Windows/macOS jobs below skip draft pull requests, so marking
    # one ready has to start the run that tests it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'studio/frontend/**'
      - 'scripts/check_frontend_dep_removal.py'
      - 'tests/studio/test_frontend_dep_removal.py'

      - 'tests/studio/playwright_strip_ansi_smoke.py'
      - 'tests/studio/playwright_composer_icons.py'
      - 'tests/studio/playwright_tooltip_switch.py'
      - 'tests/studio/playwright_titlebar_blur.py'
      - 'tests/studio/playwright_chat_autoscroll.py'
      - 'tests/studio/playwright_research_freeze.py'
      - 'tests/studio/playwright_research_review.py'
      - 'tests/studio/playwright_pinned_chat_persistence.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/storage/studio_db.py'
      - 'tests/studio/playwright_heavy_thread.py'
      - 'tests/studio/probe_dismiss_guard.py'
      - 'tests/studio/playwright_nonmodal_menus.py'
      - 'tests/studio/playwright_settings_tabs.py'
      - 'tests/studio/playwright_data_settings.py'
      - 'tests/studio/playwright_keyboard_shortcuts.py'
      - 'tests/studio/playwright_find_in_page.py'
      - 'tests/studio/playwright_project_folders.py'
      - 'tests/studio/playwright_browser_agent_select.py'
      - 'tests/studio/playwright_tool_activity.py'
      - 'tests/studio/playwright_stream_pacing.py'
      - 'tests/studio/playwright_code_block_flicker.py'
      - 'tests/studio/playwright_link_definition_probe.py'
      - 'tests/studio/playwright_user_message_time.py'
      - 'tests/studio/playwright_progressive_rows.py'
      - 'tests/studio/_code_block_flicker_analysis.py'
      - 'tests/studio/test_code_block_flicker_contract.py'
      - 'tests/studio/_playwright_robust.py'
      - 'tests/studio/test_autoscroll_harness_contract.py'
      - 'tests/studio/test_heavy_thread_harness_contract.py'
      - 'tests/studio/test_heavy_thread_gap_contract.py'
      - 'tests/studio/test_heavy_thread_measurement_integrity.py'
      - 'tests/studio/test_playwright_server_lifecycle.py'
      - 'scripts/sync_allow_scripts_pins.py'
      - 'tests/studio/test_sync_allow_scripts_pins.py'
      # Both jobs run this script before installing dependencies.
      - 'scripts/lockfile_supply_chain_audit.py'
      - '.github/workflows/studio-frontend-ci.yml'
      - '.github/scripts/retry-with-apt-lock.sh'
  push:
    branches: [main]
    paths:
      - 'studio/frontend/**'
      - 'scripts/check_frontend_dep_removal.py'
      - 'tests/studio/test_frontend_dep_removal.py'
      - 'tests/studio/playwright_strip_ansi_smoke.py'
      - 'tests/studio/playwright_composer_icons.py'
      - 'tests/studio/playwright_tooltip_switch.py'
      - 'tests/studio/playwright_titlebar_blur.py'
      - 'tests/studio/playwright_chat_autoscroll.py'
      - 'tests/studio/playwright_research_freeze.py'
      - 'tests/studio/playwright_research_review.py'
      - 'tests/studio/playwright_pinned_chat_persistence.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/storage/studio_db.py'
      - 'tests/studio/playwright_heavy_thread.py'
      - 'tests/studio/probe_dismiss_guard.py'
      - 'tests/studio/playwright_nonmodal_menus.py'
      - 'tests/studio/playwright_settings_tabs.py'
      - 'tests/studio/playwright_data_settings.py'
      - 'tests/studio/playwright_keyboard_shortcuts.py'
      - 'tests/studio/playwright_find_in_page.py'
      - 'tests/studio/playwright_project_folders.py'
      - 'tests/studio/playwright_browser_agent_select.py'
      - 'tests/studio/playwright_tool_activity.py'
      - 'tests/studio/playwright_stream_pacing.py'
      - 'tests/studio/playwright_code_block_flicker.py'
      - 'tests/studio/playwright_link_definition_probe.py'
      - 'tests/studio/playwright_user_message_time.py'
      - 'tests/studio/playwright_progressive_rows.py'
      - 'tests/studio/_code_block_flicker_analysis.py'
      - 'tests/studio/test_code_block_flicker_contract.py'
      - 'tests/studio/_playwright_robust.py'
      - 'tests/studio/test_autoscroll_harness_contract.py'
      - 'tests/studio/test_heavy_thread_harness_contract.py'
      - 'tests/studio/test_heavy_thread_gap_contract.py'
      - 'tests/studio/test_heavy_thread_measurement_integrity.py'
      - 'tests/studio/test_playwright_server_lifecycle.py'
      - 'scripts/sync_allow_scripts_pins.py'
      - 'tests/studio/test_sync_allow_scripts_pins.py'
      - 'scripts/lockfile_supply_chain_audit.py'
      - '.github/workflows/studio-frontend-ci.yml'
      - '.github/scripts/retry-with-apt-lock.sh'
  # Staging repos dispatch this on `upstream-main` to seed their dependency caches
  # (scripts/pr_review/staging_ci.py); see .github/actions/pip-cache-save.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Latest-only on a PR branch. On main, cancel-in-progress is false so a RUNNING run is
  # never killed, and a newer push replaces only the PENDING one: a merge burst runs the
  # commit already executing plus the tip. See studio-backend-ci.yml for the trade.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Frontend build + bundle sanity
    runs-on: ubuntu-latest
    # Must stay above the browser install step's own 33m bound so the step timeout fires first.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # FIXME: drop once @assistant-ui/* and assistant-stream leave 0.x; every 0.minor there is
      # a breaking change.
      - name: '@assistant-ui must be pinned exactly (no caret/tilde)'
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          if grep -nE '"(@assistant-ui/[a-z-]+|assistant-stream)":[[:space:]]*"[\^~]' studio/frontend/package.json; then
            echo "::error file=studio/frontend/package.json::These packages must be pinned to exact versions until they leave 0.x. Drop the leading ^ or ~."
            exit 1
          fi
          echo "All assistant-ui packages are pinned exactly."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      # node 22 bundles npm 10.x, which predates allowScripts; fail if the gate is missing.
      - name: Upgrade npm to 11.x (allowScripts enforcement)
        working-directory: ${{ github.workspace }}
        run: |
          npm install -g npm@^11 --no-fund --no-audit
          V=$(npm -v)
          case "$V" in
            11.1[6-9].*|11.[2-9][0-9].*|1[2-9].*) echo "npm $V has allowScripts" ;;
            *) echo "::error::npm $V lacks allowScripts (need >=11.16)"; exit 1 ;;
          esac

      # Must run BEFORE npm ci, where a compromised tarball's install scripts run.
      - name: Lockfile supply-chain audit (pre-install scan)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: allowScripts pins must match the lockfile
        working-directory: ${{ github.workspace }}
        run: |
          python3 tests/studio/test_sync_allow_scripts_pins.py
          python3 scripts/sync_allow_scripts_pins.py --check

      - name: Lockfile must agree with package.json (npm ci is strict)
        # --strict-allow-scripts: any unreviewed install script hard-fails the job.
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: npm ci must not have modified the working tree
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --quiet -- studio/frontend; then
            echo "::error::npm ci modified files; commit the updated lockfile"
            git status -- studio/frontend
            exit 1
          fi

      # Fetch the base commit with an explicit refspec so origin/<base> exists.
      - name: Dependency removal safety check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 scripts/check_frontend_dep_removal.py \
            --base "origin/${{ github.base_ref }}" \
            --enumerate-dead
          python3 tests/studio/test_frontend_dep_removal.py

      # A key added only to en.ts silently falls back to English.
      - name: Locale parity
        run: npm run i18n:check:strict

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck through bun check
        # `npm run typecheck` uses `bun check` when a Bun that has it is on PATH. Runners ship no
        # Bun, so the step above only proves the tsc path; UNSLOTH_TYPECHECK=bun forbids a silent
        # fallback to tsc here. Pinned binary, SHA-256 verified before it runs (value from the
        # release's SHASUMS256.txt). Bun 1.4.3 is the first release with `bun check`; it was
        # admitted before the usual 7-day release-age wait, by explicit maintainer decision.
        run: |
          set -euo pipefail
          BUN_VERSION="1.4.3"
          BUN_SHA256="3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18"
          curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-delay 3 --retry-connrefused --retry-all-errors \
            -o "$RUNNER_TEMP/bun.zip" \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  $RUNNER_TEMP/bun.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          PATH="$RUNNER_TEMP/bun/bun-linux-x64:$PATH" UNSLOTH_TYPECHECK=bun npm run typecheck

      - name: Unit tests
        run: npm test


      - name: Build
        run: npm run build

      - name: Built bundle must not contain Unsloth's unstable_Provider call site
        run: |
          set -e
          # `ls | head` takes head's status, so check JS is non-empty explicitly.
          JS=$(ls dist/assets/index-*.js 2>/dev/null | head -1)
          if [ ! -f "$JS" ]; then
            echo "::error::no dist/assets/index-*.js to scan, so the build produced no main bundle"
            exit 1
          fi
          # `|| true`: grep -c prints 0 and exits 1 on no match; `|| echo 0` would add a second line.
          HITS=$(grep -c 'unstable_Provider:' "$JS" || true)
          echo "main bundle: $JS"
          echo "unstable_Provider: hits=${HITS:-0} (assistant-ui internals contribute up to 3)"
          if [ "${HITS:-0}" -gt 3 ]; then
            echo "::error file=studio/frontend/src/features/chat/runtime-provider.tsx::Unsloth bundle still passes unstable_Provider through useRemoteThreadListRuntime; this is the 2026.5.1 chat-history regression. Pass adapters directly into useLocalRuntime instead."
            exit 1
          fi

      - name: Bundle size budget (75 MB)
        run: |
          SIZE=$(du -sb dist | cut -f1)
          BUDGET=$((75 * 1024 * 1024))
          echo "dist size: $SIZE bytes ($((SIZE/1024/1024)) MB), budget: $BUDGET bytes (75 MB)"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::studio/frontend/dist/ exceeded the 75 MB budget. Drop dead deps (e.g. the unused next dep) or split chunks."
            exit 1
          fi

      # Entry chunk plus everything Vite preloads before first paint.
      - name: Startup bundle budget
        run: npm run bundle:check

      # Smokes go last: a red smoke would otherwise skip the build gates.
      # No --with-deps: download the engine, probe launch, and run apt only if libraries are missing.
      - name: Pin the Playwright version so the browser cache has a key
        id: pw
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install 'playwright>=1.45,<2' pytest
          echo "version=$(python3 -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Key identical to the chromium-only shards in studio-ui-smoke.yml, so both share one entry.
      - name: Restore the Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-c-v2

      - name: Restore the apt archive cache (chromium's .deb set)
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: apt-archives-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-c-v1

      - name: Install Chromium for browser smokes
        working-directory: ${{ github.workspace }}
        # Two guarded helper calls: 2 x (2 x 420s + 125s lock wait) = 1930s.
        # test_the_retry_budget_fits_inside_the_step_timeout enforces this.
        timeout-minutes: 33
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '420'
          # apt's own retries multiply stalled transfers inside the attempt budget.
          APT_ACQUIRE_RETRIES: '0'
        run: |
          # No --with-deps: it runs its own unbounded `apt-get update`.
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            bash .github/scripts/retry-with-apt-lock.sh \
              python3 -m playwright install chromium
          fi

          # Probe whether the system libraries are actually missing before running apt.
          probe() {
            python3 - "$@" <<'PY'
          import sys
          from playwright.sync_api import sync_playwright

          missing = []
          with sync_playwright() as p:
              for name in sys.argv[1:]:
                  try:
                      browser = getattr(p, name).launch()
                      browser.close()
                  except Exception as exc:
                      missing.append(f"{name}: {type(exc).__name__}")
          if missing:
              print("engines that will not start: " + "; ".join(missing))
              sys.exit(1)
          print("chromium launches; system libraries are present")
          PY
          }

          if probe chromium; then
            echo "::notice::skipped playwright install-deps; the runner image already has the libraries"
          else
            echo "system libraries are missing, installing them"
            # Reuse last run's .debs; apt re-fetches any that do not match its index.
            if [ -d "${{ github.workspace }}/.apt-archives" ]; then
              sudo cp "${{ github.workspace }}"/.apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
              echo "seeded $(ls "${{ github.workspace }}"/.apt-archives/*.deb 2>/dev/null | wc -l) cached .deb files"
            fi
            bash .github/scripts/retry-with-apt-lock.sh \
              python3 -m playwright install-deps chromium
            mkdir -p "${{ github.workspace }}/.apt-archives"
            sudo cp /var/cache/apt/archives/*.deb "${{ github.workspace }}/.apt-archives/" 2>/dev/null || true
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/.apt-archives" || true
            # Fail loudly here rather than as an opaque per-test timeout later.
            probe chromium
          fi

      # Main-only, and NOT under always(): keys are immutable, so a failed install must never
      # be saved. test_cache_budget_discipline.py enforces this.
      - name: Save the Playwright browser cache
        if: (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/upstream-main' && github.repository != 'unslothai/unsloth')) && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}

      - name: Save the apt archive cache
        if: (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/upstream-main' && github.repository != 'unslothai/unsloth')) && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      # Imports the harnesses (hence playwright), so it sits after the install.
      - name: Dev-server lifecycle tests
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pytest tests/studio/test_playwright_server_lifecycle.py \
            tests/studio/test_autoscroll_harness_contract.py \
            tests/studio/test_heavy_thread_harness_contract.py \
            tests/studio/test_heavy_thread_measurement_integrity.py \
            tests/studio/test_heavy_thread_gap_contract.py \
            tests/studio/test_code_block_flicker_contract.py -q

      # Keep data settings separate from the shorter checks. Each group owns its cache.
      # The step bound is the smaller one, leaving the job 25 minutes for the steps before it: a
      # job timeout is a cancellation, which skips the failure-only artifact upload, so a check
      # hung past it would leave no log anywhere.
      - name: Browser smoke groups for data settings and frontend controls
        working-directory: ${{ github.workspace }}
        timeout-minutes: 15
        run: |
          mkdir -p logs
          group_pids=()
          # The groups write to files, so their output reaches the step log only here, on every
          # exit including a timeout or a cancel. A cancel is SIGINT, then SIGTERM about 7.5 s
          # later, then SIGKILL: ignore the second signal so it cannot cut cleanup short, and print
          # the logs before waiting on the groups' teardown, which may outlast the SIGKILL.
          cleanup() {
            trap '' INT TERM
            for pid in "${group_pids[@]}"; do
              kill -TERM "$pid" 2>/dev/null || true
            done
            cat logs/playwright-frontend-data.log logs/playwright-frontend-controls.log 2>/dev/null || true
            for pid in "${group_pids[@]}"; do
              wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          stop_check() {
            if [ -n "$check_pid" ]; then
              kill -TERM "$check_pid" 2>/dev/null || true
              wait "$check_pid" 2>/dev/null || true
            fi
          }
          run_check() {
            local name=$1 status=0
            shift
            echo "::group::$name"
            "$@" &
            check_pid=$!
            wait "$check_pid" || status=$?
            check_pid=
            echo "$name: exit $status"
            echo "::endgroup::"
            [ "$status" -eq 0 ] || { echo "::error title=Browser smoke $name::$name exited $status"; group_failed=1; }
          }

          (
            group_failed=0 check_pid=
            trap stop_check EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            export VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-frontend-data"
            run_check data_settings python3 tests/studio/playwright_data_settings.py
            exit "$group_failed"
          ) > logs/playwright-frontend-data.log 2>&1 &
          group_pids+=("$!")
          (
            group_failed=0 check_pid=
            trap stop_check EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            export VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-frontend-controls"
            run_check settings_tabs python3 tests/studio/playwright_settings_tabs.py
            run_check settings_tabs_blocked env PW_CHUNK_FAIL=data PW_PORT=5400 \
              PW_OUT=logs/settings_tabs_blocked_report.json \
              python3 tests/studio/playwright_settings_tabs.py
            run_check find_in_page python3 tests/studio/playwright_find_in_page.py
            run_check keyboard_shortcuts python3 tests/studio/playwright_keyboard_shortcuts.py
            run_check strip_ansi env PW_BROWSER=chromium \
              python3 tests/studio/playwright_strip_ansi_smoke.py
            # --kill-after outlasts the harness's own stop (TERM, 10 s, KILL, 10 s) so its Vite
            # server, in a session of its own, is not orphaned when the check times out
            run_check composer_icons timeout --kill-after=30s 180s \
              python3 tests/studio/playwright_composer_icons.py chromium
            run_check research_review python3 tests/studio/playwright_research_review.py
            exit "$group_failed"
          ) > logs/playwright-frontend-controls.log 2>&1 &
          group_pids+=("$!")

          failed=0
          for pid in "${group_pids[@]}"; do
            wait "$pid" || failed=1
          done
          group_pids=()
          exit "$failed"

      - name: Browser smoke for the MCP App tool bridge
        working-directory: ${{ github.workspace }}
        env:
          PW_BROWSER: chromium
        run: python3 tests/studio/playwright_mcp_app_bridge_smoke.py

      # Project create / edit dialogs with stubbed native IPC and HTTP: lost responses, spent
      # grants and older backends must leave the saved working folder matching the choice.
      - name: Browser smoke for project working folders
        working-directory: ${{ github.workspace }}
        timeout-minutes: 10
        run: python3 tests/studio/playwright_project_folders.py --out "$RUNNER_TEMP/project-folders"
      - name: Browser agent checks radios and checkboxes by their labels
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: python3 tests/studio/playwright_browser_agent_select.py

      - name: Icon tooltips follow the pointer between neighbours
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: python3 tests/studio/playwright_tooltip_switch.py chromium

      - name: Titlebar modal blur and window controls (Chromium)
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: python3 tests/studio/playwright_titlebar_blur.py

      # Each harness owns its vite server; backgrounding npm here would orphan the node child.
      - name: Browser smoke for chat autoscroll
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/playwright_chat_autoscroll.py

      - name: Browser smoke for research freeze
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/playwright_research_freeze.py

      - name: Browser regression for pinned chat persistence
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: |
          python3 -m pip install fastapi httpx pyjwt argon2-cffi cryptography huggingface_hub python-multipart structlog
          python3 tests/studio/playwright_pinned_chat_persistence.py

      # A gate, not a measurement. The released and streamdown variants are positive controls
      # that MUST flicker: a run where neither collapses means the detector stopped seeing, not
      # that the flicker stopped. Chromium only on a PR, the engine whose content-visibility
      # fallback the index.css override exists for.
      - name: Browser smoke for code block flicker
        working-directory: ${{ github.workspace }}
        env:
          SMOKE_FLICKER_ENGINES: chromium
        run: python3 tests/studio/playwright_code_block_flicker.py

      # The `plain` case is the positive control and must keep its controls.
      - name: Browser smoke for code-block controls under a link-definition lookalike
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/playwright_link_definition_probe.py

      - name: Browser check for user message timestamps
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: python3 tests/studio/playwright_user_message_time.py

      # the node suite runs no effects, so only this browser check covers the observer, re-arming, and cleanup.
      - name: Browser check for paged sidebar lists
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: python3 tests/studio/playwright_progressive_rows.py

      # Two small sizes and one repetition on Chromium: enough to prove the fixture still
      # renders every kind of content it claims to and that the curve still rises, which is all
      # a PR gate can afford. The measurement this harness exists for is the three-engine,
      # three-size, three-repetition run, which takes tens of minutes and belongs on a runner
      # asked for it deliberately, not on every frontend PR.
      - name: Browser smoke for heavy-thread interaction cost
        working-directory: ${{ github.workspace }}
        env:
          SMOKE_HEAVY_CHARS: '25000,100000'
          SMOKE_HEAVY_ENGINES: chromium
          SMOKE_HEAVY_REPEATS: '1'
          PW_ART_DIR: logs/playwright_heavy_thread
        run: python3 tests/studio/playwright_heavy_thread.py

      # A failure means the click that dismissed a menu also reached the control under it.
      - name: Browser check for non-modal menu dismissal
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/probe_dismiss_guard.py --label ci --engine chromium

      # The page mounts one still-modal menu as a control.
      - name: Browser checks for the non-modal dropdown wrapper
        working-directory: ${{ github.workspace }}
        run: python3 tests/studio/playwright_nonmodal_menus.py

      - name: Browser smoke for tool activity collapse
        working-directory: ${{ github.workspace }}
        env:
          PW_ENGINE: chromium
        run: python3 tests/studio/playwright_tool_activity.py --json

      # Reports, does not gate, for now. The budgets inside are calibrated on a
      # developer machine, and this measures a CPU-bound render on a shared runner
      # under 6x throttling, so a budget set from one box is a flake waiting to
      # happen. Tighten it from observed runs here and drop continue-on-error, the
      # way the startup profile did.
      - name: Browser smoke for chat stream pacing
        id: stream_pacing
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: python3 tests/studio/playwright_stream_pacing.py

      # Also check the stream-pacing outcome: continue-on-error makes failure() false for it.
      - name: Upload browser smoke artifacts
        if: failure() || steps.stream_pacing.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: studio-frontend-smoke-artifacts
          path: |
            logs/playwright-*
            logs/settings_tabs_report.json
            logs/settings_tabs_blocked_report.json
            logs/data_settings*
            logs/nonmodal_menus_report.json
            logs/pw/
          retention-days: 3
          if-no-files-found: ignore

      - name: Biome (non-blocking until accumulated drift is cleared)
        continue-on-error: true
        run: npm run biome:check

      - name: Upload built dist
        # Failures only: keeping ~35MB per green run made artifacts the second-largest family, ~3.5GB.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: studio-frontend-dist
          path: studio/frontend/dist
          retention-days: 1

  # The suite reads sources and resolves module URLs, so it can break only on Windows.
  # .gitattributes pins LF for studio/frontend, so exact-substring assertions hold.
  windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Frontend unit tests (Windows)
    runs-on: windows-latest
    # The steps measured ~15m30s, so 15 always cut off the Firefox step.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # Same pre-install scan as ubuntu: the jobs run concurrently.
      - name: Lockfile supply-chain audit (pre-install scan)
        working-directory: ${{ github.workspace }}
        run: python scripts/lockfile_supply_chain_audit.py

      # --ignore-scripts: a platform gate, so no install scripts run at all.
      - run: npm ci --ignore-scripts --no-fund --no-audit

      - name: Unit tests
        run: npm test

      - name: Install alignment test browsers
        working-directory: ${{ github.workspace }}
        timeout-minutes: 5
        run: |
          python -m pip install 'playwright>=1.45,<2'
          python -m playwright install chromium firefox

      - name: Composer icon alignment
        working-directory: ${{ github.workspace }}
        timeout-minutes: 3
        run: python tests/studio/playwright_composer_icons.py chromium firefox

      - name: Data settings deletion choices in Chromium and Firefox
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p logs
          # each driver owns its Vite server, optimizer cache, and report
          PW_ENGINE=chromium PW_PORT=5420 PW_OUT=logs/data_settings_report.json \
            VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-data-chromium" \
            python tests/studio/playwright_data_settings.py > logs/data_settings_chromium.log 2>&1 &
          chromium_pid=$!
          PW_ENGINE=firefox PW_PORT=5421 PW_OUT=logs/data_settings_firefox_report.json \
            VITE_TEST_CACHE_DIR="$RUNNER_TEMP/vite-data-firefox" \
            python tests/studio/playwright_data_settings.py > logs/data_settings_firefox.log 2>&1 &
          firefox_pid=$!
          failed=0
          wait "$chromium_pid" || failed=1
          wait "$firefox_pid" || failed=1
          for engine in chromium firefox; do
            echo "::group::Data settings: $engine"
            cat "logs/data_settings_$engine.log" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload alignment failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-composer-icons
          path: |
            logs/playwright-composer-icons
            logs/data_settings*
          retention-days: 1
          if-no-files-found: ignore
