# Proves the llama.cpp install loads on every supported macOS version.

name: Mac Unsloth Install Matrix CI

on:
  pull_request:
    paths:
      - 'studio/install_llama_prebuilt.py'
      - 'studio/setup.sh'
      - 'install.sh'
      - '.github/scripts/assert-llama-loads.sh'
      - '.github/workflows/studio-mac-install-matrix.yml'
      # Imported by install_llama_prebuilt.py, which this matrix guards.
      - 'studio/backend/__init__.py'
      - 'studio/backend/utils/__init__.py'
      - 'studio/backend/utils/auth_safe.py'
      - 'studio/backend/utils/prebuilt/__init__.py'
      - 'studio/backend/utils/prebuilt/llama_backend.py'
      - 'studio/backend/vendor/truststore/**'
      # The install step in this workflow is `uses:` on that composite action.
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      # Reached by the install this workflow asserts on. Not requirements/** or pyproject:
      # clean-machine-install-ci covers generic macOS install breakage.
      - 'studio/install_python_stack.py'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'studio/nvidia_probe.py'
  push:
    branches: [main]
    # Same list as the PR filter, to spare the account-wide macOS slots.
    paths:
      - 'studio/install_llama_prebuilt.py'
      - 'studio/setup.sh'
      - 'install.sh'
      - '.github/scripts/assert-llama-loads.sh'
      - '.github/workflows/studio-mac-install-matrix.yml'
      # Imported by install_llama_prebuilt.py, which this matrix guards.
      - 'studio/backend/__init__.py'
      - 'studio/backend/utils/__init__.py'
      - 'studio/backend/utils/auth_safe.py'
      - 'studio/backend/utils/prebuilt/__init__.py'
      - 'studio/backend/utils/prebuilt/llama_backend.py'
      - 'studio/backend/vendor/truststore/**'
      # The install step in this workflow is `uses:` on that composite action.
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      # Reached by the install this workflow asserts on. Not requirements/** or pyproject:
      # clean-machine-install-ci covers generic macOS install breakage.
      - 'studio/install_python_stack.py'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'studio/nvidia_probe.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  install-load:
    name: Install + load (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not redundant: a PR touching only this file runs no other macOS 15 ARM job.
          - os: macos-15        # Apple Silicon, macOS 15 Sequoia
            experimental: false
          - os: macos-26        # Apple Silicon, macOS 26 Tahoe
            experimental: false
          - os: macos-15-intel  # Intel x86_64, macOS 15 (informational)
            experimental: true
          - os: macos-26-intel  # Intel x86_64, macOS 26 (last Intel macOS)
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Assert llama.cpp loads on this macOS
        run: bash .github/scripts/assert-llama-loads.sh

      - name: Upload install log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mac-install-matrix-${{ matrix.os }}-log
          path: logs/install.log
          retention-days: 7
