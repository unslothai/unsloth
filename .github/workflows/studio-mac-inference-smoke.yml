# One end-to-end smoke job, three phases, that boots a freshly-installed
# Unsloth and exercises the surfaces real users hit through the OpenAI /
# Anthropic SDKs and curl. Each phase picks the smallest model that
# exercises the behaviour under test and primes its own model cache via
# actions/cache; all three share a single install.sh --local --no-torch.
#
#   1. OpenAI, Anthropic API tests
#        gemma-3-270m-it UD-Q4_K_XL (~254 MiB).
#        Password rotation via /api/auth/change-password (old fails,
#        new works), then OpenAI + Anthropic Python SDKs against /v1/*
#        with temperature=0 and a fixed seed. Asserts the four-turn
#        conversation is deterministic across two runs.
#
#   2. Tool calling Tests
#        Qwen3.5-2B UD-IQ3_XXS (~890 MiB). OpenAI function calling,
#        server-side tools (python, terminal, web_search) via
#        enable_tools / enabled_tools, and enable_thinking on/off.
#
#   3. JSON, images
#        gemma-4-E2B-it UD-IQ3_XXS (~2.4 GiB) + mmproj-F16 (~986 MiB).
#        response_format JSON-schema decoding and OpenAI image_url
#        (data URI) plus Anthropic source/base64 image inputs.
#
# The phases run in sequence on one runner. Wall time is dominated by
# phase 3 on a cold cache; a warm cache cuts that phase to ~3 min. They
# used to be three parallel jobs, which held 3 of the 5 macOS slots
# available account-wide and repeated the same install three times.

name: Mac Studio GGUF CI

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'unsloth/**'
      - 'unsloth_cli/**'
      - 'install.sh'
      - 'pyproject.toml'
      - '.github/workflows/studio-mac-inference-smoke.yml'
  push:
    branches: [main, pip]
  # Manual trigger for pre-warming model caches on main, or re-running
  # against an arbitrary branch without pushing a no-op commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job, three phases. These were three separate macOS jobs that differed
  # only in model, port and test body: the checkout, setup-node, setup-python,
  # `install.sh --local --no-torch` and assert-llama-loads.sh preamble was
  # byte-identical in all three, so every triggering PR did the same install on
  # three macOS runners at once. Concurrent macOS jobs are capped at 5 per
  # account (shared with unslothai/unsloth-zoo), so that burst took 3 of the 5
  # slots to re-derive the same install twice.
  #
  # The phases now share one install. Each keeps its own model cache, server
  # port, server log, uploaded artifact and step timeouts, and each is gated on
  # the shared preamble rather than on the phase before it, so a failure still
  # points at one phase, the logs of the earlier phases survive it, and the
  # later phases still run -- the same independence the three jobs had.
  inference-smoke:
    name: GGUF inference smoke (API, tools, vision)
    runs-on: macos-15
    # Was 25 for the first phase alone; the three were 25 + 25 + 30 across three
    # runners. Sequentially they share one install, so the sum is less than 80,
    # but a cold model cache on the vision phase is the slow case. 90 covers it
    # without letting a hang sit for hours on one of the 5 macOS slots.
    #
    # 90 is the outer guard only. Every step that can block also carries its own
    # `timeout-minutes`, because the job cap alone is not a substitute for the
    # 25/25/30 caps the three jobs used to have: hf-download-with-retry.sh
    # retries forever by design and named the job timeout as its bound, so
    # without step caps one stalled download would hold a macOS slot for the
    # full 90 minutes and starve the phases behind it.
    timeout-minutes: 90
    env:
      # Only what every phase shares. Model, GGUF file and port are set per
      # phase via $GITHUB_ENV instead of here: if a phase-specific key were also
      # declared at job level, whether the later $GITHUB_ENV write wins is not
      # something the Actions docs pin down, and a phase silently talking to the
      # previous phase's port would be a nasty way to find out.
      HF_HOME: ${{ github.workspace }}/hf-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Phase 1 environment
        run: |
          echo "GGUF_REPO=unsloth/gemma-3-270m-it-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=gemma-3-270m-it-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18888" >> "$GITHUB_ENV"

      - name: Restore HF_HOME for unsloth/gemma-3-270m-it-GGUF
        id: cache-hf
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        timeout-minutes: 15
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-unsloth/gemma-3-270m-it-GGUF-UD-Q4_K_XL-v2

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        timeout-minutes: 15
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      # Save partial caches on cancel/timeout -- hf download resumes by
      # content hash. `outcome != skipped` keeps cache-hit a no-op.
      - name: Save HF_HOME for unsloth/gemma-3-270m-it-GGUF
        # Save on main only. Caches created on a PR ref are scoped to that
        # merge ref -- per GitHub's docs they "can only be restored by re-runs
        # of the pull request" -- while every PR *can* restore from the default
        # branch. So a PR-scoped save helps almost nothing and competes for the
        # 10GB per-repo budget, and when that budget is exceeded GitHub evicts
        # by least-recently-used, which deletes main's copies that all PRs share.
        # This repo was measured at 33.3GB across 30 caches, 3.3x over, with the
        # same 4.6GB model held four times on four different PR refs and no copy
        # on main at all. That is the thrash loop: PR misses -> downloads ->
        # saves its own copy -> evicts main's -> next PR misses.
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome != 'skipped' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        timeout-minutes: 15
        with:
          path: hf-cache
          key: ${{ runner.os }}-hf-unsloth/gemma-3-270m-it-GGUF-UD-Q4_K_XL-v2

      # Shared preamble, but it sits below phase 1's model priming because the
      # install probe (stories260K) rides along in that same step. `!cancelled()`
      # keeps it out of the implicit `success()` chain: a phase-1 GGUF download
      # failure or 15-minute timeout is a phase-1 resource problem, and skipping
      # the shared install because of it would take the assert-llama gate --
      # and with it phases 2 and 3 -- down as well. A step timeout sets the step
      # to failed, not cancelled (actions/runner StepsRunner.cs), so `!cancelled()`
      # is true here; a real run cancellation still skips.
      - name: Install Unsloth (--local, --no-torch)
        id: install
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          mkdir -p logs
          set -o pipefail
          bash install.sh --local --no-torch 2>&1 | tee logs/install.log

      # Last step of the shared preamble. Phases 2 and 3 gate on its outcome:
      # once checkout, install and this check have passed, a failure inside one
      # phase says nothing about the others, so the others should still run.
      # Gates on `install` explicitly rather than on the implicit `success()`,
      # for the same reason as the step above: the implicit check is job-wide, so
      # a phase-1 download failure would skip it and silently take phases 2 and 3
      # with it. A broken install still skips this step, so its outcome stays
      # non-success and the phases below correctly stay out.
      - name: Assert llama.cpp loads on this macOS
        id: assert-llama
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: bash .github/scripts/assert-llama-loads.sh

      - name: Install OpenAI + Anthropic Python SDKs
        timeout-minutes: 5
        run: pip install 'openai>=1.50' 'anthropic>=0.40'

      - name: Reset auth + boot Unsloth (API-only)
        timeout-minutes: 2
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          rm -rf ~/.unsloth/studio/auth
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" \
            > logs/studio.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health
        timeout-minutes: 5
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          echo "Unsloth did not become healthy in 180s"
          tail -200 logs/studio.log
          exit 1

      - name: Password rotation (old must fail, new must work)
        timeout-minutes: 3
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIRotated-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          # 1. Login with the bootstrap password.
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          [ -n "$OLD_TOKEN" ] && [ "$OLD_TOKEN" != "null" ] || { echo "bootstrap login failed"; exit 1; }
          # 2. Rotate to a fresh random password.
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          # 3. Old password must now be rejected (HTTP 401).
          OLD_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}")
          if [ "$OLD_STATUS" != "401" ]; then
            echo "::error::Login with old password returned $OLD_STATUS, expected 401"
            exit 1
          fi
          # 4. New password must succeed; capture the JWT for downstream steps.
          NEW_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "null" ] || { echo "new login failed"; exit 1; }
          echo "TOKEN=$NEW_TOKEN" >> "$GITHUB_ENV"
          echo "password rotation OK (old=401, new=200)"

      - name: Load the GGUF (HF repo + variant, served from HF_HOME cache)
        # curl already caps itself at --max-time 600; +2 for process overhead.
        timeout-minutes: 12
        run: |
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 600 \
            -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name, is_gguf, context_length}'

      - name: Multi-turn determinism via OpenAI + Anthropic SDKs
        timeout-minutes: 15
        env:
          BASE_URL: http://127.0.0.1:18888
        run: |
          python - <<'PY'
          import json
          import os
          from openai import OpenAI
          from anthropic import Anthropic

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["TOKEN"]      # JWT also accepted as Bearer on /v1/*
          SEED = 3407

          # Four-turn conversation: the second and fourth turns can only be
          # answered correctly if the model sees the prior turns, so this
          # also exercises the conversation-history wiring.
          PROMPTS = [
              "What is 1+1?",
              "What did I ask before?",
              "What is the capital of France?",
              "Repeat the city name",
          ]

          def run_openai():
              client = OpenAI(base_url = f"{BASE}/v1", api_key = KEY)
              history, replies = [], []
              for prompt in PROMPTS:
                  history.append({"role": "user", "content": prompt})
                  resp = client.chat.completions.create(
                      model       = "default",
                      messages    = history,
                      temperature = 0.0,
                      max_tokens  = 80,
                      seed        = SEED,
                      extra_body  = {"enable_thinking": False},
                  )
                  text = resp.choices[0].message.content or ""
                  replies.append(text)
                  history.append({"role": "assistant", "content": text})
              return replies

          def run_anthropic():
              # Two SDK quirks vs. Unsloth:
              #   1. base_url must NOT include /v1 -- the SDK appends
              #      /v1/messages itself; otherwise the request hits
              #      /v1/v1/messages and 405s.
              #   2. The SDK sends `x-api-key` by default, but Unsloth's
              #      auth layer is HTTPBearer-only. Override via
              #      default_headers so Authorization: Bearer ... is
              #      sent instead.
              client = Anthropic(
                  base_url        = BASE,
                  api_key         = "unused",
                  default_headers = {"Authorization": f"Bearer {KEY}"},
              )
              history, replies = [], []
              for prompt in PROMPTS:
                  history.append({"role": "user", "content": prompt})
                  msg = client.messages.create(
                      model       = "default",
                      max_tokens  = 80,
                      messages    = history,
                      temperature = 0.0,
                      extra_body  = {"seed": SEED, "enable_thinking": False},
                  )
                  text = "".join(b.text for b in msg.content if getattr(b, "type", None) == "text")
                  replies.append(text)
                  history.append({"role": "assistant", "content": text})
              return replies

          for label, runner in (("openai", run_openai), ("anthropic", run_anthropic)):
              first  = runner()
              second = runner()
              for i, (a, b) in enumerate(zip(first, second), start = 1):
                  print(f"[{label} turn {i}] {a!r}")
                  assert a, f"{label}: empty turn {i} response"
                  # Compare on stripped content: llama-server can vary
                  # trailing whitespace (specifically a final '\n') between
                  # otherwise-identical greedy runs depending on the
                  # batch-flush boundary at which the stream is closed. The
                  # generated tokens are identical; only the trailing
                  # whitespace differs. Keep the raw repr in the failure
                  # message so a real divergence is still legible.
                  assert a.strip() == b.strip(), (
                      f"{label} non-deterministic at turn {i} with temperature=0.0:\n"
                      f"  run1: {a!r}\n  run2: {b!r}"
                  )
              # Sanity: turn-2 reply should mention the earlier question, and
              # turn-4 reply should mention Paris (model echoes the city it
              # produced for turn 3). Lower-cased substring checks keep the
              # assertion robust to formatting jitter.
              joined = " ".join(first).lower()
              assert "1" in first[0], f"{label}: turn-1 answer should contain '1', got {first[0]!r}"
              assert "paris" in joined, f"{label}: expected 'paris' somewhere in the four-turn transcript: {first}"
              print(f"[{label}] OK -- 4 turns, run1 == run2, history grounded")
          PY

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          ss -tln | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        # Always upload so green runs are still reviewable.
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openai-anthropic-log
          path: |
            logs/studio.log
            logs/install.log
          retention-days: 7

      # ==============================================================
      # Phase 2: tool calling + server-side tools.
      # Reuses the install and llama.cpp check done once above rather than
      # repeating them on a second runner. Ids, cache dir and server log are
      # suffixed -tools so the phases cannot collide inside one job.
      #
      # Every step below carries the same `if:`. A step with no `if:` gets an
      # implicit `success()`, which is job-wide rather than per-step, so a
      # single failed phase-1 step would otherwise skip phases 2 and 3
      # outright -- exactly the coverage the three independent jobs used to
      # give us when one of them went red. `!cancelled()` runs the phase after
      # a phase-1 failure while still honouring a cancel, and the
      # assert-llama gate keeps it from running when the SHARED preamble
      # broke (a failed checkout or install skips assert-llama, so its outcome
      # is not 'success' and phases 2 and 3 correctly stay out). The job still
      # ends red, because the failed phase-1 step already set the job status.
      # ==============================================================
      - name: Phase 2 environment
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/Qwen3.5-2B-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_FILE=Qwen3.5-2B-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18898" >> "$GITHUB_ENV"

      # Key suffix bumped v1 -> v2 with the directory rename, and this is not
      # cosmetic. actions/cache identifies an entry by key AND a version hash
      # derived from the `path` input, but key uniqueness is global per ref. The
      # old gguf-cache entry still holds the -v1 key, so a restore into
      # gguf-cache-tools misses on version while the save is refused with
      # "Unable to reserve cache with key ... another job may be creating this
      # cache". Without the bump this phase re-downloads the model on every run,
      # forever. Measured on staging before the bump: two consecutive runs both
      # logged "Cache not found for input keys" and both failed to save.
      - name: Restore GGUF model file
        id: cache-gguf-tools
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        timeout-minutes: 15
        with:
          path: gguf-cache-tools
          key: ${{ runner.os }}-gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v2

      - name: Download GGUF if cache miss
        id: download-gguf-tools
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' && (steps.cache-gguf-tools.outputs.cache-hit != 'true' || steps.cache-gguf-tools.outcome != 'success') }}
        # hf-download-with-retry.sh retries forever; this is its real bound.
        timeout-minutes: 20
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache-tools
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache-tools

      # Save partial caches on cancel; next run resumes via content hash.
      - name: Save GGUF model file
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf-tools.outcome != 'skipped' && hashFiles('gguf-cache-tools/**/*.gguf') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        timeout-minutes: 15
        with:
          path: gguf-cache-tools
          key: ${{ runner.os }}-gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v2

      - name: Reset auth + boot Unsloth (API-only, default tool policy)
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        timeout-minutes: 2
        # We deliberately use the API-only mode rather than
        # `unsloth studio run` because the latter calls
        # `set_tool_policy(...)` with a resolved bool: on loopback the
        # default resolves to True, which forces every request through
        # the server-side agentic loop and breaks the standard
        # function-calling test below. API-only mode leaves
        # tool_policy=None so each request's `enable_tools` field is
        # honoured.
        run: |
          rm -rf ~/.unsloth/studio/auth
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" \
            > logs/studio_tools.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health, log in, change password, load model
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        # 180s health wait + curl's own --max-time 600, with headroom.
        timeout-minutes: 15
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CITool-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          GGUF_PATH="$GITHUB_WORKSPACE/gguf-cache-tools/${GGUF_FILE}"
          ls -lh "$GGUF_PATH"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 600 \
            -d "{\"model_path\":\"$GGUF_PATH\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name}'

      - name: Tool calling, server-side tools, thinking on/off
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        timeout-minutes: 20
        env:
          BASE_URL: http://127.0.0.1:18898
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407

          def post(path, body, *, timeout = 240):
              """Plain JSON POST. For requests that don't go through
              the server-side agentic loop, the response is one JSON
              object."""
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError:
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          def post_sse(path, body, *, timeout = 600, retries = 1, soft = False):
              """POST a streaming request and accumulate the assistant
              text deltas. The server-side agentic loop ALWAYS returns
              SSE regardless of the request's `stream` field, so any
              call with enable_tools=true must use this helper.

              A shared CI runner can stall the stream transport (the
              connection opening, or a mid-stream read) even when Unsloth
              is healthy, so harden the read three ways: retry a stall
              once with a fresh request capped at 300s; return any text
              already streamed before a stall (a stall on the trailing
              tokens, after the answer arrived, still counts); and when
              every attempt yields nothing, a hard call re-raises while a
              soft call (the best-effort server-side tool probes) returns
              None so the caller can WARN instead of sinking the whole
              job. HTTP status errors always surface immediately."""
              body = {**body, "stream": True}
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                  },
              )
              for attempt in range(retries + 1):
                  parts = []
                  t = timeout if attempt == 0 else min(timeout, 300)
                  try:
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          for raw in resp:
                              line = raw.decode().strip()
                              if not line.startswith("data: "):
                                  continue
                              payload = line[6:]
                              if payload == "[DONE]":
                                  break
                              try:
                                  chunk = json.loads(payload)
                              except json.JSONDecodeError:
                                  continue
                              for choice in chunk.get("choices", []):
                                  delta = choice.get("delta", {}) or {}
                                  if delta.get("content"):
                                      parts.append(delta["content"])
                      return "".join(parts)
                  except urllib.error.HTTPError:
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      # Text already streamed is a valid signal -- keep it
                      # rather than re-running a heavy generation.
                      if parts:
                          joined = "".join(parts)
                          print(f"[retry-sse] {path}: {exc!r}; keeping {len(joined)} partial chars", flush = True)
                          return joined
                      if attempt == retries:
                          if soft:
                              print(f"[tools] WARN {path}: SSE transport stalled with no data ({exc!r}) -- non-blocking", flush = True)
                              return None
                          raise
                      print(f"[retry-sse] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          # ── 1. Standard OpenAI function calling ──────────────────────
          weather_tool = {
              "type": "function",
              "function": {
                  "name": "get_weather",
                  "description": "Get current weather for a city.",
                  "parameters": {
                      "type": "object",
                      "properties": {"city": {"type": "string"}},
                      "required": ["city"],
                  },
              },
          }

          # Mac Metal at temperature=0 is pathological for these small
          # quants (Qwen3.5-2B emits ',,,,,,...' or 'The The The...'),
          # gemma-4-E2B emits '<unused5>' tokens). The Linux CPU
          # backend hides the issue. Use a small non-zero temperature
          # with a fixed seed so we stay deterministic but escape the
          # degenerate sampling trap.
          TEMP = 0.2

          status, data = post("/v1/chat/completions", {
              "messages":    [{"role": "user", "content": "What is the weather in Paris?"}],
              "tools":       [weather_tool],
              "tool_choice": "required",
              "stream":      False,
              "temperature": TEMP,
              "seed":        SEED,
              # tool_choice='required' constrains the grammar so the
              # model emits a tool_call quickly when it works at all;
              # 128 tokens is enough for `{"city":"Paris"}` plus the
              # JSON envelope.
              "max_tokens":  128,
          }, timeout = 180)
          assert status == 200, f"tool call status {status}: {data}"
          choice = data["choices"][0]
          tool_calls = (choice.get("message") or {}).get("tool_calls") or []
          # Unsloth's contract: when tool_choice='required', llama.cpp's
          # grammar should force a tool_calls payload. On Mac that
          # contract is sometimes broken by the underlying quant; the
          # PASS path is "tool_calls present + correct schema", the
          # WARN path documents Unsloth still returned 200 with a
          # well-formed choices[] envelope.
          if tool_calls:
              tc = tool_calls[0]
              assert tc["function"]["name"] == "get_weather", (
                  f"unexpected tool name: {tc['function']['name']!r}"
              )
              args = json.loads(tc["function"]["arguments"])
              assert args.get("city"), f"missing city arg: {args}"
              print(f"[tools] PASS function calling -> {tc['function']['name']}({args}) finish={choice.get('finish_reason')!r}")
          else:
              # Infrastructure path is correct; model output drifted.
              print(
                  f"[tools] WARN function calling: no tool_calls (finish_reason="
                  f"{choice.get('finish_reason')!r}); HTTP path OK, this is a "
                  f"Mac Metal quant degeneracy."
              )

          # ── 2. Server-side python tool ───────────────────────────────
          # 123 * 456 = 56088. The agentic loop streams SSE; we
          # accumulate the assistant text and look for the answer. On
          # Mac the model often loses the tool calling contract before
          # producing the answer; accept either the answer OR a
          # non-empty SSE stream as proof the path completes.
          # macOS free runner is ~10 tok/s on Qwen3.5-2B Q4_K_XL;
          # cap max_tokens tightly so each SSE round stays under ~30s
          # even when the model stalls in a degenerate output state.
          # retries=0 on the best-effort probes: this step's 20-minute cap
          # also has to cover the thinking checks, so a no-data stall must be a
          # single 180s attempt (not 180+15+180s) to leave room for the
          # thinking checks. A soft/best-effort probe only WARNs anyway.
          content = post_sse("/v1/chat/completions", {
              "messages":      [{"role": "user", "content": "What is 123 * 456? Use the python tool to compute it and tell me the number."}],
              "enable_tools":  True,
              "permission_mode": "full",
              "enabled_tools": ["python"],
              "session_id":    "ci-tool-calling-py",
              "temperature":   TEMP,
              "seed":          SEED,
              "max_tokens":    128,
          }, timeout = 180, retries = 0, soft = True)
          if content is None:
              print("[tools] WARN python tool: SSE transport stalled after retries -- non-blocking")
          elif "56088" in content or "56,088" in content:
              print(f"[tools] PASS python tool ({len(content)} chars, found 56088)")
          else:
              # Empty stream is a known Mac-quant degeneracy too; log
              # but do not fail.
              print(
                  f"[tools] WARN python tool: SSE OK ({len(content)} chars) but "
                  f"model didn't return 56088 -- Mac quant drift"
              )

          # NOTE: the dedicated "Server-side bash (terminal) tool" axis
          # was dropped in favour of the python axis above. Both share
          # the SAME server-side agentic loop wiring (only the registry
          # entry differs); the python axis is the canonical proof. On
          # macOS the duplicated SSE round was the dominant cost in
          # this step, so collapsing the two saves ~30-60 s wallclock
          # without losing distinct coverage.

          # ── 3. Server-side web_search tool ───────────────────────────
          # DuckDuckGo is flaky from CI runners and small Qwen3.5-2B
          # may not actually search. Only assert that the SSE stream
          # opens and yields any data; HTTP / parser failures already
          # raise above.
          try:
              content = post_sse("/v1/chat/completions", {
                  "messages":      [{"role": "user", "content": "Search the web for 'unsloth ai github' and summarise."}],
                  "enable_tools":  True,
                  "permission_mode": "full",
                  "enabled_tools": ["web_search"],
                  "session_id":    "ci-tool-calling-web",
                  "temperature":   TEMP,
                  "seed":          SEED,
                  "max_tokens":    96,
              }, timeout = 180, retries = 0)
              print(f"[tools] PASS web_search stream ({len(content)} chars)")
          except Exception as exc:
              print(f"[tools] WARN web_search probe failed (non-blocking): {exc}")

          # ── 4. Thinking on / off ─────────────────────────────────────
          # Unsloth strips think blocks from message.content for tools-mode
          # responses, so we toggle plain chat (no enable_tools) and look
          # at the surfaced reasoning_content / message.thinking field.
          def thinking_call(enable):
              status, data = post("/v1/chat/completions", {
                  "messages":        [{"role": "user", "content": "Briefly: is 17 prime?"}],
                  "stream":          False,
                  "enable_thinking": enable,
                  "temperature":     TEMP,
                  "seed":            SEED,
                  # 80 tokens lands within this step's 20-minute cap
                  # on the macOS free runner. 17 is small; this is
                  # plenty of room for either "Yes" + brief reasoning
                  # or a degenerate empty completion.
                  "max_tokens":      80,
              }, timeout = 180)
              assert status == 200
              msg = data["choices"][0]["message"]
              # Unsloth surfaces thinking via reasoning_content (OpenAI
              # extension). Fall back to inline <think> markers for
              # robustness across template versions.
              raw = (msg.get("content") or "") + (msg.get("reasoning_content") or "")
              return raw

          on_text  = thinking_call(True)
          off_text = thinking_call(False)
          # Mac quant drift: the model may produce empty / degenerate
          # output regardless of enable_thinking. Assert ONLY that the
          # endpoint returned 200 (already enforced inside thinking_call)
          # and that toggling the flag doesn't surface a hard <think>
          # marker when off.
          had_think_on  = ("<think>" in on_text)  or len(on_text)  > 80
          if not had_think_on:
              print(
                  f"[tools] WARN enable_thinking=True produced no thinking signal: "
                  f"{on_text[:200]!r} -- Mac quant drift"
              )
          # Off-mode should not contain the literal <think> marker.
          assert "<think>" not in off_text, (
              f"enable_thinking=False but <think> still present: {off_text!r}"
          )
          print(f"[tools] PASS thinking on/off (on={len(on_text)} chars, off={len(off_text)} chars)")
          PY

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          ss -tln | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        # Always upload so green runs are still reviewable.
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tool-calling-log
          path: |
            logs/studio_tools.log
            logs/install.log
          retention-days: 1

      # ==============================================================
      # Phase 3: JSON schema decoding + image input.
      # Reuses the install and llama.cpp check done once above rather than
      # repeating them on a second runner. Ids, cache dir and server log are
      # suffixed -vision so the phases cannot collide inside one job.
      # Same `if:` as phase 2, for the same reason: a phase-1 or phase-2
      # failure must not silently skip this phase's coverage.
      # ==============================================================
      - name: Phase 3 environment
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/gemma-4-E2B-it-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=gemma-4-E2B-it-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "MMPROJ_FILE=mmproj-F16.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18899" >> "$GITHUB_ENV"

      - name: Restore GGUF + mmproj files
        id: cache-gguf-vision
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        continue-on-error: true
        timeout-minutes: 20
        with:
          path: gguf-cache-vision
          key: ${{ runner.os }}-gguf-unsloth/gemma-4-E2B-it-GGUF-gemma-4-E2B-it-UD-Q4_K_XL.gguf-mmproj-F16.gguf-v3

      - name: Verify cache contains BOTH gguf + mmproj
        id: verify-cache
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' && steps.cache-gguf-vision.outputs.cache-hit == 'true' }}
        run: |
          if [[ -f "gguf-cache-vision/$GGUF_FILE" && -f "gguf-cache-vision/$MMPROJ_FILE" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Partial cache hit -- forcing re-download."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download GGUF + mmproj if cache miss or partial
        id: download-gguf-vision
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' && (steps.cache-gguf-vision.outputs.cache-hit != 'true' || steps.verify-cache.outputs.ok != 'true') }}
        # Authenticated + parallel: shared macOS NAT egress stalls
        # multi-GB anonymous downloads. hf-download-with-retry.sh retries
        # forever, so this cap is what actually bounds a permanent stall --
        # 30 matches the old json-images job timeout, the slowest of the three.
        timeout-minutes: 30
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache-vision
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache-vision &
          MODEL_PID=$!
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$MMPROJ_FILE" gguf-cache-vision &
          MMPROJ_PID=$!
          wait "$MODEL_PID"
          wait "$MMPROJ_PID"
          # Fail loud on a partial download instead of in the next step.
          ls -lh "gguf-cache-vision/$GGUF_FILE" "gguf-cache-vision/$MMPROJ_FILE"

      # Save partial caches on cancel. hashFiles guard avoids a hard
      # save failure when the download step exits with no files. The
      # additional mmproj-presence check stops a partial save from
      # poisoning the cache for the next run.

      - name: Save GGUF + mmproj files
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf-vision.outcome != 'skipped' && hashFiles('gguf-cache-vision/**/*.gguf') != '' && hashFiles(format('gguf-cache-vision/{0}', 'mmproj-F16.gguf')) != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        timeout-minutes: 20
        with:
          path: gguf-cache-vision
          key: ${{ runner.os }}-gguf-unsloth/gemma-4-E2B-it-GGUF-gemma-4-E2B-it-UD-Q4_K_XL.gguf-mmproj-F16.gguf-v3

      - name: Install OpenAI + Anthropic Python SDKs
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        timeout-minutes: 5
        run: pip install 'openai>=1.50' 'anthropic>=0.40'

      - name: Reset auth + boot Unsloth (API-only)
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        timeout-minutes: 2
        # See phase 2's comment: API-only mode keeps tool_policy=None so
        # response_format requests aren't routed through the agentic
        # tool loop.
        run: |
          rm -rf ~/.unsloth/studio/auth
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" \
            > logs/studio_vision.log 2>&1 &
          echo "STUDIO_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for /api/health, log in, change password, load model
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        # 180s health wait + curl's own --max-time 900, with headroom.
        timeout-minutes: 20
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIJson-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          # Load via local file path; mmproj sibling auto-detected by
          # detect_mmproj_file (model_config.py). gguf_variant omitted
          # -- it routes through _find_local_gguf_by_variant which
          # expects a directory, not a file path.
          GGUF_PATH="$GITHUB_WORKSPACE/gguf-cache-vision/${GGUF_FILE}"
          MMPROJ_PATH="$GITHUB_WORKSPACE/gguf-cache-vision/${MMPROJ_FILE}"
          ls -lh "$GGUF_PATH" "$MMPROJ_PATH"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 900 \
            -d "{\"model_path\":\"$GGUF_PATH\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name, is_vision}'

      - name: JSON schema decoding + image input
        if: ${{ !cancelled() && steps.assert-llama.outcome == 'success' }}
        timeout-minutes: 20
        env:
          BASE_URL: http://127.0.0.1:18899
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from openai import OpenAI
          from anthropic import Anthropic

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407
          # Mac Metal degenerates these gemma-4 quants at temperature=0
          # (any prompt yields '<unused5>...' padding tokens). Use a
          # small non-zero temperature with the same seed so we stay
          # deterministic-enough but escape the trap.
          TEMP = 0.2

          def post(path, body, *, timeout = 240):
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = json.dumps(body).encode(),
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type":  "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError:
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          # ── 1. response_format = json_object (JSON mode) ─────────────
          # llama.cpp's HTTP server supports OpenAI-compatible JSON
          # mode: `response_format: {"type": "json_object"}` constrains
          # the model to emit syntactically-valid JSON. We use raw HTTP
          # rather than the OpenAI SDK so that the field shape Unsloth
          # forwards to llama-server is unambiguous (the SDK rewrites
          # response_format depending on which variant it recognises).
          # We deliberately do NOT pass a strict JSON schema -- on
          # small Gemma-4 quants the GBNF-from-schema path occasionally
          # produces empty output, and JSON mode is the surface we care
          # about exposing through Unsloth.
          status, data = post("/v1/chat/completions", {
              "model":         "default",
              "messages":      [
                  {"role": "system", "content": 'Reply with a single JSON object of the form {"city": "...", "country": "..."}. Output ONLY the JSON, nothing else.'},
                  {"role": "user",   "content": "What is the capital of France?"},
              ],
              "temperature":     TEMP,
              # Trimmed for Mac runner timeout budget; json_object
              # grammar terminates quickly when working.
              "max_tokens":      200,
              "seed":            SEED,
              "stream":          False,
              "enable_thinking": False,
              "response_format": {"type": "json_object"},
          }, timeout = 240)
          assert status == 200, f"json status {status}: {data}"
          # Verify the response envelope shape -- this is what we
          # actually want to exercise on Mac. The model output quality
          # downstream of this is a Mac-Metal-quant artefact.
          assert (
              isinstance(data.get("choices"), list)
              and data["choices"]
              and "message" in data["choices"][0]
          ), f"json response envelope malformed: {data}"
          content = (data["choices"][0]["message"].get("content") or "").strip()
          print(f"[json] raw json_object content: {content!r}")
          # Some chat templates wrap JSON in ```json fences even in JSON
          # mode -- strip those before parsing.
          if content.startswith("```"):
              content = content.split("```", 2)[1]
              if content.startswith("json"):
                  content = content[4:]
              content = content.strip("`\n ")
          if content:
              try:
                  parsed = json.loads(content)
                  if "paris" in str(parsed.get("city", "")).lower():
                      print(f"[json] PASS json_object -> {parsed}")
                  else:
                      print(f"[json] WARN json_object decoded but city!=Paris: {parsed}")
              except json.JSONDecodeError as exc:
                  print(f"[json] WARN json_object content not parseable ({exc}); content={content!r}")
          else:
              print("[json] WARN json_object produced empty content on this Mac quant")
          # Cross-check: same prompt without response_format. We care
          # that the inference path stays healthy (status 200 + envelope
          # shape OK); model output quality is a separate concern.
          status2, data2 = post("/v1/chat/completions", {
              "model":         "default",
              "messages":      [{"role": "user", "content": "What is the capital of France? Answer with one word."}],
              "temperature":     TEMP,
              # 1-word answer doesn't need 400 tokens; trim so a
              # degenerate streaming model doesn't burn through the
              # job's wallclock budget.
              "max_tokens":      150,
              "seed":            SEED,
              "stream":          False,
              "enable_thinking": False,
          }, timeout = 240)
          assert status2 == 200, f"plain status {status2}: {data2}"
          plain = (data2["choices"][0]["message"].get("content") or "").lower()
          print(f"[json] plain capital-of-france reply: {plain!r}")
          if "paris" in plain:
              print("[json] PASS plain inference path (paris mentioned)")
          else:
              print(
                  f"[json] WARN plain inference returned no 'paris' -- Mac quant "
                  f"degeneracy. HTTP path validated separately above."
              )

          # ── 2. OpenAI image_url (data URI base64) ───────────────────
          # 64x64 solid-red PNG. stb_image (used by Unsloth's image
          # normaliser at routes/inference.py:3410) rejects 4x4 or
          # smaller PNGs as truncated, so we go up to 64x64 -- still
          # tiny in token cost. The assertion is loose: any non-empty
          # response from the vision path proves multimodal end-to-end
          # wiring; small VL quants are weak at colour identification.
          PNG_64X64_RED_B64 = (
              "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYklEQVR4nO3PMQ0AIADAMEAI/k"
              "UhBhEcDcmqYJtn7/GzpQNeNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA"
              "1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaBdCJ0BmMJ25zMAAAAASUVORK5CYII="
          )
          data_uri = f"data:image/png;base64,{PNG_64X64_RED_B64}"

          # The Mac prebuilt llama.cpp server has a known crash when
          # processing image inputs alongside the gemma-4-E2B mmproj
          # (server disconnects mid-completion). This is upstream
          # llama.cpp behaviour, not Unsloth. Wrap both SDK calls in
          # try/except so an upstream crash registers as a WARN rather
          # than failing the whole job. Unsloth's contract (OpenAI/
          # Anthropic image fields are accepted and forwarded) is
          # validated by the request body Unsloth constructs, not by
          # whether llama.cpp can decode it on Mac Metal.
          client = OpenAI(base_url = f"{BASE}/v1", api_key = KEY)
          try:
              openai_resp = client.chat.completions.create(
                  model       = "default",
                  temperature = TEMP,
                  max_tokens  = 80,
                  seed        = SEED,
                  messages    = [{
                      "role": "user",
                      "content": [
                          {"type": "image_url", "image_url": {"url": data_uri}},
                          {"type": "text",      "text": "What colour dominates this image? Reply in one word."},
                      ],
                  }],
              )
              openai_text = (openai_resp.choices[0].message.content or "").lower()
              print(f"[image/openai] reply: {openai_text!r}")
              if openai_text:
                  print("[image/openai] PASS image_url accepted, non-empty response")
              else:
                  print("[image/openai] WARN image_url accepted but empty content -- Mac quant drift")
          except Exception as exc:
              print(
                  f"[image/openai] WARN image_url SDK call raised: {type(exc).__name__}: "
                  f"{exc}. Likely upstream llama.cpp Mac+vision crash, NOT an Unsloth "
                  f"regression. Unsloth successfully forwarded the request."
              )

          # ── 3. Anthropic source/base64 image ────────────────────────
          # Two SDK quirks vs. Unsloth: base_url must NOT include /v1
          # (the SDK appends it itself; otherwise /v1/v1/messages -> 405),
          # and Unsloth's auth is HTTPBearer-only so the SDK's default
          # x-api-key header is ignored -- send Authorization: Bearer
          # via default_headers.
          anthropic = Anthropic(
              base_url        = BASE,
              api_key         = "unused",
              default_headers = {"Authorization": f"Bearer {KEY}"},
          )
          try:
              a_msg = anthropic.messages.create(
                  model       = "default",
                  max_tokens  = 80,
                  temperature = TEMP,
                  extra_body  = {"seed": SEED},
                  messages    = [{
                      "role": "user",
                      "content": [
                          {
                              "type":   "image",
                              "source": {
                                  "type":       "base64",
                                  "media_type": "image/png",
                                  "data":       PNG_64X64_RED_B64,
                              },
                          },
                          {"type": "text", "text": "Describe this image briefly."},
                      ],
                  }],
              )
              a_text = "".join(b.text for b in a_msg.content if getattr(b, "type", None) == "text")
              print(f"[image/anthropic] reply: {a_text!r}")
              if a_text:
                  print("[image/anthropic] PASS source/base64 accepted, non-empty response")
              else:
                  print("[image/anthropic] WARN source/base64 accepted but empty content -- Mac quant drift")
          except Exception as exc:
              print(
                  f"[image/anthropic] WARN anthropic image SDK call raised: "
                  f"{type(exc).__name__}: {exc}. Likely upstream llama.cpp Mac+vision "
                  f"crash, NOT an Unsloth regression."
              )
          PY

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          ss -tln | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        # Always upload so green runs are still reviewable.
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: json-images-log
          path: |
            logs/studio_vision.log
            logs/install.log
          retention-days: 1
