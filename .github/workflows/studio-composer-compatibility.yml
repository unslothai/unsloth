name: Composer compatibility

on:
  pull_request:
    paths:
      # The smoke pages' import graph reaches most of src/, including src/i18n which the
      # localization driver asserts, so the whole source tree is listed.
      - 'studio/frontend/src/**'
      - 'studio/frontend/.npmrc'
      - 'studio/frontend/tsconfig*.json'
      - 'studio/frontend/smoke-*'
      - 'studio/frontend/tests/**'
      - 'studio/frontend/package*.json'
      - 'studio/frontend/vite.config.ts'
      - 'tests/studio/*composer*'
      - 'tests/studio/*prompt_queue*'
      # `*` does not cross `/`, so the patterns above miss playwright_queue_localization.py.
      - 'tests/studio/*queue_localization*'
      - 'tests/studio/_playwright_robust.py'
      - 'tests/studio/_en_catalog.py'
      - '.github/workflows/studio-composer-compatibility.yml'
      - 'scripts/lockfile_supply_chain_audit.py'
      - '.github/scripts/retry-with-apt-lock.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer:
    name: Composer (${{ matrix.os }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: browsers
          - os: macos-latest
            suite: browsers
          - os: windows-latest
            suite: browsers
          - os: macos-latest
            suite: safari
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/temp/queue-validation/browsers
      PIP_CACHE_DIR: ${{ github.workspace }}/temp/queue-validation/pip-cache
      npm_config_cache: ${{ github.workspace }}/temp/queue-validation/npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Audit dependencies
        run: python scripts/lockfile_supply_chain_audit.py
      - name: Install frontend dependencies without lifecycle scripts
        working-directory: studio/frontend
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Create isolated test environment
        run: |
          # Chrome/Edge abort when their TMPDIR socket path exceeds 107 bytes; RUNNER_TEMP is short.
          mkdir -p "$RUNNER_TEMP/qv"
          echo "TMPDIR=$RUNNER_TEMP/qv" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP/qv" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP/qv" >> "$GITHUB_ENV"
          python -m venv temp/queue-validation/venv
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          folder = "Scripts" if os.name == "nt" else "bin"
          executable = "python.exe" if os.name == "nt" else "python"
          bin_dir = (Path("temp/queue-validation/venv") / folder).resolve()
          subprocess.check_call([str(bin_dir / executable), "-m", "pip", "install", "playwright==1.62.0", "selenium==4.49.0"])
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(bin_dir) + "\n")
          PY
      - name: Install browser engines
        if: matrix.suite == 'browsers'
        timeout-minutes: 10
        run: python -m playwright install chromium firefox webkit
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          APT_ACQUIRE_RETRIES: '0'
        run: |
          if python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for name in ("chromium", "firefox", "webkit"):
                  browser = getattr(p, name).launch()
                  browser.close()
          PY
          then
            echo "Browser libraries are already installed"
          else
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install-deps chromium firefox webkit
          fi
      - name: Queue engine and composer regressions
        if: matrix.suite == 'browsers'
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/composer-*.test.ts tests/prompt-queue-*.test.ts tests/model-lifecycle-gate.test.ts tests/loading-model-selection.test.ts tests/pre-stream-run-reservation.test.ts tests/auto-compaction-settings.test.ts
      - name: Browser simulations
        if: matrix.suite == 'browsers'
        run: |
          mkdir -p temp/queue-validation/compatibility
          status=0
          # One retry per driver per browser for hosted-runner flakes; a real regression fails both.
          # The command is passed through so test_playwright_suites_run_in_ci.py finds it.
          run_driver() {
            log="$1"
            shift
            if "$@" > "$log" 2>&1; then return 0; fi
            echo "::warning::$* failed on $browser, retrying once"
            printf '\n=== first attempt failed, retrying ===\n\n' >> "$log"
            if "$@" >> "$log" 2>&1; then
              echo "::notice::$* passed on $browser after one retry"
              return 0
            fi
            echo "::error::$* failed twice on $browser"
            return 1
          }
          for browser in chromium firefox webkit chrome msedge; do
            export PW_ENGINE=chromium
            unset PW_CHANNEL PW_EXECUTABLE
            case "$browser" in
              firefox|webkit) export PW_ENGINE="$browser" ;;
              chrome|msedge) export PW_CHANNEL="$browser" ;;
            esac
            run_driver "temp/queue-validation/compatibility/$browser-queue.log" \
              python tests/studio/playwright_prompt_queue_actions.py || status=1
            run_driver "temp/queue-validation/compatibility/$browser-composer.log" \
              python tests/studio/playwright_composer_settings.py || status=1
            run_driver "temp/queue-validation/compatibility/$browser-queue-localization.log" \
              python tests/studio/playwright_queue_localization.py || status=1
          done
          exit "$status"
      - name: Native Safari simulations
        if: ${{ !cancelled() && matrix.suite == 'safari' }}
        run: |
          sudo safaridriver --enable
          python tests/studio/selenium_composer_safari.py
      - name: Upload simulation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-${{ runner.os }}-${{ matrix.suite }}
          path: temp/queue-validation/compatibility
          retention-days: 7
          if-no-files-found: warn
