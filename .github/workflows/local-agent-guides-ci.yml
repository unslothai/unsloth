# Boots a real `unsloth run --disable-tools` server and drives each coding agent through the exact
# recipe `unsloth start <agent> --no-launch` prints (unsloth_cli/commands/start.py), catching recipe drift.
# Failure classes: (a) server/API preflight, (b) agent install, (c) guide drift.

name: Local Agent Guides CI

on:
  # Non-:00 minute to avoid the top-of-hour runner stampede.
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:
  # Cache saves are main-only, so a main push seeds the GGUF cache (same paths filter as PRs).
  push:
    branches: [main]
    paths:
      # Import closure of `unsloth run` plus the recipe files; only unsloth_cli/tests/** is excluded.
      - 'unsloth_cli/*'
      - 'unsloth_cli/commands/*.py'
      # inference.py declares every endpoint the preflight curls.
      - 'studio/backend/routes/inference.py'
      - 'studio/backend/main.py'
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/models/**'
      - 'install.sh'
      - '.github/workflows/local-agent-guides-ci.yml'
      # install.sh --local runs studio/setup.sh and these installer modules, which pick the measured llama-server.
      - 'studio/setup.sh'
      - 'studio/install_*.py'
      - 'studio/prebuilt_core.py'
      - 'studio/nvidia_probe.py'
      - 'studio/node_prebuilt_pins.json'
      - 'pyproject.toml'
      - 'studio/backend/requirements/**'
      - '.github/scripts/retry-with-apt-lock.sh'
      # The install step in this workflow is `uses:` on that composite action,
      # so edits to the action must trigger this workflow.
      - '.github/actions/install-unsloth-local/action.yml'
      # Reached through install-unsloth-local, which uses the dist and uv cache pairs.
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - '.github/scripts/serve-unsloth-run.sh'
      - '.github/scripts/assert-prompt-cache.sh'
      - '.github/scripts/agent-guides-install.sh'
      - '.github/scripts/agent-guides-drive.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/ci-connect-prompt.txt'
      - '.github/scripts/ci-min-system-prompt.txt'
  pull_request:
    paths:
      - 'unsloth_cli/*'
      - 'unsloth_cli/commands/*.py'
      - 'studio/backend/routes/inference.py'
      # Contracts asserted here that live outside routes/ (/api/health, KV-cache logs, dialect schemas).
      - 'studio/backend/main.py'
      - 'studio/backend/core/inference/llama_cpp.py'
      - 'studio/backend/models/**'
      - 'install.sh'
      - '.github/workflows/local-agent-guides-ci.yml'
      # install.sh --local runs studio/setup.sh and these installer modules, which pick the measured llama-server.
      - 'studio/setup.sh'
      - 'studio/install_*.py'
      - 'studio/prebuilt_core.py'
      - 'studio/nvidia_probe.py'
      - 'studio/node_prebuilt_pins.json'
      - 'pyproject.toml'
      - 'studio/backend/requirements/**'
      - '.github/scripts/retry-with-apt-lock.sh'
      - '.github/actions/install-unsloth-local/action.yml'
      # Reached through install-unsloth-local, which uses the dist and uv cache pairs.
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - '.github/scripts/serve-unsloth-run.sh'
      - '.github/scripts/assert-prompt-cache.sh'
      - '.github/scripts/agent-guides-install.sh'
      - '.github/scripts/agent-guides-drive.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/ci-connect-prompt.txt'
      - '.github/scripts/ci-min-system-prompt.txt'

concurrency:
  # The event is in the group so a merge burst on main cannot drop the scheduled run (queue keeps one pending).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# PR runs execute PR-controlled code, so HF_TOKEN is withheld on pull_request (public GGUFs still
# download). GH_TOKEN (job-scoped, contents: read) stays: install_llama_prebuilt.py needs it for the releases API.

env:
  UNSLOTH_SEED: '3407'
  # Stops a headless TTY hang. Sized for the slowest legit turn: Codex's client preamble alone takes
  # ~460s of prompt processing on CPU.
  AGENT_INVOKE_TIMEOUT: '1200'

jobs:
  # Job 1: connection. Per agent: serve, preflight the dialect, install, run the start.py recipe,
  # assert a non-empty reply. One runner per cell, one model per port.
  connection:
    name: connection (${{ matrix.agent }}, ${{ matrix.opencode_channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, hermes, openclaw, opencode, pi, dsh, vibe]
        opencode_channel: [stable]
        include:
          # OpenClaw needs Node 24; everything else is happy on 22.
          - agent: openclaw
            node: '24'
          # V2 uses beta until @opencode-ai/cli@latest publishes opencode2.
          - agent: opencode
            opencode_channel: v2
    env:
      # gemma-4-E4B: the 270m model gave empty replies for codex/openclaw. Flat GGUF; the -MTP- repo
      # ships no separate draft.
      GGUF_REPO: unsloth/gemma-4-E4B-it-GGUF
      GGUF_FILE: gemma-4-E4B-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18901'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        # Bounded and retried: an unbounded apt hang cancels the job with no reason. Two long attempts,
        # since short ones kill a slow but working mirror.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node || '22' }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore GGUF model file
        id: cache-gguf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ env.GGUF_REPO }}-${{ env.GGUF_FILE }}-v1

      - name: Download GGUF if cache miss
        id: download-gguf
        if: steps.cache-gguf.outputs.cache-hit != 'true' || steps.cache-gguf.outcome != 'success'
        env:
          # Withheld on PRs (see env note); public GGUFs still download.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache

      - name: Save GGUF model file
        # Save on main only: PR-scoped caches only serve that PR and push main's shared copies out of the
        # LRU-evicted, nearly full repo cache budget.
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ env.GGUF_REPO }}-${{ env.GGUF_FILE }}-v1

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PRs (see env note); public GGUFs still download.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Serve unsloth run --disable-tools (gemma-4-E4B)
        run: |
          # Wipe instead of reset-password: the reset prints the new passphrase into the job log.
          rm -rf ~/.unsloth/studio/auth
          bash .github/scripts/serve-unsloth-run.sh \
            --gguf-file "$GITHUB_WORKSPACE/gguf-cache/${GGUF_FILE}" \
            --port "$STUDIO_PORT" --log-dir logs \
            --extra "--seed $UNSLOTH_SEED --temp 0" \
            --health-timeout 900

      # A failure here is a server regression (class a); the agent steps never run.
      - name: Preflight the agent's API dialect (class-a isolation)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -uo pipefail
          B="$UNSLOTH_BASE_URL"; K="$UNSLOTH_API_KEY"
          preflight_fail() {
            echo "::error::[server/API regression] agent=$AGENT: $* (preflight failed BEFORE install/connect; this is class (a), not guide drift). Endpoint contract lives in studio/backend/routes/**.";
            exit 1
          }
          code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/models" \
            -H "Authorization: Bearer $K") || true
          [ "$code" = "200" ] || preflight_fail "/v1/models returned HTTP $code"
          case "$AGENT" in
            claude)
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/messages" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}]}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/messages returned HTTP $code"
              ;;
            codex)
              # Codex always streams /v1/responses.
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/responses" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"input\":\"Hi\",\"max_output_tokens\":16,\"stream\":true}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/responses returned HTTP $code"
              ;;
            *)
              # OpenAI Chat Completions (hermes/opencode/pi/openclaw; openclaw's recipe writes an openai-completions provider).
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/chat/completions" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}]}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/chat/completions returned HTTP $code"
              ;;
          esac
          echo "preflight OK for $AGENT"

      - name: Install agent CLI (class-b isolation)
        env:
          AGENT: ${{ matrix.agent }}
          OPENCODE_CHANNEL: ${{ matrix.opencode_channel }}
        run: bash .github/scripts/agent-guides-install.sh "$AGENT"

      # Apply the env from `unsloth start <agent> --no-launch`, then run the printed command with a hard timeout.
      - name: Drive ${{ matrix.agent }} via unsloth start (class-c isolation)
        env:
          AGENT: ${{ matrix.agent }}
        run: bash .github/scripts/agent-guides-drive.sh connection "$AGENT"

      - name: Collect server logs (debug)
        if: always()
        run: |
          mkdir -p logs/studio-logs
          cp -r "$HOME/.unsloth/studio/logs/." logs/studio-logs/ 2>/dev/null || true
          # Redact the key in every uploaded path: the `unsloth run` banner prints `API Key: <key>` into logs/.
          if [ -n "${UNSLOTH_API_KEY:-}" ]; then
            grep -rlF "$UNSLOTH_API_KEY" logs redacted-configs agent-workdir 2>/dev/null | while IFS= read -r f; do
              sed -i "s#${UNSLOTH_API_KEY}#<REDACTED>#g" "$f" 2>/dev/null || true
            done
          fi

      - name: Stop Unsloth
        if: always()
        run: |
          # An unset or zero PID would make `kill 0` signal this step's whole process group.
          if [ -n "${UNSLOTH_SERVER_PID:-}" ] && [ "${UNSLOTH_SERVER_PID}" != "0" ]; then
            kill "${UNSLOTH_SERVER_PID}" 2>/dev/null || true
          fi
          sleep 2
          ss -tln 2>/dev/null | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: connection-${{ matrix.agent }}-${{ matrix.opencode_channel }}-log
          path: |
            logs/
            redacted-configs/
          retention-days: 7

  # Job 2: file-edit. Deterministic 2-turn hello.py test on Qwen3.5-4B; slow, so weekly + dispatch only.
  file-edit:
    name: file-edit (${{ matrix.agent }})
    # Not run on main pushes: `connection` already seeds the identical cache key.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # hermes/openclaw tool loops cannot finish on CPU in time; connection already hard-gates their
    # wiring, so these cells are best-effort.
    continue-on-error: ${{ matrix.best_effort || false }}
    strategy:
      fail-fast: false
      matrix:
        agent: [claude, codex, hermes, openclaw, opencode, pi, dsh, vibe]
        include:
          - agent: openclaw
            node: '24'
            best_effort: true
          - agent: hermes
            best_effort: true
          # dsh has no resume: turn 2 is a fresh session that re-reads hello.py.
          - agent: dsh
            best_effort: true
    env:
      GGUF_REPO: unsloth/gemma-4-E4B-it-GGUF
      GGUF_FILE: gemma-4-E4B-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18902'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        # Bounded and retried: an unbounded apt hang cancels the job with no reason. Two long attempts,
        # since short ones kill a slow but working mirror.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node || '22' }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore GGUF model file
        id: cache-gguf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ env.GGUF_REPO }}-${{ env.GGUF_FILE }}-v1

      - name: Download GGUF if cache miss
        id: download-gguf
        if: steps.cache-gguf.outputs.cache-hit != 'true' || steps.cache-gguf.outcome != 'success'
        env:
          # Withheld on PRs (see env note); public GGUFs still download.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache

      - name: Save GGUF model file
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ env.GGUF_REPO }}-${{ env.GGUF_FILE }}-v1

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PRs (see env note); public GGUFs still download.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Serve unsloth run --disable-tools (gemma-4-E4B)
        run: |
          rm -rf ~/.unsloth/studio/auth
          bash .github/scripts/serve-unsloth-run.sh \
            --gguf-file "$GITHUB_WORKSPACE/gguf-cache/${GGUF_FILE}" \
            --port "$STUDIO_PORT" --log-dir logs \
            --extra "--seed $UNSLOTH_SEED --temp 0" \
            --health-timeout 900

      - name: Preflight the agent's API dialect (class-a isolation)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -uo pipefail
          B="$UNSLOTH_BASE_URL"; K="$UNSLOTH_API_KEY"
          preflight_fail() {
            echo "::error::[server/API regression] agent=$AGENT: $* (preflight failed BEFORE install/connect; this is class (a), not guide drift). Endpoint contract lives in studio/backend/routes/**.";
            exit 1
          }
          code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/models" \
            -H "Authorization: Bearer $K") || true
          [ "$code" = "200" ] || preflight_fail "/v1/models returned HTTP $code"
          # Probe the agent's own dialect so a server regression reports as class (a), not guide drift.
          case "$AGENT" in
            claude)
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/messages" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}]}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/messages returned HTTP $code"
              ;;
            codex)
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/responses" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"input\":\"Hi\",\"max_output_tokens\":16,\"stream\":true}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/responses returned HTTP $code"
              ;;
            *)
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/chat/completions" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}]}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/chat/completions returned HTTP $code"
              ;;
          esac
          echo "preflight OK for $AGENT"

      - name: Install agent CLI (class-b isolation)
        env:
          AGENT: ${{ matrix.agent }}
        run: bash .github/scripts/agent-guides-install.sh "$AGENT"

      - name: 2-turn hello.py test (class-c isolation)
        env:
          AGENT: ${{ matrix.agent }}
        run: bash .github/scripts/agent-guides-drive.sh file-edit "$AGENT"

      - name: Collect server logs (debug)
        if: always()
        run: |
          mkdir -p logs/studio-logs
          cp -r "$HOME/.unsloth/studio/logs/." logs/studio-logs/ 2>/dev/null || true
          # Redact the key in every uploaded path: the `unsloth run` banner prints `API Key: <key>` into logs/.
          if [ -n "${UNSLOTH_API_KEY:-}" ]; then
            grep -rlF "$UNSLOTH_API_KEY" logs redacted-configs agent-workdir 2>/dev/null | while IFS= read -r f; do
              sed -i "s#${UNSLOTH_API_KEY}#<REDACTED>#g" "$f" 2>/dev/null || true
            done
          fi

      - name: Stop Unsloth
        if: always()
        run: |
          # An unset or zero PID would make `kill 0` signal this step's whole process group.
          if [ -n "${UNSLOTH_SERVER_PID:-}" ] && [ "${UNSLOTH_SERVER_PID}" != "0" ]; then
            kill "${UNSLOTH_SERVER_PID}" 2>/dev/null || true
          fi
          sleep 2
          ss -tln 2>/dev/null | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: file-edit-${{ matrix.agent }}-log
          path: |
            logs/
            agent-workdir/
            redacted-configs/
          retention-days: 7

  # Job: resume. Drives the real launch path: plain launch puts codex/pi homes in a temp dir wiped on
  # exit, --persist keeps them; opencode/claude persist either way. Dispatch-only.
  resume:
    name: resume (${{ matrix.agent }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One agent per class; openclaw/hermes share codex's relocation and are unit-tested.
        agent: [codex, opencode, claude, pi]
    env:
      GGUF_REPO: unsloth/gemma-4-E4B-it-GGUF
      GGUF_FILE: gemma-4-E4B-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18904'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        # Bounded and retried: an unbounded apt hang cancels the job with no reason. Two long attempts,
        # since short ones kill a slow but working mirror.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore GGUF model file
        id: cache-gguf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ env.GGUF_REPO }}-${{ env.GGUF_FILE }}-v1

      - name: Download GGUF if cache miss
        id: download-gguf
        if: steps.cache-gguf.outputs.cache-hit != 'true' || steps.cache-gguf.outcome != 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache

      - name: Save GGUF model file
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gguf-cache
          key: ${{ runner.os }}-gguf-${{ env.GGUF_REPO }}-${{ env.GGUF_FILE }}-v1

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Serve unsloth run --disable-tools (gemma-4-E4B)
        run: |
          rm -rf ~/.unsloth/studio/auth
          bash .github/scripts/serve-unsloth-run.sh \
            --gguf-file "$GITHUB_WORKSPACE/gguf-cache/${GGUF_FILE}" \
            --port "$STUDIO_PORT" --log-dir logs \
            --extra "--seed $UNSLOTH_SEED --temp 0" \
            --health-timeout 900

      - name: Preflight the agent's API dialect (class-a isolation)
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          set -uo pipefail
          B="$UNSLOTH_BASE_URL"; K="$UNSLOTH_API_KEY"
          preflight_fail() {
            echo "::error::[server/API regression] agent=$AGENT: $* (preflight failed BEFORE install/connect). Endpoint contract lives in studio/backend/routes/**.";
            exit 1
          }
          code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/models" \
            -H "Authorization: Bearer $K") || true
          [ "$code" = "200" ] || preflight_fail "/v1/models returned HTTP $code"
          case "$AGENT" in
            claude)
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/messages" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}]}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/messages returned HTTP $code"
              ;;
            codex)
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/responses" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"input\":\"Hi\",\"max_output_tokens\":16,\"stream\":true}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/responses returned HTTP $code"
              ;;
            *)
              code=$(curl -s -o /tmp/pf.json -w '%{http_code}' "$B/v1/chat/completions" \
                -H "Authorization: Bearer $K" -H 'content-type: application/json' \
                --max-time 120 \
                -d "{\"model\":\"$UNSLOTH_MODEL_ID\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Hi\"}]}") || true
              [ "$code" = "200" ] || preflight_fail "/v1/chat/completions returned HTTP $code"
              ;;
          esac
          echo "preflight OK for $AGENT"

      - name: Install agent CLI (class-b isolation)
        env:
          AGENT: ${{ matrix.agent }}
        run: bash .github/scripts/agent-guides-install.sh "$AGENT"

      - name: Resume experiment (launch path)
        env:
          AGENT: ${{ matrix.agent }}
        run: bash .github/scripts/agent-guides-drive.sh resume "$AGENT"

      - name: Collect server logs (debug)
        if: always()
        run: |
          mkdir -p logs/studio-logs
          cp -r "$HOME/.unsloth/studio/logs/." logs/studio-logs/ 2>/dev/null || true
          if [ -n "${UNSLOTH_API_KEY:-}" ]; then
            grep -rlF "$UNSLOTH_API_KEY" logs redacted-configs agent-workdir 2>/dev/null | while IFS= read -r f; do
              sed -i "s#${UNSLOTH_API_KEY}#<REDACTED>#g" "$f" 2>/dev/null || true
            done
          fi

      - name: Stop Unsloth
        if: always()
        run: |
          if [ -n "${UNSLOTH_SERVER_PID:-}" ] && [ "${UNSLOTH_SERVER_PID}" != "0" ]; then
            kill "${UNSLOTH_SERVER_PID}" 2>/dev/null || true
          fi
          sleep 2
          ss -tln 2>/dev/null | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: resume-${{ matrix.agent }}-log
          path: |
            logs/
            agent-workdir/
            redacted-configs/
          retention-days: 7

  # Job 3: prompt-cache. (a) turn-2 cached_tokens > 0; (b) Claude Code with
  # CLAUDE_CODE_ATTRIBUTION_HEADER=0 hits the KV cache on turn 2, without it misses.
  prompt-cache:
    name: prompt-cache (gemma-3-270m)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GGUF_REPO: unsloth/gemma-3-270m-it-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GGUF_FILE: gemma-3-270m-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18903'
      HF_HOME: ${{ github.workspace }}/hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        # Bounded and retried: an unbounded apt hang cancels the job with no reason. Two long attempts,
        # since short ones kill a slow but working mirror.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # The hf-cache tree is identical across OSes, so the key has no runner.os (enableCrossOsArchive).
      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        id: cache-hf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          # Withheld on PRs (see env note); public GGUFs still download.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PRs (see env note); public GGUFs still download.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Serve unsloth run --disable-tools (gemma-3-270m)
        run: |
          rm -rf ~/.unsloth/studio/auth
          bash .github/scripts/serve-unsloth-run.sh \
            --model "$GGUF_REPO" --gguf-variant "$GGUF_VARIANT" \
            --port "$STUDIO_PORT" --log-dir logs \
            --extra "--seed $UNSLOTH_SEED --temp 0"

      # Hard gate: llama.cpp KV reuse must surface as cached_tokens on /v1/chat/completions.
      - name: Server prompt-cache sanity (cached_tokens > 0)
        run: bash .github/scripts/assert-prompt-cache.sh api "$UNSLOTH_BASE_URL" "$UNSLOTH_API_KEY"

      - name: Install Claude Code (class-b isolation)
        env:
          AGENT: claude
        run: bash .github/scripts/agent-guides-install.sh claude

      # Non-blocking: depends on llama-server log wording and claude --continue prefix reuse.
      - name: Claude attribution A/B (HIT with header=0, MISS without)
        continue-on-error: true
        run: bash .github/scripts/agent-guides-drive.sh attribution-ab claude

      - name: Collect server logs (debug)
        if: always()
        run: |
          mkdir -p logs/studio-logs
          cp -r "$HOME/.unsloth/studio/logs/." logs/studio-logs/ 2>/dev/null || true
          # Redact the key in every uploaded path: the `unsloth run` banner prints `API Key: <key>` into logs/.
          if [ -n "${UNSLOTH_API_KEY:-}" ]; then
            grep -rlF "$UNSLOTH_API_KEY" logs redacted-configs agent-workdir 2>/dev/null | while IFS= read -r f; do
              sed -i "s#${UNSLOTH_API_KEY}#<REDACTED>#g" "$f" 2>/dev/null || true
            done
          fi

      - name: Stop Unsloth
        if: always()
        run: |
          # An unset or zero PID would make `kill 0` signal this step's whole process group.
          if [ -n "${UNSLOTH_SERVER_PID:-}" ] && [ "${UNSLOTH_SERVER_PID}" != "0" ]; then
            kill "${UNSLOTH_SERVER_PID}" 2>/dev/null || true
          fi
          sleep 2
          ss -tln 2>/dev/null | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prompt-cache-log
          path: |
            logs/
            redacted-configs/
          retention-days: 7
