name: Temporary fast apply MLX trainer API fix

on:
  push:
    branches:
      - feat/agent-workspace-mlx-runtime
    paths:
      - .github/workflows/tmp-apply-mlx-trainer-api-fix-linux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-workspace-mlx-runtime
          fetch-depth: 0

      - name: Verify upstream API and update MLX CI
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/unslothai/unsloth-zoo /tmp/unsloth-zoo
          grep -R -F 'MLXTrainer' /tmp/unsloth-zoo/unsloth_zoo/mlx_trainer
          grep -R -F 'MLXTrainingConfig' /tmp/unsloth-zoo/unsloth_zoo/mlx_trainer
          if grep -R -F 'UnslothMLXTrainer' /tmp/unsloth-zoo/unsloth_zoo/mlx_trainer; then
            echo 'unexpected legacy alias still exported by current unsloth-zoo' >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/mlx-ci.yml')
          source = path.read_text(encoding='utf-8')
          old_import = 'from unsloth_zoo.mlx_trainer import UnslothMLXTrainer'
          old_print = "print('OK: UnslothMLXTrainer =', UnslothMLXTrainer)"
          new_import = 'from unsloth_zoo.mlx_trainer import MLXTrainer, MLXTrainingConfig'
          new_print = (
              "print('OK: MLXTrainer =', MLXTrainer)\n"
              "          print('OK: MLXTrainingConfig =', MLXTrainingConfig)"
          )
          if old_import in source or old_print in source:
              if source.count(old_import) != 1 or source.count(old_print) != 1:
                  raise SystemExit('stale MLX trainer API references have an unexpected shape')
              source = source.replace(old_import, new_import).replace(old_print, new_print)
          if source.count(new_import) != 1 or source.count('UnslothMLXTrainer') != 0:
              raise SystemExit('current MLX trainer API assertion did not converge')
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/mlx-ci.yml; then
            echo 'MLX CI already uses the current public API'
            exit 0
          fi
          git config user.name "Philip John Basile"
          git config user.email "PBasile@Basilecom.com"
          git add .github/workflows/mlx-ci.yml
          git commit -m "ci(mlx): use the current trainer public API"
          git push origin HEAD:feat/agent-workspace-mlx-runtime
