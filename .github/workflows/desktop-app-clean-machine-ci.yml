# Installs and launches the SHIPPED desktop app on a machine stripped of developer tooling.
# No desktop session, so: bundle installs, binary arch and gatekeeper checks, the process stays up past
# preflight, and tauri.log records a READY disposition. Linux runs a real webview under Xvfb.

name: Desktop app clean machine

on:
  # Dispatch resolves the workflow from the default branch, so PRs are needed to test edits.
  pull_request:
    paths:
      - '.github/workflows/desktop-app-clean-machine-ci.yml'
      - '.github/scripts/retry-with-apt-lock.sh'

      - '.github/scripts/resolve-desktop-release.py'
      - '.github/scripts/clean-machine-env.sh'
      - '.github/scripts/clean-machine-assert.sh'
      - '.github/scripts/clean-machine-install-name-tool.sh'
      - '.github/workflows/release-desktop.yml'
      - 'studio/src-tauri/linux/**'
      - 'studio/src-tauri/src/**'
      - 'studio/src-tauri/tauri.conf.json'
      # Inputs of the AppImage that appimage-pr-build builds from this ref.
      - 'scripts/lockfile_supply_chain_audit.py'
      - 'studio/package.json'
      - 'studio/package-lock.json'
      - 'studio/frontend/package.json'
      - 'studio/frontend/package-lock.json'
      - 'studio/.npmrc'
      - 'studio/frontend/.npmrc'
      - 'studio/backend/core/data_recipe/oxc-validator/package-lock.json'
      - 'studio/backend/core/data_recipe/oxc-validator/.npmrc'
      - 'studio/src-tauri/Cargo.toml'
      - 'studio/src-tauri/Cargo.lock'
      - 'studio/src-tauri/build.rs'
      - 'studio/src-tauri/capabilities/**'
      - 'studio/src-tauri/icons/**'
      - 'studio/src-tauri/tauri.linux.conf.json'
      - 'tests/security/test_release_desktop_appimage.py'
      - 'tests/studio/appimage_test_support.py'
      - 'tests/studio/appimage_portability_smoke.py'
      - 'tests/studio/appimage_media_pipeline_probe.py'
      - 'tests/studio/appimage_model_download_webdriver.py'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag in the desktop release repo (empty resolves the newest)'
        type: string
        # Empty picks the newest SemVer v... release with the platform bundle; a tag is a fixed fixture.
        default: ''
      release_repo:
        description: 'owner/name hosting the desktop release'
        type: string
        default: ''
      strip_toolchain:
        description: 'Strip developer tooling before installing'
        type: boolean
        default: true
  schedule:
    - cron: '17 5 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Drafts are listed only to a token with push access, and review drafts are tested.
  contents: write

env:
  # release-desktop.yml publishes here; a nightly against another repo tests a frozen fixture.
  REL_REPO: ${{ inputs.release_repo || github.repository }}
  # Empty unless dispatched, so the nightly always resolves the newest release (drafts included).
  REL_TAG: ${{ inputs.release_tag || '' }}
  UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-home
  UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'

jobs:
  macos:
    # A fork PR's token cannot list review drafts, so skip rather than fail.
    if: github.event.pull_request.head.repo.fork != true
    name: desktop macOS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}

    env:
      # Forces the bundled installer through uv's first managed-Python download.
      UV_CACHE_DIR: ${{ github.workspace }}/.clean-machine/uv-cache
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.clean-machine/uv-python
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, experimental: false}
          - {os: macos-26, experimental: true}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false


      - name: Prepare fresh uv state
        run: |
          rm -rf "$UV_CACHE_DIR" "$UV_PYTHON_INSTALL_DIR"
          mkdir -p "$UV_CACHE_DIR" "$UV_PYTHON_INSTALL_DIR"

      - name: Download the shipped .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl logs
          # Match tag and required asset so non-app v... releases cannot be picked.
          if [ -z "$REL_TAG" ]; then
            releases_json="$RUNNER_TEMP/desktop-releases.json"
            if ! gh release list --repo "$REL_REPO" --limit 100 \
              --json tagName,createdAt,isDraft > "$releases_json"; then
              echo "::error::could not list desktop releases in $REL_REPO"
              exit 1
            fi
            if ! REL_TAG="$(python3 .github/scripts/resolve-desktop-release.py \
              --repo "$REL_REPO" --asset-suffix .dmg < "$releases_json")"; then
              echo "::error::no SemVer v... release with a .dmg is visible in $REL_REPO"
              exit 1
            fi
            echo "resolved release tag: $REL_TAG"
            echo "REL_TAG=$REL_TAG" >> "$GITHUB_ENV"
          fi
          # Match the extension only: bundle names change, and the arm64 check below asserts the arch.
          gh release download "$REL_TAG" --repo "$REL_REPO" \
            --pattern '*.dmg' --dir dl
          ls -la dl

      - name: Strip the developer toolchain
        # `inputs` is empty outside dispatch, and '' != false is FALSE, so gate on the event.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.strip_toolchain }}
        run: |
          bash .github/scripts/clean-machine-env.sh mask --remove
          set -a; . ./clean-machine.env; set +a
          [ -n "$UNSLOTH_TOOL_TRACE" ] || { echo "::error::mask mode set no UNSLOTH_TOOL_TRACE"; exit 1; }
          bash .github/scripts/clean-machine-install-name-tool.sh \
            verify-sentinel "$UNSLOTH_TOOL_TRACE" desktop
          bash .github/scripts/clean-machine-assert.sh absent nodylibtool

      - name: Mount and install
        run: |
          DMG="$(ls dl/*.dmg | head -1)"
          # Gatekeeper treats a quarantined download differently from a local build.
          xattr -w com.apple.quarantine \
            "0081;$(printf %x $(date +%s));Safari;" "$DMG" 2>/dev/null || true
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint /Volumes/UnslothCI
          APP="$(ls -d /Volumes/UnslothCI/*.app | head -1)"
          echo "app bundle: $APP"
          cp -R "$APP" /Applications/
          hdiutil detach /Volumes/UnslothCI -quiet
          ls -la /Applications | grep -i unsloth

      - name: Inspect the bundle (arch, signature, Gatekeeper)
        run: |
          APP="$(ls -d /Applications/*Unsloth*.app | head -1)"
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          file "$BIN"
          # lipo is an xcrun shim that disappears with the toolchain strip; `file` is base system.
          ARCHS="$(lipo -archs "$BIN" 2>/dev/null || true)"
          [ -n "$ARCHS" ] || ARCHS="$(file -b "$BIN")"
          echo "architectures: $ARCHS"
          case "$ARCHS" in
            *arm64*|*aarch64*) ;;
            *) echo "::error::the aarch64 .dmg carries no arm64 binary ($ARCHS)"; exit 1 ;;
          esac
          # Report, not gate: an unnotarised beta fails assessment, but users will see it.
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20 || true
          spctl -a -vvv -t install "$APP" 2>&1 | head -5 || \
            echo "::warning::Gatekeeper assessment failed -- users see 'cannot be opened' unless notarised"
          if [ -f "$APP/Contents/Resources/install.sh" ]; then
            echo "bundled install.sh present"
          else
            echo "::error::no bundled install.sh in the app"
            exit 1
          fi

      - name: Run the bundled installer, the path first launch takes
        run: |
          set -a; [ -f ./clean-machine.env ] && . ./clean-machine.env; set +a
          set -o pipefail
          APP="$(ls -d /Applications/*Unsloth*.app | head -1)"
          # Headless preflight waits for an Install click, so run the bundled installer as install.rs does:
          # --tauri, stdin closed, no tty. --tauri rejects a custom studio home.
          SH="$APP/Contents/Resources/install.sh"
          # Run outside the checkout like the app: older bundles resolve `studio` against the cwd.
          rc=0
          (cd "$RUNNER_TEMP" && env -u UNSLOTH_STUDIO_HOME \
            bash "$SH" --tauri \
            < /dev/null 2>&1) | tee logs/bundled-install.log || rc=$?
          echo "bundled installer exit code: $rc"
          [ "$rc" -eq 0 ] || {
            echo "::error::bundled installer exited $rc"
            exit 1
          }
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          [ -x "$PY" ] || { echo "::error::bundled installer left no venv at $PY"; exit 1; }
          "$PY" -V
          # All representative wheels must load without uv's developer-only libpython ID patch.
          "$PY" -c "import numpy, safetensors, tokenizers, torch; print('native wheels loaded', numpy.__version__, torch.__version__)"

          if [ -f ./clean-machine.env ]; then
            # uv treats install_name_tool failure as a warning, so the sentinel proves the bundled guard won.
            bash .github/scripts/clean-machine-assert.sh absent nodylibtool
          fi
          leftovers=$(find "${TMPDIR:-/tmp}" -maxdepth 1 -type d \
            -name 'unsloth-uv-install-name-tool.*' -print 2>/dev/null || true)
          [ -z "$leftovers" ] || {
            echo "::error::bundled installer left temporary uv guard directories: $leftovers"
            exit 1
          }

      - name: Launch and prove it stays up
        run: |
          set -a; [ -f ./clean-machine.env ] && . ./clean-machine.env; set +a
          APP="$(ls -d /Applications/*Unsloth*.app | head -1)"
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          (cd "$RUNNER_TEMP" && exec "$BIN") > logs/app-stdout.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 90); do
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "app still running after 90s (pid $APP_PID)"
            kill -TERM "$APP_PID" 2>/dev/null || true
          else
            # `|| rc=$?`: under `bash -e` a bare failing `wait` aborts before the diagnostics print.
            rc=0
            wait "$APP_PID" 2>/dev/null || rc=$?
            echo "::error::desktop app exited early with rc=$rc"
            tail -50 logs/app-stdout.log || true
            exit 1
          fi

      - name: What did its own log say?
        if: always()
        run: |
          for f in "$UNSLOTH_STUDIO_HOME/tauri.log" "$HOME/.unsloth/studio/tauri.log"; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            cp "$f" logs/ 2>/dev/null || true
            tail -60 "$f"
            # The preflight reason is on a separate line that tail would scroll away.
            grep -E "disposition=|can_auto_repair=|Managed preflight|Xcode Command Line|ModuleNotFoundError" "$f" || true
            found=1
            if grep -qE "desktop_preflight completed disposition=" "$f"; then disposition=1; fi
            dispositions="${dispositions:-} $(grep -oE 'desktop_preflight completed disposition=[A-Za-z]+' "$f" | sed 's/.*disposition=//' | tr '\n' ' ')"
          done
          # tauri.log opens at process start, so no log means the binary never got that far.
          [ "${found:-0}" = "1" ] || { echo "::error::the app wrote no tauri.log; it never reached setup_logging"; exit 1; }
          [ "${disposition:-0}" = "1" ] || { echo "::error::tauri.log records no desktop_preflight disposition; the app never completed preflight"; exit 1; }
          # A disposition alone is not enough: preflight can regress to NotInstalled on a working venv.
          # Every platform requires READY, since preflight reads the same legacy root on all three.
          echo "dispositions recorded: ${dispositions:-<none>}"
          case "${dispositions:-}" in
            *ManagedReady*|*OwnedReady*|*AttachedReady*) ;;
            *) echo "::error::preflight never reported a ready disposition (saw: ${dispositions:-<none>}); the app did not recognise the environment the bundled installer just built"
               exit 1 ;;
          esac

      - name: Restore the runner
        if: always()
        # The file exists only after the strip ran; skip explicitly when absent so real failures surface.
        run: |
          if [ -f .clean-machine/restore.sh ]; then
            bash .clean-machine/restore.sh
          else
            echo "no .clean-machine/restore.sh: the toolchain was never stripped, nothing to restore"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-macos-${{ matrix.os }}
          path: |
            logs/
            .clean-machine/tool-invocations.log
          retention-days: 7
          if-no-files-found: warn

  linux:
    # See the macOS job: a fork PR's token cannot list drafts, so skip rather than fail.
    if: github.event.pull_request.head.repo.fork != true
    name: desktop linux ${{ matrix.kind }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: deb, arch: x64, os: ubuntu-22.04, asset: Ubuntu.deb, experimental: false}
          - {kind: deb, arch: arm64, os: ubuntu-24.04-arm, asset: Ubuntu-ARM64.deb, experimental: false}
          - {kind: appimage, arch: x64, os: ubuntu-22.04, asset: Linux.AppImage, experimental: false}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the shipped bundle
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl logs
          asset_suffix='${{ matrix.asset }}'
          pat="*$asset_suffix"
          # See the macOS job. Loud on purpose: no matching bundle means nothing to prove.
          if [ -z "$REL_TAG" ]; then
            releases_json="$RUNNER_TEMP/desktop-releases.json"
            if ! gh release list --repo "$REL_REPO" --limit 100 \
              --json tagName,createdAt,isDraft > "$releases_json"; then
              echo "::error::could not list desktop releases in $REL_REPO"
              exit 1
            fi
            resolver_rc=0
            REL_TAG="$(python3 .github/scripts/resolve-desktop-release.py \
              --repo "$REL_REPO" --asset-suffix "$asset_suffix" < "$releases_json")" || resolver_rc=$?
            if [ "$resolver_rc" -ne 0 ]; then
              if [ "$resolver_rc" -eq 1 ] && [ "$asset_suffix" = 'Ubuntu-ARM64.deb' ]; then
                echo "::notice::no ARM64 release is available; package checks skipped"
                echo "unreleased=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::no SemVer v... release with a $asset_suffix asset is visible in $REL_REPO"
              exit 1
            fi
            echo "resolved release tag: $REL_TAG"
            echo "REL_TAG=$REL_TAG" >> "$GITHUB_ENV"
          fi
          gh release download "$REL_TAG" --repo "$REL_REPO" --pattern "$pat" --dir dl
          ls -la dl

      - name: Strip the developer toolchain
        # Same strip gate as macOS, and before the package install so dpkg maintainer scripts see no
        # toolchain.
        if: ${{ steps.download.outputs.unreleased != 'true' && (github.event_name != 'workflow_dispatch' || inputs.strip_toolchain) }}
        run: |
          bash .github/scripts/clean-machine-env.sh mask --remove
          set -a; . ./clean-machine.env; set +a
          bash .github/scripts/clean-machine-assert.sh absent

      - name: Install with NO dev tooling, only runtime libs
        if: steps.download.outputs.unreleased != 'true'
        # The .deb install is deliberately unbounded by the helper; the step budget still bounds it.
        timeout-minutes: 25
        run: |
          # No build-essential/cmake/git: a .deb user has none; apt pulls the declared deps.
          RETRY_ATTEMPTS=2 RETRY_ATTEMPT_TIMEOUT=360 \
            bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y -qq --no-install-recommends xvfb || { apt-get update -qq && apt-get install -y -qq --no-install-recommends xvfb; }'
          if [ "${{ matrix.kind }}" = "deb" ]; then
            # Refresh the index first: the image's baked apt lists 404 once Ubuntu rotates a point release.
            apt_log="$RUNNER_TEMP/deb-install.log"
            # Redirect, not tee: without pipefail a pipe would report tee's status.
            if ! sudo apt-get install -y ./dl/*.deb > "$apt_log" 2>&1; then
              cat "$apt_log"
              sudo apt-get update -qq
              if ! sudo apt-get install -y ./dl/*.deb > "$apt_log" 2>&1; then
                cat "$apt_log"
                # A fetch error is the mirror's fault, not a packaging defect.
                if grep -qE "Failed to fetch|404  Not Found" "$apt_log"; then
                  echo "::error::apt could not fetch a dependency from the mirror even after apt-get update; this is the runner's package mirror, not the .deb's dependency list"
                else
                  echo "::error::the .deb does not declare its runtime dependencies correctly"
                fi
                exit 1
              fi
            fi
            cat "$apt_log"
            BIN="$(dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep -E '/usr/bin/' | head -1)"
            # In-app .deb updates need the polkit action shipped via bundle.linux.deb.files;
            # nothing else checks it.
            POLICY=/usr/share/polkit-1/actions/ai.unsloth.studio.update.policy
            if ! dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep -qx "$POLICY"; then
              echo "::error::the .deb no longer ships $POLICY, so in-app Debian updates cannot authenticate"
              exit 1
            fi
            # auth_admin on all three implicit cases makes the update prompt instead of elevating or refusing.
            if [ "$(stat -c '%U:%G %a' "$POLICY")" != "root:root 644" ]; then
              echo "::error::$POLICY has the wrong owner or mode: $(stat -c '%U:%G %a' "$POLICY")"
              exit 1
            fi
            grep -c 'auth_admin' "$POLICY" | grep -qx 3 || {
              echo "::error::$POLICY no longer requires auth_admin for all three implicit cases"
              exit 1
            }
            echo "polkit action shipped: $(stat -c '%U:%G %a %n' "$POLICY")"
          else
            sudo apt-get install -y -qq --no-install-recommends \
              libfuse2 libgles2 libgl1 libegl1 libgbm1 libwayland-client0 \
              libharfbuzz0b libnghttp2-14 fontconfig libfribidi0
            chmod +x dl/*.AppImage
            BIN="$(ls dl/*.AppImage | head -1)"
          fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          echo "binary: $BIN"

      # The .deb's declared deps could put a toolchain back in /usr/bin after the strip.
      - name: Re-assert the toolchain is still absent after the package install
        if: ${{ steps.download.outputs.unreleased != 'true' && (github.event_name != 'workflow_dispatch' || inputs.strip_toolchain) }}
        run: |
          set -a; . ./clean-machine.env; set +a
          bash .github/scripts/clean-machine-assert.sh absent
          # `absent` cannot see a new toolchain Depends (masked packages stay installed), so read the list.
          if [ "${{ matrix.kind }}" = "deb" ]; then
            deps="$(dpkg-deb -f dl/*.deb Depends)"
            echo "declared Depends: $deps"
            if printf '%s' "$deps" | grep -qE '(^|[ ,])(git|cmake|build-essential|gcc|g\+\+|clang|llvm)([ ,(]|$)'; then
              echo "::error::the bundle now declares a developer toolchain dependency, so a .deb install no longer leaves a clean machine: $deps"
              exit 1
            fi
          fi

      - name: Run the bundled installer, the path first launch takes
        if: steps.download.outputs.unreleased != 'true'
        run: |
          set -a; [ -f ./clean-machine.env ] && . ./clean-machine.env; set +a
          set -o pipefail
          # The launch step alone passes with a broken install.sh (preflight waits for a click), so run it.
          if [ "${{ matrix.kind }}" = "deb" ]; then
            # `|| true`: grep selecting nothing would abort under pipefail before the annotation below.
            SH="$(dpkg -L "$(dpkg-deb -f dl/*.deb Package)" | grep -E '/install\.sh$' | head -1 || true)"
          else
            # A command word without a slash resolves through PATH, so this needs ./
            (cd dl && "./$(ls *.AppImage | head -1)" --appimage-extract >/dev/null)
            SH="$(find dl/squashfs-root -name install.sh -type f | head -1)"
          fi
          [ -n "$SH" ] && [ -f "$SH" ] || { echo "::error::the bundle ships no install.sh resource"; exit 1; }
          echo "bundled installer: $SH"
          # --tauri rejects a custom studio home; close stdin as install.rs does.
          SH="$(cd "$(dirname "$SH")" && pwd)/$(basename "$SH")"
          # Run outside the checkout like the app: older bundles resolve `studio` against the cwd.
          rc=0
          (cd "$RUNNER_TEMP" && env -u UNSLOTH_STUDIO_HOME \
            bash "$SH" --tauri < /dev/null 2>&1) | tee logs/bundled-install.log || rc=$?
          echo "bundled installer exit code: $rc"
          [ "$rc" -eq 0 ] || {
            echo "::error::bundled installer exited $rc"
            exit 1
          }
          PY="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          [ -x "$PY" ] || { echo "::error::bundled installer left no venv at $PY"; exit 1; }
          "$PY" -V
          # install.rs passes only --tauri, so torch is part of first launch.
          "$PY" -c "import torch; print('torch', torch.__version__)"

      - name: Launch under Xvfb and prove it stays up
        if: steps.download.outputs.unreleased != 'true'
        env:
          # GTK3's X IO error handler reports via g_debug() and then _exit(1); without this a fatal X11
          # error exits 1 with no output at all.
          G_MESSAGES_DEBUG: all
        run: |
          set -a; [ -f ./clean-machine.env ] && . ./clean-machine.env; set +a
          # The only platform where a hosted runner gives the app a real display. Launch outside the checkout.
          BIN="$(cd "$(dirname "$BIN")" && pwd)/$(basename "$BIN")"
          (cd "$RUNNER_TEMP" && exec xvfb-run -a --server-args="-screen 0 1440x900x24" \
            "$BIN") > logs/app-stdout.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 90); do
            kill -0 "$APP_PID" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "app still running after 90s"
            kill -TERM "$APP_PID" 2>/dev/null || true
          else
            # `|| rc=$?`: under `bash -e` a bare failing `wait` aborts before the diagnostics print.
            rc=0
            wait "$APP_PID" 2>/dev/null || rc=$?
            echo "::error::desktop app exited early with rc=$rc"
            tail -60 logs/app-stdout.log || true
            exit 1
          fi

      - name: What did its own log say?
        if: always() && steps.download.outputs.unreleased != 'true'
        run: |
          for f in "$UNSLOTH_STUDIO_HOME/tauri.log" "$HOME/.unsloth/studio/tauri.log"; do
            [ -f "$f" ] || continue
            echo "=== $f ==="; cp "$f" logs/ 2>/dev/null || true; tail -60 "$f"
            # The preflight reason is on a separate line that tail would scroll away.
            grep -E "disposition=|can_auto_repair=|Managed preflight|ModuleNotFoundError" "$f" || true
            found=1
            if grep -qE "desktop_preflight completed disposition=" "$f"; then disposition=1; fi
            dispositions="${dispositions:-} $(grep -oE 'desktop_preflight completed disposition=[A-Za-z]+' "$f" | sed 's/.*disposition=//' | tr '\n' ' ')"
          done
          # Same criterion as macOS: everything above is `|| true`, so this is what can fail.
          [ "${found:-0}" = "1" ] || { echo "::error::the app wrote no tauri.log; it never reached setup_logging"; exit 1; }
          [ "${disposition:-0}" = "1" ] || { echo "::error::tauri.log records no desktop_preflight disposition; the app never completed preflight"; exit 1; }
          # A disposition alone is not enough: preflight can regress to NotInstalled on a working venv.
          echo "dispositions recorded: ${dispositions:-<none>}"
          case "${dispositions:-}" in
            *ManagedReady*|*OwnedReady*|*AttachedReady*) ;;
            *) echo "::error::preflight never reported a ready disposition (saw: ${dispositions:-<none>}); the app did not recognise the environment the bundled installer just built"
               exit 1 ;;
          esac

      - name: Restore the runner
        if: always()
        # See the macOS job: `|| true` would swallow a genuinely broken restore.
        run: |
          if [ -f .clean-machine/restore.sh ]; then
            bash .clean-machine/restore.sh
          else
            echo "no .clean-machine/restore.sh: the toolchain was never stripped, nothing to restore"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-linux-${{ matrix.kind }}-${{ matrix.arch }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn

  # Build the PR AppImage once for every artifact test below.
  appimage-pr-build:
    if: github.event_name == 'pull_request'
    name: Build PR AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install AppImage build dependencies
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils fonts-noto-color-emoji gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav || { apt-get update -qq && apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils fonts-noto-color-emoji gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: false
          workspaces: 'studio/src-tauri -> target'

      - name: Audit lockfiles before package scripts run
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Install pinned Tauri CLI
        run: npm ci --prefix studio --no-fund --no-audit

      - name: Install frontend dependencies
        working-directory: studio/frontend
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: Pin complete AppImage toolchain
        run: |
          studio/src-tauri/linux/prepare-complete-appimage-tools.sh \
            "$RUNNER_TEMP/tauri-tools-cache/tauri"

      - name: Build unsigned AppImage from the PR
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/tauri-tools-cache
        run: |
          set -euo pipefail
          npx --prefix studio tauri build -v --bundles appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          mapfile -t appimages < <(find studio/src-tauri/target/release/bundle/appimage \
            -maxdepth 1 -type f -name '*.AppImage' -print)
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "::error::expected one PR AppImage, got ${#appimages[@]}"
            printf '%s\n' "${appimages[@]}"
            exit 1
          fi
          studio/src-tauri/linux/verify-complete-appimage.sh "${appimages[0]}"
          mkdir -p "$RUNNER_TEMP/appimage-pr-build"
          cp "${appimages[0]}" "$RUNNER_TEMP/appimage-pr-build/Unsloth.AppImage"

      - name: Upload branch-built AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: appimage-pr-build
          path: ${{ runner.temp }}/appimage-pr-build/Unsloth.AppImage
          retention-days: 1
          if-no-files-found: error


  # These images deliberately omit host GTK, WebKitGTK, and AppIndicator.
  appimage-portability:
    needs: appimage-pr-build
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.appimage-pr-build.result == 'success')
    name: AppImage ${{ matrix.label }}
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: ubuntu-22.04, image: 'ubuntu:22.04', display_backend: x11, install_gles: true}
          - {label: ubuntu-22.04-no-gles, image: 'ubuntu:22.04', display_backend: x11, install_gles: false}
          - {label: ubuntu-24.04-wayland, image: 'ubuntu:24.04', display_backend: wayland, install_gles: true}
          - {label: debian-12, image: 'debian:12', display_backend: x11, install_gles: true}
          - {label: fedora-44, image: 'fedora:44', display_backend: x11, install_gles: true}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install only generic display and graphics prerequisites
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            RETRY_ATTEMPTS=2 RETRY_ATTEMPT_TIMEOUT=360 \
              bash .github/scripts/retry-with-apt-lock.sh bash -c '
                set -euo pipefail
                apt-get update -qq
                alsa_package=libasound2
                if apt-cache policy "$alsa_package" | grep -q "Candidate: (none)"; then
                  alsa_package=libasound2t64
                fi
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                  ca-certificates python3 xvfb xauth binutils libgl1 libegl1 libgbm1 \
                  libwayland-client0 libwayland-cursor0 libwayland-egl1 libwayland-server0 \
                  libx11-6 libx11-xcb1 libxcb1 libxcb-randr0 libxcb-render0 libxcb-shm0 \
                  libxext6 libxrandr2 libxi6 libxcursor1 libxfixes3 libxrender1 \
                  libxcomposite1 libxdamage1 libxinerama1 libxau6 libxdmcp6 libxshmfence1 \
                  "$alsa_package" libpulse0 libharfbuzz0b libnghttp2-14 fontconfig libfribidi0
                if [[ "${{ matrix.install_gles }}" == "true" ]]; then
                  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libgles2
                fi
                if [[ "${{ matrix.display_backend }}" == "wayland" ]]; then
                  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends weston
                fi
              '
            forbidden="$(dpkg-query -W -f='${binary:Package}\n' 2>/dev/null | \
              grep -Ei 'webkit|javascriptcore|appindicator|libgtk-3' || true)"
          else
            dnf install -y -q ca-certificates python3 binutils xorg-x11-server-Xvfb xorg-x11-xauth \
              mesa-libEGL mesa-libgbm mesa-dri-drivers mesa-libGL \
              libwayland-client libwayland-cursor libwayland-egl libwayland-server \
              libX11 libX11-xcb libxcb libXext libXrandr libXi libXcursor libXfixes \
              libXrender libXcomposite libXdamage libXinerama libXau libXdmcp libxshmfence \
              alsa-lib pulseaudio-libs libnghttp2 harfbuzz fontconfig fribidi procps-ng findutils
            if [[ "${{ matrix.install_gles }}" == "true" ]]; then
              dnf install -y -q mesa-libGLES
            fi
            forbidden="$(rpm -qa | grep -Ei 'webkit|javascriptcore|appindicator|gtk3' || true)"
          fi
          if [[ "${{ matrix.install_gles }}" == "false" ]] && \
             ldconfig -p | grep -q 'libGLESv2\.so\.2'; then
            echo "::error::no-GLES portability lane unexpectedly provides libGLESv2.so.2"
            exit 1
          fi

          if [ -n "$forbidden" ]; then
            echo "::error::portability image unexpectedly contains a host desktop runtime"
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Download the AppImage built from this PR
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: appimage-pr-build
          path: dl


      - name: Download the shipped AppImage
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_REPO: ${{ inputs.release_repo || github.repository }}
          REL_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          mkdir -p dl logs/appimage-portability
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.request

          repo = os.environ["REL_REPO"]
          requested = os.environ.get("REL_TAG", "").strip()
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url, *, accept=None):
              request_headers = dict(headers)
              if accept:
                  request_headers["Accept"] = accept
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=request_headers), timeout=60
              ) as response:
                  return response.read()

          releases = json.loads(get(f"https://api.github.com/repos/{repo}/releases?per_page=100"))
          candidates = []
          for release in releases:
              tag = release.get("tag_name", "")
              if requested and tag != requested:
                  continue
              match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:[-+].*)?", tag)
              asset = next(
                  (item for item in release.get("assets", []) if item.get("name", "").endswith(".AppImage")),
                  None,
              )
              if match and asset:
                  candidates.append((tuple(map(int, match.groups())), release, asset))
          if not candidates:
              raise SystemExit(f"No AppImage release found in {repo} for {requested or 'latest SemVer'}")
          _, release, asset = max(candidates, key=lambda item: item[0])
          output = pathlib.Path("dl/Unsloth.AppImage")
          output.write_bytes(get(asset["url"], accept="application/octet-stream"))
          output.chmod(0o755)
          print(f"Downloaded {release['tag_name']} {asset['name']} ({output.stat().st_size} bytes)")
          PY

      - name: Prepare the selected AppImage
        run: |
          mkdir -p logs/appimage-portability
          chmod +x dl/Unsloth.AppImage


      - name: Audit and launch the complete AppImage
        env:
          APPIMAGE_PATH: ${{ github.workspace }}/dl/Unsloth.AppImage
          APPIMAGE_SMOKE_ART_DIR: ${{ github.workspace }}/logs/appimage-portability

          APPIMAGE_DISPLAY_BACKEND: ${{ matrix.display_backend }}
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -euo pipefail
          studio/src-tauri/linux/verify-complete-appimage.sh "$APPIMAGE_PATH"
          python3 tests/studio/appimage_media_pipeline_probe.py
          python3 tests/studio/appimage_portability_smoke.py

      - name: Upload portability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: appimage-portability-${{ matrix.label }}
          path: logs/appimage-portability/
          retention-days: 7
          if-no-files-found: warn


  # WebDriver uses the same PR artifact to exercise a real model download request.
  appimage-model-download:
    needs: appimage-pr-build
    if: >-
      always() &&
      (github.event_name != 'pull_request' || needs.appimage-pr-build.result == 'success')
    name: AppImage model download E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - name: Install WebDriver prerequisites
        timeout-minutes: 20
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y -qq --no-install-recommends python3 xvfb xauth webkit2gtk-driver libgles2 libgl1 libegl1 libgbm1 libwayland-client0 libharfbuzz0b libnghttp2-14 fontconfig libfribidi0 libasound2 libpulse0 || { apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 xvfb xauth webkit2gtk-driver libgles2 libgl1 libegl1 libgbm1 libwayland-client0 libharfbuzz0b libnghttp2-14 fontconfig libfribidi0 libasound2 libpulse0; }'
          cargo install tauri-driver --version 2.0.6 --locked
      - name: Fetch the digest-pinned COLRv1 regression font
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/googlefonts/noto-emoji/8998f5dd683424a73e2314a8c1f1e359c19e8742/fonts/Noto-COLRv1.ttf'
          output="$RUNNER_TEMP/Noto-COLRv1.ttf"
          curl -fsSL --retry 3 --retry-all-errors "$url" -o "$output"
          echo '0ae57fe58645638523ba35f388d93739d292539a9acb84df5700c81b1e1a28d2  '"$output" | sha256sum -c -

      - name: Download the AppImage built from this PR
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: appimage-pr-build
          path: dl


      - name: Download the shipped AppImage for WebDriver
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dl logs/appimage-model-download
          if [ -z "$REL_TAG" ]; then
            releases_json="$RUNNER_TEMP/desktop-releases.json"
            gh release list --repo "$REL_REPO" --limit 100 \
              --json tagName,createdAt,isDraft > "$releases_json"
            REL_TAG="$(python3 .github/scripts/resolve-desktop-release.py \
              --repo "$REL_REPO" --asset-suffix .AppImage < "$releases_json")"
            echo "resolved release tag: $REL_TAG"
          fi
          gh release download "$REL_TAG" --repo "$REL_REPO" \
            --pattern '*.AppImage' --dir dl
          chmod +x dl/*.AppImage

      - name: Prepare the selected AppImage
        run: |
          mkdir -p logs/appimage-model-download
          chmod +x dl/*.AppImage


      - name: Select, download, render progress, and cancel
        env:
          APPIMAGE_PATH: ${{ github.workspace }}/dl/Unsloth.AppImage
          APPIMAGE_E2E_ART_DIR: ${{ github.workspace }}/logs/appimage-model-download
          APPIMAGE_COLRV1_FONT: ${{ runner.temp }}/Noto-COLRv1.ttf
          APPIMAGE_COLRV1_FONT_SHA256: 0ae57fe58645638523ba35f388d93739d292539a9acb84df5700c81b1e1a28d2
        run: |
          set -euo pipefail
          appimage="$(find dl -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          export APPIMAGE_PATH="$PWD/$appimage"
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            python3 tests/studio/appimage_model_download_webdriver.py

      - name: Upload model-download evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: appimage-model-download
          path: logs/appimage-model-download/
          retention-days: 7
          if-no-files-found: warn


  windows:
    # See the macOS job: a fork PR's token cannot list drafts, so skip rather than fail.
    if: github.event.pull_request.head.repo.fork != true
    name: desktop windows
    runs-on: windows-latest
    # 60, not 45: a full torch install is slowest on Windows.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the shipped installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl logs
          # See the macOS job. Loud on purpose: no matching bundle means nothing to prove.
          if [ -z "$REL_TAG" ]; then
            releases_json="$RUNNER_TEMP/desktop-releases.json"
            if ! gh release list --repo "$REL_REPO" --limit 100 \
              --json tagName,createdAt,isDraft > "$releases_json"; then
              echo "::error::could not list desktop releases in $REL_REPO"
              exit 1
            fi
            if ! REL_TAG="$(python3 .github/scripts/resolve-desktop-release.py \
              --repo "$REL_REPO" --asset-suffix .exe < "$releases_json")"; then
              echo "::error::no SemVer v... release with an .exe is visible in $REL_REPO"
              exit 1
            fi
            echo "resolved release tag: $REL_TAG"
            echo "REL_TAG=$REL_TAG" >> "$GITHUB_ENV"
          fi
          # Extension, not fragment: releases ship x64 and arm64 .exe files, picked by arch below.
          gh release download "$REL_TAG" --repo "$REL_REPO" --pattern '*.exe' --dir dl
          ls -la dl

      - name: Strip the developer toolchain
        # Same gate as macOS, for the same `inputs`-coercion reason.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.strip_toolchain }}
        shell: pwsh
        run: |
          # Strawberry: windows-latest ships MinGW cmake/gcc under C:\Strawberry.
          # Same list the installer workflow scrubs.
          $drop = @('hostedtoolcache\windows\Python', 'WindowsApps', '\Git\', 'CMake',
                    'Microsoft Visual Studio', 'BuildTools', 'LLVM', 'MSYS', 'mingw',
                    'Strawberry')
          # The WindowsApps drop also removes winget, which every consumer machine has and install.ps1
          # uses for git, so resolve it first and shim it back as clean-machine-install-ci.yml does.
          $wingetCmd = Get-Command winget -ErrorAction SilentlyContinue
          if (-not $wingetCmd) {
            Write-Host '::error::winget was not on PATH before the strip; this image ships it and the bundled installer needs it'
            exit 1
          }
          $shim = Join-Path $env:RUNNER_TEMP 'winget-shim'
          New-Item -ItemType Directory -Force -Path $shim | Out-Null
          Set-Content -LiteralPath (Join-Path $shim 'winget.cmd') -Encoding ascii `
            -Value "@`"$($wingetCmd.Source)`" %*"
          $scrub = {
            param($entries)
            ,@($entries | Where-Object { $p = $_; $p -and -not ($drop | Where-Object { $p -like "*$_*" }) })
          }
          "PATH=$shim;$((& $scrub ($env:PATH -split ';')) -join ';')" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Off disk, not just off PATH: py.exe and uv find the toolcache on their own.
          foreach ($tc in @("$env:AGENT_TOOLSDIRECTORY\Python", 'C:\hostedtoolcache\windows\Python')) {
            if ($tc -and (Test-Path $tc)) {
              try { Rename-Item -LiteralPath $tc -NewName 'Python.masked' -ErrorAction Stop
                    Write-Host "masked toolcache python: $tc" }
              catch { Write-Host "::error::could not mask $tc ($($_.Exception.Message)); the job would not be clean"; exit 1 }
            }
          }
          # install.ps1's Refresh-SessionPath merges registry PATHs back in, so scrub those too. Expand
          # first: SetEnvironmentVariable rewrites REG_EXPAND_SZ as REG_SZ.
          foreach ($scope in 'Machine','User') {
            $raw = [System.Environment]::GetEnvironmentVariable('Path', $scope)
            if ([string]::IsNullOrWhiteSpace($raw)) { continue }
            $expanded = [System.Environment]::ExpandEnvironmentVariables($raw) -split ';'
            try {
              [System.Environment]::SetEnvironmentVariable('Path', ((& $scrub $expanded) -join ';'), $scope)
            } catch {
              Write-Host "::error::could not scrub the $scope PATH ($($_.Exception.Message)); the strip would not survive Refresh-SessionPath"
              exit 1
            }
          }
          foreach ($v in 'VSINSTALLDIR','VCINSTALLDIR','WindowsSdkDir','INCLUDE','LIB','LIBPATH') {
            "$v=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          exit 0

      - name: Verify the strip took effect
        # $GITHUB_ENV PATH applies only to later steps, so verify the heuristic scrub here.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.strip_toolchain }}
        shell: pwsh
        run: |
          $leaked = @()
          foreach ($t in 'python','py','git','cmake','cl') {
            $f = Get-Command $t -ErrorAction SilentlyContinue
            Write-Host ("{0,-8} {1}" -f $t, $(if ($f) { $f.Source } else { 'ABSENT' }))
            if ($f -and $t -ne 'py') { $leaked += "$t -> $($f.Source)" }
          }
          # install.ps1 probes `py` first, and `py -0p` still lists renamed paths, so only a start proves a leak.
          if (Get-Command py -ErrorAction SilentlyContinue) {
            foreach ($v in '-3.11', '-3.12', '-3.13') {
              $out = & py $v -c "import sys; print(sys.executable)" 2>&1
              $rc = $LASTEXITCODE
              Write-Host ("py {0} -> exit {1}: {2}" -f $v, $rc, (($out | Out-String).Trim() -replace '\r?\n', ' / '))
              if ($rc -eq 0) { $leaked += "py $v -> $out" }
            }
            # The runner appends `exit $LASTEXITCODE` to pwsh steps, so a wanted failing probe would exit 1.
            $global:LASTEXITCODE = 0
          }
          # Assert the winget shim survived the installer's PATH refreshes, or this lane silently becomes
          # the no-winget leg.
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          Write-Host ("winget   {0}" -f $(if ($winget) { $winget.Source } else { 'ABSENT' }))
          if (-not $winget) {
            Write-Host '::error::winget did not survive the strip; the bundled installer would take the no-winget fallback instead of the consumer path'
            exit 1
          }
          if ($leaked) {
            Write-Host "::error::developer tooling survived the strip: $($leaked -join '; ')"
            exit 1
          }
          exit 0

      - name: Silent install
        shell: pwsh
        run: |
          # By architecture, not position: '-' sorts before '.', so -First 1 would take the ARM64 installer.
          $all = @(Get-ChildItem dl/*.exe)
          $arm = @($all | Where-Object { $_.Name -match '(?i)-arm64\.exe$' })
          $wanted = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { $arm }
                    else { @($all | Where-Object { $_.Name -notmatch '(?i)-arm64\.exe$' }) }
          # A change in shipped architectures is a packaging change to report, not to guess through.
          if ($wanted.Count -ne 1) {
            Write-Host "::error::expected exactly one $env:PROCESSOR_ARCHITECTURE installer in the release, found $($wanted.Count) (assets: $($all.Name -join ', '))"
            exit 1
          }
          $exe = $wanted[0].FullName
          Write-Host "installer for $($env:PROCESSOR_ARCHITECTURE): $exe"
          # /S is the NSIS silent switch.
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host "::error::silent install failed"; exit 1 }
          $found = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse `
                     -Filter '*Unsloth*.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if (-not $found) { Write-Host '::error::no installed executable found'; exit 1 }
          Write-Host "installed: $($found.FullName)"
          "APP_EXE=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the bundled installer, the path first launch takes
        shell: pwsh
        run: |
          # The launch alone passes with a broken install.ps1 (the app waits for a click), so run it
          # from where NSIS put it, as install.rs does.
          $root = Split-Path -Parent $env:APP_EXE
          $ps1 = Get-ChildItem -Path $root -Recurse -Filter 'install.ps1' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $ps1) {
            Write-Host '::error::the bundle ships no install.ps1 resource'
            exit 1
          }
          Write-Host "bundled installer: $($ps1.FullName)"
          # --tauri rejects a custom studio home, so drop the override as install.rs does.
          Remove-Item Env:UNSLOTH_STUDIO_HOME -ErrorAction SilentlyContinue
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File $ps1.FullName --tauri *>&1 | Tee-Object -FilePath logs/bundled-install.log
          $rc = $LASTEXITCODE
          Write-Host "bundled installer exit: $rc"
          if ($rc -ne 0) {
            Write-Host "::error::bundled installer exited $rc"
            exit $rc
          }
          $py = Join-Path $env:USERPROFILE '.unsloth\studio\unsloth_studio\Scripts\python.exe'
          if (-not (Test-Path $py)) {
            Write-Host "::error::bundled installer left no venv at $py"
            exit 1
          }
          & $py -V
          # install.rs passes only --tauri, so torch must import from the app's venv.
          & $py -c "import torch; print('torch', torch.__version__)"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::the bundled install produced a venv with no working torch'
            exit 1
          }

      - name: Launch and prove it stays up
        shell: pwsh
        run: |
          $p = Start-Process -FilePath $env:APP_EXE -PassThru `
                 -RedirectStandardOutput logs/app-stdout.log `
                 -RedirectStandardError logs/app-stderr.log
          for ($i = 0; $i -lt 90; $i++) { if ($p.HasExited) { break }; Start-Sleep -Seconds 1 }
          if ($p.HasExited) {
            Write-Host "::error::desktop app exited early with rc=$($p.ExitCode)"
            Get-Content logs/app-stdout.log, logs/app-stderr.log -Tail 40 -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "app still running after 90s"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: What did its own log say?
        if: always()
        shell: pwsh
        run: |
          $found = $false; $disposition = $false; $dispositions = @()
          foreach ($f in @("$env:UNSLOTH_STUDIO_HOME\tauri.log",
                           "$env:USERPROFILE\.unsloth\studio\tauri.log")) {
            if (Test-Path $f) {
              Write-Host "=== $f ==="
              Copy-Item $f logs/ -ErrorAction SilentlyContinue
              Get-Content $f -Tail 60
              Select-String -Path $f -Pattern 'disposition=|can_auto_repair=|Managed preflight|ModuleNotFoundError' `
                -ErrorAction SilentlyContinue
              $found = $true
              $hits = @(Select-String -Path $f -Pattern 'desktop_preflight completed disposition=(\w+)')
              if ($hits) {
                $disposition = $true
                $dispositions += @($hits | ForEach-Object { $_.Matches[0].Groups[1].Value })
              }
            }
          }
          # Same criterion as macOS and Linux: nothing above can fail.
          if (-not $found) {
            Write-Host '::error::the app wrote no tauri.log; it never reached setup_logging'
            exit 1
          }
          if (-not $disposition) {
            Write-Host '::error::tauri.log records no desktop_preflight disposition; the app never completed preflight'
            exit 1
          }
          # The app reads the default root (%USERPROFILE%\.unsloth\studio) it wrote, ignoring
          # UNSLOTH_STUDIO_HOME, so anything but ready means it cannot boot what was installed.
          Write-Host "dispositions recorded: $($dispositions -join ', ')"
          if (-not ($dispositions | Where-Object { $_ -match '^(Managed|Owned|Attached)Ready$' })) {
            Write-Host "::error::preflight never reported a ready disposition (saw: $($dispositions -join ', ')); the app did not recognise the environment the bundled installer just built"
            exit 1
          }
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-windows
          path: logs/
          retention-days: 7
          if-no-files-found: warn
