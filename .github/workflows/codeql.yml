# Advanced setup. Push and schedule analyse all languages (no path filters on push, as GitHub
# advises); PRs analyse only touched languages, or all four when unclassifiable.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Per-commit groups on main so a merge burst does not cancel queued analyses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Languages to analyse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - name: Pick languages
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          all='["actions","javascript-typescript","python","rust"]'
          if [ "$EVENT" != "pull_request" ]; then
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            echo "$EVENT: analysing all languages"
            exit 0
          fi
          # The files API returns at most 3000 files; at that size, or on any error, analyse all.
          if ! files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            echo "could not list the PR's files: analysing all languages"
            exit 0
          fi
          # Here-string, not a pipe: grep -q closing early causes SIGPIPE under pipefail.
          count=$(grep -c . <<< "$files" || true)
          if [ "$count" -ge 3000 ] || grep -qxE '\.github/workflows/codeql\.ya?ml|\.github/codeql/.*' <<< "$files"; then
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            echo "$count files or a CodeQL config change: analysing all languages"
            exit 0
          fi
          langs=()
          has() { grep -qiE "$1" <<< "$files"; }
          has '^\.github/(workflows|actions)/|(^|/)action\.ya?ml$' && langs+=(actions)
          has '\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue|html?|svelte)$|(^|/)(package(-lock)?\.json|tsconfig[^/]*\.json|jsconfig\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?)$' && langs+=(javascript-typescript)
          has '\.pyi?$' && langs+=(python)
          has '\.rs$|(^|/)Cargo\.(toml|lock)$' && langs+=(rust)
          if [ "${#langs[@]}" -eq 0 ]; then
            json='[]'
          else
            json=$(printf '"%s",' "${langs[@]}")
            json="[${json%,}]"
          fi
          echo "languages=$json" >> "$GITHUB_OUTPUT"
          echo "$count changed files: analysing $json"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
