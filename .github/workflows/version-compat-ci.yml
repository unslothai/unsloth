#
# Cross-version compat canary for the four upstream packages whose
# release cadence regularly breaks unsloth + unsloth-zoo:
#
#   1. vLLM             (LoRA worker manager, BnB loader, cumem allocator)
#   2. TRL / GRPO       (trainer source rewriters in unsloth.models.rl*)
#   3. PEFT             (LoraConfig, get_peft_model, LoraLayer, bnb integration)
#   4. sentence-transformers (Transformer/Pooling/Normalize, Trainer)
#   5. bitsandbytes     (Linear4bit, dequantize_4bit)
#
# Strategy: GitHub raw-fetch + symbol grep against every tracked
# version (no pip install, CPU-only). When upstream renames a symbol
# we depend on, the matching test fails BEFORE a user hits it. The
# `main` branch entries give us a few-day lead on PyPI releases.
#
# Cross-references:
#   tests/vllm_compat/test_vllm_pinned_symbols.py     (vLLM symbols)
#   tests/version_compat/test_trl_grpo_pinned_symbols.py
#   tests/version_compat/test_peft_pinned_symbols.py
#   tests/version_compat/test_sentence_transformers_pinned_symbols.py
#   tests/version_compat/test_bitsandbytes_pinned_symbols.py

name: Version Compat CI

on:
  pull_request:
    # Trigger on any unsloth source change, not just the three previously
    # named files. The symbol-existence tests verify that EVERY pinned
    # upstream reference in unsloth still resolves; a new
    # `from peft.foo import Bar` added in unsloth/kernels/whatever.py
    # is just as much a compat regression risk as one added in
    # unsloth/models/rl.py.
    paths:
      - 'unsloth/**'
      - 'tests/vllm_compat/**'
      - 'tests/version_compat/**'
      - 'pyproject.toml'
      # The cap-site-consistency job below reads every file that declares the
      # transformers window, and tests/test_transformers_cap_sites.py finds the
      # workflow half of that set with a `.github/workflows/*.yml` glob. Trigger on
      # the same set the job scans, or a PR that moves a cap in notebooks-ci.yml,
      # studio-backend-ci.yml or studio-export-capability-ci.yml never starts the job
      # that exists to catch exactly that drift, and it merges green.
      - '.github/workflows/**'
      - 'tests/test_transformers_cap_sites.py'
  schedule:
    # Daily 06:43 UTC. Catches upstream PyPI releases roughly within
    # 24 h. Off the :00 / :30 fleet-collision spots.
    - cron: '43 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Latest-only on a PR branch. On main this does less than it reads like: it stops
  # a RUNNING main job being killed, but GitHub cancels any PENDING run in the group
  # the moment a newer one is queued, so a merge burst still leaves only the tip.
  # See studio-backend-ci.yml, which is grouped per commit on main for that reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Six jobs, one runner. Each of these suites fetches raw source from
  # raw.githubusercontent.com and greps for symbols -- see tests/version_compat/_fetch.py,
  # `has_def` / `first_match`. No pip install of vllm / torch / transformers is involved,
  # which is the whole point of the canary and is also what makes co-locating them safe:
  # there is no venv to conflict over, so "transformers 4.57.6" and "transformers main"
  # can share one interpreter because neither is installed.
  #
  # They were six separate jobs costing six runner slots for 287s of combined work.
  # Measured over a sampled main commit, each waited 23 to 31 minutes for admission to
  # execute for 15 to 128 seconds. The queue is the cost, so the slots are the target.
  #
  # -n 4, deliberately, and not higher. The work is network-bound rather than CPU-bound,
  # so more workers looks free and is not: measured locally on the full set,
  #
  #     serial   1606 passed, 182 skipped   182.8s
  #     -n 4     1606 passed, 182 skipped    27.8s
  #     -n 8     1606 passed, 182 skipped    75.2s
  #
  # -n 8 is 2.7x SLOWER than -n 4, which for a fetch-bound suite is upstream throttling
  # rather than core contention. 4 also matches the hosted runner's core count and the
  # -n 4 every other pytest job here already uses.
  #
  # --dist loadfile keeps each file on one worker, so a suite's tests cannot be split
  # across workers and interleaved with another's.
  #
  # tests/studio/test_version_compat_bundle.py asserts every suite the six jobs named is
  # still named here. Dropping one would not fail anything: the job would go green having
  # tested less, which is the only way this change can go wrong.
  pinned-symbol-matrix:
    name: pinned-symbol matrix (vLLM, TRL, PEFT, ST, bitsandbytes, transformers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest only
        # packaging: the PEFT backfill suite loads unsloth/import_fixes.py by file path and
        # that module imports packaging.version at the top. It pulls in nothing heavier,
        # which is why it can run in this dependency-free job at all.
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=8' 'pytest-xdist>=3' packaging
      - name: Run every pinned-symbol suite
        env:
          # Authenticated raw fetches get 5000/h; unauthenticated is 60/h and trips on the
          # matrix. That ceiling is why the worker count stays at 4.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PYTHONPATH=. so `from tests.version_compat._fetch import ...` works without an
          # editable install of unsloth itself.
          PYTHONPATH=. python -m pytest \
            tests/vllm_compat/test_vllm_pinned_symbols.py \
            tests/version_compat/test_trl_grpo_pinned_symbols.py \
            tests/version_compat/test_peft_pinned_symbols.py \
            tests/version_compat/test_unsloth_zoo_save_merged_pinned_symbols.py \
            tests/version_compat/test_peft_conversion_symbol_backfill.py \
            tests/version_compat/test_sentence_transformers_pinned_symbols.py \
            tests/version_compat/test_bitsandbytes_pinned_symbols.py \
            tests/version_compat/test_transformers_pinned_symbols.py \
            -n 4 --dist loadfile -v --tb=short

  # The version window is not one line. It is two in pyproject.toml, two more in
  # unsloth_zoo's, and a pin in studio-backend-ci.yml, notebooks-ci.yml,
  # studio-export-capability-ci.yml and the two install-bearing jobs below. When the
  # window moves, a site left behind keeps a lane testing a range users no longer get
  # and nothing goes red: the lane still runs and still passes. So the agreement
  # between them is asserted from the files.
  #
  # An OS axis, because this is the torch-free half of the check and the only half
  # that can have one. The suite installs pytest, packaging and pyyaml, reads files
  # and touches the network not at all, so a Windows and a macOS runner cost minutes
  # rather than the fetch budget the bundled job above has to live inside. What they
  # buy is the checker's own portability: pathlib separators and the default text
  # encoding are exactly where a file-reading gate goes quietly green off Linux.
  cap-site-consistency:
    name: version-window drift (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=8' packaging pyyaml
      - name: Assert every site declares the same window
        # PYTHONPATH is not needed (the suite imports nothing from the package), but
        # the pytest rootdir has to be the repo so the relative paths resolve.
        run: python -m pytest tests/test_transformers_cap_sites.py -v --tb=short

  # Optional second layer: actually `pip install` ONE representative
  # version of each package and verify unsloth + unsloth-zoo modules
  # import on it under the existing CUDA spoof. CPU-only, runs on
  # ubuntu-latest. Catches the small set of breakages that the static
  # symbol check misses (e.g. import-time side effects).
  #
  # Two lanes, not one. One pinned set proved one point of the supported range and
  # said nothing about either end of it, which is how a package that advertises
  # transformers 4.51.3 through 5.17.0 and TRL 0.18.2 through 0.24.0 can have a
  # green matrix and still not import on the floor or the ceiling.
  #
  # floor:  the declared minima themselves, not a convenient set near them: a lane
  #         that pins above the floor leaves the advertised low end untested and
  #         green. transformers 4.51.3, TRL 0.18.2 and PEFT 0.18.0 are what
  #         pyproject.toml actually admits at the bottom. transformers 4.51.3 needs
  #         huggingface_hub < 1.0, which is why this lane can never share a venv
  #         with a 5.x one. Python 3.10 rather than the 3.9 in requires-python
  #         because PEFT 0.18.0 declares Requires-Python >= 3.10, so 3.9 cannot
  #         reach this stack at all and pinning it here would only pin a resolver
  #         error. torch 2.6.0 is the last minor before the ABI window the other
  #         jobs here use.
  #         torchcodec 0.2 is the row this table pairs with torch 2.6 (see
  #         TORCH_TORCHCODEC in scripts/notebook_validator.py); triton 3.2.0 is the
  #         one torch 2.6.0 itself pins.
  # latest: nothing pinned at all, so this lane follows PyPI and is the one that
  #         notices an upstream release the cap now admits but nobody has run.
  #         torchcodec >= 0.12 rather than a lockstep row because 0.12 and up are
  #         ABI-stable against torch >= 2.11.
  #
  # torchcodec sits on the torch install line rather than in the package list,
  # because it carries a compiled extension linked against ONE libtorch build and
  # torch here comes from the CPU index. Installed from PyPI next to a
  # `torch==2.14.0+cpu` it loads far enough to be importable and then answers
  # `from torchcodec.decoders import ...` with `'torchcodec' is not a package`,
  # which is what datasets 5 does while building any Dataset; measured on the
  # latest lane. On the index line pip prefers the `+cpu` build that matches. The
  # floor lane's 0.2 row is not published there at all, so `--extra-index-url`
  # still serves it from PyPI, where it pairs with torch 2.6.0 correctly.
  #
  # hf_transfer is a declared unsloth_zoo dependency, and the zoo is installed
  # here with --no-deps, so the lane has to supply it. unsloth sets
  # HF_HUB_ENABLE_HF_TRANSFER=1 around from_pretrained, and huggingface_hub 0.x,
  # which the floor lane's transformers 4.57.6 pulls, raises rather than falling
  # back when the package is missing.
  #
  # fail-fast is off: which end broke is the whole answer, so one lane failing must
  # not cancel the other.
  zoo-imports-under-spoof:
    name: unsloth_zoo imports under CUDA spoof (${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: floor
            python: '3.10'
            torch_pins: >-
              'torch==2.6.0' 'torchvision==0.21.0' 'torchcodec>=0.2,<0.3'
            pkg_pins: >-
              'transformers==4.51.3' 'trl==0.18.2'
              'peft==0.18.0' 'sentence-transformers>=5.0,<6' 'accelerate>=1.0'
              'datasets>=3.4,<4.4' 'bitsandbytes>=0.45.5' 'triton==3.2.0'
              hf_transfer
          - slug: latest
            python: '3.12'
            torch_pins: >-
              torch torchvision 'torchcodec>=0.12'
            pkg_pins: >-
              transformers trl peft sentence-transformers
              accelerate datasets bitsandbytes triton hf_transfer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: unsloth
      - name: Clone unsloth-zoo @ main
        run: |
          # github.com occasionally 500s on the git fetch; retry so a
          # single upstream blip does not fail CI.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/unsloth-zoo"
            if git clone --depth=1 https://github.com/unslothai/unsloth-zoo \
                "$RUNNER_TEMP/unsloth-zoo"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git clone unsloth-zoo failed after 3 attempts"
              exit 1
            fi
            delay=$((5 * attempt))
            echo "::warning::clone failed (attempt $attempt/3), retrying in ${delay}s..."
            sleep "$delay"
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # This job pins its dependencies inline below rather than in a requirements
        # file, so the workflow IS the dependency spec and hashing it is what makes the
        # key describe the payload. Unscoped, setup-python hashes dependency files
        # repo-wide, so one unrelated edit invalidates ~700MB per interpreter.
        with:
          python-version: ${{ matrix.python }}

      - name: Restore the pip cache
        id: pip-cache
        # ./ resolves from GITHUB_WORKSPACE, and this job checks the repo out
        # under `unsloth/`, so the unprefixed path is a directory that does not
        # exist and the step fails with "Can't find 'action.yml'".
        #
        # One literal name for both lanes, and that is deliberate rather than an
        # oversight: the interpreter is already a segment of the key
        # (`pip-v2-<name>-<os>-<arch>-py<minor>-<hash>`), and these two lanes are
        # python 3.10 and 3.12, so they cannot overwrite each other's wheels. A
        # `${{ matrix.slug }}` here would expand to something the action accepts but
        # tests/studio/test_pip_cache_naming.py reads the workflow text, and the name
        # has to be a literal there. Two lanes on the SAME python would need the name
        # split, which means splitting the job.
        uses: ./unsloth/.github/actions/pip-cache-restore
        with:
          name: version-compat-spoof
          key-files: |
            unsloth/.github/workflows/version-compat-ci.yml

      - name: Install CPU torch + this lane's pins
        run: |
          python -m pip install --upgrade pip
          # CPU torch (vllm/peft/st all depend on it).
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            ${{ matrix.torch_pins }}
          # torchcodec is a hard requirement on transformers 5.x:
          # transformers/audio_utils.py:55 does
          #   `importlib.metadata.version("torchcodec")` UNCONDITIONALLY,
          # which raises PackageNotFoundError on a CPU runner that
          # otherwise has no audio path -- and that error trickles up
          # through every `import unsloth_zoo.<module>` because
          # unsloth-zoo's vision_utils transitively pulls
          # transformers.processing_utils (-> audio_utils). It is ABI-coupled
          # to torch and declares nothing about it, so the pair is chosen
          # per lane above rather than left to the resolver.
          #
          # huggingface_hub is deliberately NOT pinned here: transformers 4.x
          # requires < 1.0 and 5.x requires >= 1.5.0, so naming one version
          # would make one of the two lanes unresolvable. Let the pinned
          # transformers pull the hub major it needs.
          pip install ${{ matrix.pkg_pins }} \
            sentencepiece protobuf safetensors numpy 'pytest>=8' \
            tqdm packaging psutil Pillow
          # Editable-install both repos so the test imports the
          # checkouts (not whatever stale PyPI version pip resolved).
          pip install --no-deps -e "$RUNNER_TEMP/unsloth-zoo"
          pip install --no-deps -e ./unsloth
      - name: Report the resolved set
        # The lane is only meaningful if it resolved what it asked for, and the
        # latest lane asks for nothing, so print what it got. A pin that did not
        # hold is otherwise invisible in a green run.
        run: |
          python - <<'PY'
          from importlib.metadata import version
          for name in ("torch", "torchvision", "torchcodec", "transformers", "tokenizers",
                       "huggingface_hub", "trl", "peft", "accelerate", "datasets",
                       "sentence-transformers", "bitsandbytes", "triton"):
              try:
                  print(f"{name}=={version(name)}")
              except Exception as error:
                  print(f"{name}: {error}")
          PY
      - name: Run vllm_compat zoo-imports tests under spoof
        env:
          UNSLOTH_IS_PRESENT: '1'
          UNSLOTH_COMPILE_DISABLE: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          cd unsloth
          # tests/vllm_compat/test_unsloth_zoo_imports.py: narrow vllm/grpo
          #   import gates (5 tests).
          # tests/vllm_compat/test_extended_module_imports.py: full sweep
          #   of unsloth_zoo + unsloth.models.* modules + RL dispatch
          #   table population + FastModel API surface under spoof
          #   (~30 tests). Catches transformers / peft / bnb symbol pin
          #   drift at module-top BEFORE any runtime call.
          PYTHONPATH=. python -m pytest \
            tests/vllm_compat/test_unsloth_zoo_imports.py \
            tests/vllm_compat/test_extended_module_imports.py \
            -v --tb=short

      - name: Save the pip cache
        if: always()
        # ./ resolves from GITHUB_WORKSPACE, and this job checks the repo out
        # under `unsloth/`, so the unprefixed path is a directory that does not
        # exist and the step fails with "Can't find 'action.yml'".
        uses: ./unsloth/.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

  # Fake-CUDA GRPO/SFT/DPO patch run against REAL TRL (latest + main). Unlike
  # the static symbol/source greps above, this drives unsloth's actual
  # source-transform patchers (models/rl.py + rl_replacements.py) on a CPU-only
  # runner under the tests/conftest.py spoof harness -- no GPU, no training.
  # Catches structural TRL drift the greps miss (e.g. TRL 1.7.0's 2->3-tuple
  # per-token-logps return, restructured PEFT ref-adapter block) by asserting
  # the generated Unsloth trainer still satisfies the transform contracts.
  # Same two lanes as zoo-imports-under-spoof, and for the same reason. The
  # source transforms in models/rl.py are matched against TRL's text, so TRL is
  # the axis that actually decides whether they still apply, and one lane on
  # latest proved nothing about the 0.22.2 floor the package still advertises.
  # TRL 0.22.2 is also the only place where the list-dataset guard in
  # unsloth_zoo.tokenizer_utils is the sole protection, because TRL 1.x rejects
  # a list first.
  grpo-fake-run:
    name: GRPO fake-run (CPU spoof, TRL ${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: floor
            python: '3.10'
            torch_pins: >-
              'torch==2.6.0' 'torchvision==0.21.0' 'torchcodec>=0.2,<0.3'
            pkg_pins: >-
              'transformers==4.57.6' 'peft==0.18.0'
              'accelerate>=1.0' 'datasets>=3.4,<4.4' 'bitsandbytes>=0.45.5'
              'triton==3.2.0' hf_transfer
            trl_pin: 'trl==0.22.2'
          - slug: latest
            python: '3.12'
            torch_pins: >-
              torch torchvision 'torchcodec>=0.12'
            pkg_pins: >-
              transformers peft accelerate datasets
              bitsandbytes triton hf_transfer
            trl_pin: '--upgrade trl'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: unsloth
      - name: Clone unsloth-zoo @ main
        run: |
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/unsloth-zoo"
            if git clone --depth=1 https://github.com/unslothai/unsloth-zoo \
                "$RUNNER_TEMP/unsloth-zoo"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git clone unsloth-zoo failed after 3 attempts"
              exit 1
            fi
            delay=$((5 * attempt))
            echo "::warning::clone failed (attempt $attempt/3), retrying in ${delay}s..."
            sleep "$delay"
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # This job pins its dependencies inline below rather than in a requirements
        # file, so the workflow IS the dependency spec and hashing it is what makes the
        # key describe the payload. Unscoped, setup-python hashes dependency files
        # repo-wide, so one unrelated edit invalidates ~700MB per interpreter.
        with:
          python-version: ${{ matrix.python }}

      - name: Restore the pip cache
        id: pip-cache
        # ./ resolves from GITHUB_WORKSPACE, and this job checks the repo out
        # under `unsloth/`, so the unprefixed path is a directory that does not
        # exist and the step fails with "Can't find 'action.yml'".
        #
        # One literal name for both lanes, for the reason given on the spoof job
        # above: the key already carries the interpreter and these lanes are 3.10 and
        # 3.12, and the cache-naming lint reads this file as text.
        uses: ./unsloth/.github/actions/pip-cache-restore
        with:
          name: version-compat-grpo
          key-files: |
            unsloth/.github/workflows/version-compat-ci.yml

      - name: Install CPU torch + ecosystem + this lane's TRL
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            ${{ matrix.torch_pins }}
          # Ecosystem pins unsloth needs; TRL itself is installed last so it can
          # pull the transformers/peft it requires. huggingface_hub is left
          # unpinned so the pinned transformers picks its own major.
          pip install ${{ matrix.pkg_pins }} \
            sentencepiece protobuf safetensors numpy 'pytest>=8' \
            tqdm packaging psutil Pillow
          pip install ${{ matrix.trl_pin }}
          pip install --no-deps -e "$RUNNER_TEMP/unsloth-zoo"
          pip install --no-deps -e ./unsloth
      - name: Fake-run vs this lane's TRL
        env:
          UNSLOTH_IS_PRESENT: '1'
          UNSLOTH_COMPILE_DISABLE: '1'
          # Disable dynamo/inductor at the process level, before conftest.py's early
          # `import unsloth`, so the GRPO hot path never compiles on the GPU-less runner
          # (defense in depth; the CPU fake-train also flips this at runtime).
          TORCHDYNAMO_DISABLE: '1'
          TORCH_COMPILE_DISABLE: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          cd unsloth
          python -c "import trl; print('Resolved TRL', trl.__version__)"
          PYTHONPATH=. python -m pytest \
            tests/version_compat/test_trl_grpo_fake_run.py \
            tests/version_compat/test_trl_fake_train_cpu.py \
            tests/version_compat/test_trl_padding_free_max_length.py \
            tests/version_compat/test_trl_loss_normalization_contract.py \
            -v --tb=short
      # `main` is scheduled/dispatch-only so PR jobs stay fast and a bleeding-edge
      # TRL break does not red every PR. github.event_name is valid in a step if.
      # Only on the latest lane: pulling TRL main into the floor lane replaces the
      # one thing that lane exists to measure.
      - name: Fake-run vs TRL main (scheduled / dispatch only)
        if: ${{ github.event_name != 'pull_request' && matrix.slug == 'latest' }}
        env:
          UNSLOTH_IS_PRESENT: '1'
          UNSLOTH_COMPILE_DISABLE: '1'
          TORCHDYNAMO_DISABLE: '1'
          TORCH_COMPILE_DISABLE: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          pip install --upgrade "git+https://github.com/huggingface/trl"
          cd unsloth
          python -c "import trl; print('Resolved TRL', trl.__version__)"
          PYTHONPATH=. python -m pytest \
            tests/version_compat/test_trl_grpo_fake_run.py \
            tests/version_compat/test_trl_fake_train_cpu.py \
            tests/version_compat/test_trl_padding_free_max_length.py \
            tests/version_compat/test_trl_loss_normalization_contract.py \
            -v --tb=short

      - name: Save the pip cache
        if: always()
        # ./ resolves from GITHUB_WORKSPACE, and this job checks the repo out
        # under `unsloth/`, so the unprefixed path is a directory that does not
        # exist and the step fails with "Can't find 'action.yml'".
        uses: ./unsloth/.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

  # Daily-only: same suites but with --strict on importable upstream
  # tags. Schedule-only so PR jobs stay fast; cron tolerates a flake.
  daily-fresh-fetch:
    name: daily fresh-fetch sweep (cron only)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install 'pytest>=8'
      - name: Run all version-compat suites in one process (no cache)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=. python -m pytest \
            tests/vllm_compat/test_vllm_pinned_symbols.py \
            tests/version_compat/ \
            -v --tb=short
