# Cross-version compat canary: raw-fetch plus symbol grep, no pip install.

name: Version Compat CI

on:
  pull_request:
    paths:
      - 'unsloth/**'
      - 'tests/vllm_compat/**'
      - 'tests/version_compat/**'
      # Only this workflow runs the modules.json trust gate.
      - 'tests/test_st_modules_json_trust_gate.py'
      - 'pyproject.toml'
      # Same trigger set as cap-site-consistency, so a cap moved in another workflow runs this job.
      - '.github/workflows/**'
      - 'tests/test_transformers_cap_sites.py'
      - 'tests/test_trl_cap_sites.py'
      # Studio Backend CI ignores tests/version_compat and tests/vllm_compat.
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'tests/_shared/**'
      - 'studio/install_manifest.py'
      - 'tests/_zoo_aggressive_cuda_spoof.py'
      # Every job here `uses:` the pip cache pair, so an edit to either action changes
      # what it runs.
      - '.github/actions/pip-cache-restore/**'
      - '.github/actions/pip-cache-save/**'
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # -n 4: fetch-bound; -n 8 measured 2.7x slower (upstream throttling).
  # tests/studio/test_version_compat_bundle.py asserts every suite is named here.
  pinned-symbol-matrix:
    name: pinned-symbol matrix (vLLM, TRL, PEFT, ST, bitsandbytes, transformers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest only
        # packaging: import_fixes.py, loaded by path, imports it at module top.
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=8' 'pytest-xdist>=3' packaging
      - name: Resolve the transformers matrix once
        # Resolve the matrix once so xdist workers collect identical parameters.
        env:
          PYTEST_TRANSFORMERS_MATRIX_FILE: ${{ runner.temp }}/transformers-matrix.json
        run: |
          PYTHONPATH=. python -c "
          import tests.version_compat.test_transformers_pinned_symbols as matrix
          print('tags:', len(matrix.TRANSFORMERS_TAGS))
          "
          echo "PYTEST_TRANSFORMERS_MATRIX_FILE=${{ runner.temp }}/transformers-matrix.json" >> "$GITHUB_ENV"
      - name: Run every pinned-symbol suite
        env:
          # Authenticated raw fetches get 5000/h vs 60/h, which is also why workers stay at 4.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=. python -m pytest \
            tests/vllm_compat/test_vllm_pinned_symbols.py \
            tests/version_compat/test_trl_grpo_pinned_symbols.py \
            tests/version_compat/test_grpo_aux_loss_fail_fast.py \
            tests/version_compat/test_peft_pinned_symbols.py \
            tests/version_compat/test_unsloth_zoo_save_merged_pinned_symbols.py \
            tests/version_compat/test_peft_conversion_symbol_backfill.py \
            tests/version_compat/test_sentence_transformers_pinned_symbols.py \
            tests/version_compat/test_bitsandbytes_pinned_symbols.py \
            tests/version_compat/test_transformers_pinned_symbols.py \
            tests/version_compat/test_no_dtype_kwarg_at_load.py \
            -n 4 --dist loadfile -v --tb=short

  cap-site-consistency:
    name: version-window drift (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install 'pytest>=8' packaging pyyaml
      - name: Assert every site declares the same window
        # Keep on one line: PowerShell on windows-latest turns a `\` continuation into a literal path.
        run: |
          python -m pytest tests/test_transformers_cap_sites.py tests/test_trl_cap_sites.py -v --tb=short

  # Import-time lanes. floor: declared minima (py3.10 because PEFT 0.18.0 requires it). ceiling: declared maxima.
  # latest: unpinned, non-blocking canary. torchcodec rides the torch index line: a PyPI build next to a +cpu torch
  # fails `from torchcodec.decoders import ...`. hf_transfer: hub 0.x raises without it under HF_HUB_ENABLE_HF_TRANSFER=1.
  zoo-imports-under-spoof:
    name: unsloth_zoo imports under CUDA spoof (${{ matrix.slug }})
    runs-on: ubuntu-latest
    # Only `latest` resolves outside the declared window, so only it is non-blocking.
    continue-on-error: ${{ matrix.continue_on_error == true }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: floor
            python: '3.10'
            torch_pins: >-
              'torch==2.6.0' 'torchvision==0.21.0' 'torchcodec>=0.2,<0.3'
            pkg_pins: >-
              'transformers==4.52.4' 'trl==0.18.2'
              'peft==0.18.0' 'sentence-transformers>=5.0,<6' 'accelerate>=1.0'
              'datasets>=3.4,<4.4' 'bitsandbytes>=0.45.5' 'triton==3.2.0'
              hf_transfer
          - slug: ceiling
            # datasets carries the declared window: the --no-deps installs below never apply pyproject's cap.
            # 3.11, not 3.12: lanes sharing an interpreter share one pip cache key.
            # Both pins must equal pyproject's ceilings (test_a_ceiling_lane_pins_the_declared_ceiling).
            python: '3.11'
            torch_pins: >-
              torch torchvision 'torchcodec>=0.12'
            pkg_pins: >-
              'transformers==5.17.0' 'trl==1.13.0'
              peft sentence-transformers accelerate 'datasets>=3.4.1,!=4.0.*,!=4.1.0,!=4.4.*,!=4.5.0,<5.0.0'
              bitsandbytes triton hf_transfer
          - slug: latest
            continue_on_error: true
            python: '3.12'
            torch_pins: >-
              torch torchvision 'torchcodec>=0.12'
            pkg_pins: >-
              transformers trl peft sentence-transformers
              accelerate datasets bitsandbytes triton hf_transfer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: unsloth
      - name: Clone unsloth-zoo @ main
        run: |
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/unsloth-zoo"
            if git clone --depth=1 https://github.com/unslothai/unsloth-zoo \
                "$RUNNER_TEMP/unsloth-zoo"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git clone unsloth-zoo failed after 3 attempts"
              exit 1
            fi
            delay=$((5 * attempt))
            echo "::warning::clone failed (attempt $attempt/3), retrying in ${delay}s..."
            sleep "$delay"
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # Deps are pinned inline below, so the workflow file is the cache key's dependency spec.
        with:
          python-version: ${{ matrix.python }}

      - name: Restore the pip cache
        id: pip-cache
        # Prefixed: this job checks the repo out under `unsloth/`.
        # One literal name (tests/studio/test_pip_cache_naming.py), so no two lanes may share an interpreter.
        uses: ./unsloth/.github/actions/pip-cache-restore
        with:
          name: version-compat-spoof
          key-files: |
            unsloth/.github/workflows/version-compat-ci.yml

      - name: Install CPU torch + this lane's pins
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            ${{ matrix.torch_pins }}
          # torchcodec is required on transformers 5.x (audio_utils reads its metadata). It is
          # ABI-coupled to torch, so the pair is chosen per lane. huggingface_hub unpinned: 4.x wants <1.0, 5.x >=1.5.0.
          pip install ${{ matrix.pkg_pins }} \
            sentencepiece protobuf safetensors numpy 'pytest>=8' \
            tqdm packaging psutil Pillow requests
          pip install --no-deps -e "$RUNNER_TEMP/unsloth-zoo"
          pip install --no-deps -e ./unsloth
      - name: Report the resolved set
        run: |
          python - <<'PY'
          from importlib.metadata import version
          for name in ("torch", "torchvision", "torchcodec", "transformers", "tokenizers",
                       "huggingface_hub", "trl", "peft", "accelerate", "datasets",
                       "sentence-transformers", "bitsandbytes", "triton"):
              try:
                  print(f"{name}=={version(name)}")
              except Exception as error:
                  print(f"{name}: {error}")
          PY
      - name: Run vllm_compat zoo-imports tests under spoof
        env:
          UNSLOTH_IS_PRESENT: '1'
          UNSLOTH_COMPILE_DISABLE: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          cd unsloth
          # test_st_modules_json_trust_gate.py needs sentence-transformers, which only this job has.
          PYTHONPATH=. python -m pytest \
            tests/vllm_compat/test_unsloth_zoo_imports.py \
            tests/vllm_compat/test_extended_module_imports.py \
            tests/test_st_modules_json_trust_gate.py \
            -v --tb=short

      - name: Save the pip cache
        if: always()
        # Prefixed: this job checks the repo out under `unsloth/`.
        uses: ./unsloth/.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

  # Fake-CUDA GRPO/SFT/DPO patch run against REAL TRL: drives models/rl.py and
  # rl_replacements.py transforms to catch structural TRL drift the greps miss.
  grpo-fake-run:
    name: GRPO fake-run (CPU spoof, TRL ${{ matrix.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: floor
            python: '3.10'
            torch_pins: >-
              'torch==2.6.0' 'torchvision==0.21.0' 'torchcodec>=0.2,<0.3'
            pkg_pins: >-
              'transformers==4.52.4' 'peft==0.18.0'
              'accelerate>=1.0' 'datasets>=3.4,<4.4' 'bitsandbytes>=0.45.5'
              'triton==3.2.0' hf_transfer
            # The declared minimum, like the zoo-imports floor lane.
            trl_pin: 'trl==0.18.2'
          - slug: latest
            python: '3.12'
            torch_pins: >-
              torch torchvision 'torchcodec>=0.12'
            pkg_pins: >-
              transformers peft accelerate datasets
              bitsandbytes triton hf_transfer
            trl_pin: '--upgrade trl'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: unsloth
      - name: Clone unsloth-zoo @ main
        run: |
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/unsloth-zoo"
            if git clone --depth=1 https://github.com/unslothai/unsloth-zoo \
                "$RUNNER_TEMP/unsloth-zoo"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::git clone unsloth-zoo failed after 3 attempts"
              exit 1
            fi
            delay=$((5 * attempt))
            echo "::warning::clone failed (attempt $attempt/3), retrying in ${delay}s..."
            sleep "$delay"
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # Deps are pinned inline below, so the workflow file is the cache key's dependency spec.
        with:
          python-version: ${{ matrix.python }}

      - name: Restore the pip cache
        id: pip-cache
        # Prefixed: this job checks the repo out under `unsloth/`.
        uses: ./unsloth/.github/actions/pip-cache-restore
        with:
          name: version-compat-grpo
          key-files: |
            unsloth/.github/workflows/version-compat-ci.yml

      - name: Install CPU torch + ecosystem + this lane's TRL
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            ${{ matrix.torch_pins }}
          # TRL last so it pulls the transformers/peft it requires.
          pip install ${{ matrix.pkg_pins }} \
            sentencepiece protobuf safetensors numpy 'pytest>=8' \
            tqdm packaging psutil Pillow requests
          pip install ${{ matrix.trl_pin }}
          pip install --no-deps -e "$RUNNER_TEMP/unsloth-zoo"
          pip install --no-deps -e ./unsloth
      - name: Fake-run vs this lane's TRL
        env:
          UNSLOTH_IS_PRESENT: '1'
          UNSLOTH_COMPILE_DISABLE: '1'
          # Disable dynamo before conftest.py imports unsloth, so nothing compiles without a GPU.
          TORCHDYNAMO_DISABLE: '1'
          TORCH_COMPILE_DISABLE: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          cd unsloth
          python -c "import trl; print('Resolved TRL', trl.__version__)"
          PYTHONPATH=. python -m pytest \
            tests/version_compat/test_grpo_protected_tokens_guard.py \
            tests/version_compat/test_trl_grpo_fake_run.py \
            tests/version_compat/test_trl_fake_train_cpu.py \
            tests/version_compat/test_trl_padding_free_max_length.py \
            tests/version_compat/test_trl_loss_normalization_contract.py \
            tests/version_compat/test_grpo_left_pad_probe_at_the_floor.py \
            tests/version_compat/test_grpo_importance_sampling_level_at_the_floor.py \
            tests/version_compat/test_trl_config_defaults_contract.py \
            tests/version_compat/test_dense_router_aux_loss_off.py \
            tests/version_compat/test_pref_max_length_clamp.py \
            tests/version_compat/test_orpo_cpo_long_rows.py \
            tests/version_compat/test_grpo_vllm_top_k_from_fast_inference.py \
            tests/version_compat/test_trl_experimental_trainers_patched.py \
            -v --tb=short
      # TRL main is schedule/dispatch only so a bleeding-edge break does not red every PR.
      - name: Fake-run vs TRL main (scheduled / dispatch only)
        if: ${{ github.event_name != 'pull_request' && matrix.slug == 'latest' }}
        env:
          UNSLOTH_IS_PRESENT: '1'
          UNSLOTH_COMPILE_DISABLE: '1'
          TORCHDYNAMO_DISABLE: '1'
          TORCH_COMPILE_DISABLE: '1'
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          pip install --upgrade "git+https://github.com/huggingface/trl"
          cd unsloth
          python -c "import trl; print('Resolved TRL', trl.__version__)"
          PYTHONPATH=. python -m pytest \
            tests/version_compat/test_grpo_protected_tokens_guard.py \
            tests/version_compat/test_trl_grpo_fake_run.py \
            tests/version_compat/test_trl_fake_train_cpu.py \
            tests/version_compat/test_trl_padding_free_max_length.py \
            tests/version_compat/test_trl_loss_normalization_contract.py \
            tests/version_compat/test_grpo_left_pad_probe_at_the_floor.py \
            tests/version_compat/test_grpo_importance_sampling_level_at_the_floor.py \
            tests/version_compat/test_trl_config_defaults_contract.py \
            tests/version_compat/test_dense_router_aux_loss_off.py \
            tests/version_compat/test_pref_max_length_clamp.py \
            tests/version_compat/test_orpo_cpo_long_rows.py \
            tests/version_compat/test_grpo_vllm_top_k_from_fast_inference.py \
            tests/version_compat/test_trl_experimental_trainers_patched.py \
            -v --tb=short

      - name: Save the pip cache
        if: always()
        # Prefixed: this job checks the repo out under `unsloth/`.
        uses: ./unsloth/.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

  # Daily-only: same suites with --strict on importable upstream tags.
  daily-fresh-fetch:
    name: daily fresh-fetch sweep (cron only)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install 'pytest>=8'
      - name: Run all version-compat suites in one process (no cache)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PYTHONPATH=. python -m pytest \
            tests/vllm_compat/test_vllm_pinned_symbols.py \
            tests/version_compat/ \
            -v --tb=short
