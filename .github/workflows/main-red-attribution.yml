name: Main red attribution

# On a red Backend CI push run on main, open (or comment on) one labelled issue
# naming the commits since the last green main run; the next green run closes it.
# Ships inert like ci-capacity.yml: writes only when vars.MAIN_RED_GUARD_ENABLED
# == 'true', otherwise the would-be issue goes to the job summary.

# lint:workflow_triggers-allow-workflow_run -- pure observer: checks out
# nothing, runs no code from the triggering ref, only writes issues.
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

# Serialized so a close cannot land before the issue it closes exists.
concurrency:
  group: main-red-attribution-${{ github.repository }}
  cancel-in-progress: false

env:
  GUARD_LABEL: main-backend-red

jobs:
  attribute:
    # Fork PRs opened from a branch named main also report head_branch 'main'.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Attribute a red run, or close the issue on a green one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CREATED: ${{ github.event.workflow_run.created_at }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          ENABLED: ${{ vars.MAIN_RED_GUARD_ENABLED }}
        run: |
          set -euo pipefail
          short="${HEAD_SHA:0:9}"

          runs="repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?branch=main&event=push"

          open_issue() {
            gh issue list --repo "$REPO" --label "$GUARD_LABEL" --state open \
              --json number --jq '.[0].number // empty'
          }

          # Main runs overlap (one concurrency group per sha): only the newest
          # decided run may open or close, else an older red finishing late
          # reopens a healed main, or an older green closes a live break.
          newer="$(gh api "$runs&status=completed&per_page=20&created=%3E$RUN_CREATED" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")] | .[0].id // empty')"
          if [ -n "$newer" ]; then
            echo "Run $newer on main started later and already decided; nothing to do."
            exit 0
          fi

          if [ "$CONCLUSION" = "success" ]; then
            existing="$(open_issue)"
            if [ -z "$existing" ]; then
              echo "Green run on main, no open $GUARD_LABEL issue. Nothing to do."
              exit 0
            fi
            body="Backend CI is green again on main at \`$short\` ($RUN_URL). Closing."
            if [ "$ENABLED" = "true" ]; then
              gh issue close "$existing" --repo "$REPO" --comment "$body"
            else
              {
                echo "## Dry run (MAIN_RED_GUARD_ENABLED is not 'true')"
                echo "Would close #$existing with:"
                echo ""
                echo "$body"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          [ "$CONCLUSION" = "failure" ] || { echo "Conclusion $CONCLUSION, not attributable."; exit 0; }

          # created=< keeps a delayed or re-run event from seeing only younger greens.
          last_green="$(gh api \
            "$runs&status=success&per_page=50&created=%3C$RUN_CREATED" \
            --jq "[.workflow_runs[] | select(.created_at < \"$RUN_CREATED\")] | .[0].head_sha // empty")"

          if [ -n "$last_green" ]; then
            suspects="$(gh api "repos/$REPO/compare/$last_green...$HEAD_SHA" \
              --jq '.commits[] | "- \(.sha[0:9]) \(.commit.message | split("\n")[0]) (@\(.author.login // .commit.author.name))"')"
            range_line="Last green: \`${last_green:0:9}\`, suspect commits ([full compare](https://github.com/$REPO/compare/$last_green...$HEAD_SHA)):"
          else
            suspects="(no green run found in the last 50 main runs -- attribute by hand)"
            range_line="Last green: unknown."
          fi

          failed_jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"

          body="Backend CI failed on main at \`$short\` ([run]($RUN_URL)). Failing jobs: ${failed_jobs:-unknown}.

          $range_line

          $suspects

          One of the suspect pushes broke the leg; the fix (or revert) belongs on main. This issue closes itself on the next green main run.
          "
          if [ -n "$last_green" ]; then
            title="Backend CI is red on main (broke between ${last_green:0:9} and $short)"
          else
            title="Backend CI is red on main at $short (last green unknown)"
          fi

          existing="$(open_issue)"
          if [ "$ENABLED" = "true" ]; then
            gh label create "$GUARD_LABEL" --repo "$REPO" \
              --description "Backend CI is red on main" --color B60205 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "Still red at \`$short\`. $body"
            else
              gh issue create --repo "$REPO" --label "$GUARD_LABEL" \
                --title "$title" \
                --body "$body"
            fi
          else
            {
              echo "## Dry run (MAIN_RED_GUARD_ENABLED is not 'true')"
              if [ -n "$existing" ]; then
                echo "Would comment on #$existing:"
              else
                echo "Would open an issue titled: $title"
              fi
              echo ""
              echo "$body"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
