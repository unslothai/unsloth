# Keeps studiobench working. Gates on STRUCTURE, never timing (a shared runner cannot
# resolve the effects): selftests, plus a real session with --assert-liveness, since
# actions that never fire still exit 0.

name: studiobench CI

on:
  pull_request:
    paths:
      - 'tests/studio/studiobench/**'
      # Reached by the installers this workflow triggers on.
      - 'studio/nvidia_probe.py'
      - 'studio/setup.sh'
      - 'studio/prebuilt_core.py'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - '.github/workflows/studiobench-ci.yml'
      # Liveness boots this checkout's CLI; selftests load tests/conftest.py and tests/_shared.
      - 'unsloth_cli/*.py'
      - 'unsloth_cli/commands/*.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'tests/_shared/**'
      # The harness drives the shipped frontend through the real backend.
      - 'studio/frontend/**'
      - 'studio/backend/**'
      - 'install.sh'
      - 'pyproject.toml'
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      - '.github/scripts/retry-with-apt-lock.sh'
  push:
    branches: [main]
    paths:
      - 'tests/studio/studiobench/**'
      - 'studio/nvidia_probe.py'
      - 'studio/setup.sh'
      - 'studio/prebuilt_core.py'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - '.github/workflows/studiobench-ci.yml'
      # Liveness boots this checkout's CLI; selftests load tests/conftest.py and tests/_shared.
      - 'unsloth_cli/*.py'
      - 'unsloth_cli/commands/*.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'tests/_shared/**'
      - 'studio/frontend/**'
      - 'studio/backend/**'
      - 'install.sh'
      - 'pyproject.toml'
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      - '.github/scripts/retry-with-apt-lock.sh'
  workflow_dispatch:

concurrency:
  # Unique per commit on main, so a merge burst cannot cancel a pending run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  selftests:
    name: Selftests, lint and the single-file build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # No browser engine: --doctor must work on a machine without Chromium.
      - name: Install the test dependencies only
        run: pip install pytest ruff 'playwright<2' psutil

      - name: Selftests
        run: python -m pytest tests/studio/studiobench -q

      - name: Lint
        run: python -m ruff check tests/studio/studiobench

      # Heavy imports are lazy so --doctor survives a bare machine.
      - name: Doctor reports rather than crashes
        run: python -m tests.studio.studiobench --doctor

      - name: The zipapp builds and the built artifact runs
        run: |
          python -m tests.studio.studiobench.build
          test -f dist/studiobench.pyz
          python dist/studiobench.pyz --doctor

  liveness:
    name: Real-path session, every action ran
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDIO_PORT: '18902'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Unsloth
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; studiobench needs no model.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Pin the Playwright version so the browser cache has a key
        id: pw
        run: |
          pip install 'playwright>=1.45,<2' psutil
          echo "version=$(python -c 'import playwright; from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-c-v2

      # Chromium only: the tracing and CDP instruments exist only there. No --with-deps: it
      # runs its own unbounded `apt-get update`; download and apt are separate retries.
      - name: Install the Chromium engine
        id: pw-install
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '300'
          # apt's internal retries are invisible and charged to our budget; the helper retries.
          APT_ACQUIRE_RETRIES: '0'
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install chromium
          fi

          # Probe whether the system libraries are actually missing before running apt.
          probe() {
            python - <<'PY'
          import sys
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              try:
                  browser = p.chromium.launch()
                  browser.close()
              except Exception as exc:
                  print(f"chromium will not start: {type(exc).__name__}: {exc}")
                  sys.exit(1)
          print("chromium launches; system libraries are present")
          PY
          }

          if probe; then
            echo "::notice::skipped playwright install-deps; the runner image already has the libraries"
          else
            echo "system libraries are missing, installing them"
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install-deps chromium
            probe
          fi

      - name: Save the Playwright browser cache
        # Main only, and only after a successful install: the key is immutable.
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.pw-cache.outputs.cache-hit != 'true'
          && steps.pw-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-c-v2

      # No --api-only: studiobench drives the real SPA. No model needed.
      - name: Boot Unsloth
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port "$STUDIO_PORT" --log logs/studio.log --pid-var STUDIO_PID

      - name: Wait for health
        run: bash .github/scripts/wait-for-health.sh --port "$STUDIO_PORT" --log logs/studio.log

      # Pass the bootstrap password explicitly: an attached studiobench cannot find the home.
      # 100K is the smallest rung where every action except image_upload runs.
      - name: Run a real-path session
        run: |
          python -m tests.studio.studiobench \
            --tier fast --rungs 100K --reps 1 \
            --attach "http://127.0.0.1:${STUDIO_PORT}" \
            --password "$(cat ~/.unsloth/studio/auth/.bootstrap_password)" \
            --engine chromium \
            --out outputs/studiobench-ci

      # THE GATE: every scheduled action must have ran=true and expect_ok, and an empty payload
      # fails. image_upload is excused (the fixture loads no model, so the control is not
      # mounted). --allow-slot-misses 2: a slow runner misses slots by design; keep it small.
      - name: Every scheduled action ran
        run: |
          python -m tests.studio.studiobench \
            --assert-liveness outputs/studiobench-ci/payload.jsonl \
            --allow-not-run image_upload \
            --allow-slot-misses 2

      # Run --report, the documented path, which exits non-zero on an unscorable payload.
      - name: The payload renders as a report
        run: |
          python -m tests.studio.studiobench \
            --report outputs/studiobench-ci/payload.jsonl \
            --tier fast --rungs 100K
          test -s outputs/studiobench-ci/summary.md

      - name: Stop Unsloth
        if: always()
        run: kill "${STUDIO_PID:-0}" 2>/dev/null || true

      # The payload records each action's reason for not running.
      - name: Upload the payload and the Unsloth log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studiobench-ci-payload
          path: |
            outputs/studiobench-ci/**
            logs/studio.log
          retention-days: 7
          if-no-files-found: warn
