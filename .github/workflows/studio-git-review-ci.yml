# Qualify bounded Git review, native POSIX transactions and Windows refusal.
# No models, credentials, or generated frontend assets are needed.

name: Studio Git review and worktrees

on:
  pull_request:
    paths:
      - 'studio/backend/core/agent_workspace/**'
      - 'studio/backend/core/project_retirement.py'
      - 'studio/backend/routes/project_git_review.py'
      - 'studio/backend/routes/project_worktrees.py'
      - 'studio/backend/routes/chat_history.py'
      - 'studio/backend/storage/studio_db.py'
      - 'studio/backend/tests/test_project_git*.py'
      - 'studio/backend/tests/test_agent_workspace_worktrees_focused.py'
      - 'studio/backend/main.py'
      - '.github/workflows/studio-git-review-ci.yml'
  merge_group:
  push:
    branches: [main, 'codex/git-worktrees-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  focused:
    name: git (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
        variant: [lifecycle, secure-tools]

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      UNSLOTH_STUDIO_DISABLE_DEVICE_PROBE: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compose project lifecycle support
        shell: bash
        env:
          LIFECYCLE_REVISION: 31327e51f71055215b6d67fb4de9b6eb38494a73
        run: |
          git fetch --no-tags https://github.com/PhilipJohnBasile/unsloth.git "$LIFECYCLE_REVISION"
          git -c user.name='Verification CI' -c user.email='verification-ci@users.noreply.github.com' merge --no-edit --no-ff "$LIFECYCLE_REVISION"

      # Compose #10577 and #10636 to verify shared locks and native untracked reads.
      - name: Compose the secure command prerequisite
        if: matrix.variant == 'secure-tools'
        shell: bash
        env:
          EDIT_REVISION: a5d144019bb585e246d0752c11d325807d0bfb19
          SECURE_TOOLS_REVISION: 9d25a218f4dc335a952b8817588a0d023479c6de
        run: |
          git fetch --no-tags https://github.com/PhilipJohnBasile/unsloth.git "$EDIT_REVISION"
          git -c user.name='Verification CI' -c user.email='verification-ci@users.noreply.github.com' merge --no-edit --no-ff "$EDIT_REVISION"
          git fetch --no-tags https://github.com/PhilipJohnBasile/unsloth.git "$SECURE_TOOLS_REVISION"
          git -c user.name='Verification CI' -c user.email='verification-ci@users.noreply.github.com' merge --no-commit --no-ff "$SECURE_TOOLS_REVISION"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install focused backend dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi httpx typer packaging structlog huggingface-hub \
            pyjwt cryptography python-multipart aiofiles sqlalchemy psutil pyyaml requests \
            'fastmcp>=3.0.2' pytest pytest-timeout

      - name: Run Git review and lifecycle contracts
        working-directory: studio/backend
        run: >-
          python -m pytest
          tests/test_project_git_review.py
          tests/test_project_git_review_routes.py
          tests/test_agent_workspace_worktrees_focused.py
          tests/test_project_git_safety.py
          tests/test_project_git_review_regressions.py
          tests/test_project_git_prerequisites.py
          -q --tb=short --timeout=120 --maxfail=5
