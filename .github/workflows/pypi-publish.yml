# Publishes the unsloth wheel to PyPI via Trusted Publishing when a release lands
# on main: both installer `unsloth>=` pins equal __version__ (unsloth/_version.py)
# and PyPI has no wheel for it yet. Wheel only, like `build.sh publish` (#10202).
#
# Not triggered on v* tags: those are Studio tags, unrelated to __version__. The
# wheel is stamped with the newest reachable v* tag (release-desktop.yml checks
# it), so push the Studio tag before or with the pin bump.
#
# Only the publish job holds `id-token: write` and it builds nothing, so a
# compromised build dependency cannot mint the PyPI token (PyPA's recommended split).
# Setup: register this workflow + the `pypi` environment as a trusted publisher on PyPI.

name: Publish to PyPI

on:
  push:
    branches: [main]
    # Every file decide reads, so a follow-up fixing one gate input still retriggers.
    paths:
      - install.sh
      - install.ps1
      - unsloth/_version.py
  # Retry after a build fix that touched no gate file; decide still gates it.
  workflow_dispatch:
    inputs:
      studio_version:
        description: Studio tag to stamp (e.g. v0.1.2-beta); blank -> git describe
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Per commit on main: a shared group cancels a PENDING run when a newer one
  # queues, which would drop an intermediate release.
  # Accepted residual: two commits landing the gate for the same version race the
  # upload and the first wins. Only the wheel is uploaded, so the result is never a
  # mix of both runs. Deferring to the newer tip would strand a release whose tip
  # touched no gate file.
  group: pypi-publish-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to publish
    # workflow_dispatch can pick any ref; a crafted branch must not reach the OIDC
    # publish on the pypi environment's branch policy alone.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: check
        run: |
          # Comment lines are dropped so an old pin in a comment cannot count. The
          # capture keeps PEP 440 suffixes (.post1, rc1, +local).
          pins() { grep -v '^[[:space:]]*#' "$1" | grep -oP 'unsloth>=\K[0-9][0-9A-Za-z.+!-]*' | sort -u || true; }
          pin_sh=$(pins install.sh)
          pin_ps=$(pins install.ps1)
          ver=$(grep -m1 -oP '^__version__ = "\K[^"]+' unsloth/_version.py || true)
          echo "install.sh: ${pin_sh:-<none>} / install.ps1: ${pin_ps:-<none>} / __version__: ${ver:-<none>}"
          one() { [ "$(printf '%s\n' "$1" | grep -c .)" = "1" ]; }
          # Unreadable inputs mean a refactor moved them: fail, since a skip would
          # silently leave every later release unpublished.
          if ! { one "$pin_sh" && one "$pin_ps" && [ -n "$ver" ]; }; then
            echo "::error::need exactly one unsloth>= pin in each of install.sh and install.ps1, and __version__ in unsloth/_version.py"
            exit 1
          fi
          if [ "$pin_sh" != "$ver" ] || [ "$pin_ps" != "$ver" ]; then
            echo "install.sh / install.ps1 pins do not both match __version__ -> skip"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip when the wheel is already up (e.g. a manual `build.sh publish`).
          decision=$(python3 - "$ver" <<'PY'
          import json, sys, urllib.error, urllib.request
          ver = sys.argv[1]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/unsloth/{ver}/json", timeout=30) as r:
                  kinds = {f.get("packagetype") for f in (json.load(r).get("urls") or [])}
          except urllib.error.HTTPError as e:
              print("publish" if e.code == 404 else f"error:HTTP {e.code}"); sys.exit(0)
          except Exception as e:
              print(f"error:{e}"); sys.exit(0)
          print("skip" if "bdist_wheel" in kinds else "publish")
          PY
          )
          case "$decision" in
            publish) echo "unsloth $ver has no wheel on PyPI -> publish"; echo "publish=true"  >> "$GITHUB_OUTPUT" ;;
            skip)    echo "unsloth $ver wheel already on PyPI -> skip";   echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *)       echo "::error::PyPI check failed for $ver: ${decision#error:}"; exit 1 ;;
          esac

  build:
    name: Build wheel + sdist
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # need tags for `git describe` (Studio release version)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned npm (min-release-age + allowScripts)
        # Node 22's npm 10.9 silently ignores .npmrc's min-release-age and allowScripts
        # (11.16+). Exact, so a days-old npm release never builds a published wheel.
        run: |
          NPM=11.19.1
          npm install -g "npm@$NPM" --no-fund --no-audit
          [ "$(npm -v)" = "$NPM" ] || { echo "::error::npm $(npm -v) is not the pinned $NPM"; exit 1; }

      - name: Lockfile supply-chain audit (pre-install scan)
        # Must run before any install executes a lifecycle script.
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Frozen frontend install (fail closed on lockfile drift)
        # build.sh's `npm install` could re-resolve a drifted package.json past the
        # audited lock; `npm ci` fails on drift first. Same gate as studio-frontend-ci.yml.
        working-directory: studio/frontend
        run: npm ci --strict-allow-scripts --no-fund --no-audit

      - name: Resolve Studio release version
        id: studio
        env:
          OVERRIDE: ${{ github.event.inputs.studio_version }}
        run: |
          studio="${OVERRIDE:-}"
          [ -n "$studio" ] || studio=$(git describe --tags --abbrev=0 --match 'v[0-9]*' || true)
          [ -n "$studio" ] || { echo "::error::no v* Studio tag found to stamp"; exit 1; }
          # The stamp is immutable once uploaded: a manual override must name a pushed tag.
          if [ -n "${OVERRIDE:-}" ] && ! git show-ref -q --verify "refs/tags/$studio"; then
            echo "::error::studio_version does not name an existing Studio tag: $studio"; exit 1
          fi
          echo "Studio release version: $studio"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"

      - name: Build frontend + wheel + sdist
        env:
          UNSLOTH_STUDIO_RELEASE_VERSION: ${{ steps.studio.outputs.studio }}
        run: |
          # Hash-pinned for the same reason as npm; the backend is pinned in pyproject.toml.
          python -m pip install --require-hashes --no-deps -r /dev/stdin <<'REQ'
          build==1.6.1 --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject_hooks==1.3.3 --hash=sha256:5fc53fdac9f7bd63fbcdc868fb5f90b4784d78a53a3d3388cd738b807441a20b
          REQ
          bash build.sh

      - name: Verify the Studio stamp landed in dist/
        env:
          STUDIO: ${{ steps.studio.outputs.studio }}
        run: python scripts/stamp_studio_release.py --verify-dist dist --expected "$STUDIO"

      - name: Wheel + sdist content sanity
        # wheel-smoke.yml runs these too, but cannot block this upload.
        run: python scripts/check_wheel_contents.py dist

      - name: Upload wheel artifact
        # Before the import smoke: its PyPI installs run arbitrary code that could
        # rewrite dist/. A smoke failure still blocks publish.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi-dist
          path: dist/*.whl
          if-no-files-found: error
          # A rerun of this job would otherwise hit the name the first attempt kept.
          # Not run_attempt in the name: a publish-only rerun must find this one.
          overwrite: true

      - name: Studio backend import smoke
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --upgrade pip
          /tmp/v/bin/pip install -r studio/backend/requirements/studio.txt
          /tmp/v/bin/pip install \
            python-multipart aiofiles sqlalchemy cryptography \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3'
          /tmp/v/bin/pip install --no-deps dist/unsloth-*.whl
          cd /tmp
          /tmp/v/bin/python -c "from studio.backend.main import app; print('Studio backend OK:', app.title)"

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          # A rerun or a same-version race finds the wheel already there.
          skip-existing: true
