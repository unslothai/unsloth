# export_capability() is per-OS and the export backend must import without PyTorch.

name: Unsloth export capability

on:
  pull_request:
    paths:
      - 'studio/backend/core/export/export.py'
      - 'studio/backend/routes/export.py'
      - 'studio/backend/main.py'
      - 'studio/backend/tests/test_export_capability.py'
      # The install below is `uses:` on these two actions.
      - '.github/actions/pip-cache-restore/action.yml'
      - '.github/actions/pip-cache-save/action.yml'
      - 'studio/backend/utils/hardware/**'
      - '.github/workflows/studio-export-capability-ci.yml'
      # export.py imports these at module scope; a new top-level torch import is what this
      # Windows lane catches.
      - 'studio/backend/tests/conftest.py'
      - 'tests/_shared/compile_cache_isolation.py'
      - 'studio/backend/loggers/**'
      - 'pyproject.toml'
      - 'studio/backend/core/__init__.py'
      - 'studio/backend/core/export/__init__.py'
      - 'studio/backend/core/inference/__init__.py'
      - 'studio/backend/hub/__init__.py'
      - 'studio/backend/hub/utils/__init__.py'
      - 'studio/backend/hub/utils/hf_tokens.py'
      - 'studio/backend/utils/__init__.py'
      - 'studio/backend/utils/models/**'
      - 'studio/backend/utils/paths/**'
  push:
    branches: [main]
    paths:
      - 'studio/backend/core/export/export.py'
      - 'studio/backend/routes/export.py'
      - 'studio/backend/main.py'
      - 'studio/backend/tests/test_export_capability.py'
      - '.github/actions/pip-cache-restore/action.yml'
      - '.github/actions/pip-cache-save/action.yml'
      - 'studio/backend/utils/hardware/**'
      - '.github/workflows/studio-export-capability-ci.yml'
      # export.py imports these at module scope; a new top-level torch import is what this
      # Windows lane catches.
      - 'studio/backend/tests/conftest.py'
      - 'tests/_shared/compile_cache_isolation.py'
      - 'studio/backend/loggers/**'
      - 'pyproject.toml'
      - 'studio/backend/core/__init__.py'
      - 'studio/backend/core/export/__init__.py'
      - 'studio/backend/core/inference/__init__.py'
      - 'studio/backend/hub/__init__.py'
      - 'studio/backend/hub/utils/__init__.py'
      - 'studio/backend/hub/utils/hf_tokens.py'
      - 'studio/backend/utils/__init__.py'
      - 'studio/backend/utils/models/**'
      - 'studio/backend/utils/paths/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  capability:
    name: capability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows only: studio-backend-ci.yml already runs these tests on Linux.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # Deps are pinned inline below, so the workflow file is the cache key's dependency spec.
        with:
          python-version: '3.12'

      - name: Restore the pip cache
        id: pip-cache
        uses: ./.github/actions/pip-cache-restore
        with:
          name: studio-export
          key-files: |
            .github/workflows/studio-export-capability-ci.yml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.4,<2.15"
      - name: Install backend import deps
        # Not unsloth (needs a GPU, and the import-safety test blocks it).
        run: python -m pip install
          transformers peft accelerate safetensors huggingface_hub datasets
          sentencepiece protobuf fastapi starlette structlog psutil
          python-multipart pydantic httpx "numpy<3" pytest
      - name: Export capability + import-safety tests
        working-directory: studio/backend
        run: python -m pytest tests/test_export_capability.py -q

      - name: Save the pip cache
        if: always()
        uses: ./.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

