# Runs studio/backend/tests/test_export_capability.py on Linux, Windows and macOS.
#
# export_capability() is per-OS (is_apple_silicon() and the PyTorch-import probe differ per
# platform) and the export backend must import without PyTorch, so this confirms the gating and
# import-safety on hosted Windows/macOS. Hosted runners have no GPU/MLX, so a real accelerator
# export is validated separately. No GPU / model / llama.cpp: the tests mock the probes and block
# torch/unsloth, so the job installs only a CPU PyTorch plus import deps.

name: Unsloth export capability

on:
  pull_request:
    paths:
      - 'studio/backend/utils/hardware/hardware.py'
      - 'studio/backend/core/export/export.py'
      - 'studio/backend/routes/export.py'
      - 'studio/backend/main.py'
      - 'studio/backend/tests/test_export_capability.py'
      - '.github/workflows/studio-export-capability-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Latest-only on a PR branch. On main this does less than it reads like: it stops
  # a RUNNING main job being killed, but GitHub cancels any PENDING run in the group
  # the moment a newer one is queued, so a merge burst still leaves only the tip.
  # See studio-backend-ci.yml, which is grouped per commit on main for that reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  capability:
    name: capability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows only, and the reason is the same one that already removed the
        # macOS leg: the only command this job runs is `pytest
        # tests/test_export_capability.py`, and every test in that file goes
        # through `_patch()`, which monkeypatches `_has_torch`, `get_device` and
        # `is_apple_silicon`. Nothing in it touches Metal, MLX or any Apple
        # binary, so a real Mac proved nothing a Linux runner did not.
        #
        # That argument reaches one step further than it was taken. It rests on
        # studio-backend-ci.yml running the same file on ubuntu-latest as part of
        # `pytest tests/` -- which it does, the file is not in that job's
        # --ignore list -- and if that is true then the ubuntu leg HERE is the
        # duplicate, not just the macOS one. The import-safety test does not need
        # a torch-free image to be honest either: it installs its own
        # `builtins.__import__` blocker and drops preloaded torch/unsloth from
        # sys.modules, so it proves the same thing inside Backend CI's fully
        # installed environment.
        #
        # Windows stays, because nothing else in CI runs this file there and
        # `_has_torch`'s import probe is the per-OS behaviour the job exists for.
        # Measured 67s of execution behind a 10642s queue, so the ubuntu leg was
        # a runner slot spent re-proving a Linux result.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # No accelerator on hosted runners; keep detection on the CPU path.
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        # This job pins its dependencies inline below rather than in a requirements
        # file, so the workflow IS the dependency spec and hashing it is what makes the
        # key describe the payload. Unscoped, setup-python hashes dependency files
        # repo-wide, so one unrelated edit invalidates ~700MB per interpreter.
        with:
          python-version: '3.12'

      - name: Restore the pip cache
        id: pip-cache
        uses: ./.github/actions/pip-cache-restore
        with:
          name: studio-export
          key-files: |
            .github/workflows/studio-export-capability-ci.yml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU PyTorch
        # CPU wheel index so every OS gets a CPU build; keep PyPI as an extra index so torch's
        # transitive deps still resolve (matching the other workflows in this repo).
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple "torch>=2.4,<2.13"
      - name: Install backend import deps
        # Enough to import utils.hardware and core.export.export; NOT unsloth (needs a GPU, and
        # the import-safety test blocks it) or triton/llama.cpp (Linux-only / native builds).
        run: python -m pip install
          transformers peft accelerate safetensors huggingface_hub datasets
          sentencepiece protobuf fastapi starlette structlog psutil
          python-multipart pydantic httpx "numpy<3" pytest
      - name: Export capability + import-safety tests
        working-directory: studio/backend
        run: python -m pytest tests/test_export_capability.py -q

      - name: Save the pip cache
        if: always()
        uses: ./.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

