# Windows counterpart to studio-ui-smoke.yml / studio-mac-ui-smoke.yml.
# Same Playwright + Chromium end-to-end chat UI flow + extra UI flow,
# but on the FREE windows-latest runner so we catch Windows-specific
# regressions in the install path (install.ps1), the Unsloth CLI's
# Windows process-management branches, and the llama.cpp prebuilt's
# Windows HTTP layer.

name: Windows Unsloth UI CI

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'unsloth/**'
      - 'unsloth_cli/**'
      - 'install.ps1'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - 'pyproject.toml'
      - 'tests/studio/**'
      - '.github/scripts/run-studio-permission-browser.sh'
      - '.github/scripts/run-studio-indicator-browser.sh'
      - '.github/workflows/studio-windows-ui-smoke.yml'
      # Every server boot in this workflow shells out to that script, so an edit
      # to it changes what this workflow actually runs.
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/run-studio-ui-lane.sh'
      # Same for the /api/health wait that runs after a boot.
      - '.github/scripts/wait-for-health.sh'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Latest-only on a PR branch. On main this does less than it reads like: it stops
  # a RUNNING main job being killed, but GitHub cancels any PENDING run in the group
  # the moment a newer one is queued, so a merge burst still leaves only the tip.
  # See studio-backend-ci.yml, which is grouped per commit on main for that reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ui-smoke:
    name: Chat UI Tests
    runs-on: windows-latest
    timeout-minutes: 45
    # Default every step's shell to Git Bash. windows-latest's default
    # shell is pwsh; without this each curl / heredoc / `kill $PID`
    # step would need its own `shell: bash`. Steps that genuinely
    # need PowerShell (install.ps1 invocation) override per-step.
    defaults:
      run:
        shell: bash
    env:
      GGUF_REPO: unsloth/gemma-3-270m-it-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GGUF_FILE: gemma-3-270m-it-UD-Q4_K_XL.gguf
      # No STUDIO_PORT here any more. One job-wide port was the right shape when
      # one server ran at a time; the lanes each need their own, so the port now
      # belongs beside the lane that owns it in run-studio-ui-lane.sh. Leaving a
      # job-wide knob that nothing reads only invites a future step to set it and
      # expect the lanes to follow.
      HF_HOME: ${{ github.workspace }}/hf-cache
      # Force UTF-8 for stdio so Python tools (hf download, Unsloth
      # CLI, etc.) can print Unicode characters like the success
      # checkmark "✓". Windows defaults to cp1252 / charmap and
      # any tool that prints "OK ✓" hits a UnicodeEncodeError.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          # No `cache: 'npm'`. setup-node's npm cache restore silently
          # aborts the entire job on Windows runners when the npm cache
          # path (`C:\npm\cache` per `npm config get cache`) doesn't yet
          # exist on a fresh runner -- the step exits without an error
          # message and every following step gets skipped. See
          # npm/cli#7308. The frontend `npm ci` is fast enough without
          # the cache that the reliability gain is worth the ~30s.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          # No `cache: 'pip'`. install.ps1 / setup.ps1 use uv and
          # never populate ~/.cache/pip; setup-python's post-step
          # then fatal-errors with "Cache folder path is retrieved
          # for pip but doesn't exist on disk".

      # Cross-OS shared entry. The tree under `hf-cache` is byte-identical on
      # Linux, macOS and Windows, so the key carries no `runner.os`, and
      # enableCrossOsArchive lets Windows (which tars with --force-local) join it.
      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        id: cache-hf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        # Save on main only. Caches created on a PR ref are scoped to that
        # merge ref -- per GitHub's docs they "can only be restored by re-runs
        # of the pull request" -- while every PR *can* restore from the default
        # branch. So a PR-scoped save helps almost nothing and competes for the
        # per-repo cache budget, and when that budget is exceeded GitHub evicts
        # by least-recently-used, which deletes main's copies that all PRs share.
        # This repo's budget is 50 GiB, not GitHub's 10GB default, and it was
        # measured at 49.63 GiB across 258 entries -- 99.3% full, so eviction runs
        # at the margin. 20.74 GiB of that (42%) is the SAME key held on several
        # refs, and every one of those keys already has a copy on main, so the
        # PR-scoped duplicates are redundant by construction. That is the thrash
        # loop: PR misses -> downloads -> saves its own copy -> evicts main's ->
        # next PR misses.
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Pre-install Windows tweaks (npm 11 + Defender exclusions)
        shell: pwsh
        # See studio-windows-update-smoke.yml for the full rationale.
        # tl;dr: setup.ps1 needs npm >=11 to skip a 35 s winget Node
        # reinstall, and Defender's real-time scan dominates the
        # frontend / uv-pip-extract steps.
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "npm version before upgrade: $(npm -v)"
          npm install -g 'npm@^11' 2>&1 | Out-Host
          Write-Host "npm version after upgrade: $(npm -v)"
          # NOTE: do NOT pre-create these directories. See
          # studio-windows-update-smoke.yml for the full rationale --
          # creating an empty studio/frontend/dist trips setup.ps1's
          # mtime-based staleness check into "frontend up to date, skip
          # rebuild" and Unsloth boots with an empty dist directory.
          # Add-MpPreference accepts paths that do not yet exist.
          foreach ($p in @(
            "$env:USERPROFILE\.unsloth",
            "$env:USERPROFILE\AppData\Local\uv",
            "$env:GITHUB_WORKSPACE\studio\frontend\node_modules",
            "$env:GITHUB_WORKSPACE\studio\frontend\dist"
          )) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "Defender exclusion skipped ($($_.Exception.Message)): $p"
            }
          }

      - name: Seed a legacy launch-studio.vbs (upgrade-cleanup check)
        # Simulate a pre-hardening install so the post-install assertion below
        # proves the installer DELETES an existing launch-studio.vbs (the exact
        # Kaspersky-flagged file), not merely stops generating it.
        shell: pwsh
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA 'Unsloth Studio'
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          Set-Content -LiteralPath (Join-Path $appDir 'launch-studio.vbs') -Value 'WScript.Echo "legacy"' -Encoding Unicode
          Write-Host "seeded legacy launch-studio.vbs at $appDir"

      # 96s of a ~257s install on Windows (`[72s] building frontend...` -> `[168s]
      # frontend built`, 37% of it), spent in five Windows jobs on every commit to
      # produce byte-identical output. The key hashes exactly the paths
      # studio/setup.ps1:3526-3549 checks before rebuilding, so a hit means the build
      # inputs are byte-identical; the action's own reasoning, and the assertion that
      # a hit was actually REUSED rather than rebuilt, live in
      # .github/actions/frontend-dist-restore and -save.
      - name: Restore the built frontend
        id: fe-dist
        uses: ./.github/actions/frontend-dist-restore

      - name: Install Unsloth (--local, --no-torch)
        # install.ps1 is the supported Windows installer. install.sh
        # has no Windows branch (apt-get / brew calls). The PS1
        # script's `Install-UnslothStudio @args` line at the bottom
        # forwards `--local --no-torch` correctly.
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          # install.ps1 runs as a CHILD process, not in-process. Its own
          # lines now go to [Console]::Out (Write-StudioLine), not the
          # Information stream, so an in-process `*>&1 | Tee-Object` would
          # put them on the step log and never in logs/install.log. As a
          # native command its stdout IS the pipeline, and the setup.ps1
          # grandchild inherits that handle, so its markers land in the log
          # too -- they used to bypass Tee-Object entirely.
          # -Command rather than -File: $ProgressPreference is a preference
          # variable, so it does not cross a process boundary on its own.
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          # Elapsed-seconds prefix, added to the STEP LOG only. Tee-Object writes
          # logs/install.log upstream of this filter, so the artifact keeps exactly
          # what install.ps1 produced and the readers of it are unaffected.
          #
          # install.ps1 and studio/setup.ps1 are deliberately untouched. This is a
          # display filter over a stream the step already pipes, so there is no
          # switch for the installer to interpret and no way for a real user's
          # install to behave differently from this one. The install costs 268-292s
          # here against 88s for the same install on Linux, and nothing in its
          # output says where that goes.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 |
            Tee-Object -FilePath logs/install.log |
            ForEach-Object { '[{0,4:N0}s] {1}' -f $sw.Elapsed.TotalSeconds, $_ }
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }

      # Paired with the restore above: asserts the hit was reused (a `building
      # frontend` line after a hit fails the job -- otherwise the cache costs a
      # download, saves nothing, and still reports a hit), then saves on main only.
      - name: Save the built frontend
        uses: ./.github/actions/frontend-dist-save
        with:
          cache-hit: ${{ steps.fe-dist.outputs.cache-hit }}
          key: ${{ steps.fe-dist.outputs.key }}

      - name: Assert install.ps1 used the Windows llama.cpp prebuilt
        run: |
          # The filesystem is the authority here: setup.ps1's "prebuilt
          # installed and validated" reaches logs/install.log only because
          # install.ps1 is spawned as a child process, and a marker that
          # depends on process topology is a weak thing to gate on.
          # setup.ps1 writes UNSLOTH_PREBUILT_INFO.json next to the install
          # dir on success, and lays the binaries under build/bin/Release/
          # on Windows.
          STUDIO_HOME=~/.unsloth/studio
          LLAMA_DIR=~/.unsloth/llama.cpp
          INFO="$LLAMA_DIR/UNSLOTH_PREBUILT_INFO.json"
          BIN="$LLAMA_DIR/build/bin/Release/llama-server.exe"
          # Source-build fallback grep stays as a fast bail-out.
          if grep -q "falling back to source build" logs/install.log; then
            echo "::error::install.ps1 fell back to source-build llama.cpp on Windows."
            grep -E "llama-prebuilt|llama.cpp" logs/install.log | tail -60
            exit 1
          fi
          if [ ! -f "$INFO" ]; then
            echo "::error::no UNSLOTH_PREBUILT_INFO.json at $INFO; setup.ps1 didn't install the prebuilt."
            ls -la "$LLAMA_DIR" || true
            exit 1
          fi
          if [ ! -f "$BIN" ]; then
            echo "::error::no llama-server.exe at $BIN; prebuilt extraction incomplete."
            ls -la "$LLAMA_DIR/build/bin" || true
            ls -la "$LLAMA_DIR/build/bin/Release" || true
            exit 1
          fi
          echo "install.ps1 installed the Windows prebuilt llama.cpp:"
          cat "$INFO"

      - name: Assert Unsloth launcher chain (no VBS, hidden PowerShell shortcut)
        # The shortcut launch path is otherwise untested here (the steps below
        # boot `unsloth studio` directly). Guard against re-introducing the VBS
        # that tripped Kaspersky HEUR:Trojan.VBS.Agent.gen and against the .lnk
        # pointing anywhere other than hidden PowerShell over launch-studio.ps1.
        shell: pwsh
        run: |
          $appDir = Join-Path $env:LOCALAPPDATA 'Unsloth Studio'
          if (Test-Path -LiteralPath (Join-Path $appDir 'launch-studio.vbs')) {
            throw "regression: launch-studio.vbs exists (the Kaspersky VBS-FP shape)"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $appDir 'launch-studio.ps1'))) {
            throw "missing launch-studio.ps1 in $appDir"
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Unsloth Studio.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) {
            $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Unsloth Studio.lnk'
          }
          if (-not (Test-Path -LiteralPath $lnk)) { throw "no Unsloth Studio.lnk on Desktop or Start Menu" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "shortcut target: $($sc.TargetPath)"
          Write-Host "shortcut args:   $($sc.Arguments)"
          if ($sc.TargetPath -match 'wscript\.exe$') { throw "shortcut still targets wscript.exe (VBS host)" }
          if ($sc.TargetPath -notmatch 'powershell\.exe$') { throw "unexpected shortcut target: $($sc.TargetPath)" }
          if ($sc.Arguments -notmatch '-WindowStyle Hidden') {
            throw "shortcut must launch windowless (-WindowStyle Hidden)"
          }
          Write-Host "launcher chain OK (no VBS; hidden powershell over launch-studio.ps1)"

      - name: Launch Unsloth via the shortcut and assert health
        # Run the exact command the .lnk stores (hidden PowerShell over
        # launch-studio.ps1) and confirm it brings the backend up. This is the
        # only step that proves the shortcut launch is not silently broken.
        # Default port range is 8888-8908; the later UI tests use 18896/18897, so
        # there is no conflict, and we tear this server down before they boot.
        shell: pwsh
        run: |
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Unsloth Studio.lnk'
          if (-not (Test-Path -LiteralPath $lnk)) {
            $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Unsloth Studio.lnk'
          }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "launching: $($sc.TargetPath) $($sc.Arguments)"
          Start-Process -FilePath $sc.TargetPath -ArgumentList $sc.Arguments -WorkingDirectory $sc.WorkingDirectory
          $foundPort = 0
          foreach ($i in 1..180) {
            foreach ($port in 8888..8908) {
              try {
                $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 1
                if ($r.status -eq 'healthy' -and $r.service -eq 'Unsloth UI Backend') { $foundPort = $port; break }
              } catch {}
            }
            if ($foundPort) { break }
            Start-Sleep -Seconds 1
          }
          # Tear down the shortcut-launched server before the main UI tests boot.
          try {
            $owner = (Get-NetTCPConnection -LocalPort $foundPort -State Listen -ErrorAction Stop | Select-Object -First 1).OwningProcess
            if ($owner) { taskkill /PID $owner /T /F 2>$null | Out-Null }
          } catch {}
          if (-not $foundPort) { throw "Unsloth did not become healthy when launched via the shortcut" }
          Write-Host "Unsloth healthy on port $foundPort (launched via the shortcut)"

      - name: Add Unsloth shim to GITHUB_PATH
        # install.ps1 puts unsloth.exe at $StudioHome\bin\unsloth.exe
        # and adds that dir to the User PATH via the Windows registry.
        # Registry-level PATH updates don't propagate to a running
        # Git Bash session, so the next step's `unsloth ...` invocation
        # would hit "command not found". Re-export the shim dir to
        # GITHUB_PATH so every subsequent step in this job sees it.
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          if [ ! -f "$SHIM_DIR/unsloth.exe" ]; then
            echo "::error::unsloth.exe shim not found at $SHIM_DIR"
            ls -la ~/.unsloth/studio/ || true
            exit 1
          fi
          # GITHUB_PATH wants Windows-style paths; convert via cygpath.
          cygpath -w "$SHIM_DIR" >> "$GITHUB_PATH"
          echo "Added Unsloth shim dir to PATH: $(cygpath -w "$SHIM_DIR")"

      - name: Install Playwright + Chromium
        # No --with-deps on Windows: that flag installs Linux apt
        # packages. windows-latest ships the system frameworks
        # Chromium needs (Edge / WebView2) already.
        run: |
          python -m pip install 'playwright>=1.45,<2'
          python -m playwright install chromium

      # Two lanes, concurrently, on one runner.
      #
      # These five Playwright suites ran one after another for ~788s of a 20.6
      # minute job, 88% of it in steps over 60s, and this job was the last
      # finisher on every sampled commit where no macOS job ran. They are
      # disjoint -- each boots its own server and drives its own browser -- and
      # the ports were ALREADY distinct. The only thing forcing sequence was
      # shared state: boot-studio-api-only.sh hardcoded ~/.unsloth/studio/auth
      # and every "pass the bootstrap password" step read that same path back.
      # Teaching the script to honour UNSLOTH_STUDIO_HOME, the way its two
      # siblings have since #9158, is the whole enabling change.
      #
      # The lane bodies live in run-studio-ui-lane.sh, which documents the state
      # split and why there are two lanes and not five. Wait on BOTH before
      # failing: backgrounding defeats `set -e`, and without an explicit
      # wait-and-collect one lane's breakage hides the other's.
      #
      # AND BOUND BOTH. Nothing here used to have a deadline shorter than the
      # job's own 45 minutes. Every wait inside the suites is per-operation --
      # 60s default, 540s a turn, 1080s for the rapid-submit predicate -- and
      # five turns of a stalled model reach the job cap before any single one of
      # them fires. On the #9425 branch this step started at 04:33:01 and never
      # returned; the runner killed the job at its cap and GitHub recorded the
      # result as "cancelled", which `gh pr checks` renders as a failure and
      # which reads exactly like ordinary concurrency supersession. See
      # studio-backend-ci.yml, wedged the same way and bounded the same way.
      #
      # And it left nothing to read. The lane .out files are only cat'ed after
      # both `wait`s return, so a stalled step prints NOTHING while it stalls;
      # the `if: always()` artifact upload does not run when the runner kills
      # the job at its cap; and Python block-buffers stdout into a file, so the
      # buffer went down with the process. 48 minutes, no logs, no artifacts.
      #
      # So: `timeout` per lane, a heartbeat while they run, unbuffered stdout so
      # what they printed survives being killed, and the server log tailed next
      # to the lane log because a lane killed mid-turn is usually explained by
      # the llama-server it was driving. A lane that wedges now fails, names
      # itself, and leaves evidence, and its sibling still reports its own
      # result instead of being buried with it.
      - name: Drive the UI suites in two parallel lanes
        # Bounds the whole step below the job's 45m cap even if `timeout` itself
        # is defeated, and -- the point -- leaves room for "Upload Playwright
        # artifacts" to actually run. ~7m of prologue precedes this step.
        timeout-minutes: 28
        env:
          GGUF_REPO: ${{ env.GGUF_REPO }}
          GGUF_VARIANT: ${{ env.GGUF_VARIANT }}
          # Block-buffered stdout is discarded when a wedged lane is killed,
          # which is the one run whose output is worth having.
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p logs
          # The backstop, not the first line of defence: the suites' own wall
          # watchdogs should fire first and say which step they died on. 1500s
          # is 3.6x the measured lane wall (375s chat, 413s extra) and 3x the
          # slowest this step has ever been while succeeding (508s over 521
          # runs). The failures it is here for sat at 2900s. SIGINT first so a
          # suite can unwind and print the wait it was stuck on; SIGKILL 60s
          # later for the native Windows processes MSYS cannot signal politely.
          #
          lane_timeout=1500

          # Which `timeout` matters here. C:\Windows\System32\timeout.exe is on
          # PATH too, with entirely different semantics (`timeout /t N`), and
          # this job prepends a shim directory to GITHUB_PATH -- so the bare
          # name is not safe to resolve. Prefer the absolute coreutils path,
          # accept a bare one that proves itself with --version (which System32
          # does not answer), and fail loudly rather than silently running the
          # lanes unbounded again: MinGit trims usr/bin, so this is worth
          # checking rather than assuming.
          lane_timeout_bin=""
          for candidate in /usr/bin/timeout timeout; do
            if "$candidate" --version >/dev/null 2>&1; then
              lane_timeout_bin="$candidate"
              break
            fi
          done
          if [ -z "$lane_timeout_bin" ]; then
            echo "::error::no GNU coreutils timeout on this runner; the UI lanes would run unbounded and a wedge would burn the whole job again. Install coreutils or bound the lanes another way."
            exit 1
          fi
          echo "[lanes] bounding each lane with $lane_timeout_bin at ${lane_timeout}s"

          pids=""
          for lane in chat extra; do
            "$lane_timeout_bin" --signal=INT --kill-after=60 "$lane_timeout" \
              bash .github/scripts/run-studio-ui-lane.sh "$lane" \
              >"logs/lane-$lane.out" 2>&1 &
            pids="$pids $!:$lane"
          done

          # Without this the step is silent for its entire duration, so a stall
          # is indistinguishable from progress while it is happening.
          (
            while sleep 60; do
              for lane in chat extra; do
                [ -f "logs/lane-$lane.out" ] || continue
                echo "[heartbeat ${SECONDS}s] $lane: $(tail -n 1 "logs/lane-$lane.out" 2>/dev/null)"
              done
            done
          ) &
          heartbeat=$!

          rc=0
          for entry in $pids; do
            lane="${entry##*:}"
            status=0
            wait "${entry%%:*}" || status=$?
            [ "$status" -eq 0 ] && continue
            rc=1
            case "$status" in
              124|137)
                echo "::error::Windows UI lane $lane did not finish within ${lane_timeout}s and was killed. Its last output and its server log are below, and in the uploaded artifacts."
                ;;
              *)
                echo "::error::Windows UI lane $lane failed (exit $status)"
                ;;
            esac
          done
          kill "$heartbeat" 2>/dev/null || true

          for f in logs/lane-*.out; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          for f in logs/studio-lane-*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f (tail)"
            tail -n 80 "$f"
            echo "::endgroup::"
          done
          exit "$rc"


      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-studio-ui-smoke-artifacts
          path: |
            logs/studio-lane-*.log
            logs/lane-*.out
            logs/boot-*.out
            logs/install.log
            logs/playwright
            logs/playwright-permissions-*
            logs/playwright-indicator-*
            logs/playwright_extra
            logs/playwright_update_banner
            logs/studio-permissions-*.log
            logs/studio-indicator-*.log
