# Startup-time gate. Budgets are 2x the observed median rounded up to 0.5s, floored at
# 1.4x the slowest median, so runner luck does not fail PRs; it catches torch-sized
# regressions. Raise a budget in the PR that needs it. Not a required check while
# path-filtered: a skipped workflow never reports.

name: Startup profile

on:
  pull_request:
    paths:
      # main.py imports the whole backend tree at module scope.
      - 'studio/backend/**'
      - '!studio/backend/tests/**'
      # The launch phase spawns `unsloth studio --api-only`.
      - 'unsloth_cli/**'
      - 'studio/src-tauri/src/preflight**'
      # The profiler hardcodes the argv process.rs::backend_args builds; keep them in sync.
      - 'studio/src-tauri/src/process.rs'
      - 'scripts/profile_startup.py'
      - '.github/workflows/startup-profile-ci.yml'
      # The installers run these modules and read the prebuilt pins.
      - 'studio/install_*.py'
      - 'studio/prebuilt_core.py'
      - 'studio/nvidia_probe.py'
      - 'studio/node_prebuilt_pins.json'
      - 'install.sh'
      - 'install.ps1'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - 'pyproject.toml'
      - 'studio/setup.sh'
      - 'studio/setup.ps1'
      - 'studio/install_python_stack.py'
  workflow_dispatch:
    inputs:
      repeats:
        description: 'launch repeats per OS (median reported)'
        type: string
        default: '3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  profile:
    name: startup ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Slowest medians (1.4x floor source): ubuntu 3.52s, macos 5.52s, windows 5.55s.
        include:
          - os: ubuntu-latest
            max_healthz_seconds: '6.5'
          - os: macos-15
            max_healthz_seconds: '8.0'
          - os: windows-latest
            max_healthz_seconds: '10.5'

    env:
      UNSLOTH_STUDIO_HOME: ${{ github.workspace }}/.studio-home
      # A wildcard bind calls ifconfig.me on the startup path.
      UNSLOTH_STUDIO_DISABLE_PUBLIC_CHECK: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Prebuilt frontend dist is safe: --api-only never serves a frontend and install time is
      # not measured. RESTORE ONLY: no push/schedule trigger, so a save could never run;
      # tests/studio/test_frontend_dist_cache.py enforces this from the `on:` block.
      - name: Restore the uv download cache
        id: uv-cache
        uses: ./.github/actions/uv-cache-restore

      - name: Restore the built frontend
        id: fe-dist
        uses: ./.github/actions/frontend-dist-restore

      - name: Install Unsloth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs
          # --local overlays the checkout, so the profiled server is this diff.
          if [ "${{ runner.os }}" = "Windows" ]; then
            pwsh -NoProfile -File ./install.ps1 --local 2>&1 | tee logs/install.log
          else
            bash install.sh --local 2>&1 | tee logs/install.log
          fi

      # `save: 'false'` still checks that a restored dist was reused, without uploading.
      - name: Check the restored frontend was reused
        uses: ./.github/actions/frontend-dist-save
        with:
          cache-hit: ${{ steps.fe-dist.outputs.cache-hit }}
          key: ${{ steps.fe-dist.outputs.key }}
          save: 'false'

      - name: Declare this job a uv cache consumer, not a producer
        uses: ./.github/actions/uv-cache-save
        with:
          cache-hit: ${{ steps.uv-cache.outputs.cache-hit }}
          key: ${{ steps.uv-cache.outputs.key }}
          save: 'false'

      - name: Profile startup
        shell: bash
        run: |
          # Explicit pipefail: the gate's exit code reaches this step only through the tee pipe.
          set -o pipefail
          BIN="$UNSLOTH_STUDIO_HOME/unsloth_studio/bin/unsloth"
          [ -x "$BIN" ] || BIN="$UNSLOTH_STUDIO_HOME/unsloth_studio/Scripts/unsloth.exe"
          [ -x "$BIN" ] || BIN=""
          # Profile with the installed venv interpreter, which is what launches.
          PY="$UNSLOTH_STUDIO_HOME/unsloth_studio/bin/python"
          [ -x "$PY" ] || PY="$UNSLOTH_STUDIO_HOME/unsloth_studio/Scripts/python.exe"
          [ -x "$PY" ] || PY="$(command -v python3 || command -v python)"
          python3 scripts/profile_startup.py \
            --python "$PY" \
            ${BIN:+--bin "$BIN"} \
            --repeats "${{ inputs.repeats || '3' }}" \
            --max-healthz-seconds "${{ matrix.max_healthz_seconds }}" \
            --json "startup-${{ matrix.os }}.json" 2>&1 | tee logs/profile.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          f="startup-${{ matrix.os }}.json"
          [ -f "$f" ] || { echo "no profile produced"; exit 0; }
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"### {d['platform']} / {d['machine']} (py {d['python']}, {d['cpu_count']} cpu)\n")
          imp = d.get("imports", {})
          # Gate on ok: a failed `import main` still leaves rows, so a total can lie.
          if imp.get("ok"):
              print(f"**`import main`: {imp['total_seconds']}s**\n")
              print("| package | self ms |")
              print("|---|---:|")
              for k, v in list(imp.get("self_by_package_ms", {}).items())[:8]:
                  print(f"| {k} | {v} |")
              print()
          else:
              print("**`import main` failed - no valid import profile**\n")
              print("```\n" + (imp.get("error") or "")[-1500:] + "\n```\n")
          lau = d.get("launch") or {}
          runs = len(lau.get("runs") or [])
          failed = lau.get("failed_runs") or 0
          if lau.get("healthz_median_seconds") is not None:
              # The aggregates cover only the runs that reached healthz, so flag the
              # failures: bare numbers would read as a normal fast startup.
              note = f" _({runs - failed} of {runs} launches; {failed} never became healthy)_" if failed else ""
              print(f"**time to a healthy port: {lau['healthz_median_seconds']}s median, "
                    f"{lau['healthz_max_seconds']}s max**{note}\n")
          elif lau.get("skipped"):
              print(f"_launch phase skipped: {lau['skipped']}_\n")
          elif runs:
              print(f"**no launch measurement: all {runs} launches failed to become healthy**\n")
          PY

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: startup-profile-${{ matrix.os }}
          path: |
            startup-*.json
            logs/
          retention-days: 14
          if-no-files-found: warn
