# Three end-to-end smoke phases that boot a freshly-installed Unsloth and
# exercise the surfaces real users hit through the OpenAI / Anthropic
# SDKs and curl. Each phase picks the smallest model that exercises the
# behaviour under test and primes its own model cache via actions/cache.
# All three run sequentially on ONE runner and share a single
# install.sh --local --no-torch bootstrap, matching what
# studio-windows-inference-smoke.yml already does.
#
#   1. OpenAI, Anthropic API tests            port 18888
#        gemma-3-270m-it UD-Q4_K_XL (~254 MiB).
#        Password rotation via /api/auth/change-password (old fails,
#        new works), then OpenAI + Anthropic Python SDKs against /v1/*
#        with temperature=0 and a fixed seed. Asserts the four-turn
#        conversation is deterministic across two runs.
#
#   2. Tool calling Tests                     port 18889
#        Qwen3.5-2B UD-Q4_K_XL (~1.28 GiB). OpenAI function calling,
#        server-side tools (python, terminal, web_search) via
#        enable_tools / enabled_tools, and enable_thinking on/off.
#
#   3. JSON, images                           port 18890
#        Qwen3-VL-2B-Instruct UD-Q4_K_XL (~1.1 GiB) + mmproj-F16 (~780 MiB).
#        response_format JSON-schema decoding and OpenAI image_url
#        (data URI) plus Anthropic source/base64 image inputs.
#
# Each phase gates on the shared install rather than on the phase before it,
# so a phase-1 failure still lets phases 2 and 3 report. That is what the three
# separate jobs gave for free and what the bundle has to reproduce by hand.

name: Unsloth GGUF CI

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'unsloth/**'
      - 'unsloth_cli/**'
      - 'install.sh'
      - 'pyproject.toml'
      - '.github/workflows/studio-inference-smoke.yml'
      - '.github/scripts/retry-with-apt-lock.sh'
      # Every server boot in this workflow shells out to that script, so an edit
      # to it changes what this workflow actually runs.
      - '.github/scripts/boot-studio-api-only.sh'
      # Same for the /api/health wait that runs after a boot.
      - '.github/scripts/wait-for-health.sh'
      # The install step in this workflow is `uses:` on that composite action,
      # so an edit to the action changes what this workflow actually runs.
      - '.github/actions/install-unsloth-local/action.yml'
      # The dist cache moved out of install-unsloth-local so the Windows jobs could
      # share one definition of its key; a change to it still has to re-run the jobs
      # that depend on it.
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
  push:
    branches: [main]
  # Manual trigger for pre-warming HF_HOME caches on main, or re-running
  # against an arbitrary branch without pushing a no-op commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Latest-only on a PR branch. On main this does less than it reads like: it stops
  # a RUNNING main job being killed, but GitHub cancels any PENDING run in the group
  # the moment a newer one is queued, so a merge burst still leaves only the tip.
  # See studio-backend-ci.yml, which is grouped per commit on main for that reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # One job, three phases -- the Linux port of the layout Windows and macOS
  # already use (studio-windows-inference-smoke.yml, studio-mac-inference-smoke.yml).
  # These were three ubuntu-latest jobs differing only in model, port and test
  # body; checkout, apt, setup-node, setup-python and `install.sh --local
  # --no-torch` were identical in all three.
  #
  # This reverses the note in studio-windows-inference-smoke.yml that said the
  # trade was not worth making on ubuntu because "setup is ~1.9 min against ~3.0
  # min of tests" and the added sequential wall time would cost more feedback
  # latency than the slots are worth. The arithmetic was right; its premise --
  # that the three jobs start together -- is not what the runners actually do.
  #
  # Measured on main. Run 32089506294 started two jobs at 02:40:11 and the third
  # at 02:46:52, a 6m41s wait for the third slot, and finished at 02:52:57: a
  # 12m46s wall for ~6 min of work. Run 32089558062 staggered all three
  # (02:47:32 / 02:50:01 / 02:54:06). Across 18 recent multi-job runs on main the
  # median gap between a run's first and last job start was 175s, and 13 of the
  # 18 exceeded 60s. The sequential wall time the note was trying to avoid is
  # already being paid, in the queue, plus two extra setups.
  #
  # Measured bundled, on a staging repo with an EMPTY actions cache, so every
  # model downloaded cold: 6m03s for all three phases. 105s of that is the now-
  # shared setup (checkout 4s, apt 9s, node 1s, python 2s, install.sh 88s, SDKs
  # 6s), which the three jobs each paid separately; the phases themselves are
  # 26s / 179s / 36s. That is at or under the 6m05 the longest of the three jobs
  # took on its own, on a third of the runners -- so this is not the "slower but
  # cheaper" trade it looked like before it was measured. It also gives back 2 of
  # the 60 concurrent slots, which is what makes the contended case rarer for
  # every other workflow.
  #
  # Each phase keeps its own model cache directory, HF_HOME, port, server log,
  # uploaded artifact and step timeouts, and each is gated on the SHARED preamble
  # rather than on the phase before it, so a failure still points at one phase,
  # earlier phases' logs survive it, and later phases still run -- the same
  # independence the three jobs had.
  inference-smoke:
    name: GGUF inference smoke (API, tools, vision)
    runs-on: ubuntu-latest
    # Was 25 + 25 + 30 across three runners. Sequentially they share one
    # install, so the sum is well under 60, but a cold model cache on the
    # vision phase is the slow case. Every step that can block also carries
    # its own `timeout-minutes`: the job cap alone is not a substitute,
    # because hf-download-with-retry.sh retries forever by design and named
    # the enclosing step's timeout as its bound.
    timeout-minutes: 60
    env:
      # Only what every phase shares. Model, GGUF file, port and HF_HOME are
      # set per phase via $GITHUB_ENV instead of here: if a phase-specific key
      # were also declared at job level, whether the later $GITHUB_ENV write
      # wins is not something the Actions docs pin down, and a phase quietly
      # talking to the previous phase's port would be a nasty way to find out.
      #
      # Unbuffered stdio so a phase that dies mid-step leaves its output in the
      # log rather than in a lost 8KB pipe buffer. Three phases share one log
      # now, so "which phase was running" has to be readable from the tail.
      PYTHONUNBUFFERED: '1'
      # hf-xet's chunk directory defaults to a path under HF_HOME, which is what
      # the phase-1 and phase-3 cache entries save. Those chunks are scratch --
      # re-derivable from the blobs sitting next to them -- so pinning them
      # outside the workspace keeps each hf-cache* tree closer to 1:1 with the
      # model files it holds. hf-download-with-retry.sh already sets
      # HF_XET_CHUNK_CACHE_SIZE_BYTES=0, so this mainly covers the downloads
      # Unsloth itself makes at load time, which do not go through that script.
      HF_XET_CACHE: ${{ github.workspace }}/xet-scratch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false


      - name: Linux deps for llama.cpp prebuilt
        # Bounded and retried through the shared helper: an unbounded apt step does
        # not fail, it spends the job's whole budget and is reported as "cancelled"
        # with no reason and every later step skipped. update and install go as one
        # unit, since retrying the install after a stalled update re-reads the same
        # broken package list.
        # Two long attempts, not three short ones. 150s killed apt mid-`update`
        # against a mirror that was degraded rather than dead, and every attempt
        # then hit the same wall -- three kills and no result. The bound exists to
        # stop an infinite hang, not to race a slow mirror.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'


      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'


      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # Cross-OS shared entry. The tree under `hf-cache` is byte-identical on
      # Linux, macOS and Windows, so the key carries no `runner.os`, and
      # enableCrossOsArchive lets Windows (which tars with --force-local) join it.

      # Deliberately NO `if:`, so this rides the implicit success() and a failed
      # preamble still stops the job here, exactly as it did when this was three
      # jobs. Every phase below gates on this step's outcome.
      - name: Install Unsloth (--local, --no-torch)
        id: install
        timeout-minutes: 25
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      # Needed by phases 1 and 3 only; the tool-calling phase drives the API
      # with curl and never imports them, which is why phase 2 does not gate
      # on this.
      - name: Install OpenAI + Anthropic Python SDKs
        id: sdks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        # anthropic is held below 1.0: v1 removed temperature, top_p and top_k as
        # accepted arguments on messages.create(), so the probes below, which pin
        # temperature = 0.0 for determinism, raise TypeError against it. The v1 route
        # is extra_body; moving to it is a deliberate change to what the probes send,
        # not something a CI install should decide by resolving a new major.
        run: pip install 'openai>=1.50,<4' 'anthropic>=0.40,<1'

      # Phase 1's environment and model cache sit HERE, after the shared
      # preamble, not before it. They used to run before the installer, which is
      # where they sat when phase 1 was its own job -- harmless then, because a
      # priming failure only killed that one job. Once the installer is shared,
      # the same failure would skip it under the implicit success() and every
      # later phase's gate would evaluate false. Ordering the shared setup first
      # keeps a phase-1 resource failure phase-local.
      - name: Phase 1 environment (OpenAI, Anthropic API)
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/gemma-3-270m-it-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=gemma-3-270m-it-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18888" >> "$GITHUB_ENV"
          echo "STUDIO_LOG=logs/studio.log" >> "$GITHUB_ENV"
          echo "HF_HOME=${{ github.workspace }}/hf-cache" >> "$GITHUB_ENV"

      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' }}
        id: cache-hf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && (steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success') }}
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        # Save on main only. Caches created on a PR ref are scoped to that
        # merge ref -- per GitHub's docs they "can only be restored by re-runs
        # of the pull request" -- while every PR *can* restore from the default
        # branch. So a PR-scoped save helps almost nothing and competes for the
        # per-repo cache budget, and when that budget is exceeded GitHub evicts
        # by least-recently-used, which deletes main's copies that all PRs share.
        # This repo's budget is 50 GiB, not GitHub's 10GB default, and it was
        # measured at 49.63 GiB across 258 entries -- 99.3% full, so eviction runs
        # at the margin. 20.74 GiB of that (42%) is the SAME key held on several
        # refs, and every one of those keys already has a copy on main, so the
        # PR-scoped duplicates are redundant by construction. That is the thrash
        # loop: PR misses -> downloads -> saves its own copy -> evicts main's ->
        # next PR misses.
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true


      - name: Reset auth + boot Unsloth (API-only)
        id: boot-api
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.prime-hf.outcome != 'failure' }}
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT" --log "$STUDIO_LOG"

      - name: Wait for /api/health
        id: ready-api
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.boot-api.outcome == 'success' }}
        run: |
          bash .github/scripts/wait-for-health.sh --port "$STUDIO_PORT"

      - name: Password rotation (old must fail, new must work)
        id: rotate-api
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.ready-api.outcome == 'success' }}
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIRotated-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          # 1. Login with the bootstrap password.
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          [ -n "$OLD_TOKEN" ] && [ "$OLD_TOKEN" != "null" ] || { echo "bootstrap login failed"; exit 1; }
          # 2. Rotate to a fresh random password.
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          # 3. Old password must now be rejected (HTTP 401).
          OLD_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}")
          if [ "$OLD_STATUS" != "401" ]; then
            echo "::error::Login with old password returned $OLD_STATUS, expected 401"
            exit 1
          fi
          # 4. New password must succeed; capture the JWT for downstream steps.
          NEW_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "null" ] || { echo "new login failed"; exit 1; }
          echo "TOKEN=$NEW_TOKEN" >> "$GITHUB_ENV"
          echo "password rotation OK (old=401, new=200)"

      - name: Load the GGUF (HF repo + variant, served from HF_HOME cache)
        id: load-api
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.rotate-api.outcome == 'success' }}
        run: |
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 600 \
            -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name, is_gguf, context_length}'

      - name: Multi-turn determinism via OpenAI + Anthropic SDKs
        id: chat-api
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.load-api.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:18888
        run: |
          python3 .github/scripts/studio_smoke/multi_turn_chat.py

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          ss -tln | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        # Always upload so green runs are still reviewable.
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openai-anthropic-log
          path: |
            logs/studio.log
            logs/install.log
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Tool calling Tests
  # ─────────────────────────────────────────────────────────────────────

      - name: Phase 2 environment (tool calling)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/Qwen3.5-2B-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_FILE=Qwen3.5-2B-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18889" >> "$GITHUB_ENV"
          echo "STUDIO_LOG=logs/studio_tools.log" >> "$GITHUB_ENV"
          # Phase 2 passes an absolute .gguf path to /api/inference/load and
          # never touches HF_HOME, but it must not inherit phase 1's either.
          echo "HF_HOME=${{ github.workspace }}/hf-cache-tools" >> "$GITHUB_ENV"

      - name: Restore GGUF model file
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        id: cache-gguf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: gguf-cache-tools
          key: gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v3
          enableCrossOsArchive: true

      - name: Download GGUF if cache miss
        id: download-gguf
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (steps.cache-gguf.outputs.cache-hit != 'true' || steps.cache-gguf.outcome != 'success') }}
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache-tools
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache-tools

      - name: Save GGUF model file
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf.outcome == 'success' && hashFiles('gguf-cache-tools/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gguf-cache-tools
          key: gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v3
          enableCrossOsArchive: true


      - name: Reset auth + boot Unsloth (API-only, default tool policy)
        id: boot-tools
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.download-gguf.outcome != 'failure' }}
        # We deliberately use the API-only mode rather than
        # `unsloth studio run` because the latter calls
        # `set_tool_policy(...)` with a resolved bool: on loopback the
        # default resolves to True, which forces every request through
        # the server-side agentic loop and breaks the standard
        # function-calling test below. API-only mode leaves
        # tool_policy=None so each request's `enable_tools` field is
        # honoured.
        run: |
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT" --log "$STUDIO_LOG"

      - name: Wait for /api/health, log in, change password, load model
        id: ready-tools
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.boot-tools.outcome == 'success' }}
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CITool-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          GGUF_PATH="$GITHUB_WORKSPACE/gguf-cache-tools/${GGUF_FILE}"
          ls -lh "$GGUF_PATH"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 600 \
            -d "{\"model_path\":\"$GGUF_PATH\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name}'

      - name: Tool calling, server-side tools, thinking on/off
        id: test-tools
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.ready-tools.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:18889
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407

          def post(path, body, *, timeout = 240):
              """Plain JSON POST. For requests that don't go through
              the server-side agentic loop, the response is one JSON
              object."""
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          def post_sse(path, body, *, timeout = 600, retries = 1, complete_on = None):
              """POST a streaming request and accumulate the assistant
              text deltas. The server-side agentic loop ALWAYS returns
              SSE regardless of the request's `stream` field, so any
              call with enable_tools=true must use this helper.

              Returns (content, raw_payloads):
                content       -- concatenated assistant delta.content
                raw_payloads  -- list of every raw "data: ..." event
                                 payload (JSON strings). Callers asserting
                                 that a server-side tool actually ran (and
                                 not just that the model emitted some
                                 text) should grep raw_payloads for tool
                                 invocation markers / tool output, since
                                 `delta.content` alone is not evidence
                                 that the tool path executed.

              A shared CI runner can stall the stream transport (the
              connection opening, or a mid-stream read) even when Unsloth
              is healthy, so retry a stall once with a fresh request
              capped at 300s. A stall means the stream did NOT complete,
              so partial events are normally NOT returned (an early
              tool_start with no tool_end is not proof the tool loop
              finished). The one exception is `complete_on`: an optional
              predicate over the events collected so far -- when a stall
              happens after it is already satisfied (the tool ran and
              produced its result before the trailing read timed out),
              those events are returned rather than discarded, so the
              stall-after-answer case still counts. HTTP status errors
              surface immediately; a stall that yields no completed result
              across all attempts re-raises so the caller can rotate to
              the next seed.
              """
              body = {**body, "stream": True}
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                  },
              )
              for attempt in range(retries + 1):
                  parts = []
                  events = []
                  t = timeout if attempt == 0 else min(timeout, 300)
                  try:
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          for raw in resp:
                              line = raw.decode().strip()
                              if not line.startswith("data: "):
                                  continue
                              payload = line[6:]
                              if payload == "[DONE]":
                                  break
                              events.append(payload)
                              try:
                                  chunk = json.loads(payload)
                              except json.JSONDecodeError:
                                  continue
                              for choice in chunk.get("choices", []):
                                  delta = choice.get("delta", {}) or {}
                                  if delta.get("content"):
                                      parts.append(delta["content"])
                      return "".join(parts), events
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      # A stall after the tool already produced its result is
                      # the case this probe exists to tolerate: keep those
                      # events. But a stall with only an early tool_start (no
                      # completed output) is not proof the tool loop finished,
                      # so it must not pass -- retry once, then raise so
                      # _run_tool_probe rotates to the next seed.
                      if complete_on is not None and complete_on(events):
                          print(f"[retry-sse] {path}: {exc!r}; keeping {len(events)} completed events", flush = True)
                          return "".join(parts), events
                      if attempt == retries:
                          raise
                      print(f"[retry-sse] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          _STUDIO_TOOL_TYPES = {
              "tool_start", "tool_end", "tool_use", "tool_result",
          }

          def _tool_invoked(events):
              """Structural check: True iff some SSE payload is a real
              tool envelope (Unsloth tool_start/tool_end, Anthropic
              tool_use/tool_result, OpenAI non-empty delta.tool_calls /
              message.tool_calls / finish_reason='tool_calls' /
              role:'tool' / function_call). tool_status is NOT
              evidence: Unsloth emits empty tool_status events on
              iteration boundaries even when no tool ran.
              """
              for raw in events:
                  try:
                      ev = json.loads(raw)
                  except (json.JSONDecodeError, TypeError):
                      continue
                  if not isinstance(ev, dict):
                      continue
                  if ev.get("type") in _STUDIO_TOOL_TYPES:
                      return True
                  for choice in ev.get("choices", []) or []:
                      if not isinstance(choice, dict):
                          continue
                      if choice.get("finish_reason") == "tool_calls":
                          return True
                      for src_key in ("delta", "message"):
                          src = choice.get(src_key) or {}
                          if not isinstance(src, dict):
                              continue
                          tc = src.get("tool_calls")
                          if isinstance(tc, list) and tc:
                              return True
                          if src.get("function_call"):
                              return True
                          if src.get("role") == "tool":
                              return True
                  for item in ev.get("output", []) or []:
                      if isinstance(item, dict) and item.get("type") in {
                          "tool_call", "function_call", "tool_use",
                      }:
                          return True
                  content = ev.get("content")
                  if isinstance(content, list):
                      for blk in content:
                          if isinstance(blk, dict) and blk.get("type") in {
                              "tool_use", "tool_result",
                          }:
                              return True
              return False

          def _tool_output_contains(events, *needles):
              """True iff any tool_end.result / tool_result.content /
              tool-role message content contains a needle. Inspects
              the tool's own output, not the model's narration."""
              for raw in events:
                  try:
                      ev = json.loads(raw)
                  except (json.JSONDecodeError, TypeError):
                      continue
                  if not isinstance(ev, dict):
                      continue
                  if ev.get("type") == "tool_end":
                      result = ev.get("result")
                      if isinstance(result, str) and any(n in result for n in needles if n):
                          return True
                  if ev.get("type") == "tool_result":
                      content = ev.get("content")
                      if isinstance(content, str) and any(n in content for n in needles if n):
                          return True
                      if isinstance(content, list):
                          for blk in content:
                              if isinstance(blk, dict):
                                  text = blk.get("text") or blk.get("content")
                                  if isinstance(text, str) and any(n in text for n in needles if n):
                                      return True
                  for choice in ev.get("choices", []) or []:
                      delta = (choice or {}).get("delta") or {}
                      msg = (choice or {}).get("message") or {}
                      for src in (delta, msg):
                          if src.get("role") == "tool":
                              content = src.get("content") or ""
                              if isinstance(content, str) and any(n in content for n in needles if n):
                                  return True
              return False

          # ── 1. Standard OpenAI function calling ──────────────────────
          weather_tool = {
              "type": "function",
              "function": {
                  "name": "get_weather",
                  "description": "Get current weather for a city.",
                  "parameters": {
                      "type": "object",
                      "properties": {"city": {"type": "string"}},
                      "required": ["city"],
                  },
              },
          }

          status, data = post("/v1/chat/completions", {
              "messages":    [{"role": "user", "content": "What is the weather in Paris?"}],
              "tools":       [weather_tool],
              "tool_choice": "required",
              "stream":      False,
              "temperature": 0.0,
              "seed":        SEED,
              "max_tokens":  120,
          })
          assert status == 200, f"tool call status {status}: {data}"
          choice = data["choices"][0]
          assert choice["finish_reason"] == "tool_calls", f"finish_reason={choice['finish_reason']!r}"
          tc = choice["message"]["tool_calls"][0]
          assert tc["function"]["name"] == "get_weather"
          args = json.loads(tc["function"]["arguments"])
          assert args.get("city"), f"missing city arg: {args}"
          print(f"[tools] PASS function calling -> {tc['function']['name']}({args})")

          # T=0 = deterministic argmax in llama.cpp; T>0 lets seed
          # rotation explore distinct trajectories on retry.
          TOOL_PROBE_TEMP = 0.4

          def _run_tool_probe(*, label, prompt, enabled, session, needles,
                              max_attempts = 4):
              """Drive a server-side tool with retries. Hard FAIL if no
              attempt has structural invocation evidence. WARN (not
              FAIL) if invoked but no attempt produces the expected
              literal in tool_end.result -- small-quant Qwen3.5-2B can
              emit OpenAI tool_calls deltas without Unsloth's GGUF
              agentic loop intercepting them, and that GGUF-vs-OpenAI
              format mismatch is out of scope for #5642.
              """
              attempts_log = []
              best = None
              # Cap the wall-clock spent rotating through stalled seeds so a
              # persistent no-data wedge fails fast (clean assertion) instead
              # of being killed by the job's timeout-minutes. A healthy or
              # merely degenerate round answers in seconds, so all seeds still
              # run in the normal case; only stalls consume the budget.
              probe_deadline = time.monotonic() + 300
              for attempt_i in range(max_attempts):
                  # Cap each read by the budget still remaining (not just a flat
                  # 180s) and skip an attempt too small to finish, so the whole
                  # rotation stays within ~300s -- two probes then fit the job's
                  # timeout-minutes even if every seed stalls.
                  remaining = int(probe_deadline - time.monotonic())
                  if attempt_i and remaining < 30:
                      print(f"[tools] {label}: seed-rotation budget spent after {attempt_i} attempts", flush = True)
                      break
                  attempt_seed = SEED + attempt_i
                  try:
                      # Bounded per-attempt timeout, no inner retry -- the seed
                      # loop IS the retry, so a stall raises quickly and rotates
                      # rather than spending post_sse's full 600+300s. complete_on
                      # keeps a stall that already produced the tool result (only
                      # the trailing read timed out) instead of discarding it.
                      content, events = post_sse("/v1/chat/completions", {
                          "messages":      [{"role": "user", "content": prompt}],
                          "enable_tools":  True,
                          "permission_mode": "full",
                          "enabled_tools": enabled,
                          "session_id":    f"{session}-att{attempt_i}",
                          "temperature":   TOOL_PROBE_TEMP,
                          "seed":          attempt_seed,
                          "max_tokens":    600,
                      }, timeout = min(180, remaining), retries = 0,
                         complete_on = lambda ev: _tool_invoked(ev) and _tool_output_contains(ev, *needles))
                  except urllib.error.HTTPError:
                      # HTTPError subclasses URLError, so re-raise a real 4xx/5xx
                      # here instead of letting the transport-stall handler below
                      # swallow it and rotate seeds -- an endpoint status failure
                      # must surface, not be masked as missing tool evidence.
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      # A transport stall that outlived post_sse's own retry:
                      # log it as a failed attempt and rotate to the next seed
                      # rather than sinking the whole probe on one bad stream.
                      attempts_log.append({
                          "attempt": attempt_i, "seed": attempt_seed,
                          "transport_error": repr(exc),
                      })
                      print(f"[tools] retry {label} attempt {attempt_i}: transport {exc!r}", flush = True)
                      continue
                  invoked  = _tool_invoked(events)
                  produced = _tool_output_contains(events, *needles)
                  attempts_log.append({
                      "attempt": attempt_i, "seed": attempt_seed,
                      "n_events": len(events),
                      "tool_invoked": invoked, "tool_output_contains": produced,
                      "content_len": len(content),
                  })
                  if invoked and produced:
                      print(f"[tools] PASS {label} attempt {attempt_i}")
                      return content, events, attempts_log
                  if invoked and best is None:
                      best = (content, events)
                  print(f"[tools] retry {label} attempt {attempt_i}: invoked={invoked} output_ok={produced} events={len(events)}")
              if best is not None:
                  print(f"[tools] WARN {label}: invoked but no tool_end.result match (small-quant flake). Attempts: {attempts_log}")
                  content, events = best
                  return content, events, attempts_log
              raise AssertionError(
                  f"{label}: no structural tool-invocation evidence across "
                  f"{max_attempts} attempts. enable_tools may be silently "
                  f"ignored. Attempts: {attempts_log}"
              )

          # ── 2. Server-side python tool ───────────────────────────────
          content, events, _attempts = _run_tool_probe(
              label    = "python tool",
              prompt   = "What is 123 * 456? Use the python tool to compute it and tell me the number.",
              enabled  = ["python"],
              session  = "ci-tool-calling-py",
              needles  = ("56088", "56,088"),
          )
          if "56088" in content or "56,088" in content:
              print(f"[tools] python tool narration OK")
          else:
              print(f"[tools] python tool narration drifted -- content={content!r}")

          # ── 3. Server-side bash (terminal) tool ──────────────────────
          content, events, _attempts = _run_tool_probe(
              label    = "bash/terminal tool",
              prompt   = "Use the terminal tool to run `echo hello-bash-tool` and tell me the exact output.",
              enabled  = ["terminal"],
              session  = "ci-tool-calling-bash",
              needles  = ("hello-bash-tool",),
          )
          if "hello-bash-tool" in content:
              print(f"[tools] bash/terminal narration OK")
          else:
              print(f"[tools] bash/terminal narration dropped literal -- content={content!r}")

          # ── 4. Server-side web_search tool ───────────────────────────
          # DuckDuckGo is flaky from CI runners and small Qwen3.5-2B
          # may not actually search. Only assert that the SSE stream
          # opens and yields any data; HTTP / parser failures already
          # raise above. Tool-invocation strictness is relaxed here
          # because (a) the search may legitimately return no results,
          # and (b) DuckDuckGo upstream blocks GHA IP ranges often
          # enough that requiring a tool_call marker would create
          # red-herring failures from infra rather than from Unsloth.
          try:
              # Best-effort and bounded: a single 180s attempt keeps a stall
              # from eating the job's timeout-minutes (it already WARNs, so a
              # retry buys nothing).
              content, events = post_sse("/v1/chat/completions", {
                  "messages":      [{"role": "user", "content": "Search the web for 'unsloth ai github' and summarise."}],
                  "enable_tools":  True,
                  "permission_mode": "full",
                  "enabled_tools": ["web_search"],
                  "session_id":    "ci-tool-calling-web",
                  "temperature":   0.0,
                  "seed":          SEED,
                  "max_tokens":    400,
              }, timeout = 180, retries = 0)
              print(
                  f"[tools] PASS web_search stream ({len(content)} chars in content, "
                  f"{len(events)} raw events)"
              )
          except Exception as exc:
              print(f"[tools] WARN web_search probe failed (non-blocking): {exc}")

          # ── 5. Thinking on / off ─────────────────────────────────────
          # Unsloth strips think blocks from message.content for tools-mode
          # responses, so we toggle plain chat (no enable_tools) and look
          # at the surfaced reasoning_content / message.thinking field.
          def thinking_call(enable):
              status, data = post("/v1/chat/completions", {
                  "messages":        [{"role": "user", "content": "Briefly: is 17 prime?"}],
                  "stream":          False,
                  "enable_thinking": enable,
                  "temperature":     0.0,
                  "seed":            SEED,
                  "max_tokens":      300,
              })
              assert status == 200
              msg = data["choices"][0]["message"]
              # Unsloth surfaces thinking via reasoning_content (OpenAI
              # extension). Fall back to inline <think> markers for
              # robustness across template versions.
              raw = (msg.get("content") or "") + (msg.get("reasoning_content") or "")
              return raw

          on_text  = thinking_call(True)
          off_text = thinking_call(False)
          had_think_on  = ("<think>" in on_text)  or len(on_text)  > 80
          had_think_off = ("<think>" in off_text) and len(off_text) > 0
          assert had_think_on, (
              f"enable_thinking=True produced no thinking signal: {on_text!r}"
          )
          # Off-mode should not contain the literal <think> marker.
          assert "<think>" not in off_text, (
              f"enable_thinking=False but <think> still present: {off_text!r}"
          )
          print(f"[tools] PASS thinking on/off (on={len(on_text)} chars, off={len(off_text)} chars)")
          PY

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          ss -tln | grep ":${STUDIO_PORT}" || true
          # Capture backend + llama-server logs so a 500 has a server-side traceback.
          mkdir -p logs/server-logs
          cp -r ~/.unsloth/studio/logs/. logs/server-logs/ 2>/dev/null || true

      - name: Upload logs
        # Always upload so green runs are still reviewable.
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tool-calling-log
          path: |
            logs/studio_tools.log
            logs/install.log
            logs/server-logs/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: JSON, images
  # ─────────────────────────────────────────────────────────────────────

      - name: Phase 3 environment (JSON, images)
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/Qwen3-VL-2B-Instruct-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=Qwen3-VL-2B-Instruct-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "MMPROJ_FILE=mmproj-F16.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18890" >> "$GITHUB_ENV"
          echo "STUDIO_LOG=logs/studio_vision.log" >> "$GITHUB_ENV"
          # Its own directory, not phase 1's `hf-cache`. Phase 1's entry is
          # byte-shared with the macOS and Windows gemma phases under a key with
          # no `runner.os`, and actions/cache identifies an entry by key AND a
          # hash of `path`, so phase 1 keeps `hf-cache` untouched and the vision
          # phase (whose key is already Linux-scoped) is the one that moves.
          echo "HF_HOME=${{ github.workspace }}/hf-cache-vision" >> "$GITHUB_ENV"

      - name: Restore HF_HOME for ${{ env.GGUF_REPO }} (model + mmproj)
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' }}
        id: cache-hf-vision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache-vision
          key: ${{ runner.os }}-hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-${{ env.MMPROJ_FILE }}-v3

      - name: Prime HF_HOME with the GGUF + mmproj
        id: prime-hf-vision
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && (steps.cache-hf-vision.outputs.cache-hit != 'true' || steps.cache-hf-vision.outcome != 'success') }}
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache-vision
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$MMPROJ_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }} (model + mmproj)
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf-vision.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache-vision
          key: ${{ runner.os }}-hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-${{ env.MMPROJ_FILE }}-v3

      - name: Reset auth + boot Unsloth (API-only)
        id: boot-vision
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.prime-hf-vision.outcome != 'failure' }}
        # See phase 2's comment: API-only mode keeps tool_policy=None so
        # response_format requests aren't routed through the agentic
        # tool loop.
        run: |
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT" --log "$STUDIO_LOG"

      - name: Wait for /api/health, log in, change password, load model
        id: ready-vision
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.prime-hf-vision.outcome != 'failure' }}
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIJson-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          # Retry: llama-server startup can race process teardown after a
          # failed attempt. Keep curl out of a pipe so HTTP failures are not
          # masked by jq.
          LOAD_OK=0
          for attempt in 1 2 3; do
            HTTP=$(curl -s -o /tmp/load.json -w '%{http_code}' \
              -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              --max-time 900 \
              -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048}")
            if [ "$HTTP" = "200" ]; then LOAD_OK=1; break; fi
            echo "::warning::/api/inference/load attempt $attempt returned $HTTP; response:"
            cat /tmp/load.json || true
            sleep 10
          done
          [ "$LOAD_OK" = "1" ] || { echo "::error::/api/inference/load failed 3 attempts"; exit 22; }
          jq '{status, display_name, is_vision}' /tmp/load.json

      - name: JSON schema decoding + image input
        id: test-vision
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.sdks.outcome == 'success' && steps.ready-vision.outcome == 'success' }}
        env:
          BASE_URL: http://127.0.0.1:18890
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from openai import OpenAI
          from anthropic import Anthropic

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407

          def post(path, body, *, timeout = 240):
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = json.dumps(body).encode(),
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type":  "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          # ── 1. response_format = json_object (JSON mode) ─────────────
          # llama.cpp's HTTP server supports OpenAI-compatible JSON
          # mode: `response_format: {"type": "json_object"}` constrains
          # the model to emit syntactically-valid JSON. We use raw HTTP
          # rather than the OpenAI SDK so that the field shape Unsloth
          # forwards to llama-server is unambiguous (the SDK rewrites
          # response_format depending on which variant it recognises).
          # We deliberately do NOT pass a strict JSON schema -- on
          # small Gemma-4 quants the GBNF-from-schema path occasionally
          # produces empty output, and JSON mode is the surface we care
          # about exposing through Unsloth.
          status, data = post("/v1/chat/completions", {
              "model":         "default",
              "messages":      [
                  {"role": "system", "content": 'Reply with a single JSON object of the form {"city": "...", "country": "..."}. Output ONLY the JSON, nothing else.'},
                  {"role": "user",   "content": "What is the capital of France?"},
              ],
              "temperature":     0.0,
              "max_tokens":      200,
              "seed":            SEED,
              "stream":          False,
              "enable_thinking": False,
              "response_format": {"type": "json_object"},
          }, timeout = 600)
          assert status == 200, f"json status {status}: {data}"
          content = (data["choices"][0]["message"].get("content") or "").strip()
          # Some chat templates wrap JSON in ```json fences even in JSON
          # mode -- strip those before parsing.
          if content.startswith("```"):
              content = content.split("```", 2)[1]
              if content.startswith("json"):
                  content = content[4:]
              content = content.strip("`\n ")
          parsed = json.loads(content)
          assert "paris" in str(parsed.get("city", "")).lower(), (
              f"city != Paris: {parsed}"
          )
          print(f"[json] PASS json_object -> {parsed}")

          # ── 2. OpenAI image_url (data URI base64) ───────────────────
          # 64x64 solid-red PNG. stb_image (used by Unsloth's image
          # normaliser at routes/inference.py:3410) rejects 4x4 or
          # smaller PNGs as truncated, so we go up to 64x64 -- still
          # tiny in token cost. The assertion is loose: any non-empty
          # response from the vision path proves multimodal end-to-end
          # wiring; small VL quants are weak at colour identification.
          PNG_64X64_RED_B64 = (
              "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYklEQVR4nO3PMQ0AIADAMEAI/k"
              "UhBhEcDcmqYJtn7/GzpQNeNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA"
              "1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaBdCJ0BmMJ25zMAAAAASUVORK5CYII="
          )
          data_uri = f"data:image/png;base64,{PNG_64X64_RED_B64}"

          client = OpenAI(base_url = f"{BASE}/v1", api_key = KEY)
          openai_resp = client.chat.completions.create(
              model       = "default",
              temperature = 0.0,
              max_tokens  = 80,
              seed        = SEED,
              messages    = [{
                  "role": "user",
                  "content": [
                      {"type": "image_url", "image_url": {"url": data_uri}},
                      {"type": "text",      "text": "What colour dominates this image? Reply in one word."},
                  ],
              }],
          )
          openai_text = (openai_resp.choices[0].message.content or "").lower()
          print(f"[image/openai] reply: {openai_text!r}")
          assert openai_text, "OpenAI image_url returned empty content"
          # We do not strictly require 'red' -- some quants of small VL
          # models are weak at colour names. Just require a non-empty
          # answer; the vision path is the part under test.
          print("[image/openai] PASS image_url accepted, non-empty response")

          # ── 3. Anthropic source/base64 image ────────────────────────
          # Two SDK quirks vs. Unsloth: base_url must NOT include /v1
          # (the SDK appends it itself; otherwise /v1/v1/messages -> 405),
          # and Unsloth's auth is HTTPBearer-only so the SDK's default
          # x-api-key header is ignored -- send Authorization: Bearer
          # via default_headers.
          anthropic = Anthropic(
              base_url        = BASE,
              api_key         = "unused",
              default_headers = {"Authorization": f"Bearer {KEY}"},
          )
          a_msg = anthropic.messages.create(
              model       = "default",
              max_tokens  = 80,
              temperature = 0.0,
              extra_body  = {"seed": SEED},
              messages    = [{
                  "role": "user",
                  "content": [
                      {
                          "type":   "image",
                          "source": {
                              "type":       "base64",
                              "media_type": "image/png",
                              "data":       PNG_64X64_RED_B64,
                          },
                      },
                      {"type": "text", "text": "Describe this image briefly."},
                  ],
              }],
          )
          a_text = "".join(b.text for b in a_msg.content if getattr(b, "type", None) == "text")
          print(f"[image/anthropic] reply: {a_text!r}")
          assert a_text, "Anthropic source/base64 returned empty content"
          print("[image/anthropic] PASS source/base64 accepted, non-empty response")
          PY

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          ss -tln | grep ":${STUDIO_PORT}" || true

      - name: Upload logs
        # Always upload so green runs are still reviewable.
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: json-images-log
          path: |
            logs/studio_vision.log
            logs/install.log
          retention-days: 7
