# Runs studio/backend/tests/ on every PR touching the backend or the unsloth library.
# Excluded: tests/test_studio_api.py (end-to-end against a live model + GGUF download) and
# llama_cpp_load_progress_live (spawns a real llama.cpp process), neither fit for a
# CPU-only free runner.
#
# runs-on: ubuntu-24.04, not ubuntu-latest, for the QUEUE: the org's backlog is almost all
# ubuntu-latest, and identical no-op jobs measured past 40 min there against under 2 min on
# every other label (#10914). Cost: the image no longer tracks the fleet default.

name: Backend CI

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'unsloth/**'
      - 'unsloth_cli/**'
      - 'tests/**'
      # The validate_studio_features.py step below guards docker/jupyter and the
      # docker notebook helpers, so a docker-only change must trigger this CI.
      - 'docker/**'
      # tests/sh/*.sh and tests/studio/install/* assert against these two files. Without
      # them an install-only edit (the shape most AMD/ROCm routing fixes take) skipped
      # Backend CI entirely.
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/**'
      - 'pyproject.toml'
      # tests/studio reads .github/actions/*/action.yml and asserts properties of those
      # composite actions. Without this entry an action-only change ran Core, which does
      # not execute tests/studio, and skipped this workflow, which does.
      - '.github/actions/**'
      - '.github/workflows/studio-backend-ci.yml'
      # tests/python/test_amd_extras_contract.py asserts against this file.
      - '.github/workflows/security-audit.yml'
  push:
    branches: [main]

concurrency:
  # Unique per commit on main, so a merge burst cannot cancel a pending run
  # before it starts. See the note below for what this is buying.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main this buys less than it looks like: GitHub cancels any PENDING run in the group
  # as soon as a newer one is queued, and cancel-in-progress governs only EXECUTING runs
  # (workflow-syntax docs), so a merge burst leaves only the tip's run alive. Detection
  # survives on the cumulative tree; per-commit attribution does not.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The oldest interpreter this code is expected to run on. Nothing EXECUTES it: the old
  # 3.10/3.11/3.12 legs differed from 3.13 by one skip marker, and what they defended is
  # static, so scripts/lint_backend_python_floor.py checks it instead. Raising this is a
  # support decision, not a CI one.
  # 3.10 rather than the 3.9 pyproject.toml declares, because 3.9 is not true today:
  # unsloth/models/_utils.py uses dataclasses.dataclass(kw_only) and
  # tempfile.TemporaryDirectory(ignore_cleanup_errors), both 3.10.
  PYTHON_FLOOR: '3.10'


jobs:
  pytest:
    name: (Python ${{ matrix.python }}, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # A hang guard, NOT a performance budget: a cap that lands inside the real spread makes
    # every PR carry a red check that says nothing about the PR. It reports "cancelled" and
    # names nothing, so the per-test --timeout below is what names a hang and this is only
    # the backstop for a wedge that timer cannot see (collection, a worker that never comes
    # up). Leave it through the shard split: a shard does less work, so 45 only gets looser,
    # and retuning on a prediction is the failure this number was raised to fix.
    timeout-minutes: 45
    strategy:
      # fail-fast off: cancelling the other shards on the first failure would hide which
      # of them were also red.
      fail-fast: false
      matrix:
        # 3.13 only: the four old legs collected the same tests and differed by ONE skip
        # marker, and what they defended (nothing reaches for a symbol newer than the floor)
        # is static and now checked by scripts/lint_backend_python_floor.py. A static check
        # runs nothing, though, and a sys.version_info branch is only parsed, never taken --
        # hence the second entry: 3.11, the newest version still on the pre-3.12 side of the
        # three backend files that straddle it, running those files and nothing else.
        #
        # The 3.13 leg is three shards of ONE selection, balanced on measured time, not file
        # count. All three root at `tests/` and differ only in what they ignore, because
        # `--ignore=FILE` does NOT filter a file passed as an explicit argument, so a shard
        # rooted at an expanded glob would drag the twelve serial files back in past the
        # shared --ignore list below. Shard 3 is "tests/ minus the other two ranges", never
        # an allowlist, so a new file lands in exactly one shard with no workflow edit.
        # test_ci_backend_pytest_shards.py fails if that stops holding, and
        # test_backend_ci_parallel_isolation.py fails if a shard collects one of the twelve.
        # Two name shapes the split cannot absorb are forbidden by name in that guard: a
        # subdirectory called test_*, and a file matching BOTH discovery patterns
        # (test_api_test.py). Each lands in no shard, because fnmatch's * crosses / and the
        # suffix rule cannot say "unless it starts with test_" in one pattern. Diverging per
        # prefix character was tried and reverted: it over-consumes te_test.py into BOTH
        # ranged shards.
        include:
          - python: '3.13'
            scope: full
            shard: a-k
            selection: >-
              tests/
              --ignore-glob=tests/*/*
              --ignore-glob=tests/*_test.py
              --ignore-glob=tests/test_[!a-k]*.py
          - python: '3.13'
            scope: full
            shard: l-r
            selection: >-
              tests/
              --ignore-glob=tests/*/*
              --ignore-glob=tests/*_test.py
              --ignore-glob=tests/test_[!l-r]*.py
          - python: '3.13'
            scope: full
            shard: rest
            selection: >-
              tests/
              --ignore-glob=tests/test_[a-r]*.py
          - python: '3.11'
            scope: floor-spot-check
            shard: floor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '${{ matrix.python }}'

      - name: Restore the pip cache
        id: pip-cache
        uses: ./.github/actions/pip-cache-restore
        with:
          name: studio-backend
          key-files: |
            pyproject.toml
            studio/backend/requirements/*.txt

      - name: Install backend test dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          # Unsloth's declared backend deps:
          pip install -r studio/backend/requirements/studio.txt
          # Extras that studio.txt does not list but the import chain needs
          # (python-multipart for FastAPI form/file uploads, sqlalchemy/cryptography
          #  for the auth DB, yaml/jinja2 for utils.models.model_config, psutil for
          #  the orphan-cleanup process scan, etc.):
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx \
            soundfile librosa
          # pytest-timeout: see the --timeout flags below; without it a test that never
          # returns is indistinguishable from a slow suite.
          # soundfile + librosa: test_audio_dataset_decode importorskips both, so without
          # them the no-torchcodec decode path is silently untested here.
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchaudio<2.11'
          # Tracks pyproject.toml's cap rather than an independent number: the old `<5.5`
          # had drifted below it and excluded the very release the package shipped as
          # its ceiling, so this job tested 5.4.x while every user got 5.5.0.
          pip install 'transformers>=4.51,<=5.17.0'
          # peft: imported at module scope by core/inference/inference.py but listed only in
          # files this job does not install, so without it every importorskip of that module
          # SKIPS and stays green. A stub does not work: transformers probes
          # `importlib.util.find_spec("peft")`, which raises on a stub whose __spec__ is None.
          # AFTER the CPU torch line, never before: peft depends on torch, so pip resolves it
          # from PyPI and the CUDA wheel satisfies the range, leaving this CPU-only job
          # carrying the CUDA distribution. The version is read out of extras-no-deps.txt
          # rather than written here, because that file pins peft deliberately (0.19.0 breaks
          # Unsloth's export subprocess) and the two must not drift apart.
          pip install "$(grep -m1 -E '^peft==' studio/backend/requirements/extras-no-deps.txt)"
          # torchao: the pre-quant allowlist is built by importing the tensor constructors a
          # checkpoint names, and registration refuses unless one resolves, so without it
          # every pre-quant load returns None. CPU-only is fine: it declines its cpp
          # extensions under torch < 2.11 and the pure-Python constructors still import.
          pip install torchao

      - name: Backend tests
        if: matrix.scope == 'full'
        working-directory: studio/backend
        # The deselections are all environment-specific: they need a real GPU or a live
        # llama.cpp process, so they can never pass on a GPU-less runner whatever the code
        # does.
        #
        # -n 4 was checked to be order-independent here: serial and parallel produced the
        # same failure set name for name. Unit tests on CPU wheels with no model loaded, so
        # this is CPU-bound rather than memory-bound, unlike the inference smoke workflows.
        #
        # test_streaming_stripper is ignored here and run serially below, for the reason
        # repo-cpu-tests isolates load_freeze: it compares its own cost against a reference
        # timed in the same process, and a descheduled worker inflates one side of the
        # ratio. The other isolated files assert ABSOLUTE elapsed time at 50-100ms, which is
        # inside one scheduler quantum. Bounds of 0.5s and up stay in the parallel run, and
        # the isolation guard scans for the tight ones, so a new test below that threshold
        # fails the guard instead of flaking here.
        #
        # --timeout is a per-test cap, so a test that never returns fails with its own name
        # instead of taking the job down as "cancelled"; it is set at several times the
        # slowest legitimate test in this suite. It arms INSIDE each xdist worker, so a
        # stuck CONTROLLER escapes it -- when a worker wedges holding the pipe the session
        # waits forever and no per-test cap is consulted. Hence the outer `timeout`, which a
        # wedged worker cannot defeat: SIGINT first so pytest dumps where it was stuck,
        # SIGKILL 60s later. Expect a stuck FRAME, not always a test name.
        #
        # The --ignore flags and the -k filter stay HERE rather than in the matrix: they are
        # the selection every shard inherits, so one copy is what makes "the thirteen serial
        # files are ignored by every parallel shard" a property of the step rather than
        # three lists that have to agree. Shards differ only in `${{ matrix.selection }}`.
        run: |
          timeout --signal=INT --kill-after=60 1500 \
          python -m pytest ${{ matrix.selection }} -q --tb=short -n 4 --dist loadgroup --timeout=330 \
            --ignore=tests/test_studio_api.py \
            --ignore=tests/test_streaming_stripper.py \
            --ignore=tests/test_llama_cpp_wait_for_vram_settle.py \
            --ignore=tests/test_tool_xml_strip.py \
            --ignore=tests/test_diffusion_checkpoint_resume.py \
            --ignore=tests/test_tool_output_streaming.py \
            --ignore=tests/test_web_fetch_extraction.py \
            --ignore=tests/test_tool_call_parser_strict.py \
            --ignore=tests/test_tunnel_safe_long_post.py \
            --ignore=tests/test_scan_loras_off_event_loop.py \
            --ignore=tests/test_anthropic_messages.py \
            --ignore=tests/test_profile_stats.py \
            --ignore=tests/test_media_auto_switch.py \
            --ignore=tests/test_pr5624_regressions.py \
            -k 'not llama_cpp_load_progress_live and not TestGpuAutoSelection and not TestPreSpawnGpuResolution and not TestPerGpuFitGuardAllCounts and not TestTransformersIntrospection and not test_returns_cuda_when_cuda_available and not test_calls_cuda_cache_when_cuda'

      - name: Backend tests that cannot share a worker
        # One shard, one process, the same twelve files, carried ONCE: none of them can go
        # back into the parallel run. a-k because it is the shortest shard.
        if: matrix.scope == 'full' && matrix.shard == 'a-k'
        working-directory: studio/backend
        # Relative timing against a reference measured in the same process. Serial, so the
        # comparison is between two implementations rather than between two schedulings.
        run: |
          python -m pytest -q --tb=short --timeout=330 \
            tests/test_streaming_stripper.py \
            tests/test_llama_cpp_wait_for_vram_settle.py \
            tests/test_tool_xml_strip.py \
            tests/test_diffusion_checkpoint_resume.py \
            tests/test_tool_output_streaming.py \
            tests/test_web_fetch_extraction.py \
            tests/test_tool_call_parser_strict.py \
            tests/test_tunnel_safe_long_post.py \
            tests/test_scan_loras_off_event_loop.py \
            tests/test_anthropic_messages.py \
            tests/test_profile_stats.py \
            tests/test_media_auto_switch.py \
            tests/test_pr5624_regressions.py

      - name: Pre-3.12 branches, on the newest interpreter that takes them
        if: matrix.scope == 'floor-spot-check'
        working-directory: studio/backend
        # Not a second copy of the suite: only the pre-3.12 side of the backend files that
        # carry a sys.version_info branch, which a 3.13-only matrix stops executing. 3.11 is
        # the newest version still on that side, so what it catches is about the boundary
        # rather than about being old. It runs beside the full leg, not in front of it.
        run: |
          python -m pytest -q --tb=short --timeout=330 \
            tests/test_third_party_source.py \
            tests/test_recommended_folders_permission.py \
            tests/test_hf_cache_settings.py

      - name: Save the pip cache
        if: always()
        uses: ./.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

  repo-cpu-tests:
    # Auto-discovers everything under tests/ that is not GPU-bound, so a new test in a
    # covered directory needs no workflow edit. tests/conftest.py pre-loads
    # unsloth_zoo.device_type and unsloth.device_type under a mocked
    # torch.cuda.is_available so the unsloth import chain succeeds on CPU.
    name: Repo tests (CPU, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Same reason and same number as the matrix above: the old 30 sat INSIDE this job's
    # measured spread, so which run lost was a property of the runner, not of the PR. A
    # cancelled job is worse than a slow one twice over -- the cap fires mid-step and blames
    # whichever step was unlucky, and every step after it never runs, so the PR loses that
    # coverage silently. Leave it at 45 through the split below rather than retuning on a
    # prediction.
    timeout-minutes: 45
    strategy:
      # Three shards of one selection, balanced on measured time, not on file count. Shard 3
      # is "tests/ minus the other two roots", never an allowlist, so a new file lands in
      # exactly one shard without a workflow edit, including one in a brand-new top-level
      # directory. tests/test_ci_repo_cpu_shards.py fails if that stops being true.
      # fail-fast off: cancelling the other shards on a failure would hide which were red.
      fail-fast: false
      matrix:
        include:
          - shard: studio
            selection: >-
              tests/studio
              --ignore=tests/studio/load_freeze
              --ignore=tests/studio/test_hardware_dispatch_matrix.py
              --ignore=tests/studio/test_is_mlx_dispatch_gate.py
              --ignore=tests/studio/test_xpu_spoof_pipeline.py
              --ignore=tests/studio/test_mlx_context_platform_matrix.py
          - shard: python
            selection: >-
              tests/python
              tests/kaggle
          - shard: rest
            selection: >-
              tests/
              --ignore=tests/studio
              --ignore=tests/python
              --ignore=tests/kaggle
              --ignore=tests/qlora
              --ignore=tests/saving
              --ignore=tests/utils
              --ignore=tests/sh
              --ignore=tests/vllm_compat
              --ignore=tests/version_compat
              --deselect tests/test_model_registry.py::test_model_registration
              --deselect tests/test_model_registry.py::test_all_model_registration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Restore the pip cache
        id: pip-cache
        uses: ./.github/actions/pip-cache-restore
        with:
          name: repo-cpu-tests
          key-files: |
            pyproject.toml
            studio/backend/requirements/*.txt

      # node compiles the TS harness test_chat_preset_builtin_invariants.py needs, and
      # tests/python/* spawn fresh `uv venv`s for the no-torch install path. Both suites
      # self-skip when the tool is missing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install uv (for tests/python/* sandboxed venvs)
        run: pip install uv

      - name: Install deps (shared shape with backend pytest job)
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/backend/requirements/studio.txt
          pip install \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests typer \
            'numpy<3' pytest pytest-asyncio pytest-xdist pytest-timeout httpx
          # pytest-timeout: the --timeout flag on the pytest step below. Same reason as the
          # backend pytest job -- without it a test that never returns is reported as the
          # job being "cancelled", naming nothing.
          # torchvision: unsloth_zoo.vision_utils imports it at module scope.
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchvision<0.26' 'torchaudio<2.11'
          # Tracks pyproject.toml's cap rather than an independent number: the old `<5.5`
          # had drifted below it and excluded the very release the package shipped as
          # its ceiling, so this job tested 5.4.x while every user got 5.5.0.
          pip install 'transformers>=4.51,<=5.17.0'
          # bitsandbytes: hard import in unsloth/models/_utils.py. Recent
          # versions ship a CPU build that imports cleanly on Linux.
          pip install 'bitsandbytes>=0.45'
          # The conftest preload needs unsloth_zoo (unsloth.device_type imports
          # unsloth_zoo.utils.Version at module scope). From git main so this job sees the
          # same zoo HEAD as Core / MLX / install.sh, or a fix on zoo main hides until
          # release. No --no-deps, so triton still comes in for the CPU collection imports.
          for attempt in 1 2 3; do
            if pip install "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo"; then
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "::error::unsloth_zoo install failed after 3 attempts"; exit 1; }
            sleep $((5 * attempt))
          done
          pip install -e . --no-deps

      # tests/test_formatter_fixed_point.py skips unless the installed ruff is the one the
      # repo is formatted with, so without this the guard is permanently skipped here. The
      # version is read out of .pre-commit-config.yaml, because a second pin would go stale
      # and silently disable the guard.
      - name: Install the pinned ruff (formatter fixed-point guard)
        run: |
          pin="$(python -c 'import sys; sys.path.insert(0, "scripts"); import run_ruff_format as r; print(r.pinned_ruff_version(r.CONFIG.read_text(encoding = "utf-8")) or "")')"
          if [ -z "$pin" ]; then
            echo "::error::.pre-commit-config.yaml no longer pins a ruff for ruff-format-with-kwargs"
            exit 1
          fi
          pip install "ruff==$pin"

      - name: Repo tests (CPU, auto-discovered)
        env:
          # tests/python/* import install_python_stack from studio/.
          PYTHONPATH: ${{ github.workspace }}/studio
          # Skip lazy compilation work the unsloth import chain wants to
          # do at import time on a real GPU.
          UNSLOTH_COMPILE_DISABLE: '1'
        # --ignore: GPU-bound directories (qlora/saving need real weights), tests/sh (the
        #   next step's shell suite), tests/utils (a helpers folder), and
        #   tests/vllm_compat + tests/version_compat, which are drift canaries with their
        #   own job in version-compat-ci.yml that installs the heavier dep set they need.
        #   The hardware-spoofing files run isolated in the next step because they mutate
        #   hardware.py module globals, and tests/studio/load_freeze in the one after
        #   because its assertions are wall-clock latency bounds.
        # -m: honour markers from tests/python/conftest.py (`server` = needs studio venv,
        #   `e2e` = needs network).
        # --deselect test_model_registration / test_all_model_registration: they hit
        #   huggingface_hub for live model existence checks.
        #
        # -n 4 was checked to be order-independent here. The three pytest steps below stay
        # serial deliberately: the hardware-spoof step exists because those files mutate
        # hardware.py module globals, and all three run in well under a minute, so there is
        # nothing to win and isolation to lose.
        #
        # --timeout and the outer `timeout` mirror the backend pytest job for the reasons
        # written out there; the numbers are this suite's own tail. The outer one must stay
        # far enough under the job cap that it fires first and says where it was stuck.
        run: |
          timeout --signal=INT --kill-after=60 2100 \
          python -m pytest ${{ matrix.selection }} -q --tb=short -n 4 --dist loadgroup --timeout=330 \
            -m 'not server and not e2e'

      - name: Hardware-spoof tests (state-sensitive, run in isolation)
        # The four spoof files live under tests/studio, so they belong to that shard.
        if: matrix.shard == 'studio'
        env:
          PYTHONPATH: ${{ github.workspace }}/studio
          UNSLOTH_COMPILE_DISABLE: '1'
        # The spoof fixtures mutate hardware.py module globals at runtime, leaking into any
        # other test that imports hardware, so they get their own pytest invocation.
        run: |
          python -m pytest -q --tb=short \
            tests/studio/test_hardware_dispatch_matrix.py \
            tests/studio/test_is_mlx_dispatch_gate.py \
            tests/studio/test_xpu_spoof_pipeline.py \
            tests/studio/test_mlx_context_platform_matrix.py

      - name: Event-loop latency tests (wall clock, run without CPU contention)
        # tests/studio/load_freeze, so the studio shard, and it still runs alone in its own
        # invocation: two shards on two runners do not contend with each other.
        if: matrix.shard == 'studio'
        env:
          PYTHONPATH: ${{ github.workspace }}/studio
          UNSLOTH_COMPILE_DISABLE: '1'
        # These drive a live uvicorn server and assert upper bounds on real elapsed time,
        # which a descheduled worker inflates, so they run alone. Assert the property rather
        # than a tight bound where you can: the /health burst tests now hold the blocking
        # call open on an event and require /health to answer while it is held, which is
        # what "the route leaves the event loop free" actually means and does not move with
        # load.
        run: python -m pytest tests/studio/load_freeze -q --tb=short

      - name: CLI tests (unsloth_cli)
        # Not under tests/, so no shard owns it by discovery; it rides the python shard,
        # which is the shortest of the three.
        if: matrix.shard == 'python'
        # Own step, not folded into the tests/ discovery above: pyproject's testpaths is
        # tests/, and this suite needs no PYTHONPATH or CUDA spoof (it self-bootstraps
        # sys.path and imports neither unsloth nor torch).
        run: python -m pytest unsloth_cli/tests -q --tb=short

      - name: Docker JupyterLab/notebook feature validation
        # Named validate_studio_features.py (not test_*.py) so pytest skips it;
        # run explicitly so notebook/Colab/branding regressions fail CI.
        if: matrix.shard == 'rest'
        run: python tests/validate_studio_features.py

      - name: Save the pip cache
        if: always()
        uses: ./.github/actions/pip-cache-save
        with:
          dir: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.key }}
          cache-hit: ${{ steps.pip-cache.outputs.cache-hit }}

  shell-installer-tests:
    # Its own job rather than the tail of the longest one: these hermetic bash suites share
    # nothing with the Python install they used to sit behind (they mock uv, wsl.exe and the
    # venv, and sed functions out of install.sh), yet they sat on that job's critical path
    # and got named when its cap fired (#10849, #10861) while later steps never ran.
    # No pip install at all here, so the job is checkout plus the loop.
    name: Shell installer tests
    runs-on: ubuntu-24.04
    # 165s measured, and a hung mock would otherwise sit here until the workflow's own limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Shell installer tests
        # Auto-discovered rather than allowlisted: the old hardcoded list had silently
        # fallen seven files behind tests/run_all.sh, so those suites never ran on a PR.
        # Skips are explicit and each carries a reason;
        # tests/studio/test_ci_shell_suite_coverage.py fails if this step stops discovering
        # the directory or the skip list grows without one.
        #
        # Skipped:
        #   test_install_rollback_lifecycle.sh: covered by cross-platform-parity-ci.yml.
        run: |
          set -e
          skip="test_install_rollback_lifecycle.sh"
          found=0
          for s in tests/sh/test_*.sh; do
              case " $skip " in
                  *" $(basename "$s") "*) echo "skipping $s (see workflow comment)"; continue ;;
              esac
              found=$((found + 1))
              echo "::group::$s"
              bash "$s"
              echo "::endgroup::"
          done
          [ "$found" -gt 0 ] || { echo "::error::no shell tests discovered under tests/sh"; exit 1; }
          echo "ran $found shell installer test files"
