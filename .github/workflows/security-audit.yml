# Supply-chain audit on dependency PRs, push to main, nightly and dispatch. Nothing is installed:
# pip-audit resolves via PyPI metadata and the scanners inspect archives without running hooks.

name: Security audit

on:
  # PRs run this only when they touch an input it reads; floating pins are covered by the
  # daily cron and every push to main.
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'studio/backend/requirements/**'
      - 'studio/frontend/package.json'
      - 'studio/frontend/package-lock.json'
      - 'studio/src-tauri/Cargo.lock'
      - 'studio/src-tauri/Cargo.toml'
      - 'scripts/scan_packages.py'
      - 'scripts/scan_packages_baseline.json'
      # Scripts and inputs the gating steps read on a pull request.
      - 'scripts/lockfile_supply_chain_audit.py'
      - 'studio/package-lock.json'
      - 'studio/backend/core/data_recipe/oxc-validator/package-lock.json'
      - 'studio/backend/core/data_recipe/oxc-validator/.npmrc'
      - 'scripts/scan_npm_packages.py'
      - 'scripts/scan_npm_packages_baseline.json'
      - 'scripts/check_new_install_scripts.py'
      # Not tests/security/**: those suites run in workflow-trigger-lint.yml
      # (tests/studio/test_short_job_absorption.py keeps them there).
      - '.github/workflows/security-audit.yml'
  push:
    branches: [main]
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:

concurrency:
  # Event in the group so a scheduled run and a push to main cannot coalesce and drop the
  # pending nightly.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Network retry knobs only; no integrity check is relaxed.
env:
  PIP_RETRIES: "10"
  PIP_DEFAULT_TIMEOUT: "60"
  # Disabling HTTP/2 multiplexing mitigates crates.io curl-56 connection resets.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "2000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"

jobs:
  # pip-audit + npm audit + cargo audit on one runner; each step is continue-on-error so
  # one finding does not suppress the others.
  advisory-audit:
    name: advisory audit (pip + npm + cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Per-job egress allowlist: PyPI, npm, crates.io advisories, GitHub releases (osv-scanner),
      # Semgrep registry and TruffleHog.
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            semgrep.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so TruffleHog can diff base..head.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # Save only on main: PR-scoped caches only serve that PR and evict main's shared copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: studio/src-tauri -> target

      - name: Install pip-audit + cargo-audit
        # cargo-audit >= 0.22 is needed for CVSS 4.0 advisories (0.21 fails to parse them).
        run: |
          retry() {  # retry <max-attempts> <command...> with exponential backoff
            local max="$1"; shift
            local n=1 delay=5
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "attempt ${n}/${max} failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
            done
          }
          retry 5 python -m pip install --upgrade pip 'pip-audit>=2.7'
          retry 5 cargo install --locked --version '^0.22' cargo-audit

      - name: Build filtered Python requirements set
        # Build audit-reqs/ from pyproject (core + huggingfacenotorch extras) and the backend
        # requirements with `git+` lines stripped (pip-audit -r would clone them).
        run: |
          mkdir -p audit-reqs
          python <<'PY' > audit-reqs/unsloth-deps.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          core = d["project"]["dependencies"]
          def extra(name):
              # A bare KeyError reads as a generic crash: that is how four scan jobs
              # stayed dead for three weeks. Name the extra, for every extra indexed here.
              try:
                  return d["project"]["optional-dependencies"][name]
              except KeyError:
                  raise SystemExit(
                      f"pyproject.toml has no [{name}] extra, so the hf-stack scan "
                      "set cannot be built. Add the extra, or update this workflow."
                  )
          extras = extra("huggingfacenotorch")
          # extras-no-deps.txt no longer pins torchcodec, so the audit set would lose it.
          audio = extra("audio-torch211")
          print("# Auto-generated from pyproject.toml by security-audit.yml.")
          print("# core deps + huggingfacenotorch extras + audio-torch211.")
          for spec in core + extras + audio:
              print(spec)
          PY
          for extra in audio-torch210 audio-torch290 audio-torch280; do
          python - "$extra" <<'PY' > "audit-reqs/$extra.txt"
          import sys, tomllib
          extra = sys.argv[1]
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          # The older lines _select_torchcodec_spec installs on torch 2.10, 2.9 and 2.8, all of
          # which the flavor and default-ROCm repairs still resolve. One file each: their
          # ranges are disjoint, so they cannot share a resolve with each other or with
          # audio-torch211's >=0.11.
          try:
              specs = d["project"]["optional-dependencies"][extra]
          except KeyError:
              raise SystemExit(
                  f"pyproject.toml has no [{extra}] extra, so its scan set cannot be "
                  "built. Add the extra, or update this workflow."
              )
          print("# Auto-generated from pyproject.toml by security-audit.yml.")
          print(f"# {extra}.")
          for spec in specs:
              print(spec)
          PY
          done
          for f in studio.txt extras.txt extras-no-deps.txt \
                   no-torch-runtime.txt overrides.txt triton-kernels.txt; do
            python <<PY > "audit-reqs/$f"
          src = "studio/backend/requirements/$f"
          with open(src) as fh:
              for line in fh:
                  stripped = line.strip()
                  before_comment = stripped.split("#", 1)[0]
                  if "git+" in before_comment:
                      print(f"# [security-audit] skipped git+ spec: {stripped}")
                      continue
                  print(line.rstrip("\n"))
          PY
          done

      - name: pip-audit (declared Python deps, no install)
        # `-r` resolves via PyPI metadata without running install hooks.
        # PIP_CONSTRAINT pins an older setuptools so legacy setup.py packages (openai-whisper) build.
        continue-on-error: true
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/audit-reqs/build-constraints.txt
        run: |
          set +e
          cat > audit-reqs/build-constraints.txt <<'CONSTRAINTS'
          setuptools<78
          wheel
          CONSTRAINTS
          : > logs-pip-audit.txt
          for f in unsloth-deps audio-torch210 audio-torch290 audio-torch280 studio extras \
                   extras-no-deps no-torch-runtime overrides triton-kernels; do
            if ! grep -qE '^[^#[:space:]]' "audit-reqs/$f.txt"; then
              echo "[security-audit] $f.txt has no PyPI specs after git+ filter, skipping" \
                | tee -a logs-pip-audit.txt
              continue
            fi
            echo "::group::pip-audit -r audit-reqs/$f.txt"
            {
              echo
              echo "=== $f ==="
              pip-audit -r "audit-reqs/$f.txt" --format=columns
              echo "=== end $f (rc=$?) ==="
            } 2>&1 | tee -a logs-pip-audit.txt
            echo "::endgroup::"
          done
          {
            echo "## pip-audit (Python)"
            echo
            echo '### Coverage'
            echo '- unsloth core + `huggingfacenotorch` + every `audio-torch2xx` extra (pyproject.toml)'
            echo '- studio/backend/requirements/{studio,extras,extras-no-deps,no-torch-runtime,overrides,triton-kernels}.txt'
            echo '- `git+` specs are stripped before audit (out of scope: we audit PyPI archives)'
            echo
            echo '### Findings'
            echo '```'
            cat logs-pip-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Structural lockfile scan (non-registry URLs, missing integrity, IOC strings); catches
      # attacks before an advisory exists.
      - name: Lockfile supply-chain audit (pre-install scan)
        run: |
          python3 scripts/lockfile_supply_chain_audit.py
          {
            echo "## Lockfile supply-chain audit"
            echo
            echo "Scanned: studio/frontend/package-lock.json + studio/backend/core/data_recipe/oxc-validator/package-lock.json + studio/package-lock.json + studio/src-tauri/Cargo.lock"
            echo
            echo "No structural anomalies or known IOC strings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: npm audit (Unsloth frontend)
        # No --omit=dev: a malicious dev dependency can still steal CI secrets.
        continue-on-error: true
        working-directory: studio/frontend
        run: |
          set +e
          npm audit --audit-level=high | tee ../../logs-npm-audit.txt
          npm audit --json > ../../logs-npm-audit.json || true
          {
            echo "## npm audit (Unsloth frontend)"
            echo
            echo '```'
            tail -200 ../../logs-npm-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: npm audit (oxc-validator runtime + Tauri CLI holder)
        continue-on-error: true
        run: |
          set +e
          for pair in oxc:studio/backend/core/data_recipe/oxc-validator tauri-cli:studio; do
            name="${pair%%:*}"; dir="${pair#*:}"
            (cd "$dir" && npm audit --audit-level=high) | tee "logs-npm-audit-$name.txt"
            (cd "$dir" && npm audit --json) > "logs-npm-audit-$name.json" || true
            {
              echo "## npm audit ($dir)"
              echo
              echo '```'
              tail -200 "logs-npm-audit-$name.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: cargo audit (Unsloth Tauri)
        continue-on-error: true
        working-directory: studio/src-tauri
        run: |
          set +e
          cargo audit | tee ../../logs-cargo-audit.txt
          {
            echo "## cargo audit (Unsloth Tauri)"
            echo
            echo '```'
            tail -200 ../../logs-cargo-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download + verify OSV-Scanner
        # Separate step so binary integrity is a hard gate; a download failure only skips the scan.
        # Bump OSV_SHA256 together with OSV_VERSION.
        run: |
          set -euo pipefail
          OSV_VERSION="v2.0.2"
          OSV_SHA256="3abcfd7126c453a00421487e721b296e0cb68085bd431d6cef60872774170fc8"
          if ! curl --proto '=https' --tlsv1.2 -fsSL \
            --retry 5 --retry-delay 3 --retry-connrefused --retry-all-errors \
            -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"; then
            echo "::warning::osv-scanner download failed after retries; skipping scan" >&2
            rm -f /tmp/osv-scanner
            exit 0   # transient availability: do not red-fail the job
          fi
          if ! echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -; then
            echo "::error::osv-scanner checksum mismatch; refusing to execute" >&2
            rm -f /tmp/osv-scanner
            exit 1   # integrity failure: hard-fail
          fi
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version

      - name: OSV-Scanner (PyPI + npm + cargo, cross-ecosystem advisories)
        # OSV often has advisories before the per-ecosystem DBs.
        continue-on-error: true
        run: |
          set +e
          if [ ! -x /tmp/osv-scanner ]; then
            echo "osv-scanner unavailable this run; skipping scan" | tee logs-osv-scanner.txt
          else
            /tmp/osv-scanner scan source \
              --lockfile=studio/frontend/package-lock.json \
              --lockfile=studio/backend/core/data_recipe/oxc-validator/package-lock.json \
              --lockfile=studio/package-lock.json \
              --lockfile=studio/src-tauri/Cargo.lock \
              --lockfile=requirements.txt:audit-reqs/unsloth-deps.txt \
              --lockfile=requirements.txt:audit-reqs/audio-torch210.txt \
              --lockfile=requirements.txt:audit-reqs/audio-torch290.txt \
              --lockfile=requirements.txt:audit-reqs/audio-torch280.txt \
              --lockfile=requirements.txt:audit-reqs/studio.txt \
              --lockfile=requirements.txt:audit-reqs/no-torch-runtime.txt \
              --lockfile=requirements.txt:audit-reqs/overrides.txt \
              --lockfile=requirements.txt:audit-reqs/extras.txt \
              --lockfile=requirements.txt:audit-reqs/extras-no-deps.txt \
              --format=table 2>&1 | tee logs-osv-scanner.txt
          fi
          {
            echo "## OSV-Scanner (cross-ecosystem)"
            echo
            echo '```'
            tail -200 logs-osv-scanner.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Semgrep catches first-party logic bugs that pattern scanning cannot.
      - name: Semgrep (supply-chain + python rule packs)
        continue-on-error: true
        run: |
          set +e
          python -m pip install --quiet 'semgrep>=1.95'
          semgrep --version
          semgrep scan \
            --config p/supply-chain \
            --config p/python \
            --config p/javascript \
            --config p/security-audit \
            --severity ERROR --severity WARNING \
            --metrics off \
            --timeout 120 \
            studio/backend unsloth scripts \
            2>&1 | tee logs-semgrep.txt
          {
            echo "## Semgrep (supply-chain + python + javascript rules)"
            echo
            echo '```'
            tail -200 logs-semgrep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Flag every requirement not pinned with `==`, `===` or `@` (warning only).
      - name: Lockfile pin verifier (Python requirements)
        continue-on-error: true
        run: |
          python <<'PY' | tee logs-pin-verifier.txt
          import re
          from pathlib import Path

          # Specs that look like `pkg==1.2.3` or `pkg @ git+...` or
          # bare comments / -r lines are pinned-or-not-applicable.
          PINNED = re.compile(r"^\s*[A-Za-z0-9_.\-]+\s*(?:===|==)\s*[^,;]+\s*$")
          GIT_OR_URL = re.compile(r"^\s*[A-Za-z0-9_.\-]+\s*@\s*(?:git\+|https?://)")

          unpinned = []
          for f in sorted(Path("studio/backend/requirements").glob("*.txt")):
              for i, raw in enumerate(f.read_text().splitlines(), 1):
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("-"):
                      continue
                  spec = line.split("#", 1)[0].strip().split(";", 1)[0].strip()
                  if not spec:
                      continue
                  if "git+" in spec or PINNED.match(spec) or GIT_OR_URL.match(spec):
                      continue
                  unpinned.append((str(f), i, line))

          print(f"::group::Lockfile pin status")
          if unpinned:
              print(f"WARN: {len(unpinned)} non-`==` specs across requirements/*.txt")
              print("(litellm 1.82.7 wave hit anyone on `>=`; tighten when feasible.)")
              for f, i, line in unpinned[:80]:
                  print(f"  {f}:{i}: {line}")
              if len(unpinned) > 80:
                  print(f"  ... and {len(unpinned) - 80} more")
          else:
              print("OK: every spec is exact-pinned.")
          print("::endgroup::")
          PY
          {
            echo "## Lockfile pin verifier"
            echo
            echo '```'
            cat logs-pin-verifier.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Trivy is deliberately not used: its action tags were hijacked in the litellm 1.82.7
      # compromise. OSV-Scanner and TruffleHog cover its CVE and secret detection.

      # TruffleHog: verified secrets only; full repo on push to main, base..head on PRs.
      - name: TruffleHog (secrets in diff)
        continue-on-error: true
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85  # v3.97.9
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          # The action already passes --no-update; repeating it is an error.
          extra_args: --only-verified

      - name: Generate CycloneDX SBOM
        continue-on-error: true
        run: |
          set +e
          python -m pip install --quiet 'cyclonedx-bom>=4.6'
          mkdir -p sbom
          # cyclonedx-py 4.x uses `--sv` and `-o`; the old long spellings are rejected.
          for f in audit-reqs/*.txt; do
            base=$(basename "$f" .txt)
            if grep -qE '^[^#[:space:]]' "$f"; then
              cyclonedx-py requirements "$f" \
                --sv 1.6 \
                --of JSON \
                -o "sbom/sbom-$base.json" 2>&1 | tail -5 || true
            fi
          done
          cyclonedx-py environment \
            --sv 1.6 \
            --of JSON \
            -o sbom/sbom-environment.json 2>&1 | tail -5 || true
          ls -la sbom/
          {
            echo "## CycloneDX SBOM"
            echo
            echo "Generated SBOM files:"
            ls sbom/ | sed 's/^/- sbom\//'
          } >> "$GITHUB_STEP_SUMMARY"

      # Mutable tags were the tj-actions attack vector. Catch every
      # non-SHA-pinned `uses:` across the workflows tree. Warn-only
      # initially so the existing baseline does not block PRs.
      - name: GitHub Actions pinning verifier
        continue-on-error: true
        run: |
          python <<'PY' | tee logs-actions-pinning.txt
          import re
          from pathlib import Path
          # SHA pin = 40 hex chars after @
          SHA_PIN = re.compile(r"@[0-9a-f]{40}\b")
          # First-party / GitHub-published actions get a softer pass
          # (still recommended to pin; not a security gate).
          FIRST_PARTY = re.compile(r"^\s*-\s*uses:\s*(actions|github)/[^@]+@")
          USES = re.compile(r"^\s*-\s*uses:\s*([^@\s]+)@(\S+)")
          unpinned_third = []
          unpinned_first = []
          for f in sorted(Path(".github/workflows").glob("*.yml")):
              for i, line in enumerate(f.read_text().splitlines(), 1):
                  m = USES.match(line)
                  if not m:
                      continue
                  name, ref = m.group(1), m.group(2)
                  if SHA_PIN.search(line):
                      continue
                  bucket = unpinned_first if FIRST_PARTY.match(line) else unpinned_third
                  bucket.append((str(f), i, name, ref))
          print("::group::Action pinning status")
          print(f"third-party actions on mutable refs: {len(unpinned_third)}")
          for f, i, n, r in unpinned_third:
              print(f"  HIGH  {f}:{i}: {n}@{r}")
          print()
          print(f"first-party (actions/* | github/*) on mutable refs: {len(unpinned_first)}")
          for f, i, n, r in unpinned_first[:30]:
              print(f"  WARN  {f}:{i}: {n}@{r}")
          if len(unpinned_first) > 30:
              print(f"  ... and {len(unpinned_first) - 30} more")
          print()
          print("Recommendation: pin third-party actions to a 40-char SHA.")
          print("Dependabot's github-actions ecosystem will auto-bump them.")
          print("::endgroup::")
          PY
          {
            echo "## GitHub Actions pinning verifier"
            echo
            echo '```'
            cat logs-actions-pinning.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Report requirements lacking hash pins (--require-hashes); conversion is a roadmap item.
      - name: Hash-pin verifier (Python requirements)
        continue-on-error: true
        run: |
          python <<'PY' | tee logs-hash-verifier.txt
          import re
          from pathlib import Path
          PINNED = re.compile(r"^\s*[A-Za-z0-9_.\-]+\s*==\s*[^,;]+\s*$")
          HASH_LINE = re.compile(r"--hash=sha256:[0-9a-f]{64}")
          total_pinned = 0
          with_hash = 0
          for f in sorted(Path("studio/backend/requirements").glob("*.txt")):
              text = f.read_text()
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or line.startswith("-"):
                      continue
                  spec = line.split("#", 1)[0].strip().split(";", 1)[0]
                  if PINNED.match(spec):
                      total_pinned += 1
                      if HASH_LINE.search(raw):
                          with_hash += 1
          print(f"::group::Hash-pin status")
          print(f"  exact == pins:       {total_pinned}")
          print(f"  with --hash=sha256:  {with_hash}")
          print(f"  without --hash:      {total_pinned - with_hash}")
          print()
          print("Roadmap: convert to hash-locked installs via")
          print("`uv pip compile --generate-hashes` and `pip install --require-hashes`.")
          print("Hash-locked installs would have refused a republished")
          print("malicious litellm 1.82.7 wheel even at the same version.")
          print("::endgroup::")
          PY
          {
            echo "## Hash-pin verifier"
            echo
            echo '```'
            cat logs-hash-verifier.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: advisory-audit-logs
          path: |
            logs-pip-audit.txt
            logs-npm-audit.txt
            logs-npm-audit.json
            logs-npm-audit-*.txt
            logs-npm-audit-*.json
            logs-cargo-audit.txt
            logs-osv-scanner.txt
            logs-semgrep.txt
            logs-pin-verifier.txt
            logs-actions-pinning.txt
            logs-hash-verifier.txt
            audit-reqs/
            sbom/
          retention-days: 30

  pip-scan-packages:
    # Download (never install) the transitive closure and pattern-scan archives for malicious
    # payloads pip-audit cannot see. Sharded by load; triton-kernels.txt is git+-only.
    name: ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: 'pip scan-packages :: hf-stack'
            id: hf-stack
            files: 'unsloth-deps no-torch-runtime'
          - name: 'pip scan-packages :: studio'
            id: studio
            files: 'studio overrides extras-no-deps audio-torch210'
          - name: 'pip scan-packages :: extras'
            id: extras
            files: 'extras'
          # scan_packages.py keeps the first requirement per package name, so each torchcodec line
          # needs its own shard.
          - name: 'pip scan-packages :: audio-torch290'
            id: audio-torch290
            files: 'audio-torch290'
          - name: 'pip scan-packages :: audio-torch280'
            id: audio-torch280
            files: 'audio-torch280'
    steps:
      # Egress block: this job only fetches PyPI archives.
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install scan_packages.py runtime deps
        run: python -m pip install --upgrade pip requests packaging

      - name: Build filtered requirements set
        # Same input transform as advisory-audit; `git+` specs are stripped because `pip download`
        # cannot resolve them.
        run: |
          mkdir -p audit-reqs
          python <<'PY' > audit-reqs/unsloth-deps.txt
          import tomllib
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          core = d["project"]["dependencies"]
          def extra(name):
              # A bare KeyError reads as a generic crash: that is how four scan jobs
              # stayed dead for three weeks. Name the extra, for every extra indexed here.
              try:
                  return d["project"]["optional-dependencies"][name]
              except KeyError:
                  raise SystemExit(
                      f"pyproject.toml has no [{name}] extra, so the hf-stack scan "
                      "set cannot be built. Add the extra, or update this workflow."
                  )
          extras = extra("huggingfacenotorch")
          # extras-no-deps.txt no longer pins torchcodec, so the audit set would lose it.
          audio = extra("audio-torch211")
          print("# Auto-generated from pyproject.toml by security-audit.yml.")
          print("# core deps + huggingfacenotorch extras + audio-torch211.")
          for spec in core + extras + audio:
              print(spec)
          PY
          for extra in audio-torch210 audio-torch290 audio-torch280; do
          python - "$extra" <<'PY' > "audit-reqs/$extra.txt"
          import sys, tomllib
          extra = sys.argv[1]
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          # The older lines _select_torchcodec_spec installs on torch 2.10, 2.9 and 2.8, all of
          # which the flavor and default-ROCm repairs still resolve. One file each: their
          # ranges are disjoint, so they cannot share a resolve with each other or with
          # audio-torch211's >=0.11.
          try:
              specs = d["project"]["optional-dependencies"][extra]
          except KeyError:
              raise SystemExit(
                  f"pyproject.toml has no [{extra}] extra, so its scan set cannot be "
                  "built. Add the extra, or update this workflow."
              )
          print("# Auto-generated from pyproject.toml by security-audit.yml.")
          print(f"# {extra}.")
          for spec in specs:
              print(spec)
          PY
          done
          for f in studio.txt extras.txt extras-no-deps.txt \
                   no-torch-runtime.txt overrides.txt triton-kernels.txt; do
            python <<PY > "audit-reqs/$f"
          src = "studio/backend/requirements/$f"
          with open(src) as fh:
              for line in fh:
                  stripped = line.strip()
                  before_comment = stripped.split("#", 1)[0]
                  if "git+" in before_comment:
                      print(f"# [security-audit] skipped git+ spec: {stripped}")
                      continue
                  print(line.rstrip("\n"))
          PY
          done

      - name: Sanity-check scan_packages.py
        run: |
          test -f scripts/scan_packages.py
          head -3 scripts/scan_packages.py
          grep -q "Standalone pre-install package scanner" scripts/scan_packages.py

      - name: Scan declared + transitive Python deps
        # Exits 1 only on non-baselined CRITICAL/HIGH findings (baseline:
        # scripts/scan_packages_baseline.json). One `pip download` per shard dedups the closure.
        env:
          SHARD_FILES: ${{ matrix.shard.files }}
          # "1" = blocking; set "0" to return to advisory.
          SCAN_ENFORCE: "1"
        run: |
          set +e
          mkdir -p logs
          LOG="logs-scan-packages-${{ matrix.shard.id }}.txt"
          echo "::group::shard ${{ matrix.shard.id }} input files"
          REQ_ARGS=()
          for f in $SHARD_FILES; do
            if grep -qE '^[^#[:space:]]' "audit-reqs/$f.txt"; then
              echo "  + audit-reqs/$f.txt"
              REQ_ARGS+=( -r "audit-reqs/$f.txt" )
            else
              echo "  - audit-reqs/$f.txt (empty after git+ filter, skipping)"
            fi
          done
          echo "::endgroup::"
          rc=0
          if [ ${#REQ_ARGS[@]} -eq 0 ]; then
            echo "[security-audit] shard ${{ matrix.shard.id }}: no PyPI specs, nothing to scan" \
              | tee "$LOG"
          else
            python scripts/scan_packages.py --with-deps "${REQ_ARGS[@]}" \
              2>&1 | tee "$LOG"
            rc=${PIPESTATUS[0]}
          fi
          {
            echo "## scan_packages :: shard ${{ matrix.shard.id }}"
            echo
            echo "### Files in this shard"
            for f in $SHARD_FILES; do echo "- audit-reqs/$f.txt"; done
            echo
            echo "scan_packages.py exit code: $rc (enforce=$SCAN_ENFORCE)"
            echo
            echo '### Findings (tail)'
            echo '```'
            tail -200 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # PIPESTATUS is captured above so `tee` does not mask the exit code.
          if [ "$SCAN_ENFORCE" = "1" ]; then
            exit "$rc"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: scan-packages-log-${{ matrix.shard.id }}
          path: |
            logs-scan-packages-${{ matrix.shard.id }}.txt
            audit-reqs/
          retention-days: 30

  npm-scan-packages:
    # npm counterpart: fetch each lockfile tarball directly (never `npm install`), verify
    # integrity, extract with guards and pattern-scan. Stdlib-only; every tarball is hostile.
    name: npm scan-packages (Unsloth frontend tarballs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: []
    steps:
      # Egress: registry.npmjs.org plus GitHub for checkout/setup machinery.
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Sanity-check scan_npm_packages.py
        run: |
          test -f scripts/scan_npm_packages.py
          python3 -c "import ast; ast.parse(open('scripts/scan_npm_packages.py').read())"

      - name: Scan npm tarballs (declared + transitive, no install)
        # Blocking on non-baselined HIGH/CRITICAL (scripts/scan_npm_packages_baseline.json).
        env:
          SCAN_ENFORCE: "1"
        run: |
          set +e
          LOG=logs-scan-npm.txt
          python3 scripts/scan_npm_packages.py 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          {
            echo "## scan_npm_packages"
            echo
            echo "scan_npm_packages.py exit code: $rc (enforce=$SCAN_ENFORCE)"
            echo
            echo '### Findings (tail)'
            echo '```'
            tail -300 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # PIPESTATUS is captured above so `tee` does not mask the exit code.
          if [ "$SCAN_ENFORCE" = "1" ]; then
            exit "$rc"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: scan-npm-packages-log
          path: logs-scan-npm.txt
          retention-days: 30

  # `npm audit signatures` (advisory) plus check_new_install_scripts.py, which blocks newly
  # added dependencies that ship install hooks.
  npm-provenance-and-install-scripts:
    name: npm provenance + new install-script diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Base commit needed for `git show <base-sha>:.../package-lock.json`.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Unsloth frontend deps (--ignore-scripts)
        # --ignore-scripts is mandatory: no third-party hook may run here.
        working-directory: studio/frontend
        run: |
          retry() {  # retry <max-attempts> <command...> with exponential backoff
            local max="$1"; shift
            local n=1 delay=5
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::command failed after ${n} attempts: $*" >&2
                return 1
              fi
              echo "attempt ${n}/${max} failed; retrying in ${delay}s: $*" >&2
              sleep "$delay"; n=$((n + 1)); delay=$((delay * 2))
            done
          }
          retry 5 npm ci --ignore-scripts
          (cd ../backend/core/data_recipe/oxc-validator && retry 5 npm ci --ignore-scripts)
          (cd .. && retry 5 npm ci --ignore-scripts)

      - name: npm audit signatures (informational)
        continue-on-error: true
        run: |
          set -o pipefail
          rc=0
          for dir in studio/frontend studio/backend/core/data_recipe/oxc-validator studio; do
            LOG="$dir/logs-audit-signatures.txt"
            (cd "$dir" && npm audit signatures) 2>&1 | tee "$LOG" || rc=1
            {
              echo "## npm audit signatures ($dir)"
              echo
              echo '```'
              tail -200 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$rc"

      - name: Diff for newly-added install-script deps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -e
          for lock in studio/frontend/package-lock.json studio/backend/core/data_recipe/oxc-validator/package-lock.json studio/package-lock.json; do
            # A lockfile the base does not have yet diffs against an empty tree.
            git show "$BASE_SHA:$lock" > /tmp/base-package-lock.json 2>/dev/null || echo '{}' > /tmp/base-package-lock.json
            python3 scripts/check_new_install_scripts.py --base /tmp/base-package-lock.json --head "$lock"
          done

      - name: Skip install-script diff (non-PR trigger)
        if: github.event_name != 'pull_request'
        run: |
          echo "Not a pull_request event; install-script diff requires a base ref."
          echo "This step is intentionally a no-op outside PR triggers."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: npm-audit-signatures-log
          path: |
            studio/frontend/logs-audit-signatures.txt
            studio/backend/core/data_recipe/oxc-validator/logs-audit-signatures.txt
            studio/logs-audit-signatures.txt
          if-no-files-found: ignore
          retention-days: 30
