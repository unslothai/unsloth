# PR-time Tauri build (Linux debug, unsigned). A second job type-checks `#[cfg(windows)]`
# code, which Linux strips and cannot cross-compile (`ring` needs MSVC).

name: Unsloth Tauri CI

on:
  pull_request:
    # ready_for_review: every job below skips draft pull requests, so marking
    # one ready has to start the run that tests it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'studio/frontend/**'
      - 'studio/src-tauri/**'
      # Tauri spawns `unsloth studio`.
      - 'unsloth_cli/**'
      - '.github/workflows/studio-tauri-smoke.yml'
      - '.github/scripts/retry-with-apt-lock.sh'
      # The Tauri CLI is installed from the studio/ package root.
      - 'studio/package.json'
      - 'studio/package-lock.json'
      - 'studio/.npmrc'
      - 'scripts/lockfile_supply_chain_audit.py'
      # Read by the Rust test every_shared_case_agrees_with_the_desktop_filter.
      - 'studio/backend/tests/fixtures/access_log_records.json'
  push:
    branches: [main]
    # Same list as the PR filter, to spare the account-wide macOS slots.
    paths:
      - 'studio/frontend/**'
      - 'studio/src-tauri/**'
      # Tauri spawns `unsloth studio`.
      - 'unsloth_cli/**'
      - '.github/workflows/studio-tauri-smoke.yml'
      - '.github/scripts/retry-with-apt-lock.sh'
      # The Tauri CLI is installed from the studio/ package root.
      - 'studio/package.json'
      - 'studio/package-lock.json'
      - 'studio/.npmrc'
      - 'scripts/lockfile_supply_chain_audit.py'
      # Read by the Rust test every_shared_case_agrees_with_the_desktop_filter.
      - 'studio/backend/tests/fixtures/access_log_records.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Latest-only on a PR branch. On main, cancel-in-progress is false so a RUNNING run is
  # never killed, and a newer push replaces only the PENDING one: a merge burst runs the
  # commit already executing plus the tip. See studio-backend-ci.yml for the trade.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  linux-debug-build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Tauri Linux debug build (no codesign)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux native deps for Tauri / WebKit2GTK
        # Bounded and retried: a hung apt step is reported as `cancelled` with no reason.
        # update + install retry as one unit; two long attempts, since slow mirrors are common.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb || { apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb; }'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          # Save only on main: PR-scoped caches only serve that PR and evict main's shared copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: studio/src-tauri -> target

      - name: Lockfile supply-chain audit (pre-install scan)
        # Must run BEFORE any `npm install`, including the Tauri CLI below.
        run: python3 scripts/lockfile_supply_chain_audit.py

      - name: Install pinned Tauri CLI (matches release-desktop.yml)
        # Lifecycle scripts are required for `vite build`; the lockfile audit runs first.
        run: npm ci --prefix studio --no-fund --no-audit

      - name: Verify pinned Tauri CLI version
        run: |
          out="$(npx --prefix studio tauri --version)"
          echo "$out"
          [ "$out" = "tauri-cli 2.10.1" ] || { echo "::error::expected tauri-cli 2.10.1, got $out"; exit 1; }

      - name: Frontend build (npm ci, vite)
        working-directory: studio/frontend
        # Lifecycle scripts are required for `vite build`; the lockfile audit runs first.
        run: |
          npm ci --no-fund --no-audit
          npm run build
          test -f dist/index.html

      - name: Rust unit tests (studio/src-tauri)
        working-directory: studio/src-tauri
        run: cargo test --no-fail-fast

      - name: Tauri debug build (Linux, no bundle, no codesign)
        # --debug --no-bundle: compile and wire the dist, no packaging or signing.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx --prefix studio tauri build --debug --no-bundle

      - name: Inspect produced binary
        run: |
          BIN=$(find studio/src-tauri/target/debug -maxdepth 1 -type f -executable 2>/dev/null \
                | grep -Ev '\.(d|so|dylib|dll)$' \
                | grep -Ev '/(deps|build|examples)$' \
                | head -1)
          echo "binary: $BIN"
          if [ -z "$BIN" ]; then
            echo "::error::Tauri debug binary not produced"
            ls -la studio/src-tauri/target/debug/ || true
            exit 1
          fi
          file "$BIN"
          du -h "$BIN"

      # The only job that catches a Linux startup regression before a release. Ten launches:
      # the #8062 X11 race killed about one in three. The backend is a stub.
      - name: Launch repeatedly under Xvfb
        run: |
          set -u
          BIN="$PWD/studio/src-tauri/target/debug/unsloth-studio"
          [ -x "$BIN" ] || { echo "::error::no debug binary at $BIN"; exit 1; }

          # libX11 >= 1.8 calls XInitThreads() itself, so the race cannot reproduce there.
          x11ver="$(dpkg-query -W -f='${Version}' libx11-6 2>/dev/null || true)"
          echo "libx11-6: ${x11ver:-not installed}"
          if [ -z "$x11ver" ] || dpkg --compare-versions "$x11ver" ge 2:1.8; then
            echo "::warning::libX11 ${x11ver:-unknown} initialises threading itself, so these launches no longer cover the #8062 race, only that the app starts. Keep this job on a runner with libX11 < 1.8 to keep that coverage."
          fi

          # Derived from MIN_DESKTOP_BACKEND_VERSION so the stub never reads as Stale.
          STUB_VERSION="$(sed -n 's/.*MIN_DESKTOP_BACKEND_VERSION: &str = "\([^"]*\)".*/\1/p' \
            studio/src-tauri/src/preflight/version.rs)"
          [ -n "$STUB_VERSION" ] || {
            echo "::error::could not read MIN_DESKTOP_BACKEND_VERSION from preflight/version.rs"
            exit 1
          }
          echo "stub backend version: $STUB_VERSION"

          mkdir -p "$RUNNER_TEMP/stub" launch-logs
          cat > "$RUNNER_TEMP/stub/unsloth" <<'STUB'
          #!/bin/sh
          case "$*" in
            "-h") exit 0 ;;
            *desktop-capabilities*)
              printf '%s\n' '{"desktop_protocol_version":1,"desktop_manageability_version":2,"supports_api_only":true,"supports_provision_desktop_auth":true,"supports_desktop_backend_ownership":true,"studio_install_ok":true,"version":"__STUB_VERSION__"}'
              exit 0 ;;
            *studio*--api-only*) exec sleep 60 ;;
          esac
          exit 1
          STUB
          sed -i "s/__STUB_VERSION__/$STUB_VERSION/" "$RUNNER_TEMP/stub/unsloth"
          chmod +x "$RUNNER_TEMP/stub/unsloth"

          fails=0
          for i in $(seq 1 10); do
            H="$RUNNER_TEMP/launch-$i"
            rm -rf "$H"
            mkdir -p "$H/.unsloth/studio/unsloth_studio/bin" "$H/.config" "$H/xdg"
            cp "$RUNNER_TEMP/stub/unsloth" "$H/.unsloth/studio/unsloth_studio/bin/unsloth"
            D=$((70 + i))
            Xvfb ":$D" -screen 0 1440x900x24 -nolisten tcp > "launch-logs/xvfb-$i.log" 2>&1 &
            XV=$!
            for _ in $(seq 1 40); do [ -e "/tmp/.X11-unix/X$D" ] && break; sleep 0.25; done
            (
              export DISPLAY=":$D" HOME="$H" XDG_RUNTIME_DIR="$H/xdg" XDG_CONFIG_HOME="$H/.config"
              # Without this GTK drops its fatal X error report and exits silently.
              export G_MESSAGES_DEBUG=all RUST_BACKTRACE=full
              unset UNSLOTH_STUDIO_HOME STUDIO_HOME
              exec "$BIN"
            ) > "launch-logs/app-$i.log" 2>&1 &
            APP=$!
            for _ in $(seq 1 20); do kill -0 "$APP" 2>/dev/null || break; sleep 1; done
            if kill -0 "$APP" 2>/dev/null; then
              kill -TERM "$APP" 2>/dev/null || true
              # Only count launches that reached the spawn; a parked app survives trivially.
              if grep -q "start_managed_server spawned" "launch-logs/app-$i.log"; then
                echo "launch $i: reached the backend spawn and stayed up"
              else
                fails=$((fails + 1))
                echo "::error::launch $i never reached the backend spawn, so it never exercised the startup transition"
                tail -25 "launch-logs/app-$i.log" || true
              fi
            else
              rc=0; wait "$APP" 2>/dev/null || rc=$?
              fails=$((fails + 1))
              echo "::error::launch $i exited early with rc=$rc"
              tail -25 "launch-logs/app-$i.log" || true
            fi
            kill "$XV" 2>/dev/null || true
            wait "$XV" 2>/dev/null || true
          done

          if [ "$fails" -ne 0 ]; then
            echo "::error::$fails of 10 launches did not reach the app shell and stay there"
            exit 1
          fi
          echo "10 of 10 launches reached the backend spawn and stayed up"

      # GPU rendering setting: Off must keep a working transport on X11, and a GPU launch that
      # dies with Wayland Error 71 before the window is ready must relaunch on the CPU path.
      # UNSLOTH_TEST_GPU_ERROR71 (debug builds only) sends the real GTK message through the hook.
      - name: GPU rendering Off and the Error 71 fallback under Xvfb
        run: |
          set -u
          BIN="$PWD/studio/src-tauri/target/debug/unsloth-studio"
          probe() {
            name="$1"; shift
            H="$RUNNER_TEMP/gpu-$name"
            rm -rf "$H"
            mkdir -p "$H/.unsloth/studio/unsloth_studio/bin" "$H/.config/ai.unsloth.studio" "$H/xdg"
            cp "$RUNNER_TEMP/stub/unsloth" "$H/.unsloth/studio/unsloth_studio/bin/unsloth"
            if [ -n "${SETTING:-}" ]; then
              printf '%s\n' "$SETTING" > "$H/.config/ai.unsloth.studio/gpu-rendering-v1"
            fi
            D=$((90 + ${#name}))
            Xvfb ":$D" -screen 0 1440x900x24 -nolisten tcp > "launch-logs/xvfb-gpu-$name.log" 2>&1 &
            XV=$!
            for _ in $(seq 1 40); do [ -e "/tmp/.X11-unix/X$D" ] && break; sleep 0.25; done
            (
              export DISPLAY=":$D" HOME="$H" XDG_RUNTIME_DIR="$H/xdg" XDG_CONFIG_HOME="$H/.config"
              export G_MESSAGES_DEBUG=all RUST_BACKTRACE=full "$@"
              unset UNSLOTH_STUDIO_HOME STUDIO_HOME
              exec "$BIN"
            ) > "launch-logs/app-gpu-$name.log" 2>&1 &
            APP=$!
            for _ in $(seq 1 25); do kill -0 "$APP" 2>/dev/null || break; sleep 1; done
            up=0
            kill -0 "$APP" 2>/dev/null && up=1
            kill -TERM "$APP" 2>/dev/null || true
            wait "$APP" 2>/dev/null || true
            kill "$XV" 2>/dev/null || true
            wait "$XV" 2>/dev/null || true
            LOG="launch-logs/app-gpu-$name.log"
            if [ "$up" != 1 ] || ! grep -q "start_managed_server spawned" "$LOG"; then
              echo "::error::GPU rendering $name launch did not stay up"
              tail -40 "$LOG"
              return 1
            fi
          }

          mkdir -p launch-logs
          SETTING=off probe off
          grep -q "GPU rendering: setting=off" launch-logs/app-gpu-off.log
          grep -q "GPU rendering off (setting); set WEBKIT_DMABUF_RENDERER_FORCE_SHM=1 WEBKIT_DISABLE_COMPOSITING_MODE=1" \
            launch-logs/app-gpu-off.log || { echo "::error::Off did not take the X11 CPU path"; exit 1; }
          echo "Off: X11 CPU path, stayed up"

          SETTING= probe crash UNSLOTH_TEST_GPU_ERROR71=1
          LOG=launch-logs/app-gpu-crash.log
          grep -q "Error 71 (Protocol error) dispatching to Wayland display" "$LOG"
          grep -q "fell back to the CPU path after a launch crash" "$LOG" \
            || { echo "::error::no CPU fallback after the simulated Error 71"; tail -40 "$LOG"; exit 1; }
          FLAG="$RUNNER_TEMP/gpu-crash/.config/ai.unsloth.studio/gpu-rendering-unsafe-v1"
          grep -q "reason=error71" "$FLAG" || { echo "::error::fallback flag not written"; exit 1; }
          echo "Error 71: fell back to the CPU path, flag written, stayed up"

      - name: Upload launch logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tauri-launch-logs
          path: launch-logs
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Tauri debug build
        # Failures only, and only the binary: target/debug is ~1.3GB per run.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tauri-debug-build
          path: |
            studio/src-tauri/target/debug/unsloth-studio
            studio/frontend/dist
          if-no-files-found: warn
          retention-days: 1

  # `cfg(windows)` code (e.g. install.rs path normalizer) is stripped on Linux.
  windows-unit-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Rust unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          # Save only on main: PR-scoped caches only serve that PR and evict main's shared copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: studio/src-tauri -> target

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Lockfile supply-chain audit (pre-install scan)
        run: python scripts/lockfile_supply_chain_audit.py

      # tauri-build resolves frontendDist at compile time, so dist/ must exist first.
      - name: Frontend build (npm ci, vite)
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Rust unit tests (studio/src-tauri)
        working-directory: studio/src-tauri
        run: cargo test --no-fail-fast

      # The browser guard is under `not(debug_assertions)`, so check the release profile.
      - name: Rust release type check (studio/src-tauri)
        working-directory: studio/src-tauri
        run: cargo check --all-targets --release

      - name: Install pinned Tauri CLI (matches release-desktop.yml)
        run: npm ci --prefix studio --no-fund --no-audit

      - name: Tauri debug build (Windows, no bundle)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx --prefix studio tauri build --debug --no-bundle

      # GPU rendering Off must reach WebView2 as --disable-gpu without dropping wry's default
      # flags; Auto must leave the arguments alone. The second launch follows the first at once,
      # so a WebView2 that cannot switch arguments on a fast relaunch fails here.
      - name: GPU rendering Off reaches WebView2
        shell: pwsh
        run: |
          $bin = Resolve-Path "studio/src-tauri/target/debug/unsloth-studio.exe"
          $cfg = Join-Path $env:APPDATA "ai.unsloth.studio"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          function Get-Browser {
            Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" |
              Where-Object { $_.CommandLine -notmatch '--type=' -and $_.CommandLine -match 'ai\.unsloth\.studio\\EBWebView' }
          }
          function Stop-App($app) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Browser | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
          function Probe($setting) {
            Set-Content -Path (Join-Path $cfg "gpu-rendering-v1") -Value $setting
            $app = Start-Process -FilePath $bin -PassThru
            $browser = $null
            for ($i = 0; $i -lt 90 -and -not $browser; $i++) { Start-Sleep 1; $browser = Get-Browser }
            if (-not $browser) { Stop-App $app; throw "no WebView2 browser process for setting=$setting" }
            $line = ($browser | Select-Object -First 1).CommandLine
            Write-Host "setting=$setting -> $line"
            Start-Sleep 20
            if ($app.HasExited) { throw "app exited (code $($app.ExitCode)) with setting=$setting" }
            Stop-App $app
            return $line
          }
          $off = Probe "off"
          if ($off -notmatch '--disable-gpu') { throw "Off: --disable-gpu missing" }
          if ($off -notmatch 'msSmartScreenProtection') { throw "Off: wry's default --disable-features was dropped" }
          $auto = Probe "auto"
          if ($auto -match '--disable-gpu') { throw "Auto: --disable-gpu present" }
          Write-Host "Off passes --disable-gpu with wry's defaults; Auto leaves the arguments alone"

  macos-unit-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Rust unit tests (macos)
    # macos-26, not macos-15: same hardware class but a much shorter queue tail (measured on
    # studio-mac-install-matrix). Re-measure if queues change.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-03-27

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          # Save only on main: PR-scoped caches only serve that PR and evict main's shared copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: studio/src-tauri -> target

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Lockfile supply-chain audit (pre-install scan)
        run: python scripts/lockfile_supply_chain_audit.py

      # tauri-build resolves frontendDist at compile time, so dist/ must exist first.
      - name: Frontend build (npm ci, vite)
        working-directory: studio/frontend
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Rust unit tests (studio/src-tauri)
        working-directory: studio/src-tauri
        run: cargo test --no-fail-fast

      # The browser guard is under `not(debug_assertions)`, so check the release profile.
      - name: Rust release type check (studio/src-tauri)
        working-directory: studio/src-tauri
        run: cargo check --all-targets --release
