# One job, three phases on one install.ps1 --local --no-torch: SDK chat (18888), tool
# calling (18898), JSON + vision (18899).

name: Windows Unsloth GGUF CI

on:
  pull_request:
    paths:
      # studio/frontend/** stays: install.ps1 builds it and the dist cache key hashes it.
      - 'studio/backend/**'
      - 'studio/frontend/**'
      - 'studio/setup.ps1'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'unsloth_cli/**'
      - 'install.ps1'
      - 'scripts/uninstall.ps1'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - 'pyproject.toml'
      - 'tests/studio_setup_ps1/**'
      # The PowerShell unit tests run here and nowhere else.
      - 'tests/studio/*.ps1'
      - 'tests/studio/test_pester_bootstrap_hardening.py'
      # Reached by the installers this workflow triggers on.
      - 'studio/nvidia_probe.py'
      - '.github/workflows/studio-windows-inference-smoke.yml'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/studio_smoke/multi_turn_chat.py'
  push:
    branches: [main]
    paths:
      - 'studio/backend/**'
      - 'studio/frontend/**'
      - 'studio/setup.ps1'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'unsloth_cli/**'
      - 'install.ps1'
      - 'scripts/uninstall.ps1'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - 'pyproject.toml'
      - 'tests/studio_setup_ps1/**'
      - 'tests/studio/*.ps1'
      - 'tests/studio/test_pester_bootstrap_hardening.py'
      - 'studio/nvidia_probe.py'
      - '.github/workflows/studio-windows-inference-smoke.yml'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/studio_smoke/multi_turn_chat.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job, three phases: sharing the ~7 min Windows install saves runner slots. Each
  # phase keeps its own cache, port, log and artifact and gates on the shared preamble.
  inference-smoke:
    name: GGUF inference smoke (API, tools, vision)
    runs-on: windows-latest
    # hf-download-with-retry.sh retries forever, so every blocking step has its own timeout.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # Phase-specific vars go to $GITHUB_ENV per phase, never here: precedence against job env
      # is not documented.
      # Windows defaults to cp1252 and the tools print a non-ASCII checkmark.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Fast GPU-free gate before the heavy smoke.
      - name: PowerShell installer unit tests
        shell: pwsh
        run: |
          foreach ($f in @('install.ps1', 'studio/setup.ps1')) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
            Write-Host "$f parsed with no errors"
          }
          # The step only inherits the LAST exit code, so check each test.
          pwsh -NoProfile -File tests/studio/test_resolve_cuda_toolkit.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/studio/test_torch_flavor.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/studio/test_node_decision.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/studio/test_mirror_fallback.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/studio/test_node_probe_guard.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/studio/test_path_probe_access_denied.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/studio/test_unsloth_torch_override.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # cross-platform-parity-ci.yml, which is the host it describes.

      # Must keep the shared unsloth.ico while a WSL shortcut still uses it.
      - name: uninstall.ps1 unit test (dual-install icon preserve)
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/uninstall.ps1).Path, [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; exit 1 }
          Write-Host "uninstall.ps1 parsed with no errors"
          pwsh -NoProfile -File tests/studio/test_uninstall_dual_install_icon.ps1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Pre-install Windows tweaks (npm 11 + Defender exclusions)
        shell: pwsh
        # See studio-windows-update-smoke.yml: npm >= 11 and Defender exclusions.
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "npm version before upgrade: $(npm -v)"
          npm install -g 'npm@^11' 2>&1 | Out-Host
          Write-Host "npm version after upgrade: $(npm -v)"
          # Do NOT pre-create these: an empty dist makes setup.ps1 skip the frontend rebuild.
          foreach ($p in @(
            "$env:USERPROFILE\.unsloth",
            "$env:USERPROFILE\AppData\Local\uv",
            "$env:GITHUB_WORKSPACE\studio\frontend\node_modules",
            "$env:GITHUB_WORKSPACE\studio\frontend\dist"
          )) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "Defender exclusion skipped ($($_.Exception.Message)): $p"
            }
          }

      # No `if:`: a failed preamble must stop the job here, or phases gated on assert-prebuilt
      # would hide the real failure.

      # The dist key hashes the paths setup.ps1 checks before rebuilding (see
      # .github/actions/frontend-dist-restore). install.ps1 preserves the exported UV_CACHE_DIR.
      - name: Restore the uv download cache
        id: uv-cache
        uses: ./.github/actions/uv-cache-restore

      - name: Restore the built frontend
        id: fe-dist
        uses: ./.github/actions/frontend-dist-restore

      - name: Install Unsloth (--local, --no-torch)
        id: install
        timeout-minutes: 25
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          # install.ps1 runs as a CHILD process so its [Console]::Out output reaches Tee-Object.
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          # Timestamps go to the step log only; logs/install.log keeps raw output.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 |
            Tee-Object -FilePath logs/install.log |
            ForEach-Object { '[{0,4:N0}s] {1}' -f $sw.Elapsed.TotalSeconds, $_ }
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }

      # Asserts a cache hit was reused (a `building frontend` line fails the job); saves on main.
      - name: Save the built frontend
        uses: ./.github/actions/frontend-dist-save
        with:
          cache-hit: ${{ steps.fe-dist.outputs.cache-hit }}
          key: ${{ steps.fe-dist.outputs.key }}

      - name: Save the uv download cache
        uses: ./.github/actions/uv-cache-save
        with:
          cache-hit: ${{ steps.uv-cache.outputs.cache-hit }}
          key: ${{ steps.uv-cache.outputs.key }}

      - name: Assert install.ps1 used the Windows llama.cpp prebuilt
        id: assert-prebuilt
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # Filesystem check: it does not depend on which process emitted a marker.
          LLAMA_DIR=~/.unsloth/llama.cpp
          INFO="$LLAMA_DIR/UNSLOTH_PREBUILT_INFO.json"
          BIN="$LLAMA_DIR/build/bin/Release/llama-server.exe"
          if grep -q "falling back to source build" logs/install.log; then
            echo "::error::install.ps1 fell back to source-build llama.cpp on Windows."
            grep -E "llama-prebuilt|llama.cpp" logs/install.log | tail -60
            exit 1
          fi
          if [ ! -f "$INFO" ]; then
            echo "::error::no UNSLOTH_PREBUILT_INFO.json at $INFO."
            ls -la "$LLAMA_DIR" || true
            exit 1
          fi
          if [ ! -f "$BIN" ]; then
            echo "::error::no llama-server.exe at $BIN."
            ls -la "$LLAMA_DIR/build/bin" || true
            exit 1
          fi
          echo "install.ps1 installed the Windows prebuilt llama.cpp:"
          cat "$INFO"

      # Phases gate on this step: it only runs after assert-prebuilt succeeded, and also
      # catches a missing shim.
      - name: Add Unsloth shim to GITHUB_PATH
        id: shim
        if: ${{ !cancelled() && steps.assert-prebuilt.outcome == 'success' }}
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          if [ ! -f "$SHIM_DIR/unsloth.exe" ]; then
            echo "::error::unsloth.exe shim not found at $SHIM_DIR"
            ls -la ~/.unsloth/studio/ || true
            exit 1
          fi
          cygpath -w "$SHIM_DIR" >> "$GITHUB_PATH"

      # Phases 1 and 3 only; phase 2 uses curl.
      - name: Install OpenAI + Anthropic Python SDKs
        id: sdks
        if: ${{ !cancelled() && steps.assert-prebuilt.outcome == 'success' }}
        timeout-minutes: 10
        run: python -m pip install 'openai>=1.50,<4' 'anthropic>=1,<2'

      # Phase 1 setup sits after the shared preamble so its failure stays phase-local.
      - name: Phase 1 environment (API + auth)
        run: |
          echo "GGUF_REPO=unsloth/gemma-3-270m-it-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=gemma-3-270m-it-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18888" >> "$GITHUB_ENV"
          echo "HF_HOME=${{ github.workspace }}/hf-cache" >> "$GITHUB_ENV"

      # Split restore/save: actions/cache can report a hit and exit non-zero without extracting
      # (actions/cache#1621), so restore is continue-on-error and Prime re-downloads.
      # Cross-OS key: the hf-cache tree is byte-identical on every OS.
      - name: Restore HF_HOME cache for unsloth/gemma-3-270m-it-GGUF
        id: cache-hf
        timeout-minutes: 15
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-unsloth/gemma-3-270m-it-GGUF-UD-Q4_K_XL-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        timeout-minutes: 15
        # Also on the silent restore-failure mode above.
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME cache for unsloth/gemma-3-270m-it-GGUF
        timeout-minutes: 15
        # Save on main only: PR-scoped caches only serve that PR and evict main's shared copies
        # from the near-full repo cache budget.
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-unsloth/gemma-3-270m-it-GGUF-UD-Q4_K_XL-v3
          enableCrossOsArchive: true

      - name: Reset auth + boot Unsloth (API-only)
        timeout-minutes: 2
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT"

      - name: Wait for /api/health
        timeout-minutes: 10
        run: |
          bash .github/scripts/wait-for-health.sh --port "$STUDIO_PORT"

      - name: Password rotation (old must fail, new must work)
        timeout-minutes: 3
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIRotated-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          [ -n "$OLD_TOKEN" ] && [ "$OLD_TOKEN" != "null" ] || { echo "bootstrap login failed"; exit 1; }
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          OLD_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}")
          if [ "$OLD_STATUS" != "401" ]; then
            echo "::error::Login with old password returned $OLD_STATUS, expected 401"
            exit 1
          fi
          NEW_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "null" ] || { echo "new login failed"; exit 1; }
          echo "TOKEN=$NEW_TOKEN" >> "$GITHUB_ENV"
          echo "password rotation OK (old=401, new=200)"

      - name: Load the GGUF (HF repo + variant, served from HF_HOME cache)
        timeout-minutes: 20
        run: |
          # Retry the load: llama-server warm-up can drop TCP on Windows runners.
          # speculative_type=off and n_parallel=1 make the determinism check valid: n-gram drafting
          # and --kv-unified change batch shapes between runs. Other phases keep the defaults.
          LOAD_OK=0
          for attempt in 1 2 3; do
            HTTP=$(curl -s -o /tmp/load.json -w '%{http_code}' \
              -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              --max-time 600 \
              -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048,\"speculative_type\":\"off\",\"n_parallel\":1}")
            if [ "$HTTP" = "200" ]; then LOAD_OK=1; break; fi
            echo "::warning::/api/inference/load attempt $attempt returned $HTTP; response:"
            cat /tmp/load.json || true
            sleep 10
          done
          [ "$LOAD_OK" = "1" ] || { echo "::error::/api/inference/load failed 3 attempts"; exit 22; }
          jq '{status, display_name, is_gguf, context_length}' /tmp/load.json

      - name: Multi-turn determinism via OpenAI + Anthropic SDKs
        timeout-minutes: 12
        env:
          BASE_URL: http://127.0.0.1:18888
        run: |
          python .github/scripts/studio_smoke/multi_turn_chat.py

      - name: Stop Unsloth
        if: always()
        # pwsh, not Git Bash (it exits 143 from kill/sleep blocks). Kill by listening port, since
        # $! is an MSYS pid, then by command line for a server that never bound its port.
        # Failures are swallowed so teardown never fails the job.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $port = $env:STUDIO_PORT
          $owners = (Get-NetTCPConnection -LocalPort $port -State Listen).OwningProcess |
                    Sort-Object -Unique
          foreach ($owner in $owners) {
            try {
              $p = Get-Process -Id $owner
              Write-Host "stopping pid $owner ($($p.ProcessName)) on port $port"
              Stop-Process -Id $owner -Force
            } catch {
              Write-Host "pid $owner already gone"
            }
          }
          $stragglers = Get-CimInstance Win32_Process |
                        Where-Object { $_.CommandLine -match 'unsloth' -and
                                       $_.CommandLine -match 'studio' -and
                                       $_.ProcessId -notin $owners }
          foreach ($s in $stragglers) {
            Write-Host "stopping unbound pid $($s.ProcessId): $($s.CommandLine)"
            Stop-Process -Id $s.ProcessId -Force
          }
          Start-Sleep -Seconds 2
          if ((Get-NetTCPConnection -LocalPort $port -State Listen)) {
            Write-Host "note: something is still listening on $port"
          } else {
            Write-Host "port $port is free"
          }
          exit 0

      - name: Collect llama-server logs
        if: always()
        # A transient DLL-init crash (0xC0000142) in this diagnostic copy must not fail the job.
        continue-on-error: true
        shell: bash
        # Copy llama-server's own logs; the backend traceback only shows the symptom.
        run: |
          mkdir -p logs/llama-server
          cp -v ~/.unsloth/studio/logs/llama-server/*.log logs/llama-server/ 2>/dev/null || \
            echo "no llama-server logs to collect"

      - name: Upload logs
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-openai-anthropic-log
          path: |
            logs/studio.log
            logs/install.log
            logs/llama-server/*.log
          retention-days: 7

      - name: Phase 2 environment (tool calling)
        # Without this gate the step would ride success() while gated steps ran with the
        # previous phase's model, port and HF_HOME.
        if: ${{ !cancelled() && steps.shim.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/Qwen3.5-2B-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_FILE=Qwen3.5-2B-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18898" >> "$GITHUB_ENV"
          echo "HF_HOME=${{ github.workspace }}/hf-cache-tools" >> "$GITHUB_ENV"

      # Cross-OS key shared with the Linux tool-calling job. Bump the suffix whenever `path`
      # changes: actions/cache versions entries by path, and a moved path misses and fails to save.
      - name: Restore GGUF model cache
        if: ${{ !cancelled() && steps.shim.outcome == 'success' }}
        id: cache-gguf-tools
        timeout-minutes: 15
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: gguf-cache-tools
          key: gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v3
          enableCrossOsArchive: true

      - name: Download GGUF if cache miss
        id: download-gguf-tools
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && (steps.cache-gguf-tools.outputs.cache-hit != 'true' || steps.cache-gguf-tools.outcome != 'success') }}
        timeout-minutes: 15
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache-tools
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache-tools

      - name: Save GGUF model cache
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf-tools.outcome == 'success' && hashFiles('gguf-cache-tools/**/*.gguf') != ''
        timeout-minutes: 15
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: gguf-cache-tools
          key: gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v3
          enableCrossOsArchive: true

      - name: Reset auth + boot Unsloth (API-only, default tool policy)
        id: boot-tools
        # Do not boot a server when this phase's own download failed.
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.download-gguf-tools.outcome != 'failure' }}
        timeout-minutes: 2
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port "$STUDIO_PORT" --log logs/studio_tools.log

      - name: Wait for /api/health, log in, change password, load model
        id: ready-tools
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.boot-tools.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CITool-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          # Use forward slashes so the path embeds in JSON; pathlib accepts them on Windows.
          GGUF_PATH="${GITHUB_WORKSPACE//\\//}/gguf-cache-tools/${GGUF_FILE}"
          ls -lh "$GGUF_PATH"
          LOAD_OK=0
          for attempt in 1 2 3; do
            HTTP=$(curl -s -o /tmp/load.json -w '%{http_code}' \
              -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              --max-time 600 \
              -d "{\"model_path\":\"$GGUF_PATH\",\"is_lora\":false,\"max_seq_length\":2048}")
            if [ "$HTTP" = "200" ]; then LOAD_OK=1; break; fi
            echo "::warning::/api/inference/load attempt $attempt returned $HTTP; response:"
            cat /tmp/load.json || true
            sleep 10
          done
          [ "$LOAD_OK" = "1" ] || { echo "::error::/api/inference/load failed 3 attempts"; exit 22; }
          jq '{status, display_name}' /tmp/load.json

      - name: Tool calling, server-side tools, thinking on/off
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.ready-tools.outcome == 'success' }}
        timeout-minutes: 15
        env:
          BASE_URL: http://127.0.0.1:18898
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407
          # Same temperature shim as the Mac job. Small Qwen3.5-2B
          # quants can degenerate at temperature=0; a small non-zero
          # temperature with a fixed seed keeps the test deterministic
          # while escaping the trap.
          TEMP = 0.2

          def post(path, body, *, timeout = 240):
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          def post_sse(path, body, *, timeout = 600, retries = 1, soft = False):
              # The server-side agentic loop always answers over SSE. A
              # shared CI runner can stall the stream transport (the
              # connection opening, or a mid-stream read) even when Unsloth
              # is healthy, so harden the read three ways:
              #   * retry a transport stall once with a fresh request,
              #     capped at 300s (a healthy server answers a retry
              #     quickly, a wedged one never does);
              #   * return any text already streamed before a stall, so a
              #     stall on the trailing tokens -- after the answer
              #     arrived -- still counts;
              #   * when every attempt yields nothing, a hard call
              #     re-raises while a soft call (the best-effort
              #     server-side tool probes) returns None so the caller
              #     can WARN instead of sinking the whole job.
              # HTTP status errors always surface immediately.
              body = {**body, "stream": True}
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                      # The tool loop's frames, and the confirm gate's prompt, only
                      # go to a caller that asks, as the Studio UI does. Ask, so this
                      # probe exercises the same path a user takes.
                      "X-Unsloth-Events": "1",
                  },
              )
              for attempt in range(retries + 1):
                  parts = []
                  t = timeout if attempt == 0 else min(timeout, 300)
                  try:
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          for raw in resp:
                              line = raw.decode().strip()
                              if not line.startswith("data: "):
                                  continue
                              payload = line[6:]
                              if payload == "[DONE]":
                                  break
                              try:
                                  chunk = json.loads(payload)
                              except json.JSONDecodeError:
                                  continue
                              for choice in chunk.get("choices", []):
                                  delta = choice.get("delta", {}) or {}
                                  if delta.get("content"):
                                      parts.append(delta["content"])
                      return "".join(parts)
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      # Text already streamed is a valid signal -- keep it
                      # rather than re-running a heavy generation.
                      if parts:
                          joined = "".join(parts)
                          print(f"[retry-sse] {path}: {exc!r}; keeping {len(joined)} partial chars", flush = True)
                          return joined
                      if attempt == retries:
                          if soft:
                              print(f"[tools] WARN {path}: SSE transport stalled with no data ({exc!r}) -- non-blocking", flush = True)
                              return None
                          raise
                      print(f"[retry-sse] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          # ── 1. Standard OpenAI function calling ──────────────────────
          weather_tool = {
              "type": "function",
              "function": {
                  "name": "get_weather",
                  "description": "Get current weather for a city.",
                  "parameters": {
                      "type": "object",
                      "properties": {"city": {"type": "string"}},
                      "required": ["city"],
                  },
              },
          }

          status, data = post("/v1/chat/completions", {
              "messages":    [{"role": "user", "content": "What is the weather in Paris?"}],
              "tools":       [weather_tool],
              "tool_choice": "required",
              "stream":      False,
              "temperature": TEMP,
              "seed":        SEED,
              "max_tokens":  600,
          })
          assert status == 200, f"tool call status {status}: {data}"
          choice = data["choices"][0]
          tool_calls = (choice.get("message") or {}).get("tool_calls") or []
          if tool_calls:
              tc = tool_calls[0]
              assert tc["function"]["name"] == "get_weather", (
                  f"unexpected tool name: {tc['function']['name']!r}"
              )
              args = json.loads(tc["function"]["arguments"])
              assert args.get("city"), f"missing city arg: {args}"
              print(f"[tools] PASS function calling -> {tc['function']['name']}({args}) finish={choice.get('finish_reason')!r}")
          else:
              print(
                  f"[tools] WARN function calling: no tool_calls (finish_reason="
                  f"{choice.get('finish_reason')!r}); HTTP path OK, model output drift."
              )

          # ── 2. Server-side python tool ───────────────────────────────
          # Bound each soft probe to a single 180s attempt (timeout=180,
          # retries=0): this job runs two of them back-to-back under a
          # 30-minute cap, so the default 600+15+300s per stall could hit
          # the workflow timeout before the thinking checks run. A soft
          # probe only WARNs anyway, so a retry buys nothing.
          content = post_sse("/v1/chat/completions", {
              "messages":      [{"role": "user", "content": "What is 123 * 456? Use the python tool to compute it and tell me the number."}],
              "enable_tools":  True,
              "permission_mode": "full",
              "enabled_tools": ["python"],
              "session_id":    "ci-tool-calling-py",
              "temperature":   TEMP,
              "seed":          SEED,
              "max_tokens":    600,
          }, timeout = 180, retries = 0, soft = True)
          if content is None:
              print("[tools] WARN python tool: SSE transport stalled after retries -- non-blocking")
          elif "56088" in content or "56,088" in content:
              print(f"[tools] PASS python tool ({len(content)} chars, found 56088)")
          else:
              assert content, "python tool: SSE stream empty"
              print(
                  f"[tools] WARN python tool: SSE OK ({len(content)} chars) but "
                  f"model didn't return 56088 -- model output drift"
              )

          # ── 3. Server-side bash (terminal) tool ──────────────────────
          # On Windows the terminal tool resolves to the system shell
          # (cmd.exe wrapper) and `echo hello-bash-tool` works the same
          # way it does on POSIX. The model still has to choose to
          # invoke the tool; assert non-empty SSE if it doesn't.
          content = post_sse("/v1/chat/completions", {
              "messages":      [{"role": "user", "content": "Use the terminal tool to run `echo hello-bash-tool` and tell me the exact output."}],
              "enable_tools":  True,
              "permission_mode": "full",
              "enabled_tools": ["terminal"],
              "session_id":    "ci-tool-calling-bash",
              "temperature":   TEMP,
              "seed":          SEED,
              "max_tokens":    600,
          }, timeout = 180, retries = 0, soft = True)
          if content is None:
              print("[tools] WARN terminal tool: SSE transport stalled after retries -- non-blocking")
          elif "hello-bash-tool" in content:
              print(f"[tools] PASS terminal tool ({len(content)} chars)")
          else:
              assert content, "terminal tool: SSE stream empty"
              print(
                  f"[tools] WARN terminal tool: SSE OK ({len(content)} chars) but "
                  f"model didn't echo 'hello-bash-tool' -- model output drift"
              )

          # ── 4. Server-side web_search tool ───────────────────────────
          # DuckDuckGo can be flaky from CI runners; only assert that
          # the SSE stream opens and yields any data.
          try:
              content = post_sse("/v1/chat/completions", {
                  "messages":      [{"role": "user", "content": "Search the web for 'unsloth ai github' and summarise."}],
                  "enable_tools":  True,
                  "permission_mode": "full",
                  "enabled_tools": ["web_search"],
                  "session_id":    "ci-tool-calling-web",
                  "temperature":   TEMP,
                  "seed":          SEED,
                  "max_tokens":    400,
              }, timeout = 180, retries = 0)
              print(f"[tools] PASS web_search stream ({len(content)} chars)")
          except Exception as exc:
              print(f"[tools] WARN web_search probe failed (non-blocking): {exc}")

          # ── 5. Thinking on / off ─────────────────────────────────────
          def thinking_call(enable):
              status, data = post("/v1/chat/completions", {
                  "messages":        [{"role": "user", "content": "Briefly: is 17 prime?"}],
                  "stream":          False,
                  "enable_thinking": enable,
                  "temperature":     TEMP,
                  "seed":            SEED,
                  "max_tokens":      300,
              })
              assert status == 200
              msg = data["choices"][0]["message"]
              raw = (msg.get("content") or "") + (msg.get("reasoning_content") or "")
              return raw

          on_text  = thinking_call(True)
          off_text = thinking_call(False)
          had_think_on = ("<think>" in on_text) or len(on_text) > 80
          if not had_think_on:
              print(
                  f"[tools] WARN enable_thinking=True produced no thinking signal: "
                  f"{on_text[:200]!r}"
              )
          assert "<think>" not in off_text, (
              f"enable_thinking=False but <think> still present: {off_text!r}"
          )
          print(f"[tools] PASS thinking on/off (on={len(on_text)} chars, off={len(off_text)} chars)")
          PY

      - name: Stop Unsloth
        if: always()
        # pwsh, not Git Bash (it exits 143 from kill/sleep blocks). Kill by listening port, since
        # $! is an MSYS pid, then by command line for a server that never bound its port.
        # Failures are swallowed so teardown never fails the job.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $port = $env:STUDIO_PORT
          $owners = (Get-NetTCPConnection -LocalPort $port -State Listen).OwningProcess |
                    Sort-Object -Unique
          foreach ($owner in $owners) {
            try {
              $p = Get-Process -Id $owner
              Write-Host "stopping pid $owner ($($p.ProcessName)) on port $port"
              Stop-Process -Id $owner -Force
            } catch {
              Write-Host "pid $owner already gone"
            }
          }
          $stragglers = Get-CimInstance Win32_Process |
                        Where-Object { $_.CommandLine -match 'unsloth' -and
                                       $_.CommandLine -match 'studio' -and
                                       $_.ProcessId -notin $owners }
          foreach ($s in $stragglers) {
            Write-Host "stopping unbound pid $($s.ProcessId): $($s.CommandLine)"
            Stop-Process -Id $s.ProcessId -Force
          }
          Start-Sleep -Seconds 2
          if ((Get-NetTCPConnection -LocalPort $port -State Listen)) {
            Write-Host "note: something is still listening on $port"
          } else {
            Write-Host "port $port is free"
          }
          exit 0

      - name: Collect llama-server logs
        if: always()
        # A transient DLL-init crash (0xC0000142) in this diagnostic copy must not fail the job.
        continue-on-error: true
        shell: bash
        # Copy llama-server's own logs; the backend traceback only shows the symptom.
        run: |
          mkdir -p logs/llama-server
          cp -v ~/.unsloth/studio/logs/llama-server/*.log logs/llama-server/ 2>/dev/null || \
            echo "no llama-server logs to collect"

      - name: Upload logs
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-tool-calling-log
          path: |
            logs/studio_tools.log
            logs/install.log
            logs/llama-server/*.log
          retention-days: 7

      - name: Phase 3 environment (JSON + vision)
        # Without this gate the step would ride success() while gated steps ran with the
        # previous phase's model, port and HF_HOME.
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.sdks.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/Qwen3-VL-2B-Instruct-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-IQ2_XXS" >> "$GITHUB_ENV"
          echo "GGUF_FILE=Qwen3-VL-2B-Instruct-UD-IQ2_XXS.gguf" >> "$GITHUB_ENV"
          echo "MMPROJ_FILE=mmproj-F16.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18899" >> "$GITHUB_ENV"
          echo "HF_HOME=${{ github.workspace }}/hf-cache-vision" >> "$GITHUB_ENV"

      # Suffix bumped with the path rename: same key + different `path` never restores.
      - name: Restore HF_HOME cache for unsloth/Qwen3-VL-2B-Instruct-GGUF (model + mmproj)
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.sdks.outcome == 'success' }}
        id: cache-hf-vision
        timeout-minutes: 20
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache-vision
          key: ${{ runner.os }}-hf-unsloth/Qwen3-VL-2B-Instruct-GGUF-UD-IQ2_XXS-mmproj-F16.gguf-v3

      - name: Prime HF_HOME with the GGUF + mmproj
        id: prime-hf-vision
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.sdks.outcome == 'success' && (steps.cache-hf-vision.outputs.cache-hit != 'true' || steps.cache-hf-vision.outcome != 'success') }}
        timeout-minutes: 20
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache-vision
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$MMPROJ_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME cache for unsloth/Qwen3-VL-2B-Instruct-GGUF (model + mmproj)
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf-vision.outcome == 'success'
        timeout-minutes: 20
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache-vision
          key: ${{ runner.os }}-hf-unsloth/Qwen3-VL-2B-Instruct-GGUF-UD-IQ2_XXS-mmproj-F16.gguf-v3

      - name: Reset auth + boot Unsloth (API-only)
        id: boot-vision
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.sdks.outcome == 'success' && steps.prime-hf-vision.outcome != 'failure' }}
        timeout-minutes: 2
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port "$STUDIO_PORT" --log logs/studio_vision.log

      - name: Wait for /api/health, log in, change password, load model
        id: ready-vision
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.sdks.outcome == 'success' && steps.boot-vision.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIJson-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          LOAD_OK=0
          for attempt in 1 2 3; do
            HTTP=$(curl -s -o /tmp/load.json -w '%{http_code}' \
              -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              --max-time 900 \
              -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048}")
            if [ "$HTTP" = "200" ]; then LOAD_OK=1; break; fi
            echo "::warning::/api/inference/load attempt $attempt returned $HTTP; response:"
            cat /tmp/load.json || true
            sleep 10
          done
          [ "$LOAD_OK" = "1" ] || { echo "::error::/api/inference/load failed 3 attempts"; exit 22; }
          jq '{status, display_name, is_vision}' /tmp/load.json

      - name: JSON schema decoding + image input
        if: ${{ !cancelled() && steps.shim.outcome == 'success' && steps.sdks.outcome == 'success' && steps.ready-vision.outcome == 'success' }}
        timeout-minutes: 15
        env:
          BASE_URL: http://127.0.0.1:18899
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from openai import OpenAI
          from anthropic import Anthropic

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407
          TEMP = 0.2

          def post(path, body, *, timeout = 240):
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = json.dumps(body).encode(),
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type":  "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          # ── 1. response_format = json_object (JSON mode) ─────────────
          status, data = post("/v1/chat/completions", {
              "model":         "default",
              "messages":      [
                  {"role": "system", "content": 'Reply with a single JSON object of the form {"city": "...", "country": "..."}. Output ONLY the JSON, nothing else.'},
                  {"role": "user",   "content": "What is the capital of France?"},
              ],
              "temperature":     TEMP,
              "max_tokens":      600,
              "seed":            SEED,
              "stream":          False,
              "enable_thinking": False,
              "response_format": {"type": "json_object"},
          }, timeout = 600)
          assert status == 200, f"json status {status}: {data}"
          assert (
              isinstance(data.get("choices"), list)
              and data["choices"]
              and "message" in data["choices"][0]
          ), f"json response envelope malformed: {data}"
          content = (data["choices"][0]["message"].get("content") or "").strip()
          print(f"[json] raw json_object content: {content!r}")
          if content.startswith("```"):
              content = content.split("```", 2)[1]
              if content.startswith("json"):
                  content = content[4:]
              content = content.strip("`\n ")
          if content:
              try:
                  parsed = json.loads(content)
                  if "paris" in str(parsed.get("city", "")).lower():
                      print(f"[json] PASS json_object -> {parsed}")
                  else:
                      print(f"[json] WARN json_object decoded but city!=Paris: {parsed}")
              except json.JSONDecodeError as exc:
                  print(f"[json] WARN json_object content not parseable ({exc}); content={content!r}")
          else:
              print("[json] WARN json_object produced empty content")

          status2, data2 = post("/v1/chat/completions", {
              "model":         "default",
              "messages":      [{"role": "user", "content": "What is the capital of France? Answer with one word."}],
              "temperature":     TEMP,
              "max_tokens":      400,
              "seed":            SEED,
              "stream":          False,
              "enable_thinking": False,
          }, timeout = 600)
          assert status2 == 200, f"plain status {status2}: {data2}"
          plain = (data2["choices"][0]["message"].get("content") or "").lower()
          print(f"[json] plain capital-of-france reply: {plain!r}")
          if "paris" in plain:
              print("[json] PASS plain inference path (paris mentioned)")
          else:
              print(
                  f"[json] WARN plain inference returned no 'paris' -- "
                  f"model output drift. HTTP path validated separately above."
              )

          # ── 2. OpenAI image_url (data URI base64) ───────────────────
          PNG_64X64_RED_B64 = (
              "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYklEQVR4nO3PMQ0AIADAMEAI/k"
              "UhBhEcDcmqYJtn7/GzpQNeNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA"
              "1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaBdCJ0BmMJ25zMAAAAASUVORK5CYII="
          )
          data_uri = f"data:image/png;base64,{PNG_64X64_RED_B64}"

          # On Windows + the Qwen3-VL mmproj, llama.cpp's vision
          # path runs on CPU (no Metal involvement). The wrapper is
          # kept for resilience but the vision path is expected to
          # work on Windows; an exception here is a real regression.
          client = OpenAI(base_url = f"{BASE}/v1", api_key = KEY)
          try:
              openai_resp = client.chat.completions.create(
                  model       = "default",
                  temperature = TEMP,
                  max_tokens  = 80,
                  seed        = SEED,
                  messages    = [{
                      "role": "user",
                      "content": [
                          {"type": "image_url", "image_url": {"url": data_uri}},
                          {"type": "text",      "text": "What colour dominates this image? Reply in one word."},
                      ],
                  }],
              )
              openai_text = (openai_resp.choices[0].message.content or "").lower()
              print(f"[image/openai] reply: {openai_text!r}")
              if openai_text:
                  print("[image/openai] PASS image_url accepted, non-empty response")
              else:
                  print("[image/openai] WARN image_url accepted but empty content")
          except Exception as exc:
              print(
                  f"[image/openai] WARN image_url SDK call raised: {type(exc).__name__}: "
                  f"{exc}. Unsloth successfully forwarded the request; failure here is "
                  f"upstream llama.cpp vision behaviour."
              )

          # ── 3. Anthropic source/base64 image ────────────────────────
          anthropic = Anthropic(
              base_url        = BASE,
              api_key         = "unused",
              default_headers = {"Authorization": f"Bearer {KEY}"},
          )
          try:
              a_msg = anthropic.messages.create(
                  model       = "default",
                  max_tokens  = 80,
                  # anthropic 1.x rejects a top-level temperature; extra_body sends the same JSON.
                  extra_body  = {"temperature": TEMP, "seed": SEED},
                  messages    = [{
                      "role": "user",
                      "content": [
                          {
                              "type":   "image",
                              "source": {
                                  "type":       "base64",
                                  "media_type": "image/png",
                                  "data":       PNG_64X64_RED_B64,
                              },
                          },
                          {"type": "text", "text": "Describe this image briefly."},
                      ],
                  }],
              )
              a_text = "".join(b.text for b in a_msg.content if getattr(b, "type", None) == "text")
              print(f"[image/anthropic] reply: {a_text!r}")
              if a_text:
                  print("[image/anthropic] PASS source/base64 accepted, non-empty response")
              else:
                  print("[image/anthropic] WARN source/base64 accepted but empty content")
          except Exception as exc:
              print(
                  f"[image/anthropic] WARN anthropic image SDK call raised: "
                  f"{type(exc).__name__}: {exc}. Likely upstream llama.cpp vision "
                  f"behaviour, NOT an Unsloth regression."
              )
          PY

      - name: Stop Unsloth
        if: always()
        # pwsh, not Git Bash (it exits 143 from kill/sleep blocks). Kill by listening port, since
        # $! is an MSYS pid, then by command line for a server that never bound its port.
        # Failures are swallowed so teardown never fails the job.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $port = $env:STUDIO_PORT
          $owners = (Get-NetTCPConnection -LocalPort $port -State Listen).OwningProcess |
                    Sort-Object -Unique
          foreach ($owner in $owners) {
            try {
              $p = Get-Process -Id $owner
              Write-Host "stopping pid $owner ($($p.ProcessName)) on port $port"
              Stop-Process -Id $owner -Force
            } catch {
              Write-Host "pid $owner already gone"
            }
          }
          $stragglers = Get-CimInstance Win32_Process |
                        Where-Object { $_.CommandLine -match 'unsloth' -and
                                       $_.CommandLine -match 'studio' -and
                                       $_.ProcessId -notin $owners }
          foreach ($s in $stragglers) {
            Write-Host "stopping unbound pid $($s.ProcessId): $($s.CommandLine)"
            Stop-Process -Id $s.ProcessId -Force
          }
          Start-Sleep -Seconds 2
          if ((Get-NetTCPConnection -LocalPort $port -State Listen)) {
            Write-Host "note: something is still listening on $port"
          } else {
            Write-Host "port $port is free"
          }
          exit 0

      - name: Collect llama-server logs
        if: always()
        # A transient DLL-init crash (0xC0000142) in this diagnostic copy must not fail the job.
        continue-on-error: true
        shell: bash
        # Copy llama-server's own logs; the backend traceback only shows the symptom.
        run: |
          mkdir -p logs/llama-server
          cp -v ~/.unsloth/studio/logs/llama-server/*.log logs/llama-server/ 2>/dev/null || \
            echo "no llama-server logs to collect"

      - name: Upload logs
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-json-images-log
          path: |
            logs/studio_vision.log
            logs/install.log
            logs/llama-server/*.log
          retention-days: 7

  # Install and run with no Visual Studio.
  no-vs-cpu:
    name: Unsloth install + inference without Visual Studio
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      GGUF_REPO: unsloth/gemma-3-270m-it-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GGUF_FILE: gemma-3-270m-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18820'
      HF_HOME: ${{ github.workspace }}/hf-cache
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # Cross-OS key: the hf-cache tree is byte-identical on every OS.
      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        id: cache-hf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Pre-install Windows tweaks (npm 11 + Defender exclusions)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          npm install -g 'npm@^11' 2>&1 | Out-Host
          foreach ($p in @(
            "$env:USERPROFILE\.unsloth",
            "$env:USERPROFILE\AppData\Local\uv",
            "$env:GITHUB_WORKSPACE\studio\frontend\node_modules",
            "$env:GITHUB_WORKSPACE\studio\frontend\dist"
          )) {
            try { Add-MpPreference -ExclusionPath $p -ErrorAction Stop } catch { }
          }

      - name: Prepare no-build-tools simulation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'no-build-tools'
          $pf = Join-Path $root 'ProgramFiles'
          $pfx86 = Join-Path $root 'ProgramFilesx86'
          New-Item -ItemType Directory -Force -Path $pf, $pfx86 | Out-Null

          $blocked = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($tool in @('cmake', 'cl.exe')) {
            foreach ($cmd in (Get-Command $tool -All -ErrorAction SilentlyContinue)) {
              if ($cmd.Source) {
                $dir = Split-Path -Parent $cmd.Source
                if ($dir) {
                  [void] $blocked.Add(
                    [Environment]::ExpandEnvironmentVariables($dir).Trim().Trim('"').TrimEnd('\'))
                }
              }
            }
          }
          # Normalized so registry spellings (trailing slash, unexpanded %VAR%) still match.
          function Test-Blocked([string]$p) {
            $n = [Environment]::ExpandEnvironmentVariables($p).Trim().Trim('"').TrimEnd('\')
            return $blocked.Contains($n)
          }

          $pathParts = $env:Path -split [IO.Path]::PathSeparator |
            Where-Object { $_ -and -not (Test-Blocked $_) }
          $noBuildToolsPath = $pathParts -join [IO.Path]::PathSeparator

          # The installers rebuild the session Path from these scopes, so filter them too.
          foreach ($scope in @('Machine', 'User')) {
            $orig = [Environment]::GetEnvironmentVariable('Path', $scope)
            if (-not $orig) { continue }
            Set-Content -LiteralPath (Join-Path $root "orig-path-$scope.txt") -Value $orig -NoNewline
            $kept = ($orig -split ';' | Where-Object { $_ -and -not (Test-Blocked $_) }) -join ';'
            [Environment]::SetEnvironmentVariable('Path', $kept, $scope)
            Write-Host "Filtered $scope Path scope."
          }

          "NO_BUILD_TOOLS_PROGRAMFILES=$pf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NO_BUILD_TOOLS_PROGRAMFILES_X86=$pfx86" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NO_BUILD_TOOLS_PATH<<NO_BUILD_TOOLS_PATH_EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $noBuildToolsPath | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NO_BUILD_TOOLS_PATH_EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "ProgramFiles simulation root: $pf"
          Write-Host "ProgramFiles(x86) simulation root: $pfx86"
          if ($blocked.Count -gt 0) {
            Write-Host "Removed build-tool PATH dirs:"
            $blocked | Sort-Object | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "No cmake or cl.exe PATH dirs found to remove."
          }

      - name: Assert Visual Studio + CMake are genuinely undetectable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Set in-script: step-level env keys with parentheses (`ProgramFiles(x86)`) are not applied.
          if (-not $env:NO_BUILD_TOOLS_PROGRAMFILES) { Write-Error "NO_BUILD_TOOLS_* env missing (Prepare step did not run?)"; exit 1 }
          $env:ProgramFiles = $env:NO_BUILD_TOOLS_PROGRAMFILES
          ${env:ProgramFiles(x86)} = $env:NO_BUILD_TOOLS_PROGRAMFILES_X86
          $env:Path = $env:NO_BUILD_TOOLS_PATH
          . (Join-Path $env:GITHUB_WORKSPACE 'tests/studio_setup_ps1/Get-FunctionSource.ps1')
          $setup = Join-Path $env:GITHUB_WORKSPACE 'studio/setup.ps1'
          foreach ($fn in @('Resolve-VsGeneratorFromLabel', 'Find-VsBuildTools')) {
            . ([scriptblock]::Create((Get-FunctionSource -Path $setup -Name $fn)))
          }
          $vs = Find-VsBuildTools
          if ($vs) { Write-Error "Find-VsBuildTools still detects VS: $($vs.Generator) @ $($vs.InstallPath)"; exit 1 }
          if (Get-Command cmake -ErrorAction SilentlyContinue) { Write-Error "cmake is still on PATH"; exit 1 }
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) { Write-Error "cl.exe is still on PATH"; exit 1 }
          Write-Host "Confirmed: no Visual Studio, no cmake, no cl.exe."

      - name: PyTorch CPU wheel installs and imports (no Visual Studio)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -c "import torch; print('torch', torch.__version__, 'cuda?', torch.cuda.is_available())"

      - name: Install Unsloth (--local, --no-torch) with no build tools present
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          $env:ProgramFiles = $env:NO_BUILD_TOOLS_PROGRAMFILES
          ${env:ProgramFiles(x86)} = $env:NO_BUILD_TOOLS_PROGRAMFILES_X86
          $env:Path = $env:NO_BUILD_TOOLS_PATH
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          # Child process so output reaches the log; -Command because $ProgressPreference is not
          # inherited.
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          # Timestamps go to the step log only; logs/install.log keeps raw output.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 |
            Tee-Object -FilePath logs/install.log |
            ForEach-Object { '[{0,4:N0}s] {1}' -f $sw.Elapsed.TotalSeconds, $_ }
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }

      - name: Assert prebuilt used AND no build tools were installed
        run: |
          LLAMA_DIR=~/.unsloth/llama.cpp
          INFO="$LLAMA_DIR/UNSLOTH_PREBUILT_INFO.json"
          BIN="$LLAMA_DIR/build/bin/Release/llama-server.exe"
          fail=0
          if grep -q "falling back to source build" logs/install.log; then
            echo "::error::install.ps1 fell back to source-build llama.cpp without VS."; fail=1
          fi
          # The deferred build-tool installs must NOT run on the prebuilt path.
          for pat in "Kitware.CMake" "Microsoft.VisualStudio.2022.BuildTools" "installing via winget"; do
            if grep -qi "$pat" logs/install.log; then
              echo "::error::unexpected build-tool install on the prebuilt path: '$pat'"; fail=1
            fi
          done
          [ -f "$INFO" ] || { echo "::error::no UNSLOTH_PREBUILT_INFO.json"; ls -la "$LLAMA_DIR" || true; fail=1; }
          [ -f "$BIN" ]  || { echo "::error::no llama-server.exe"; ls -la "$LLAMA_DIR/build/bin" || true; fail=1; }
          if [ "$fail" != "0" ]; then grep -iE "cmake|visual studio|prebuilt|source build" logs/install.log | tail -60; exit 1; fi
          echo "Prebuilt installed with no build tools:"
          cat "$INFO"

      - name: Add Unsloth shim to GITHUB_PATH
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          [ -f "$SHIM_DIR/unsloth.exe" ] || { echo "::error::unsloth.exe shim not found"; ls -la ~/.unsloth/studio/ || true; exit 1; }
          cygpath -w "$SHIM_DIR" >> "$GITHUB_PATH"

      - name: Reset auth + boot Unsloth (API-only)
        run: |
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT"

      - name: Wait for /api/health, log in, load the GGUF
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json || { tail -200 logs/studio.log; exit 1; }
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CINoVS-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          LOAD_OK=0
          for attempt in 1 2 3; do
            HTTP=$(curl -s -o /tmp/load.json -w '%{http_code}' \
              -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
              -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
              --max-time 600 \
              -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048}")
            if [ "$HTTP" = "200" ]; then LOAD_OK=1; break; fi
            echo "::warning::/api/inference/load attempt $attempt returned $HTTP"; cat /tmp/load.json || true; sleep 10
          done
          [ "$LOAD_OK" = "1" ] || { echo "::error::/api/inference/load failed 3 attempts"; exit 22; }
          jq '{status, display_name, is_gguf}' /tmp/load.json

      - name: Inference works via the prebuilt llama.cpp (no VS)
        run: |
          RESP=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/v1/chat/completions" \
            -H "Authorization: Bearer $API_KEY" -H 'content-type: application/json' \
            --max-time 240 \
            -d '{"model":"default","messages":[{"role":"user","content":"What is 1+1? Answer briefly."}],"temperature":0,"max_tokens":32,"stream":false}')
          echo "$RESP" | jq '.choices[0].message' || { echo "$RESP"; exit 1; }
          CONTENT=$(echo "$RESP" | jq -r '.choices[0].message.content')
          [ -n "$CONTENT" ] && [ "$CONTENT" != "null" ] || { echo "::error::empty completion"; exit 1; }
          echo "Inference OK without Visual Studio: $CONTENT"

      - name: Clean no-build-tools simulation
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'no-build-tools'
          foreach ($scope in @('Machine', 'User')) {
            $saved = Join-Path $root "orig-path-$scope.txt"
            if (Test-Path -LiteralPath $saved) {
              [Environment]::SetEnvironmentVariable('Path', (Get-Content -LiteralPath $saved -Raw), $scope)
              Write-Host "Restored $scope Path scope."
            }
          }
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue

      - name: Stop Unsloth
        if: always()
        shell: cmd
        run: echo Stop Unsloth (no-op; runner reclaims STUDIO_PID=%STUDIO_PID% at job end)

      - name: Collect llama-server logs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p logs/llama-server
          cp -v ~/.unsloth/studio/logs/llama-server/*.log logs/llama-server/ 2>/dev/null || echo "no llama-server logs"

      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-no-vs-cpu-log
          path: |
            logs/install.log
            logs/studio.log
            logs/llama-server/*.log
          retention-days: 7

  # One job per Windows image (the image is what is tested), to save scarce Windows slots.
  # The VC++ round-trip uninstalls the runtime, so it runs LAST in each box.
  small-checks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: setup.ps1 units, no-VS resolve, VC++ round-trip (windows-latest)
            phases: ' pester no-vs-gpu vcredist '
          - os: windows-2025-vs2026
            name: real-VS detection + VC++ round-trip (VS 2026)
            phases: ' vs-detect vcredist '
            label: 'VS 2026'
            expectGen: 'Visual Studio 18 2026'
            expectToolset: 'v180'
          - os: windows-2022
            name: real-VS detection (VS 2022)
            phases: ' vs-detect '
            label: 'VS 2022'
            expectGen: 'Visual Studio 17 2022'
            expectToolset: 'v170'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        # One step in the no-VS resolve phase relies on this default.
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: ${{ contains(matrix.phases, ' pester ') || contains(matrix.phases, ' no-vs-gpu ') }}
        with:
          python-version: '3.12'

      - name: Detect the real Visual Studio with setup.ps1 functions
        if: ${{ !cancelled() && contains(matrix.phases, ' vs-detect ') }}
        shell: pwsh
        env:
          EXPECT_GEN: ${{ matrix.expectGen }}
          EXPECT_TOOLSET: ${{ matrix.expectToolset }}
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'tests/studio_setup_ps1/Get-FunctionSource.ps1')
          $setup = Join-Path $env:GITHUB_WORKSPACE 'studio/setup.ps1'
          foreach ($fn in @('Resolve-VsGeneratorFromLabel', 'Get-VcBuildCustomizationsDir', 'Find-VsBuildTools')) {
              . ([scriptblock]::Create((Get-FunctionSource -Path $setup -Name $fn)))
          }

          $vsw = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsw) {
              $year = (& $vsw -latest -property catalog_productLineVersion 2>$null | Select-Object -First 1)
              $path = (& $vsw -latest -property installationPath 2>$null | Select-Object -First 1)
              Write-Host "Real vswhere: productLineVersion='$year'  installPath='$path'"
          } else {
              Write-Host "vswhere not present at $vsw (relying on filesystem fallback)"
          }

          $r = Find-VsBuildTools
          if (-not $r) { throw "Find-VsBuildTools returned null on a host with real $env:EXPECT_GEN" }
          Write-Host "Find-VsBuildTools -> Generator='$($r.Generator)' Source='$($r.Source)' InstallPath='$($r.InstallPath)'"
          if ($r.Generator -ne $env:EXPECT_GEN) {
              throw "Detection mismatch: got '$($r.Generator)', expected '$env:EXPECT_GEN'"
          }
          if (-not (Test-Path $r.InstallPath)) { throw "Detected InstallPath does not exist: $($r.InstallPath)" }

          $bc = Get-VcBuildCustomizationsDir -VsInstallPath $r.InstallPath -Generator $r.Generator
          $derived = Split-Path (Split-Path $bc -Parent) -Leaf   # e.g. v170 / v180
          Write-Host "Get-VcBuildCustomizationsDir -> '$bc' (toolset='$derived')"
          if ($derived -ne $env:EXPECT_TOOLSET) {
              throw "Toolset mismatch: derived '$derived', expected '$env:EXPECT_TOOLSET'"
          }

          $vcRoot = Join-Path $r.InstallPath 'MSBuild\Microsoft\VC'
          if (Test-Path $vcRoot) {
              $realToolsets = @((Get-ChildItem -Path $vcRoot -Directory -ErrorAction SilentlyContinue).Name)
              Write-Host "Real VC toolset dirs: $($realToolsets -join ', ')"
              if ($realToolsets -notcontains $derived) {
                  throw "Derived toolset '$derived' is not present on the real $env:EXPECT_GEN install (have: $($realToolsets -join ', '))"
              }
              Write-Host "OK: toolset '$derived' exists on the real VS install."
          } else {
              Write-Warning "VC MSBuild root absent ($vcRoot) - C++ workload not installed; skipping on-disk toolset check."
          }

          Write-Host "PASS: real $env:EXPECT_GEN detected correctly with toolset '$derived'."


      - name: Guard the Pester bootstrap
        if: ${{ !cancelled() && contains(matrix.phases, ' pester ') }}
        shell: bash
        run: |
          python -m pip install --quiet pyyaml pytest
          python -m pytest tests/studio/test_pester_bootstrap_hardening.py -q

      - name: Install Pester v5
        if: ${{ !cancelled() && contains(matrix.phases, ' pester ') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $moduleName = 'Pester'
          $minimum    = [version]'5.5.0'

          function Get-InstalledPester {
              Get-Module -ListAvailable -Name $moduleName |
                  Where-Object { $_.Version -ge $minimum } |
                  Sort-Object Version -Descending |
                  Select-Object -First 1
          }

          $installed = Get-InstalledPester
          if (-not $installed) {
              # Prefer PSResourceGet: the legacy path's nuget.exe bootstrap flakes on runners.
              $hasPSResourceGet = [bool](Get-Command Install-PSResource -ErrorAction SilentlyContinue)
              $usePSResourceGet = $hasPSResourceGet

              for ($attempt = 1; $attempt -le 3; $attempt++) {
                  try {
                      if ($usePSResourceGet) {
                          if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                              Register-PSResourceRepository -PSGallery
                          }
                          Install-PSResource -Name $moduleName -Version "[$minimum,)" `
                              -Repository PSGallery -TrustRepository -Scope CurrentUser
                      } else {
                          # Never silence this: a swallowed failure leaves PSGallery unregistered.
                          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                              Register-PSRepository -Default
                          }
                          Set-PSRepository PSGallery -InstallationPolicy Trusted
                          Install-Module $moduleName -MinimumVersion $minimum -Force `
                              -SkipPublisherCheck -Scope CurrentUser
                      }

                      $installed = Get-InstalledPester
                      if ($installed) { break }
                      throw "$moduleName >= $minimum still not present after install"
                  } catch {
                      Write-Host "::warning::$moduleName install attempt $attempt/3 failed: $($_.Exception.Message)"
                      if ($attempt -eq 3) { throw }
                      # The two clients fail independently, so alternate between them on retry.
                      if ($hasPSResourceGet) { $usePSResourceGet = -not $usePSResourceGet }
                      Start-Sleep -Seconds (5 * $attempt)
                  }
              }
          }

          Import-Module $moduleName -MinimumVersion $minimum -Force
          $loaded = Get-Module $moduleName
          if (-not $loaded -or $loaded.Version -lt $minimum) {
              throw "$moduleName >= $minimum failed to import"
          }
          $loaded | Select-Object Name, Version | Format-Table

      - name: Run Pester suite
        if: ${{ !cancelled() && contains(matrix.phases, ' pester ') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testDir = Join-Path $env:GITHUB_WORKSPACE 'tests/studio_setup_ps1'
          if (-not (Test-Path $testDir)) {
              Write-Error "Test directory not found: $testDir"
              exit 1
          }
          $cfg = New-PesterConfiguration
          $cfg.Run.Path                = $testDir
          $cfg.Run.Exit                = $true   # non-zero exit => job fails
          $cfg.Run.Throw               = $true   # also throw on test failure / 0 tests
          $cfg.TestResult.Enabled      = $true
          $cfg.TestResult.OutputFormat = 'NUnitXml'
          $cfg.TestResult.OutputPath   = Join-Path $env:GITHUB_WORKSPACE 'pester-results.xml'
          $cfg.Output.Verbosity        = 'Detailed'
          Invoke-Pester -Configuration $cfg

      - name: Upload Pester results
        if: ${{ always() && contains(matrix.phases, ' pester ') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pester-results-setup-ps1
          path: pester-results.xml
          if-no-files-found: warn


      - name: Prepare no-build-tools simulation
        if: ${{ !cancelled() && contains(matrix.phases, ' no-vs-gpu ') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'no-build-tools'
          $pf = Join-Path $root 'ProgramFiles'
          $pfx86 = Join-Path $root 'ProgramFilesx86'
          New-Item -ItemType Directory -Force -Path $pf, $pfx86 | Out-Null

          $blocked = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($tool in @('cmake', 'cl.exe')) {
            foreach ($cmd in (Get-Command $tool -All -ErrorAction SilentlyContinue)) {
              if ($cmd.Source) {
                $dir = Split-Path -Parent $cmd.Source
                if ($dir) { [void] $blocked.Add($dir) }
              }
            }
          }

          $pathParts = $env:Path -split [IO.Path]::PathSeparator |
            Where-Object { $_ -and -not $blocked.Contains($_) }
          $noBuildToolsPath = $pathParts -join [IO.Path]::PathSeparator

          "NO_BUILD_TOOLS_PROGRAMFILES=$pf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NO_BUILD_TOOLS_PROGRAMFILES_X86=$pfx86" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NO_BUILD_TOOLS_PATH<<NO_BUILD_TOOLS_PATH_EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $noBuildToolsPath | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NO_BUILD_TOOLS_PATH_EOF" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Windows CUDA and ROCm prebuilts exist in unslothai/llama.cpp (what GPU users download, no VS)
        if: ${{ !cancelled() && contains(matrix.phases, ' no-vs-gpu ') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/unslothai/llama.cpp/releases/latest" > /tmp/rel.json
          echo "release: $(jq -r .tag_name /tmp/rel.json)"
          ASSETS=$(jq -r '.assets[].name' /tmp/rel.json)
          echo "$ASSETS" | grep -iE 'windows-x64-cuda[0-9]' || {
            echo "::error::no Windows x64 CUDA prebuilt asset found in unslothai/llama.cpp latest release"
            echo "$ASSETS"; exit 1; }
          # No AMD GPU on hosted runners, so pin the Windows ROCm bundles' presence here.
          echo "$ASSETS" | grep -iE 'windows-x64-rocm-gfx' || {
            echo "::error::no Windows x64 ROCm (per-gfx) prebuilt asset found in unslothai/llama.cpp latest release"
            echo "$ASSETS"; exit 1; }
          echo "Windows CUDA and ROCm prebuilts are available -- GPU users get them without compiling."

      - name: The prebuilt resolver runs without Visual Studio
        if: ${{ !cancelled() && contains(matrix.phases, ' no-vs-gpu ') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # pwsh: bash cannot export `ProgramFiles(x86)`.
          $env:ProgramFiles = $env:NO_BUILD_TOOLS_PROGRAMFILES
          ${env:ProgramFiles(x86)} = $env:NO_BUILD_TOOLS_PROGRAMFILES_X86
          $env:Path = $env:NO_BUILD_TOOLS_PATH
          # Resolver-only: the point is that resolution needs no compiler.
          python -m pip install --upgrade huggingface_hub
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pip install huggingface_hub failed"; exit 1 }
          python studio/install_llama_prebuilt.py --resolve-prebuilt latest --output-format json > resolve.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::resolver exited non-zero"
            if (Test-Path resolve.json) { Get-Content resolve.json }
            exit 1
          }
          Get-Content resolve.json
          Write-Host "Prebuilt resolver ran with no Visual Studio present."

      - name: Clean no-build-tools simulation
        if: ${{ always() && contains(matrix.phases, ' no-vs-gpu ') }}
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'no-build-tools') -Recurse -Force -ErrorAction SilentlyContinue

  # setup.ps1 unit tests, real-VS detection and vcredist round-trip.

      - name: Detect present, fire on a clean box, and round-trip the install
        if: ${{ !cancelled() && contains(matrix.phases, ' vcredist ') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'tests/studio_setup_ps1/Get-FunctionSource.ps1')
          $setup = Join-Path $env:GITHUB_WORKSPACE 'studio/setup.ps1'
          $script:StudioVtOk = $false
          $script:UnslothVerbose = $false
          # Get-HostMachineArch is only reached on the absent path, so only the clean-box part needs it.
          foreach ($fn in @('Get-StudioAnsi', 'Write-StudioLine', 'Write-StudioStdoutMirror',
                            'step', 'substep',
                            'Invoke-SetupCommand', 'Refresh-Environment', 'Get-HostMachineArch',
                            'Test-VCRedistInstalled', 'Ensure-VCRedist')) {
              $src = Get-FunctionSource -Path $setup -Name $fn
              if (-not $src) { throw "Function '$fn' not found in setup.ps1" }
              . ([scriptblock]::Create($src))
          }

          $regKeys = @(
              'HKLM\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64',
              'HKLM\SOFTWARE\WOW6432Node\Microsoft\VisualStudio\14.0\VC\Runtimes\x64'
          )
          function Show-GroundTruth {
              $dll = Join-Path $env:SystemRoot 'System32\vcruntime140_1.dll'
              Write-Host ("  System32\vcruntime140_1.dll present: {0}" -f (Test-Path $dll))
              foreach ($k in $regKeys) {
                  $r = Get-ItemProperty -Path "HKLM:\$($k.Substring(5))" -ErrorAction SilentlyContinue
                  if ($r) { Write-Host ("  {0}: Installed={1} {2}.{3}" -f $k, $r.Installed, $r.Major, $r.Minor) }
                  else    { Write-Host ("  {0}: (absent)" -f $k) }
              }
          }

          Write-Host '== A. Detection on the stock runner (expect present) =='
          Show-GroundTruth
          if (-not (Test-VCRedistInstalled)) { throw 'Test-VCRedistInstalled reported ABSENT on a stock runner that ships the VC++ runtime (detection regression).' }
          Write-Host '  Test-VCRedistInstalled -> present  OK'

          Write-Host '== B. Genuinely clean box (restorable): detection must FIRE =='
          $scratch = Join-Path $env:RUNNER_TEMP 'cleanwin'
          New-Item -ItemType Directory -Force -Path (Join-Path $scratch 'System32') | Out-Null
          $backup = Join-Path $env:RUNNER_TEMP 'vcreg_backup'
          New-Item -ItemType Directory -Force -Path $backup | Out-Null
          $origSysRoot = $env:SystemRoot
          try {
              for ($i = 0; $i -lt $regKeys.Count; $i++) {
                  reg query $regKeys[$i] *> $null
                  if ($LASTEXITCODE -eq 0) {
                      reg export $regKeys[$i] (Join-Path $backup "$i.reg") /y *> $null
                      reg delete $regKeys[$i] /f *> $null
                  }
              }
              $env:SystemRoot = $scratch
              if (Test-VCRedistInstalled) { throw 'Detection still PRESENT after both signals were removed (it would never trigger an install on a clean box).' }
              Write-Host '  Test-VCRedistInstalled -> absent  OK (detection fires on a clean box)'
          } finally {
              $env:SystemRoot = $origSysRoot
              for ($i = 0; $i -lt $regKeys.Count; $i++) {
                  $f = Join-Path $backup "$i.reg"
                  if (Test-Path $f) { reg import $f *> $null }
              }
          }
          Show-GroundTruth
          if (-not (Test-VCRedistInstalled)) { throw 'Detection did not recover after restoring the registry (test restore bug).' }

          Write-Host '== C. Literal uninstall on this throwaway VM (official installer), observe detection =='
          # aka.ms CDN can truncate the response; retry and require a plausible size.
          $exe = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          $vcUrl = 'https://aka.ms/vs/17/release/vc_redist.x64.exe'
          $got = $false
          foreach ($attempt in 1..4) {
              try {
                  Remove-Item $exe -Force -ErrorAction SilentlyContinue
                  Invoke-WebRequest -Uri $vcUrl -OutFile $exe -UseBasicParsing -TimeoutSec 180
                  $size = (Get-Item $exe -ErrorAction Stop).Length
                  if ($size -lt 10MB) { throw "truncated download: $size bytes" }
                  $sig = Get-AuthenticodeSignature $exe
                  if ($sig.Status -ne 'Valid') { throw "signature is $($sig.Status)" }
                  Write-Host ("  vc_redist.x64.exe {0:N0} bytes, signed by {1}" -f $size, $sig.SignerCertificate.Subject)
                  $got = $true
                  break
              } catch {
                  Write-Host "  vc_redist download attempt $attempt failed: $($_.Exception.Message)"
                  if ($attempt -lt 4) { Start-Sleep -Seconds (10 * $attempt) }
              }
          }
          if (-not $got) { throw 'Could not download vc_redist.x64.exe after 4 attempts.' }
          Start-Process -FilePath $exe -ArgumentList '/uninstall', '/quiet', '/norestart' -Wait
          Show-GroundTruth
          Write-Host ("  Test-VCRedistInstalled after uninstall -> {0}" -f (Test-VCRedistInstalled))
          if (Test-VCRedistInstalled) {
              Write-Host '  Note: the Visual Studio on this image ref-counts the runtime, so the package'
              Write-Host '        uninstall is a no-op here; section B already proved detection on a clean box.'
          }

          Write-Host '== D. Restore via Ensure-VCRedist (winget product path), installer fallback if needed =='
          Ensure-VCRedist
          if (-not (Test-VCRedistInstalled)) {
              Write-Host '  winget path did not restore it; using the official installer to close the round trip.'
              Start-Process -FilePath $exe -ArgumentList '/install', '/quiet', '/norestart' -Wait
          }
          Show-GroundTruth
          if (-not (Test-VCRedistInstalled)) { throw 'VC++ runtime could not be restored after the uninstall round-trip.' }
          Write-Host '  Test-VCRedistInstalled -> present  OK'
          Write-Host 'PASS: detection is correct on a real install, fires on a clean box, and the install round-trip restores the runtime.'
