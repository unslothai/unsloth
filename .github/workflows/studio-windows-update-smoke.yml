# Windows update smoke: install.ps1 must pick the prebuilt llama.cpp, two updates must
# report it validated, and the server must still boot.

name: Windows Unsloth Update CI

on:
  pull_request:
    paths:
      - 'install.ps1'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - 'scripts/uninstall.ps1'
      - 'tests/studio/test_uninstall_*.ps1'
      - 'tests/studio/test_psmodulepath_normalization.ps1'
      - 'studio/setup.ps1'
      - 'studio/setup.bat'
      - 'studio/backend/requirements/**'
      - 'pyproject.toml'
      # First-order local imports of the installer entrypoints.
      - 'studio/nvidia_probe.py'
      - 'studio/prebuilt_core.py'
      - 'studio/backend/utils/**'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/audio_cpp_prebuilt_pins.json'
      - 'unsloth_cli/**'
      # Mirrors the frontend-dist-restore cache key; a miss makes setup.ps1 run the build.
      - 'studio/frontend/*'
      - 'studio/frontend/src/**'
      - 'studio/frontend/public/**'
      - '.github/workflows/studio-windows-update-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'install.ps1'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - 'scripts/uninstall.ps1'
      - 'tests/studio/test_uninstall_*.ps1'
      - 'tests/studio/test_psmodulepath_normalization.ps1'
      - 'studio/setup.ps1'
      - 'studio/setup.bat'
      - 'studio/backend/requirements/**'
      - 'pyproject.toml'
      - 'studio/nvidia_probe.py'
      - 'studio/prebuilt_core.py'
      - 'studio/backend/utils/**'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/audio_cpp_prebuilt_pins.json'
      - 'unsloth_cli/**'
      - 'studio/frontend/*'
      - 'studio/frontend/src/**'
      - 'studio/frontend/public/**'
      - '.github/workflows/studio-windows-update-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  update-idempotency:
    name: Unsloth Updating Tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Windows defaults to cp1252 and the tools print a non-ASCII checkmark.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: uninstall.ps1 unit tests (argument guard, dual-install icon preserve)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/studio/test_uninstall_arg_guard.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/studio/test_uninstall_dual_install_icon.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Refresh-Environment must not reload PSModulePath over the prepended 5.1 module dir.
      - name: PSModulePath normalization unit tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_psmodulepath_normalization.ps1

      # powershell.exe covers Windows PowerShell 5.1, which differs from pwsh 7 on native stderr.
      - name: uninstall.ps1 argument guard under Windows PowerShell 5.1
        shell: powershell
        run: |
          powershell -NoProfile -File tests/studio/test_uninstall_arg_guard.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          # No pip cache: the installers use uv, and setup-python's post-step would fail.

      - name: Pre-install Windows tweaks (npm 11 + Defender exclusions)
        shell: pwsh
        # npm 11 flips setup.ps1's Node decision to "system" (Vite 8 needs npm >= 11), avoiding
        # a Node download. Defender exclusions remove per-file scan latency on the install dirs;
        # wrapped in try/catch so a permission flake does not break the install.
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "npm version before upgrade: $(npm -v)"
          npm install -g 'npm@^11' 2>&1 | Out-Host
          Write-Host "npm version after upgrade: $(npm -v)"
          # Do NOT pre-create these: a fresh empty dist is newer than every source, so setup.ps1
          # skips the rebuild. Add-MpPreference accepts paths that do not exist yet.
          foreach ($p in @(
            "$env:USERPROFILE\.unsloth",
            "$env:USERPROFILE\AppData\Local\uv",
            "$env:GITHUB_WORKSPACE\studio\frontend\node_modules",
            "$env:GITHUB_WORKSPACE\studio\frontend\dist"
          )) {
            try {
              Add-MpPreference -ExclusionPath $p -ErrorAction Stop
              Write-Host "Defender exclusion added: $p"
            } catch {
              Write-Host "Defender exclusion skipped ($($_.Exception.Message)): $p"
            }
          }

      # The dist key hashes the paths setup.ps1 checks before rebuilding (see
      # .github/actions/frontend-dist-restore). install.ps1 preserves the exported UV_CACHE_DIR.
      - name: Restore the uv download cache
        id: uv-cache
        uses: ./.github/actions/uv-cache-restore

      - name: Restore the built frontend
        id: fe-dist
        uses: ./.github/actions/frontend-dist-restore

      - name: Install Unsloth (--local, --no-torch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          # install.ps1 runs as a CHILD process so its [Console]::Out output reaches Tee-Object.
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          # Timestamps go to the step log only; logs/install.log keeps raw output.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 |
            Tee-Object -FilePath logs/install.log |
            ForEach-Object { '[{0,4:N0}s] {1}' -f $sw.Elapsed.TotalSeconds, $_ }
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }

      # Asserts a cache hit was reused (a `building frontend` line fails the job); saves on main.
      - name: Save the built frontend
        uses: ./.github/actions/frontend-dist-save
        with:
          cache-hit: ${{ steps.fe-dist.outputs.cache-hit }}
          key: ${{ steps.fe-dist.outputs.key }}

      - name: Save the uv download cache
        uses: ./.github/actions/uv-cache-save
        with:
          cache-hit: ${{ steps.uv-cache.outputs.cache-hit }}
          key: ${{ steps.uv-cache.outputs.key }}

      - name: Assert install.ps1 used the Windows llama.cpp prebuilt
        run: |
          # Check the filesystem, not a marker from a particular process.
          LLAMA_DIR=~/.unsloth/llama.cpp
          INFO="$LLAMA_DIR/UNSLOTH_PREBUILT_INFO.json"
          BIN="$LLAMA_DIR/build/bin/Release/llama-server.exe"
          if grep -q "falling back to source build" logs/install.log; then
            echo "::error::install.ps1 fell back to source-build llama.cpp on Windows."
            grep -E "llama-prebuilt|llama.cpp" logs/install.log | tail -60
            exit 1
          fi
          if [ ! -f "$INFO" ]; then
            echo "::error::no UNSLOTH_PREBUILT_INFO.json at $INFO."
            ls -la "$LLAMA_DIR" || true
            exit 1
          fi
          if [ ! -f "$BIN" ]; then
            echo "::error::no llama-server.exe at $BIN."
            ls -la "$LLAMA_DIR/build/bin" || true
            exit 1
          fi
          echo "install.ps1 installed the Windows prebuilt llama.cpp:"
          cat "$INFO"

      - name: Add Unsloth shim to GITHUB_PATH
        run: |
          SHIM_DIR=~/.unsloth/studio/bin
          if [ ! -f "$SHIM_DIR/unsloth.exe" ]; then
            echo "::error::unsloth.exe shim not found at $SHIM_DIR"
            ls -la ~/.unsloth/studio/ || true
            exit 1
          fi
          cygpath -w "$SHIM_DIR" >> "$GITHUB_PATH"

      - name: First update should be a no-op (prebuilt already validated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          set -o pipefail
          # Timestamps go to the step log only; logs/update.log is unchanged.
          unsloth studio update --local 2>&1 \
            | tee logs/update.log \
            | while IFS= read -r line || [ -n "$line" ]; do
                printf '[%4ds] %s\n' "$SECONDS" "$line"
              done
          if grep -q "falling back to source build" logs/update.log; then
            echo "::error::studio update fell back to source-build llama.cpp on Windows."
            grep -E "llama-prebuilt|llama.cpp" logs/update.log | tail -60
            exit 1
          fi
          if ! grep -qE "prebuilt up to date and validated|prebuilt installed and validated" logs/update.log; then
            echo "::error::no prebuilt up-to-date marker in update.log."
            grep -E "llama-prebuilt|llama.cpp" logs/update.log | tail -60
            exit 1
          fi
          echo "update path took the prebuilt fast path"

      - name: Update must keep the --no-torch install GGUF-only
        run: |
          # setup.ps1 must recover --no-torch from the manifest or it deletes its own venv. The skip
          # line only prints when the dependency pass runs.
          if grep -q "running ordered dependency installation" logs/update.log \
             && ! grep -q "skipping direct PyTorch and Triton installation (no-torch mode)" logs/update.log; then
            echo "::error::studio update left no-torch mode; it would reinstall PyTorch."
            grep -iE "no-torch|stale venv|PyTorch" logs/update.log | tail -40
            exit 1
          fi
          PY="$HOME/.unsloth/studio/unsloth_studio/Scripts/python.exe"
          if [ ! -f "$PY" ]; then
            echo "::error::studio venv interpreter missing at $PY"
            exit 1
          fi
          if "$PY" -c "import torch" 2>/dev/null; then
            echo "::error::torch was reinstalled into the --no-torch venv."
            exit 1
          fi
          echo "update preserved no-torch mode"

      - name: Second update must also be a no-op
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          set -o pipefail
          # Timestamps go to the step log only; logs/update2.log is unchanged.
          unsloth studio update --local 2>&1 \
            | tee logs/update2.log \
            | while IFS= read -r line || [ -n "$line" ]; do
                printf '[%4ds] %s\n' "$SECONDS" "$line"
              done
          grep -q "falling back to source build" logs/update2.log && {
              echo "::error::second update fell back to source build on Windows"
              tail -60 logs/update2.log; exit 1; } || true
          grep -qE "prebuilt up to date and validated|prebuilt installed and validated" logs/update2.log
          echo "second update was clean"

      - name: Boot Unsloth briefly to confirm the install is still usable
        run: |
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p 18891 \
            > logs/studio.log 2>&1 &
          PID=$!
          HEALTHY=""
          # jq, not python: MSYS and native Windows resolve `/tmp` to different directories.
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18891/api/health > /tmp/health.json; then
              if jq -e '.status == "healthy"' /tmp/health.json >/dev/null; then
                HEALTHY=1
                break
              fi
            fi
            sleep 1
          done
          if [ -z "$HEALTHY" ]; then
            echo "Unsloth failed to come up after \`update\`"
            tail -200 logs/studio.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          echo "post-update Unsloth /api/health OK"

      - name: Uninstall and verify clean
        # Round-trip scripts/uninstall.ps1 to catch new install locations it misses.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          if (-not (Test-Path "$PWD\scripts\uninstall.ps1")) {
            Write-Host "scripts/uninstall.ps1 not present in this tree; skipping round-trip"
            "" | Set-Content logs/uninstall.log
            exit 0
          }
          pwsh -NoProfile -File "$PWD\scripts\uninstall.ps1" *>&1 | Tee-Object -FilePath logs/uninstall.log
          $leak = 0
          foreach ($p in @(
            "$env:USERPROFILE\.unsloth\studio",
            "$env:USERPROFILE\.unsloth\studio\unsloth_studio",
            "$env:USERPROFILE\.unsloth\studio\bin\unsloth.exe",
            "$env:USERPROFILE\.unsloth\whisper.cpp",
            "$env:USERPROFILE\.unsloth\audio.cpp",
            "$env:USERPROFILE\.unsloth\.llama.cpp.install.lock",
            "$env:USERPROFILE\.unsloth\.node.install.lock",
            "$env:USERPROFILE\.unsloth\.whisper.cpp.install.lock",
            "$env:USERPROFILE\.unsloth\.audio.cpp.install.lock"
          )) {
            if (Test-Path -LiteralPath $p) {
              Write-Host "::error::leak: $p"
              $leak++
            }
          }
          # Nothing but Unsloth writes under ~/.unsloth, so anything left was missed.
          if (Test-Path -LiteralPath "$env:USERPROFILE\.unsloth") {
            Write-Host "::error::leak: ~/.unsloth survived the uninstall"
            Get-ChildItem -LiteralPath "$env:USERPROFILE\.unsloth" -Force -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 40 -ExpandProperty FullName
            $leak++
          }
          if ($leak -gt 0) { exit 1 }
          pwsh -NoProfile -File "$PWD\scripts\uninstall.ps1" *>&1 | Select-Object -Last 5
          pwsh -NoProfile -File "$PWD\scripts\uninstall.ps1" *>&1 | Select-Object -Last 5
          Write-Host "PASS: windows install -> update -> uninstall round-trip clean"

      - name: Upload update logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-studio-update-log
          path: |
            logs/install.log
            logs/update.log
            logs/update2.log
            logs/studio.log
            logs/uninstall.log
          retention-days: 7
