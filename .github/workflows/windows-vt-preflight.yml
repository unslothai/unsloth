# Measurement only: does $Host.UI.SupportsVirtualTerminal agree with the native console
# checks, so the native VT code in the installers can be removed? Steps are redirected,
# so the console case runs under conhost.exe and reports through a file.

name: "Windows: virtual terminal preflight"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/Probe-VirtualTerminal.ps1'
      - '.github/workflows/windows-vt-preflight.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: "property vs native call (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      # Every hosted Windows image: VT behaviour comes from the OS. fail-fast off so one UNSAFE
      # answer keeps its comparison.
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Measure with stdout redirected, and with a real console
        shell: pwsh
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          $probe = (Resolve-Path '.github/scripts/Probe-VirtualTerminal.ps1').Path
          $outDir = Join-Path $env:RUNNER_TEMP 'vt-preflight'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $redirected = Join-Path $outDir 'redirected.json'
          $console    = Join-Path $outDir 'console.json'

          # 5.1 specifically: what install.rs spawns and a clean Windows ships; pwsh 7 differs.
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $ps51)) {
            Write-Host "::error::Windows PowerShell 5.1 is not at $ps51; this runner cannot answer the question that matters"
            exit 1
          }

          # RemoteSigned, not Bypass.
          & $ps51 -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File $probe -OutFile $redirected
          if (-not (Test-Path -LiteralPath $redirected)) {
            Write-Host '::error::the redirected probe wrote no result file'
            exit 1
          }

          # conhost.exe gives the child a real console handle.
          $conhost = Join-Path $env:SystemRoot 'System32\conhost.exe'
          if (-not (Test-Path -LiteralPath $conhost)) {
            Write-Host '::error::conhost.exe is absent; the console case cannot be measured on this runner'
            exit 1
          }
          Start-Process -FilePath $conhost -Wait -ArgumentList @(
            $ps51, '-NoProfile', '-NonInteractive',
            '-ExecutionPolicy', 'RemoteSigned',
            '-File', $probe, '-OutFile', $console, '-Attached'
          )

          if (-not (Test-Path -LiteralPath $console)) {
            Write-Host '::error::the console-attached probe wrote no result file. Not reporting a verdict: an unmeasured console is not a safe one.'
            exit 1
          }

          $r = Get-Content -Raw $redirected | ConvertFrom-Json
          $c = Get-Content -Raw $console    | ConvertFrom-Json

          foreach ($row in @($r, $c)) {
            Write-Host ''
            Write-Host "--- $($row.label)"
            Write-Host "  host               : $($row.hostName) / $($row.psVersion) / $($row.psEdition)"
            Write-Host "  os                 : $($row.osCaption) build $($row.osBuild) / $($row.architecture)"
            Write-Host "  isOutputRedirected : $($row.isOutputRedirected)"
            Write-Host "  SupportsVirtualTerminal : $($row.supportsVt)$(if ($row.supportsVtError) { " [$($row.supportsVtError)]" })"
            Write-Host "  native GetConsoleMode/Set : $($row.nativeVt)$(if ($row.nativeVtError) { " [$($row.nativeVtError)]" })"
            Write-Host "  console mode       : $($row.nativeConsoleMode)"
          }

          # Control: the console run must actually have had a console.
          if ($c.isOutputRedirected -ne $false) {
            Write-Host ''
            Write-Host "::error::the console-attached run still reports isOutputRedirected=$($c.isOutputRedirected), so no real console was measured."
            Write-Host '::error::Refusing to report a verdict. Two redirected runs agree with each other for reasons that say nothing about a user at a console.'
            exit 1
          }
          Write-Host ''
          Write-Host 'control: the console-attached run really had a console (isOutputRedirected=False)'

          # Per-image result; the all-hosts claim belongs to the summary job.
          $where = "$env:MATRIX_OS ($($c.osCaption ?? 'unknown build'))"
          Write-Host ''
          if ($null -ne $c.supportsVt -and $c.supportsVt -eq $c.nativeVt) {
            Write-Host "VERDICT for ${where}: SAFE. At a real console the property and the native call both answer $($c.supportsVt)."
            Write-Host '         This leg speaks for this image only. See the summary job for whether every'
            Write-Host '         measured host agreed, which is what the replacement actually rests on.'
            exit 0
          }

          Write-Host "::error::VERDICT for ${where}: UNSAFE. At a real console the property answers '$($c.supportsVt)' but the native call answers '$($c.nativeVt)'."
          Write-Host '::error::Do NOT swap the implementation. Users on this host would lose banner colour, or worse get raw escape sequences.'
          Write-Host '::error::This is the measurement saying no, which is the outcome this lane exists to be able to produce.'
          exit 1

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per leg: upload-artifact v4+ refuses duplicate names.
          name: vt-preflight-${{ matrix.os }}
          path: ${{ runner.temp }}/vt-preflight/*.json
          if-no-files-found: warn
          retention-days: 30

  agree:
    name: did every measured host agree
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Combine the legs
        env:
          RESULT: ${{ needs.measure.result }}
        run: |
          set -euo pipefail
          echo "measure matrix result: $RESULT"
          if [ "$RESULT" = "success" ]; then
            echo "VERDICT: SAFE on every measured host."
            echo "Windows Server 2025, Windows Server 2022 and Windows 11 on Arm64 all reported the"
            echo "property and the native call agreeing at a real console. That is the claim"
            echo "Enable-StudioVirtualTerminal's replacement rests on."
            echo
            echo "Still not measured here, and not claimed: Windows 10, and x64 Windows 11 client."
            echo "No hosted runner offers either. The four self-hosted Windows 11 Pro boxes are where"
            echo "an x64 client answer would come from if one is wanted before the swap ships."
            exit 0
          fi
          echo "::error::At least one host did not agree, or could not be measured (result: $RESULT)."
          echo "::error::Read the per-host legs. A single UNSAFE answer is enough to cancel the replacement:"
          echo "::error::the cost of being wrong is raw escape sequences printed at a user."
          exit 1
