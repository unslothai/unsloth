# Copyright 2026-present the Unsloth AI Inc. team. All rights reserved.
# Notebook regression tests on real Kaggle T4 hardware (sm_75, no bf16, no FA2, 16GB), the card the
# notebooks target. Four legs in ONE kernel, one per card at a time, longest first; the order lives in
# .github/scripts/kaggle_t4_ci/legs.py. The Studio GPU smoke rides the same kernel (--with-studio); it
# does not replace kaggle-t4-studio-gpu-ci.yml. One kernel, not two, leaves the account's second
# session for that workflow.
#
# control and canary differ ONLY in installed library versions: canary red + control green means a
# library release broke Unsloth; both red is not a version bump; control red means the pins in
# tests/kaggle/t4_smoke/pins/control.txt stopped resolving. Determinism and the reference band apply
# to control only. Under fp16 the GradScaler skips the first steps, so runs shorter than ~5 steps apply
# no updates; check_steps.py measures that floor.
#
# BUDGET. Read this before changing any trigger. Two Kaggle accounts with weekly quotas, shared with
# kaggle-t4-studio-gpu-ci.yml. The split is Unsloth 35, this leg 15 of the 50h CI allowance; the
# reserves enforce it (this leg stands down at 40h spent account-wide, Unsloth at 50h).
# Cost of one invocation (one kernel, Studio install hidden on a CPU lane):
#   TOTAL, expected                             ~0.25 h  (rounded up)
# Sampling (--percent 15), solved at the busy end of 88..231 eligible events/week to target 9h:
#     busy week   231 x 0.15 x 0.25 =   8.7 GPU-h  (35 launches)
# The rate is for THIS payload set; wiring another leg (e.g. grpo) needs this recomputed.
#
# FAILURE SEMANTICS: red when a payload ran on a T4 and failed, or when the account's
# WEEKLY accelerator quota is exhausted (the gate says so before any kernel is pushed). An UNREADABLE
# quota and every other infrastructure outcome skips; the in-job recheck uses --soft-fail.
#
# CREDENTIALS: only the gate sees both KAGGLE_API_TOKEN secrets and publishes the chosen SECRET NAME,
# never a token; later steps index secrets by that name. Tokens never reach the Kaggle kernel.
# The trust boundary is repository write access, as for every secret (on pull_request the PR's own
# YAML runs, so a base-branch copy of the scripts protects nothing); a tighter one would be an
# environment secret with required reviewers.

name: Kaggle T4 Notebook CI

on:
  pull_request:
    # `labeled` is not a default type; the opt-in label must start a run of its own.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'unsloth/**'
      - 'tests/kaggle/**'
      - '.github/scripts/kaggle_t4_ci/**'
      - '.github/workflows/kaggle-t4-notebook-ci.yml'
      # The gated t4-smoke job runs these scripts by path when the kernel carries Studio.
      - '.github/scripts/kaggle_studio_ci/**'
      # The payloads install the commit under test as a distribution.
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'unsloth/**'
      - 'tests/kaggle/**'
      - '.github/scripts/kaggle_t4_ci/**'
      - '.github/workflows/kaggle-t4-notebook-ci.yml'
      # The gated t4-smoke job runs these scripts by path when the kernel carries Studio.
      - '.github/scripts/kaggle_studio_ci/**'
      - 'pyproject.toml'
  # Nightly for legs too flaky to gate PRs (grpo's intermittent vLLM standby crash on Turing).
  # Off the hour to avoid the scheduler peak.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      legs:
        description: 'Comma-separated leg names to run instead of the wired KERNELS set. Empty means the wired set. The nightly uses this to run grpo, which is deliberately not per-PR'
        type: string
        default: ''
      force:
        description: 'Bypass the sampling gate (quota and concurrency still apply)'
        type: boolean
        default: true
      max_steps:
        description: 'Training steps for the control and canary legs'
        type: string
        default: '10'
      skip_reference_band:
        description: 'Do not band-check against the committed reference. Set this for the ONE run that recaptures the reference after a config change'
        type: boolean
        default: false
      unsloth_ref:
        description: 'unslothai/unsloth ref to install and test'
        type: string
        default: ''
      slot:
        description: 'Which of the accounts two Kaggle session slots to occupy. Two dispatches naming different slots run side by side; anything else takes slot 1'
        type: choice
        options: ['1', '2']
        default: '1'
      shared_wheels:
        description: 'Build unsloth and unsloth_zoo once up front and install every leg from the wheel, instead of each leg resolving the git spec itself'
        type: boolean
        default: false
      studio_concurrent:
        description: 'Let the Studio GPU half share a card with a small leg instead of waiting for the queue to drain. ON by default: it takes about 1100s off the critical path, at the cost of Studio seeing one T4 rather than two. Set false to get the both-cards coverage back on a run that can afford the wall clock'
        type: boolean
        default: true

permissions:
  contents: read

# Not latest-only: a cancelled runner cannot stop kernels it already pushed. The slot is in this
# group too, or two dispatches meant for both session slots would discard each other while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.slot || '1' }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    # Forks never receive the Kaggle secrets.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    # Worst case for two accounts at the socket ceiling; the suite asserts this arithmetic.
    timeout-minutes: 15
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}
      # Carries the SECRET NAME so the GPU job can index secrets, never a token.
      account: ${{ steps.decide.outputs.account }}
      account_user: ${{ steps.decide.outputs.account_user }}
      head_sha: ${{ steps.ref.outputs.head_sha }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # kaggle 2.x is required: 1.7.4.5 cannot authenticate with KAGGLE_API_TOKEN, lacks `kernels
      # delete` (the budget control) and quota_view() (read by gate.py).
      - name: Install the Kaggle client
        run: python -m pip install --quiet 'kaggle==2.2.4'

      # budget-hours is the worst case of ONE invocation from launch.py's constants (2 sessions x ~13800s,
      # ~8 GPU-h); the harness suite recomputes it. reserve-hours 20 caps this leg at 40h spent and is
      # deliberately above the Unsloth leg's 10. The event action and label stop non-opt-in labels from
      # forcing runs; label text goes through env, never the shell.
      # Keyed on the commit under test (not github.sha) so dispatches of one ref collide in the in-flight check.
      - name: Name the commit under test
        id: ref
        env:
          UNSLOTH_REF: ${{ inputs.unsloth_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$UNSLOTH_REF" ]; then
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$UNSLOTH_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            RESOLVED="$UNSLOTH_REF"
          else
            RESOLVED=''
            for attempt in 1 2 3; do
              LS="$(git ls-remote https://github.com/unslothai/unsloth "$UNSLOTH_REF" || true)"
              PEELED="$(printf '%s\n' "$LS" | grep '\^{}$' | head -n1 | cut -f1)"
              if [ -n "$PEELED" ]; then
                RESOLVED="$PEELED"
              else
                RESOLVED="$(printf '%s\n' "$LS" | head -n1 | cut -f1)"
              fi
              if [ -n "$RESOLVED" ]; then break; fi
              echo "ls-remote attempt $attempt resolved nothing"
              sleep 10
            done
          fi
          echo "head_sha=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "the gate is keyed on unslothai/unsloth@${RESOLVED:-(unresolved)}"

      - name: Decide
        id: decide
        env:
          # The only step that gets both tokens.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_API_TOKEN_2: ${{ secrets.KAGGLE_API_TOKEN_2 }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          python .github/scripts/kaggle_t4_ci/gate.py \
            --percent 15 \
            --head-sha '${{ steps.ref.outputs.head_sha }}' \
            --kind notebook \
            --slot '${{ inputs.slot || '1' }}' \
            --force '${{ inputs.force || (github.event_name == 'schedule' && 'true' || 'false') }}' \
            --labels "$PR_LABELS" \
            --label-name kaggle-t4-ci \
            --event-action "$EVENT_ACTION" \
            --event-label "$EVENT_LABEL" \
            --kernels 1 \
            --budget-hours 4 \
            --reserve-hours 20

  t4-smoke:
    name: T4 smoke
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # Posts the verdict as a commit status, possibly for an earlier commit's collected kernel.
    permissions:
      contents: read
      statuses: write
    # Holds the SECRET NAME, not the token: `secrets` is unavailable at strategy expansion, and a
    # `cond && A || B` ternary silently yields the other account's token when the first is empty.
    strategy:
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    # MUST EXCEED the launcher's worst case (~13800s from launch.py's constants: push retries with
    # discards, polling, evidence budget, release()). Killing the runner skips release(), and Kaggle's
    # push-time timeout does not stop a wedged kernel. The launcher also guards via --deadline-epoch;
    # the harness suite recomputes this relation.
    timeout-minutes: 260
    # Not keyed on the ref: the Kaggle account is global. One kernel here plus one Studio kernel is
    # exactly Kaggle's 2-session cap per account, so each workflow must keep pushing ONE kernel.
    concurrency:
      # Slotted and per account: a group allows one runner and only one PENDING run (a second cancels
      # it), while an account allows 2 sessions. The slot input is 1 or 2 only.
      group: kaggle-t4-account-${{ needs.gate.outputs.account }}-notebook-${{ inputs.slot || '1' }}
      cancel-in-progress: false
    steps:
      # FIRST: the launcher's deadline guard needs the true job start, or it reads optimistic.
      - name: Record when the job started
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Harden runner (audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      # Check out the head SHA the kernels install, not the synthetic merge ref, so harness and package match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # kaggle 2.x is required: 1.7.4.5 cannot authenticate with KAGGLE_API_TOKEN, lacks `kernels
      # delete` (the budget control) and quota_view() (read by gate.py).
      - name: Install the Kaggle client
        run: python -m pip install --quiet 'kaggle==2.2.4'

      # Run the CPU-only harness suites BEFORE pushing; pytest testpaths excludes them, so nothing else
      # does. Whole directory, not one file. CPU torch must be installed FIRST, or peft pulls CUDA torch and
      # the CPU line becomes a no-op; the order is then checked (torch.version.cuda is None).
      - name: Test the harness
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          # Every third-party module tests/kaggle/test_*.py imports unguarded; test_harness_dependencies.py
          # keeps this line and that import set in agreement.
          python -m pip install --quiet pytest transformers peft datasets pillow pyyaml huggingface_hub
          python -c "import torch, sys; sys.exit(None if torch.version.cuda is None else 'torch %s is built for CUDA %s: the CPU-index install was skipped as already satisfied' % (torch.__version__, torch.version.cuda))"
          python -m pytest tests/kaggle -q

      # Resolve a dispatched ref to one commit, so every leg installs the same Unsloth; the harness stays
      # on the checked-out tree. An unresolvable ref stands the run down.
      - name: Resolve the ref under test
        id: ref
        env:
          UNSLOTH_REF: ${{ inputs.unsloth_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GATE_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          if [ -z "$UNSLOTH_REF" ]; then
            echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "testing unslothai/unsloth@$HEAD_SHA"
            exit 0
          fi
          # Reuse the gate's resolution: a moving ref could name a commit the gate never keyed on.
          RESOLVED="$GATE_SHA"
          # A SHA-shaped string may not exist (ls-remote matches refs only); fetching the object proves it is
          # installable (exit 128 otherwise). Applied to every branch above.
          if ! printf '%s' "$RESOLVED" | grep -Eq '^[0-9a-f]{40}$'; then
            RESOLVED=''
          fi
          if [ -n "$RESOLVED" ]; then
            EXISTS=''
            for attempt in 1 2 3; do
              if git fetch --quiet --depth=1 https://github.com/unslothai/unsloth "$RESOLVED"; then
                EXISTS=yes
                break
              fi
              echo "fetch attempt $attempt did not find $RESOLVED"
              sleep 10
            done
            if [ -z "$EXISTS" ]; then
              echo "::warning title=The requested unsloth commit does not exist::unslothai/unsloth does not serve the commit $RESOLVED, so the four legs would each have failed to install it after the session was paid for. Standing down."
              RESOLVED=''
            fi
          fi
          if [ -z "$RESOLVED" ]; then
            echo "::warning title=Could not resolve the requested unsloth ref::the dispatched ref names no branch, tag or full commit on unslothai/unsloth, so the four legs could not be pinned to one revision. Standing down rather than letting each of them install whatever it resolves. Give a branch name, a tag, or a full 40-character SHA."
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "testing unslothai/unsloth@$RESOLVED (dispatched as '$UNSLOTH_REF')"

      # Resolve zoo ONCE so control and canary install the same commit (zoo is not in the control pins).
      # Unresolvable stands down rather than falling back to the branch name.
      - name: Pin the zoo revision
        id: pins
        if: steps.ref.outputs.stand_down != 'true'
        run: |
          ZOO_REF=''
          for attempt in 1 2 3; do
            ZOO_REF="$(git ls-remote https://github.com/unslothai/unsloth-zoo refs/heads/main | cut -f1)"
            if [ -n "$ZOO_REF" ]; then break; fi
            echo "ls-remote attempt $attempt resolved nothing"
            sleep 10
          done
          if [ -z "$ZOO_REF" ]; then
            echo "::warning title=Could not resolve unsloth-zoo main::standing down rather than installing a moving branch, so nothing was learned about the code under test"
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "zoo_ref=$ZOO_REF" >> "$GITHUB_OUTPUT"
          echo "testing against unslothai/unsloth-zoo@$ZOO_REF"

      # Validate max_steps before anything is paid for; check_steps.py measures the floor from the
      # committed reference rather than restating a number here.
      - name: Validate the dispatched step count
        id: stepcount
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true'
        env:
          MAX_STEPS: ${{ inputs.max_steps || 10 }}
        run: |
          python .github/scripts/kaggle_t4_ci/check_steps.py \
            --max-steps "$MAX_STEPS" \
            --payload-dir tests/kaggle/t4_smoke

      # A reference compares only to a run of its own step count; recapture runs need skip_reference_band.
      # See tests/kaggle/t4_smoke/references/README.md.
      - name: Build the kernel notebooks
        id: build
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true' && steps.stepcount.outputs.stand_down != 'true'
        env:
          # `github.event.inputs` is null on a schedule, so the nightly list comes from the fallback.
          # multi_gpu and latest_compile serialise here because neither fits the per-PR kernel's makespan.
          LEG_LIST: ${{ inputs.legs || (github.event_name == 'schedule' && 'grpo,multi_gpu,latest_compile' || '') }}
          SKIP_BAND: ${{ inputs.skip_reference_band }}
          # The validated, normalised count: parse_steps accepts "+10" or "010" as ten, like argparse.
          MAX_STEPS: ${{ steps.stepcount.outputs.steps }}
          REF_STEPS: ${{ steps.stepcount.outputs.reference_steps }}
        run: |
          SKIP=''
          if [ "$SKIP_BAND" = "true" ]; then
            SKIP='--skip-reference'
            echo "::warning title=Reference band check disabled::this run was dispatched with skip_reference_band, so the control leg's metrics are compared against nothing. Only a reference-recapture run should look like this."
          elif [ "$MAX_STEPS" != "$REF_STEPS" ]; then
            # A reference cannot compare across step counts, so drop the band instead of failing.
            SKIP='--skip-reference'
            echo "::warning title=Reference band check skipped::this run is $MAX_STEPS steps and the committed reference was captured at $REF_STEPS, which are not comparable. The band check is off for this run; everything else the control leg asserts still applies."
          fi
          # Off unless asked for; test_the_workflow_can_actually_reach_studio_concurrent guards the wiring.
          # Shared wheels: measured effect is mixed, hence a flag.
          SHARED_WHEELS=''
          if [ "${{ inputs.shared_wheels }}" = "true" ]; then
            SHARED_WHEELS='--shared-wheels'
          fi
          # Default ON; `inputs` is null on push and schedule, so the fallback decides those.
          STUDIO_CONCURRENT='--studio-concurrent'
          if [ "${{ inputs.studio_concurrent }}" = "false" ]; then
            STUDIO_CONCURRENT=''
          fi
          # A leg list REPLACES --all-kernels: the plan and payload count come from one call.
          if [ -n "$LEG_LIST" ]; then
            KERNEL_SELECT="--legs $LEG_LIST"
            echo "::notice title=Leg override::running $LEG_LIST instead of the wired set"
          else
            KERNEL_SELECT="--all-kernels"
          fi
          # Studio rides the wired set only: build_kernel.py refuses --with-studio without --all-kernels.
          # test_grpo_nightly.py runs this body and parses the argv.
          STUDIO=()
          if [ -z "$LEG_LIST" ]; then
            STUDIO=(--with-studio --studio-args "--max-steps 8")
            if [ -n "$STUDIO_CONCURRENT" ]; then
              STUDIO+=("$STUDIO_CONCURRENT")
              echo "::notice title=Studio shares a card::the Studio GPU half is pinned to one T4 beside a small leg, so this run does NOT cover Studio's own choice between two cards. The report records tensor_split_over_two_cards=false rather than claiming it."
            fi
            echo "studio=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Studio is not in this kernel::this run selects legs explicitly, and the Studio payload rides the wired set only. Its coverage comes from the per-PR runs."
            # Without it the reporter answers `partial` for a payload never aboard.
            echo "studio=false" >> "$GITHUB_OUTPUT"
          fi
          python .github/scripts/kaggle_t4_ci/build_kernel.py \
            --payload-dir tests/kaggle/t4_smoke \
            --out kernel \
            $KERNEL_SELECT \
            --unsloth-ref '${{ steps.ref.outputs.ref }}' \
            --zoo-ref '${{ steps.pins.outputs.zoo_ref }}' \
            --smoke-args "--max-steps $MAX_STEPS" \
            "${STUDIO[@]}" \
            --per-run-timeout 3900 \
            $SHARED_WHEELS \
            $SKIP

      # Collect before the recheck: it can take minutes, and the recheck must be last before the push.
      # It also finds whether a kernel for this commit is already in flight.
      - name: Collect finished Kaggle runs
        id: collect
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true' && steps.stepcount.outputs.stand_down != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets[matrix.secret_name] }}
        run: |
          python .github/scripts/kaggle_t4_ci/collect.py \
            --outdir kaggle_collected \
            --expect '${{ steps.build.outputs.payloads }}' \
            --sha '${{ steps.ref.outputs.ref }}' \
            --kind notebook \
            --slot '${{ inputs.slot || '1' }}' \
            --no-delete \
            --target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Post first, delete second, so a failed post leaves the kernel for the next pass.
      - name: Post the collected verdicts as commit statuses
        id: post
        if: always() && hashFiles('kaggle_collected/collect_result.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/kaggle_t4_ci/post_statuses.py \
            --result kaggle_collected/collect_result.json \
            --out kaggle_collected/posted.json

      - name: Release the kernels whose verdicts were delivered
        if: always() && hashFiles('kaggle_collected/collect_result.json') != ''
        env:
          KAGGLE_API_TOKEN: ${{ secrets[matrix.secret_name] }}
        run: |
          python .github/scripts/kaggle_t4_ci/collect.py \
            --outdir kaggle_collected \
            --delete-collected kaggle_collected/collect_result.json \
            --posted kaggle_collected/posted.json

      # kernel-timeout-sec is only a backstop (Kaggle has ignored it); the launcher deleting kernels is
      # the budget control. Recheck the account right before the push: the gate answer can be stale.
      # --force skips only the sampling draw. --soft-fail: losing the race while queued is a stand-down.
      - name: Recheck the Kaggle account
        id: recheck
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true' && steps.stepcount.outputs.stand_down != 'true'
        env:
          # --account-env narrows the recheck to the account whose slot this job holds.
          KAGGLE_API_TOKEN: ${{ secrets[matrix.secret_name] }}
        run: |
          python .github/scripts/kaggle_t4_ci/gate.py \
            --force true \
            --soft-fail \
            --account-env KAGGLE_API_TOKEN \
            --kernels 1 \
            --budget-hours 4 \
            --reserve-hours 20

      # Via env, not an inline expression, so Kaggle API text never reaches a shell.
      - name: Report the stale approval
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true' && steps.stepcount.outputs.stand_down != 'true' && steps.recheck.outputs.should_run != 'true'
        env:
          REASON: ${{ steps.recheck.outputs.reason }}
        run: |
          echo "::warning title=Stood down at the second check::${REASON}"

      - name: Note that this commit is already running on Kaggle
        if: steps.recheck.outputs.should_run == 'true' && steps.collect.outputs.in_flight == 'true'
        run: |
          echo "::notice title=Already in flight::a Kaggle kernel for this commit is still running from an earlier run, so nothing was dispatched. Its result will arrive as the kaggle-t4-notebook commit status."

      # --deadline-epoch is when this job is killed; the launcher pushes only if its worst case fits.
      # JOB_TIMEOUT_MINUTES must equal timeout-minutes (asserted by the harness suite).
      # Push and exit; the verdict arrives later as the `kaggle-t4-notebook` commit status.
      - name: Dispatch to Kaggle
        id: launch
        if: steps.recheck.outputs.should_run == 'true' && steps.collect.outputs.in_flight != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets[matrix.secret_name] }}
          JOB_TIMEOUT_MINUTES: 260
        run: |
          python .github/scripts/kaggle_t4_ci/launch.py \
            ${{ steps.build.outputs.notebooks }} \
            --user '${{ matrix.kaggle_user }}' \
            --outdir kaggle_evidence \
            --expect '${{ steps.build.outputs.payloads }}' \
            --kernel-timeout-sec 3600 \
            --max-wait 5400 \
            --poll-every 60 \
            --dispatch \
            --kind notebook \
            --slot '${{ inputs.slot || '1' }}' \
            --commit-sha '${{ steps.ref.outputs.ref }}' \
            --deadline-epoch "$(( JOB_START_EPOCH + JOB_TIMEOUT_MINUTES * 60 ))"

      # Gated on the launcher's verdict, not exit code: launch.py exits 0 for every stand-down.
      - name: Mark the dispatch pending on this commit
        if: steps.launch.outputs.verdict == 'dispatched'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/${{ steps.ref.outputs.ref }}" \
            -f state=pending -f context=kaggle-t4-notebook \
            -f description="dispatched to Kaggle; the result is collected when the kernel finishes" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --silent || echo "::warning title=Could not post the pending status::kaggle-t4-notebook"

      # The launcher collects only notebooks and logs, so the Studio payload encodes evidence in cell
      # output. Harmless on runs without Studio.
      - name: Unpack the Playwright evidence
        if: always() && hashFiles('kaggle_evidence/**/*_output.ipynb', 'kaggle_collected/**/*_output.ipynb') != ''
        continue-on-error: true
        run: |
          # One kernel per call: chunks from two kernels would be spliced together.
          for dir in kaggle_evidence/*/ kaggle_collected/*/; do
            [ -d "$dir" ] || continue
            python .github/scripts/kaggle_studio_ci/collect_evidence.py \
              --evidence "$dir" \
              --outdir "studio_evidence/$(basename "$dir")"
          done

      # continue-on-error: an artifact outage must not decide the check colour; the next step reports
      # the failed outcome.
      - name: Upload evidence
        id: evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kaggle-t4-evidence
          path: |
            kaggle_evidence/**
            kaggle_collected/**
            studio_evidence/**
            kernel*.ipynb
          # 14 days: sampled runs can be a fortnight apart, and references are recaptured from these.
          retention-days: 14
          if-no-files-found: warn

      - name: Report the evidence upload failure
        if: always() && steps.evidence.outcome == 'failure'
        run: |
          echo "::warning title=The evidence artifact did not upload::the executed notebooks and kernel logs for this run are not attached. The verdict below stands on its own; re-run the job if the evidence is needed."

      # Only when the launcher ran: a stand-down has no evidence and must not read as a failure.
      - name: Report
        if: always() && hashFiles('kaggle_evidence/**/*_output.ipynb') != ''
        run: |
          python .github/scripts/kaggle_t4_ci/report.py \
            --evidence kaggle_evidence \
            --expect '${{ steps.build.outputs.legs || 4 }}'

      # Separate reporter: the Studio assertions are not comparable to training traces. Only when the
      # kernel carried Studio, or it prints PARTIAL for a payload it never ran.
      - name: Report Studio
        if: always() && hashFiles('kaggle_evidence/**/*_output.ipynb') != '' && steps.build.outputs.studio == 'true'
        run: |
          python .github/scripts/kaggle_studio_ci/report.py \
            --evidence kaggle_evidence
