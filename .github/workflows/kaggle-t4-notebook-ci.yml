# SPDX-License-Identifier: AGPL-3.0-only
# Copyright 2026-present the Unsloth AI Inc. team. All rights reserved.
#
# Notebook regression tests on real Kaggle T4 hardware.
#
# Why T4 and why not a GitHub runner: every other GPU-adjacent job in this
# repo either has no GPU at all or has one nobody's free Colab session has.
# T4 is the card the notebooks are written against -- sm_75, no bf16, no
# flash-attention 2, 16GB. A regression that only appears there is invisible
# to the rest of CI. Kaggle gives us that card for free, two per session,
# and allows two sessions at once: four payloads.
#
# ---------------------------------------------------------------------
# WHAT RUNS: three legs, two kernels, one leg per T4. See
# .github/scripts/kaggle_t4_ci/legs.py, which is the single source of truth
# for the leg-to-kernel plan; this file does not restate it.
# ---------------------------------------------------------------------
#
#   kernel 1   control   tiny Qwen2.5-0.5B SFT, PINNED library set
#              canary    the same run on the newest permitted library set
#   kernel 2   gptoss    gpt-oss-20b LoRA: torch.compile and float32 on sm_75
#              frontier  the same SFT run on the newest transformers and trl
#                        on PyPI, above the ceiling zoo's metadata permits
#
# A fifth leg, `grpo` (Qwen3-4B through a vLLM engine), is written and NOT
# wired: its vLLM standby path hits an intermittent illegal memory access on
# Turing, one session in three. The measurements and what would have to
# change are on legs.UNWIRED. The second kernel's second T4 costs nothing --
# a session bills its wall clock once, not per card -- which is why frontier
# sits there rather than waiting for a kernel of its own.
#
# **control and canary are one instrument, not two tests.** They run the
# same payload, seed, dataset and step count on the two cards of the same
# session, and differ ONLY in the version of transformers, trl, peft,
# accelerate and bitsandbytes that gets installed. So:
#
#   canary red, control green -> a library RELEASE broke Unsloth, and the
#     job summary already names the versions that differ between the two
#     legs. This is the signal the whole workflow is built around.
#   both red                  -> not a version bump. The base image, the
#     model download, Kaggle, or Unsloth's own code.
#   control red, canary green -> the pins stopped resolving. A maintenance
#     signal for tests/kaggle/t4_smoke/pins/control.txt, not a regression.
#
# Determinism and the committed reference band apply to the CONTROL leg
# only. Bitwise agreement across library versions is not achievable and is
# not claimed, so the canary asserts what does not depend on versions: the
# canary string, that the optimizer actually applied updates, that two fresh
# processes agreed bitwise WITH EACH OTHER, and that nothing raised.
#
# The band check compares against a reference captured at ONE step count and
# refuses, as a failure, to compare against one captured at another. That
# refusal is deliberate: the alternative is a green check comparing a run
# against a curve it has nothing to do with. The committed reference is a
# 10-step trace and max_steps is 10, so it applies as committed.
#
# 10 steps is not arbitrary, and shortening it is not free. The T4 has no
# bf16, so this runs fp16 with a dynamic GradScaler that starts at 65536,
# halves on each overflow, and skips the step it overflowed on. The
# reference records grad_norm NaN at steps 1, 2 and 3 and a finite value
# from step 4: a run of three steps applies ZERO optimizer updates, never
# learns the canary, and asserts nothing about training. Anything under
# about five steps needs --init-loss-scale AND a reference recaptured with
# it.
#
# ---------------------------------------------------------------------
# BUDGET. Read this before changing any trigger.
# ---------------------------------------------------------------------
# The Kaggle account behind KAGGLE_ACCESS_TOKEN_GH has a WEEKLY accelerator
# budget (60h on this account at time of writing; Kaggle's documented
# baseline is 30h and the surplus is a discretionary "floating" allowance
# that can be withdrawn). This workflow is allotted 40 GPU-h/week of it and
# is held to that in four independent layers:
#
#   1. paths filters, which turn a four-figure event count into a
#      two-figure one.
#   2. A sampling gate (.github/scripts/kaggle_t4_ci/gate.py), derived from
#      the run id so a re-run cannot reroll the dice.
#   3. A quota floor. The gate reads Kaggle's own accelerator-quota API and
#      refuses to start unless what remains covers this run's worst case
#      PLUS a 20h reserve. Against a 60h account that reserve is what makes
#      the 40h allowance a HARD ceiling rather than an average: CI cannot
#      spend the last 20h whatever the sampling rate turns out to be.
#   4. A concurrency check. Kaggle caps concurrent batch GPU kernels at 2
#      per ACCOUNT. This job uses both, and only when the account is
#      otherwise idle: a single kernel belonging to anyone else stands it
#      down entirely. See ALLOWED_IN_FLIGHT_FOREIGN_KERNELS in gate.py.
#
# ARITHMETIC, recomputed from live numbers on 2026-08-11. Everything below
# is measured on unslothai/unsloth over the preceding 7 days, or on real
# Kaggle sessions; none of it is estimated.
#
#   commits on main                                479
#     ... touching the paths filter below            45   (9.4%)
#       measured BEFORE pyproject.toml joined the filter. It is one file and
#       a rarely touched one, so the eligible counts below move by a little
#       rather than by a lot; the 20h reserve is what holds either way.
#   pull requests opened                            567
#     ... touching the paths filter                7.5%   (9 of a 120 sample)
#     = pull requests that can trigger this          43
#     commits carried by those, measured           4.33 each
#
#   ELIGIBLE INVOCATIONS PER WEEK
#     push to main                                   45
#     pull_request opened                            43
#     pull_request synchronize                  0 .. 143  (one per push after
#                                                          the first; bounded
#                                                          above by the
#                                                          commit count)
#     TOTAL                                    88 .. 231
#
#   COST OF ONE INVOCATION. Two kernels. A session bills its wall clock ONCE
#   rather than per card, at almost exactly 1 GPU-h per hour of session, so
#   the cost is the wall clock and the second T4 of each kernel is free.
#   Measured on kernels 066cd463 (control + canary, both green, 263s of
#   payload) and 8161ceb9 / 7ab727f1 (gpt-oss, 375s of payload):
#     kernel 1 (control + canary)                  0.10 h
#     kernel 2 (gptoss)                            0.13 h
#     TOTAL, expected                             ~0.25 h  (rounded up)
#
#   SAMPLING RATE. Solving at the pessimistic end of the eligible range, and
#   targeting 30h rather than the full 40 so an unusually busy week does not
#   spend the allowance before the quota floor has to intervene:
#     231 x r x 0.25 h = 30 h   ->   r = 0.52, set to 40% (--percent 40)
#
#   EXPECTED SPEND at 40%:
#     quiet week   88 x 0.40 x 0.25 =   8.8 GPU-h
#     busy week   231 x 0.40 x 0.25 =  23.1 GPU-h
#   against the 40 GPU-h allowance: 15% to 39% of the 60h account.
#
#   The rate is set for THIS payload set and does not survive a change to
#   it. Wiring the grpo leg would roughly double kernel 2 and put a busy
#   week over the allowance, so that change comes with a recomputation of
#   this block, not just a line in legs.KERNELS.
#
#   WORST CASE, if every sampled launch ran to both kernel ceilings
#   (1h + 1h), is far above the allowance -- and is not the control.
#   Layer 3 is: the 20h reserve stops CI at 40h spent, whatever the
#   arithmetic above turns out to have got wrong. The sampling rate sets the
#   EXPECTED spend; the reserve sets the ceiling.
#
# ---------------------------------------------------------------------
# FAILURE SEMANTICS
# ---------------------------------------------------------------------
# Red ONLY when a payload ran on a T4 and its assertions failed. Every other
# outcome -- not sampled, no quota, account busy, push throttled, kernel
# died on Kaggle's side, evidence would not download -- is a SKIP or a
# warning and exits 0. Nothing was learned about the code in those cases, so
# nothing should block a merge.
#
# This job is NOT intended to be a required check. It runs on a minority of
# commits by design, so requiring it would block every commit it declined
# to run on.
#
# ---------------------------------------------------------------------
# CREDENTIALS
# ---------------------------------------------------------------------
# KAGGLE_ACCESS_TOKEN_GH is passed as KAGGLE_API_TOKEN to the gate and the
# launcher only. It is never echoed, never written to an output or an
# artifact, and never travels to the Kaggle kernel: the kernel receives the
# notebook and nothing else. Fork pull requests do not receive the secret,
# and the gate skips cleanly when it is absent.
#
# WHERE THE TRUST BOUNDARY ACTUALLY IS, since it is easy to draw it in the
# wrong place. A SAME-REPOSITORY pull request does receive the secret, and on
# `pull_request` GitHub runs the workflow file from the merge ref, so the YAML
# in a pull request is the YAML that executes. Running the gate and the
# launcher from a trusted base-branch copy would therefore protect nothing:
# whoever can edit gate.py in a pull request can edit this file too.
#
# It is not a hole this workflow opens either. Per GitHub's own hardening
# guidance, "Any user with write access to your repository has read access to
# all secrets configured in your repository" -- a push to any branch runs a
# workflow with the repository's secrets, no pull request needed. The boundary
# is repository write access, and it is the same boundary for every secret
# here.
#
# If that blast radius is ever judged too wide for this particular token, the
# mechanism is an ENVIRONMENT secret with required reviewers (plus deleting the
# repository-level copy, or the environment buys nothing), not a trusted copy
# of a script. The cost is a human approval on every sampled run, which is why
# it is not done here.

name: Kaggle T4 Notebook CI

on:
  pull_request:
    # `labeled` is NOT one of GitHub's defaults -- those are opened,
    # synchronize and reopened -- so without it the kaggle-t4-ci opt-in the
    # gate advertises does nothing until some unrelated event happens to fire.
    # The gate reads the label off the event payload, so the label has to be
    # able to start a run of its own.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'unsloth/**'
      - 'tests/kaggle/**'
      - '.github/scripts/kaggle_t4_ci/**'
      - '.github/workflows/kaggle-t4-notebook-ci.yml'
      # The payloads install the commit under test as a distribution, so the
      # file that says how it is built and what it depends on is part of what
      # this workflow tests. BUDGET.md counted it as a watched path already.
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'unsloth/**'
      - 'tests/kaggle/**'
      - '.github/scripts/kaggle_t4_ci/**'
      - '.github/workflows/kaggle-t4-notebook-ci.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the sampling gate (quota and concurrency still apply)'
        type: boolean
        default: true
      max_steps:
        description: 'Training steps for the control and canary legs'
        type: string
        default: '10'
      skip_reference_band:
        description: 'Do not band-check against the committed reference. Set this for the ONE run that recaptures the reference after a config change'
        type: boolean
        default: false
      unsloth_ref:
        description: 'unslothai/unsloth ref to install and test'
        type: string
        default: ''

permissions:
  contents: read

# Per-ref, like every other workflow here -- but NOT latest-only.
#
# The repo idiom is `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}`,
# and it is wrong for this one workflow. A cancelled runner cannot stop the
# Kaggle kernels it has already pushed, and an orphaned kernel bills quota to
# its own ceiling with nobody left to read the result. Superseded runs that
# have not STARTED are still discarded (GitHub keeps only the most recent
# pending run per group), which is where the saving was anyway; only a run
# that is already spending is left alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    # Fork pull requests never receive KAGGLE_ACCESS_TOKEN_GH, so this job
    # could only ever reach "the token is not available to this context" --
    # a runner spent to learn nothing. The gate handles the absent token
    # cleanly regardless (it skips, and exits 0); this just does not start.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # 2.2.4, and the version is load bearing rather than tidy. Everything
      # this workflow asks the client to do has to EXIST in the pin:
      #
      # * `KAGGLE_API_TOKEN` is the only credential this workflow has, and
      #   1.7.4.5's `authenticate()` refuses it -- it wants a kaggle.json
      #   that nothing here writes, and raises before a call is made.
      # * `kaggle kernels delete` landed in 1.7.5.0 (Kaggle/kaggle-cli#762),
      #   first released in 1.8.0. On 1.7.4.5 argparse answers it with
      #   `invalid choice: 'delete'` and exit 2, so the cleanup that is this
      #   workflow's budget control never sent a request at all.
      # * `quota_view()`, which gate.py reads the remaining accelerator hours
      #   from, exists only on 2.x.
      #
      # The client exits nonzero on a failed call, which is what launch.py
      # reads to decide whether a kernel is really gone.
      - name: Install the Kaggle client
        run: python -m pip install --quiet 'kaggle==2.2.4'

      # budget-hours is the worst case ONE invocation can cost, and it is
      # derived from the LAUNCHER's bound rather than from the ceiling passed
      # to Kaggle at push time. That ceiling has been observed not to stop a
      # wedged kernel (see the note by --kernel-timeout-sec below), so what
      # actually ends a session is launch.py deleting it at its own deadline:
      # --max-wait, 5400s, now measured from before the first push. Two
      # kernels, each billing its own session wall clock, is 2 x 1.5h plus
      # the evidence collection before the deletions -- about 3.2h, rounded
      # up. Keep this in step with --max-wait; the harness suite asserts the
      # relation.
      #
      # reserve-hours is what turns the 40 GPU-h/week allowance into a hard
      # ceiling. The account budget is 60h, so refusing to start below 20h
      # remaining means CI can never have spent more than 40h in a week,
      # whatever the sampling estimate at the top of this file got wrong.
      # Raise it to throttle CI harder. Do not raise it above roughly 45 or
      # CI will never run at all on a week with any other usage.
      #
      # The event ACTION and the label that was just applied go in too, and
      # they are what stops the `labeled` trigger from multiplying runs. That
      # trigger fires on EVERY label, not only the opt-in one, and each fresh
      # run is a fresh sampling draw; worse, once kaggle-t4-ci is on the pull
      # request, every later label sees it in the label list and FORCES a run.
      # A couple of bot labels then cost more sessions than the whole sampling
      # estimate at the top of this file budgets for. The gate stands a
      # `labeled` run down unless the label that started it is the opt-in one.
      #
      # Label names and the raw label list travel through the environment
      # rather than being interpolated into the shell, for the same reason the
      # stale-approval warning below does: they are free text set by anyone
      # with write access.
      - name: Decide
        id: decide
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN_GH }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          python .github/scripts/kaggle_t4_ci/gate.py \
            --percent 40 \
            --force '${{ inputs.force || 'false' }}' \
            --labels "$PR_LABELS" \
            --label-name kaggle-t4-ci \
            --event-action "$EVENT_ACTION" \
            --event-label "$EVENT_LABEL" \
            --kernels 2 \
            --budget-hours 4 \
            --reserve-hours 20

  t4-smoke:
    name: T4 smoke
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # THIS DEADLINE MUST EXCEED THE LAUNCHER'S WORST CASE, with headroom, and
    # that is a stronger requirement than "long enough for a normal run".
    # Nothing else stops a pushed kernel: the runner being killed here takes
    # launch.py's finish() -> release() with it, and a kernel that nobody
    # deletes bills quota to its own ceiling (Kaggle's push-time timeout has
    # been measured NOT to stop a wedged one).
    #
    # The launcher's worst case, from launch.py's own constants:
    #   push, per notebook   PUSH_ATTEMPTS 4 x subprocess timeout 600s
    #                        + PUSH_BACKOFF_SEC backoffs 45 + 90 + 180
    #                        = 2715s
    #   two notebooks, pushed sequentially            5430s   (90.5 min)
    #   polling, which shares ONE deadline started before the first push,
    #   so it does not stack on top of them          <=5400s  (--max-wait
    #                                                  below, minus the
    #                                                  pushes)
    #   evidence download, two kernels                ~600s
    #   release(): every slug each push FILED, so up to PUSH_ATTEMPTS
    #   deletions per kernel at 180s                 <=1440s
    #   ----------------------------------------------------------------
    #   total                        max(5430, 5400) + 2040 = ~7470s
    #                                                        (~125 min)
    #
    # 200 leaves ~75 min of headroom on that. A normal run is ~15 min; this
    # only fires if the launcher wedged. Lower --max-wait or PUSH_ATTEMPTS
    # before lowering this.
    timeout-minutes: 200
    # Deliberately NOT keyed on the ref. The Kaggle account is one global
    # resource with a 2-kernel cap and this job takes both, so two runs of
    # this workflow on different branches must not overlap.
    # cancel-in-progress is false: a cancelled run cannot stop the kernels it
    # already pushed, and an orphaned kernel burns quota to its own ceiling
    # with nobody watching.
    concurrency:
      group: kaggle-t4-notebook-ci-account
      cancel-in-progress: false
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      # ONE SNAPSHOT, harness and package alike. The default checkout for a
      # pull_request is GitHub's synthetic merge revision, while the ref the
      # kernels install is the PR head; if the base branch has moved since the
      # branch point those are different trees, and the run would then report
      # on a combination of payload scripts, reference and legs.py that exists
      # nowhere. Checking out the same head SHA the launcher installs keeps
      # the two in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # 2.2.4, and the version is load bearing rather than tidy. Everything
      # this workflow asks the client to do has to EXIST in the pin:
      #
      # * `KAGGLE_API_TOKEN` is the only credential this workflow has, and
      #   1.7.4.5's `authenticate()` refuses it -- it wants a kaggle.json
      #   that nothing here writes, and raises before a call is made.
      # * `kaggle kernels delete` landed in 1.7.5.0 (Kaggle/kaggle-cli#762),
      #   first released in 1.8.0. On 1.7.4.5 argparse answers it with
      #   `invalid choice: 'delete'` and exit 2, so the cleanup that is this
      #   workflow's budget control never sent a request at all.
      # * `quota_view()`, which gate.py reads the remaining accelerator hours
      #   from, exists only on 2.x.
      #
      # The client exits nonzero on a failed call, which is what launch.py
      # reads to decide whether a kernel is really gone.
      - name: Install the Kaggle client
        run: python -m pip install --quiet 'kaggle==2.2.4'

      # BEFORE anything is built or pushed. The suites are CPU-only and run in
      # under a minute; they parse every generated cell, check the leg wiring,
      # the report verdicts, the payload's own pass/fail rules, the pin
      # handling and this file's trigger, budget and timeout wiring. The root
      # pyproject.toml sets testpaths = ["tests/security"], so a bare pytest
      # never collects them and no other workflow runs them -- which means
      # without this step a broken harness is discovered forty minutes into a
      # Kaggle session instead of here, having spent the quota to find out.
      #
      # The whole DIRECTORY, not one file: naming a file is how the two suites
      # added after it (the transport tests and the payload-assertion tests,
      # which cover the report extraction, the reference checks and the leg
      # isolation) ended up collected by nothing at all.
      #
      # torch from the CPU index and transformers WITHOUT it: the payload
      # modules the suites import need both to import at all, and the CPU
      # wheel is a minute against a session that costs quota. Measured in a
      # bare venv with exactly these three: 292 passed.
      - name: Test the harness
        run: |
          python -m pip install --quiet pytest transformers
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pytest tests/kaggle -q

      # The ref the kernels install and test. For a pull request that is
      # the head SHA, so they exercise the proposed code and not the merge
      # base, and it is the SHA checked out above. Pinned to a SHA rather
      # than a branch name so a push landing mid-run cannot change what was
      # tested.
      #
      # A DISPATCHED ref is resolved to one commit here, for exactly the
      # reason the zoo step below resolves main. Every payload pip-installs
      # independently on the kernel, so a branch name forwarded unchanged can
      # resolve to a different commit in each of the four legs, and the run
      # would then compare a control against a canary that are not running the
      # same Unsloth. The report records a distribution version rather than a
      # commit, so that drift would not be visible afterwards either.
      #
      # This resolves what is INSTALLED and nothing else. The harness -- the
      # payloads, legs.py, the committed reference -- deliberately stays on
      # the checked-out tree, because a dispatch is how an arbitrary ref gets
      # tested with today's harness and most of that harness does not exist on
      # older refs at all.
      #
      # A ref that cannot be resolved stands the run DOWN rather than
      # installing a moving branch, which is the same answer the zoo step
      # gives and for the same reason.
      - name: Resolve the ref under test
        id: ref
        env:
          UNSLOTH_REF: ${{ inputs.unsloth_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$UNSLOTH_REF" ]; then
            echo "ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "testing unslothai/unsloth@$HEAD_SHA"
            exit 0
          fi
          if printf '%s' "$UNSLOTH_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            RESOLVED="$UNSLOTH_REF"
          else
            RESOLVED=''
            for attempt in 1 2 3; do
              LS="$(git ls-remote https://github.com/unslothai/unsloth "$UNSLOTH_REF" || true)"
              # An annotated tag lists the tag OBJECT first and the commit it
              # points at on the `^{}` line. pip can check out the commit.
              PEELED="$(printf '%s\n' "$LS" | grep '\^{}$' | head -n1 | cut -f1)"
              if [ -n "$PEELED" ]; then
                RESOLVED="$PEELED"
              else
                RESOLVED="$(printf '%s\n' "$LS" | head -n1 | cut -f1)"
              fi
              if [ -n "$RESOLVED" ]; then break; fi
              echo "ls-remote attempt $attempt resolved nothing"
              sleep 10
            done
          fi
          # Every branch above ends here, including the 40-character one.
          # That branch used to be its own exit: a SHA is already immutable,
          # so it was accepted on shape alone and nothing ever asked whether
          # unslothai/unsloth HAS that commit. A mistyped -- or force-pushed
          # away, or fork-only -- SHA is syntactically perfect, so the run
          # pushed the paid kernels, every payload's `pip install git+...`
          # failed on it, and the four import probes reported the pull
          # request red for a commit that never existed. That is the exact
          # outcome stand_down exists to avoid, spent quota and all.
          #
          # `git ls-remote` cannot answer this: it matches REFS, and it exits
          # 0 with empty output for any SHA, which is why the shape test was
          # there in the first place. `git fetch` of the object itself can,
          # it is the same reachability pip needs to install the commit, and
          # GitHub answers an unreachable one with `upload-pack: not our ref`
          # and exit 128. --depth=1 keeps it to one commit.
          #
          # Applied to the ls-remote result too, not only to the SHA the form
          # supplied: it costs one more fetch and it means the value written
          # below has been proven installable however it was arrived at.
          if ! printf '%s' "$RESOLVED" | grep -Eq '^[0-9a-f]{40}$'; then
            RESOLVED=''
          fi
          if [ -n "$RESOLVED" ]; then
            EXISTS=''
            for attempt in 1 2 3; do
              if git fetch --quiet --depth=1 https://github.com/unslothai/unsloth "$RESOLVED"; then
                EXISTS=yes
                break
              fi
              echo "fetch attempt $attempt did not find $RESOLVED"
              sleep 10
            done
            if [ -z "$EXISTS" ]; then
              echo "::warning title=The requested unsloth commit does not exist::unslothai/unsloth does not serve the commit $RESOLVED, so the four legs would each have failed to install it after the session was paid for. Standing down."
              RESOLVED=''
            fi
          fi
          if [ -z "$RESOLVED" ]; then
            echo "::warning title=Could not resolve the requested unsloth ref::the dispatched ref names no branch, tag or full commit on unslothai/unsloth, so the four legs could not be pinned to one revision. Standing down rather than letting each of them install whatever it resolves. Give a branch name, a tag, or a full 40-character SHA."
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "testing unslothai/unsloth@$RESOLVED (dispatched as '$UNSLOTH_REF')"

      # unsloth-zoo is resolved ONCE, here, and every leg installs that exact
      # commit.
      #
      # Passing the branch name instead is not equivalent. zoo is not in
      # pins/control.txt either, so the control leg -- the one leg with a
      # committed reference band -- would install whatever main happened to be
      # at the moment its own pip ran, and every payload pips independently on
      # the kernel: the control and the canary could resolve two different zoo
      # commits within one session, which is exactly the uncontrolled variable
      # the pairing exists to exclude. The report records a distribution
      # version, not a commit, so the drift would not even be visible after
      # the fact.
      #
      # A resolution that cannot be made stands the run DOWN. Falling back to
      # the branch name restores exactly the behaviour the pin exists to
      # remove -- every payload independently installing whatever main is when
      # its own pip runs -- and a control and a canary that differ by
      # unrecorded zoo code invalidate both the reference band and the whole
      # attribution the pairing is for. A run that cannot be made reproducible
      # is one that has nothing to say, which is infrastructure: a warning and
      # a green job, exactly like the concurrency and quota stand-downs. The
      # ls-remote is retried first, since a single blip is not a verdict.
      #
      # Also reads the step count the committed reference was captured at, so
      # the build step below can tell whether the band check applies to this
      # run at all.
      - name: Pin the zoo revision and read the reference
        id: pins
        if: steps.ref.outputs.stand_down != 'true'
        run: |
          ZOO_REF=''
          for attempt in 1 2 3; do
            ZOO_REF="$(git ls-remote https://github.com/unslothai/unsloth-zoo refs/heads/main | cut -f1)"
            if [ -n "$ZOO_REF" ]; then break; fi
            echo "ls-remote attempt $attempt resolved nothing"
            sleep 10
          done
          if [ -z "$ZOO_REF" ]; then
            echo "::warning title=Could not resolve unsloth-zoo main::standing down rather than installing a moving branch, so nothing was learned about the code under test"
            echo "stand_down=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "zoo_ref=$ZOO_REF" >> "$GITHUB_OUTPUT"
          echo "testing against unslothai/unsloth-zoo@$ZOO_REF"
          REF_STEPS="$(python -c "import json,sys; print(json.load(open('tests/kaggle/t4_smoke/references/t4_qwen2.5-0.5b.json')).get('config',{}).get('max_steps',''))")"
          echo "reference_max_steps=$REF_STEPS" >> "$GITHUB_OUTPUT"
          echo "committed reference was captured at max_steps=$REF_STEPS"

      # --all-kernels builds every kernel in legs.KERNELS and emits the
      # launcher's --notebook arguments and the expected payload count, so
      # the leg-to-kernel plan is stated once, in legs.py, rather than here
      # as well.
      #
      # The reference is captured at ONE step count and is only comparable
      # to a run of that same count -- the payload refuses the comparison
      # otherwise rather than quietly reporting a pass. So the run that
      # RECAPTURES a reference after a config change has to be dispatched
      # with skip_reference_band, and it is the only run that should be.
      # See tests/kaggle/t4_smoke/references/README.md.
      - name: Build the kernel notebooks
        id: build
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true'
        env:
          SKIP_BAND: ${{ inputs.skip_reference_band }}
          MAX_STEPS: ${{ inputs.max_steps || 10 }}
          REF_STEPS: ${{ steps.pins.outputs.reference_max_steps }}
        run: |
          SKIP=''
          if [ "$SKIP_BAND" = "true" ]; then
            SKIP='--skip-reference'
            echo "::warning title=Reference band check disabled::this run was dispatched with skip_reference_band, so the control leg's metrics are compared against nothing. Only a reference-recapture run should look like this."
          elif [ "$MAX_STEPS" != "$REF_STEPS" ]; then
            # A reference is a trace of ONE step count and the payload refuses
            # to compare across counts (check_reference returns
            # step_count_mismatch, which reference_failures turns red). So a
            # dispatch with max_steps != the reference's own count could only
            # ever fail on the arithmetic rather than on the code. Drop the
            # band instead of failing the run; the rest of the control leg's
            # assertions still apply.
            SKIP='--skip-reference'
            echo "::warning title=Reference band check skipped::this run is $MAX_STEPS steps and the committed reference was captured at $REF_STEPS, which are not comparable. The band check is off for this run; everything else the control leg asserts still applies."
          fi
          python .github/scripts/kaggle_t4_ci/build_kernel.py \
            --payload-dir tests/kaggle/t4_smoke \
            --out kernel \
            --all-kernels \
            --unsloth-ref '${{ steps.ref.outputs.ref }}' \
            --zoo-ref '${{ steps.pins.outputs.zoo_ref }}' \
            --smoke-args "--max-steps ${{ inputs.max_steps || 10 }}" \
            --per-run-timeout 3300 \
            $SKIP

      # kernel-timeout-sec is passed to Kaggle at push time and is a
      # BACKSTOP, not the budget control. Measured on 2026-08-11: a kernel
      # pushed with -t 5400 whose own nbconvert crashed sat in RUNNING for
      # over two hours and stopped only when it was deleted. So the value is
      # passed and nothing rests on it; what actually bounds the spend is
      # the launcher deleting every kernel it pushed, on every path out,
      # which was measured to take the account's used-hours figure back
      # down. See launch.py's module docstring.
      #
      # One value for both kernels because Kaggle takes it per push, and the
      # larger requirement wins: kernel 2 downloads a 12GB gpt-oss checkpoint
      # before it trains anything.
      # THE GATE'S ANSWER CAN BE STALE BY THE TIME WE GET HERE, and this is
      # the first point at which it cannot be.
      #
      # The `gate` job surveys quota and in-flight kernels before this job
      # exists, and this job then queues on the account-wide concurrency group
      # above with cancel-in-progress false. So when two refs are sampled in
      # together, the second one's approval can be up to a full run old by the
      # time it holds the slot, and a human session or another consumer can
      # have spent the reserve in between. Re-asking here, with the slot in
      # hand and immediately before the push, is the only version of the
      # question whose answer is still true when it is acted on.
      #
      # --force true skips the SAMPLING draw and only the sampling draw: the
      # dice were already rolled by the gate job and rerolling them here would
      # discard a run that was legitimately sampled in. The quota floor and
      # the concurrency survey run in full.
      - name: Recheck the Kaggle account
        id: recheck
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN_GH }}
        run: |
          python .github/scripts/kaggle_t4_ci/gate.py \
            --force true \
            --kernels 2 \
            --budget-hours 4 \
            --reserve-hours 20

      # Through the environment rather than an inline expression, so nothing
      # the Kaggle API put in that string is ever interpolated into a shell.
      - name: Report the stale approval
        if: steps.ref.outputs.stand_down != 'true' && steps.pins.outputs.stand_down != 'true' && steps.recheck.outputs.should_run != 'true'
        env:
          REASON: ${{ steps.recheck.outputs.reason }}
        run: |
          echo "::warning title=Stood down at the second check::${REASON}"

      - name: Launch on Kaggle and collect
        id: launch
        if: steps.recheck.outputs.should_run == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN_GH }}
        run: |
          python .github/scripts/kaggle_t4_ci/launch.py \
            ${{ steps.build.outputs.notebooks }} \
            --user danielhanchen \
            --outdir kaggle_evidence \
            --expect '${{ steps.build.outputs.payloads }}' \
            --kernel-timeout-sec 3600 \
            --max-wait 5400 \
            --poll-every 60

      # always(): the evidence is most valuable exactly when something went
      # wrong, and the executed notebooks are kilobytes.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kaggle-t4-evidence
          path: |
            kaggle_evidence/**
            kernel*.ipynb
          # 14 rather than the repo's usual 7. This job runs on a minority of
          # commits, so two consecutive samples of it can be a fortnight
          # apart, and comparing them is the main reason to keep the evidence
          # at all. It is also where a reference is recaptured from.
          retention-days: 14
          if-no-files-found: warn

      # Only when the launcher actually ran. A run that stood down at the
      # recheck has no evidence to report on, and reporting "0 of 4 payloads"
      # for it would read as a failure rather than as the skip it is.
      - name: Report
        if: always() && steps.recheck.outputs.should_run == 'true'
        run: |
          python .github/scripts/kaggle_t4_ci/report.py \
            --evidence kaggle_evidence \
            --expect '${{ steps.build.outputs.payloads || 4 }}'
