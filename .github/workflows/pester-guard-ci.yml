# Runs the Pester bootstrap guard on Windows when the guard itself changes, without
# launching the full studio-windows-inference-smoke matrix.

name: Pester guard

on:
  pull_request:
    # ready_for_review: Windows/macOS jobs below skip draft pull requests, so marking
    # one ready has to start the run that tests it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/studio/test_pester_bootstrap_hardening.py'
      - '.github/workflows/pester-guard-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guard:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Pester bootstrap guard
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Guard the Pester bootstrap
        shell: bash
        run: |
          python -m pip install --quiet pyyaml pytest
          python -m pytest tests/studio/test_pester_bootstrap_hardening.py -q
