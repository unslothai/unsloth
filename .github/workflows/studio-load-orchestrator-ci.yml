# Event-loop regression test: detect_audio_type must run via asyncio.to_thread so
# load-progress polling stays responsive. CPU-only with a stdlib fake llama-server.

name: Unsloth load-orchestrator CI

# Per-commit runs live in Lint CI via .github/scripts/lane-load-orchestrator.sh; this
# stays dispatchable.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # Shared with the Lint CI lane.
      - name: Run load-orchestrator tests
        run: bash .github/scripts/lane-load-orchestrator.sh
