# Collects Kaggle kernels the GPU workflows dispatched (they push and exit) and posts a
# `kaggle-t4-notebook` / `kaggle-studio-gpu` commit status against the sha in the kernel slug.
# Neither can be a required check: sampled commits get no status. One job per account, one token each.
name: Kaggle collect

on:
  schedule:
    # Every 10 minutes, off the hour.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'Delete a still-running kernel older than this many hours'
        type: string
        default: '3'
      no_delete:
        description: 'Collect and report without deleting (inspection only; a kernel left up keeps billing)'
        type: boolean
        default: false

permissions:
  contents: read

# Not serialised against the GPU jobs' own collection; collect.py is safe under races (worst case
# a duplicate verdict). Not cancel-in-progress: a pass mid-download must finish.
concurrency:
  group: kaggle-collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    # collect.py's BUDGET_SEC (900s) + RELEASE_BUDGET_SEC (600s) + setup, so the script stops first.
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - account_id: '1'
            secret_name: KAGGLE_API_TOKEN
          - account_id: '2'
            secret_name: KAGGLE_API_TOKEN_2
    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Only the posting step gets GH_TOKEN; checkout would persist the job token into .git.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install the Kaggle client
        # kaggle 1.7.4.5's authenticate() cannot read KAGGLE_API_TOKEN.
        run: python -m pip install --quiet 'kaggle==2.2.4'

      - name: Collect this account's kernels
        id: collect
        env:
          # Index by name: a ternary would hand over the other account's token when this one is empty.
          KAGGLE_API_TOKEN: ${{ secrets[matrix.secret_name] }}
        # --require-auth: a broken token here must be red; an EMPTY token (single-account repo) only warns.
        # --no-delete: the last step releases kernels after statuses post.
        run: |
          python .github/scripts/kaggle_t4_ci/collect.py \
            --outdir kaggle_collected \
            --require-auth \
            --no-delete \
            --max-age-hours '${{ inputs.max_age_hours || '3' }}' \
            --target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Post first, delete second, so a failed post leaves the kernel for the next pass.
      - name: Post the commit statuses
        id: post
        if: always() && hashFiles('kaggle_collected/collect_result.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/kaggle_t4_ci/post_statuses.py \
            --result kaggle_collected/collect_result.json \
            --out kaggle_collected/posted.json

      - name: Release the kernels whose verdicts were delivered
        if: always() && !inputs.no_delete && hashFiles('kaggle_collected/collect_result.json') != ''
        env:
          KAGGLE_API_TOKEN: ${{ secrets[matrix.secret_name] }}
        run: |
          python .github/scripts/kaggle_t4_ci/collect.py \
            --outdir kaggle_collected \
            --delete-collected kaggle_collected/collect_result.json \
            --posted kaggle_collected/posted.json

      # One kernel per call: chunks from two kernels would be spliced together.
      - name: Unpack the Playwright evidence
        if: always() && hashFiles('kaggle_collected/**/*_output.ipynb') != ''
        continue-on-error: true
        run: |
          for dir in kaggle_collected/*/; do
            [ -d "$dir" ] || continue
            python .github/scripts/kaggle_studio_ci/collect_evidence.py \
              --evidence "$dir" \
              --outdir "studio_evidence/$(basename "$dir")"
          done

      # continue-on-error: statuses are already posted; an artifact outage is not a collection failure.
      - name: Upload evidence
        if: always() && hashFiles('kaggle_collected/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kaggle-collect-evidence-account-${{ matrix.account_id }}
          path: |
            kaggle_collected/**
            studio_evidence/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Summarise
        if: always() && hashFiles('kaggle_collected/collect_result.json') != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          data = json.loads(pathlib.Path("kaggle_collected/collect_result.json").read_text())
          # Collection runs --no-delete, so `deleted` there is always false; the
          # release step wrote the real outcome beside it.
          release = pathlib.Path("kaggle_collected/delete_result.json")
          released = set(json.loads(release.read_text()).get("deleted") or []) if release.exists() else set()
          print(f"### Kaggle collect: account {data.get('owner') or '?'}\n")
          rows = data.get("kernels") or []
          for k in rows:
              k["deleted"] = bool(k.get("deleted")) or k.get("slug") in released
          if not rows:
              print("Nothing of ours was in flight on this account.\n")
          else:
              print("| kernel | commit | kind | state | verdict | deleted |")
              print("| --- | --- | --- | --- | --- | --- |")
              for k in rows:
                  print("| `{}` | `{}` | {} | {} | **{}** | {} |".format(
                      k["slug"].rsplit("/", 1)[-1], k.get("sha") or "-",
                      k.get("kind") or "-", k.get("state") or "-",
                      k.get("verdict") or "-", "yes" if k.get("deleted") else "no"))
              print()
              for k in rows:
                  if k.get("reason"):
                      print(f"- `{k['slug'].rsplit('/', 1)[-1]}`: {k['reason']}")
          PY
