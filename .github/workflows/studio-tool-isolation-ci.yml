name: Studio tool isolation

on:
  pull_request:
    paths:
      - 'studio/backend/core/inference/**'
      - 'studio/backend/tests/test_srt*'
      - 'studio/backend/tests/test_network_proxy.py'
      - 'studio/frontend/src/features/chat/**'
      - 'studio/frontend/src/components/assistant-ui/tool-ui-*.tsx'
      - 'studio/frontend/tests/tool-isolation*'
      - 'studio/frontend/tests/tool-network-policy.test.ts'
      - 'studio/frontend/scripts/srt-browser/**'
      - 'studio/install_srt_runtime.py'
      - 'studio/setup.*'
      - 'pyproject.toml'
      - '.github/workflows/studio-tool-isolation-ci.yml'
      - '.github/scripts/retry-with-apt-lock.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-tool-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: studio/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set isolated Studio state directory
        run: echo "UNSLOTH_STUDIO_HOME=$RUNNER_TEMP/srt-studio-home" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install Linux prerequisites without changing host confinement policy
        timeout-minutes: 8
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '150'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh bash -c 'sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep'
      - name: Install Python test dependencies
        run: |
          python -m pip install pytest pytest-timeout structlog psutil Pillow fastapi
      - name: Install and verify the shipped locked helper
        run: python studio/install_srt_runtime.py
      - name: Reinstall from the populated offline cache
        run: python studio/install_srt_runtime.py --offline
      - name: Protocol and native positive/negative controls
        working-directory: studio/backend/core/inference/srt_runtime
        env:
          UNSLOTH_SRT_NATIVE_TESTS: '1'
        run: npm test
      - name: Selected Python and shell live capability probe
        run: |
          python -c 'from core.inference.os_sandbox import capability_snapshot; c = capability_snapshot(force=True); print(c); assert c.available, c.reason; assert not c.qualified'
      - name: Installer and proxy regressions
        run: python -m pytest --noconftest studio/backend/tests/test_srt_install.py studio/backend/tests/test_srt_adapter.py studio/backend/tests/test_srt_seccomp.py studio/backend/tests/test_srt_launch_contract.py studio/backend/tests/test_srt_network.py studio/backend/tests/test_srt_platform_capability.py studio/backend/tests/test_srt_control.py studio/backend/tests/test_srt_process_lifetime.py studio/backend/tests/test_network_proxy.py -q --timeout=60
      - name: Actual Required tools, selected Pillow runtime and HTTPS allowlist
        env:
          UNSLOTH_SRT_NATIVE_TESTS: '1'
        run: python -m pytest --noconftest studio/backend/tests/test_srt_native_tools.py -q --timeout=120

  desktop-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: studio/backend
      UNSLOTH_SRT_NATIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Set isolated Studio state directory
        shell: bash
        run: echo "UNSLOTH_STUDIO_HOME=$RUNNER_TEMP/srt-studio-home" >> "$GITHUB_ENV"
      - name: Install selected Python test dependencies
        run: python -m pip install pytest pytest-timeout structlog psutil Pillow fastapi
      - name: Install macOS prerequisite
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Install verified helper without privileged setup
        run: python studio/install_srt_runtime.py
      - name: Reinstall from the populated offline cache
        run: python studio/install_srt_runtime.py --offline
      - name: Provision upstream sandbox account and WFP on disposable Windows runner
        if: runner.os == 'Windows'
        run: python studio/install_srt_runtime.py --offline --windows-install
      - name: Native helper protocol and platform controls
        working-directory: studio/backend/core/inference/srt_runtime
        run: npm test
      - name: Native selected runtime capability
        run: python -c "from core.inference.os_sandbox import capability_snapshot; c=capability_snapshot(force=True); print(c); assert c.available, c.reason"
      - name: Native Studio tool controls and installer regressions
        run: python -m pytest --noconftest studio/backend/tests/test_srt_install.py studio/backend/tests/test_srt_platform_capability.py studio/backend/tests/test_srt_control.py studio/backend/tests/test_srt_process_lifetime.py studio/backend/tests/test_srt_native_platform.py -q --timeout=120
      - name: Install macOS production browser fixture dependencies
        if: runner.os == 'macOS'
        run: python -m pip install uvicorn httpx PyJWT python-multipart huggingface_hub requests packaging pyyaml python-dotenv cryptography
      - name: Install macOS browser and locked frontend dependencies
        if: runner.os == 'macOS'
        working-directory: studio/frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/srt-browser-deps" --ignore-scripts --no-save --package-lock=false --no-audit --no-fund playwright@1.58.2
          node "$RUNNER_TEMP/srt-browser-deps/node_modules/playwright/cli.js" install chromium
      - name: Click through native macOS Python and Terminal policy flows
        if: runner.os == 'macOS'
        working-directory: studio/frontend
        env:
          SRT_BROWSER_ARTIFACTS: ${{ runner.temp }}/srt-browser
          SRT_PLAYWRIGHT_MODULE: ${{ runner.temp }}/srt-browser-deps/node_modules/playwright/index.mjs
        run: SRT_BROWSER_PYTHON="$(command -v python)" node scripts/srt-browser/run.mjs
      - name: Upload macOS browser proof and cleanup diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srt-browser-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/srt-browser/*.png
            ${{ runner.temp }}/srt-browser/*.json
            ${{ runner.temp }}/srt-browser/*.txt
            ${{ runner.temp }}/srt-browser/*.log
          if-no-files-found: warn
      - name: Remove upstream sandbox account and WFP from disposable Windows runner
        if: always() && runner.os == 'Windows'
        run: node studio/backend/core/inference/srt_runtime/node_modules/@anthropic-ai/sandbox-runtime/dist/cli.js windows-uninstall

  frontend-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install locked frontend dependencies
        working-directory: studio/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Consent, queued policy and record provenance
        working-directory: studio/frontend
        run: node --experimental-strip-types --test tests/tool-isolation-*.test.ts tests/tool-network-policy.test.ts
      - name: Typecheck
        working-directory: studio/frontend
        run: npm run typecheck
