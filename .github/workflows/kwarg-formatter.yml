# Runs the kwarg formatter (the ruff-format-with-kwargs hook) on our own runners.
# pre-commit.ci ran it over every file on every PR, which made this repo the
# heaviest user of its free tier (#14174), so .pre-commit-config.yaml now lists it
# under `ci: skip`. The cheap hooks stay on pre-commit.ci, which keeps autofixing
# them on every PR, Dependabot's included (sync-allow-scripts-pins relies on that).
#
# A PR checks only the files it changes. A PR that touches the hook, its config or
# the ruff config can change the verdict on any file, so it gets --all-files, and
# so does every push to main. This job only reports: the fix is
# `python scripts/run_ruff_format.py FILE ...` (or `pre-commit run
# ruff-format-with-kwargs --files FILE ...`) and a commit.

name: Kwarg formatter

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  kwarg-format:
    name: ruff-format-with-kwargs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The PR merge commit and its first parent, the base tip it is diffed against.
          fetch-depth: 2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - run: pip install 'pre-commit==4.7.0'

      - name: Run the hook
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          scope=(--all-files)
          if [ "$EVENT" = pull_request ]; then
            if ! git diff --name-only HEAD^1 HEAD \
                | grep -qE '^(\.pre-commit-config\.yaml|pyproject\.toml|scripts/(run_ruff_format|enforce_kwargs_spacing)\.py)$'; then
              scope=(--from-ref HEAD^1 --to-ref HEAD)
            fi
          fi
          echo "pre-commit run ruff-format-with-kwargs ${scope[*]}"
          pre-commit run ruff-format-with-kwargs "${scope[@]}" --show-diff-on-failure
