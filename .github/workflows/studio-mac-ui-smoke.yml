# Mac counterpart to studio-ui-smoke.yml, plus the API, inference and update phases on
# one install to save macOS slots. The update phase runs LAST: it uninstalls.

name: Mac Unsloth UI + API + Update + Inference CI

on:
  pull_request:
    paths:
      # Not studio/** or unsloth/**: the install is --no-torch and src-tauri is never built.
      - 'studio/backend/**'
      - 'studio/frontend/**'
      - 'studio/setup.sh'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'unsloth_cli/**'
      - 'install.sh'
      - 'pyproject.toml'
      # Only the tests/studio files the jobs execute.
      - 'tests/studio/playwright_*.py'
      - 'tests/studio/_playwright_robust.py'
      - 'tests/studio/studio_api_smoke.py'
      - '.github/scripts/run-studio-permission-browser.sh'
      - '.github/scripts/run-studio-indicator-browser.sh'
      - '.github/workflows/studio-mac-ui-smoke.yml'
      - 'studio/nvidia_probe.py'
      - 'scripts/lockfile_supply_chain_audit.py'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      # The install step in this workflow is `uses:` on that composite action.
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - 'scripts/uninstall.sh'
      - '.github/scripts/assert-llama-loads.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/studio_smoke/multi_turn_chat.py'
  push:
    branches: [main]
    # Same list as the PR filter, to spare the account-wide macOS slots.
    paths:
      - 'studio/backend/**'
      - 'studio/frontend/**'
      - 'studio/setup.sh'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'unsloth_cli/**'
      - 'install.sh'
      - 'pyproject.toml'
      - 'tests/studio/playwright_*.py'
      - 'tests/studio/_playwright_robust.py'
      - 'tests/studio/studio_api_smoke.py'
      - '.github/scripts/run-studio-permission-browser.sh'
      - '.github/scripts/run-studio-indicator-browser.sh'
      - '.github/workflows/studio-mac-ui-smoke.yml'
      - 'studio/nvidia_probe.py'
      - 'scripts/lockfile_supply_chain_audit.py'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      # The install step in this workflow is `uses:` on that composite action.
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
      - 'scripts/uninstall.sh'
      - '.github/scripts/assert-llama-loads.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/studio_smoke/multi_turn_chat.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ui-smoke:
    name: Chat UI, API, Update and GGUF inference
    runs-on: macos-15
    # Phases share one install; the cap still bounds a hang holding a macOS slot.
    timeout-minutes: 100
    env:
      GGUF_REPO: unsloth/gemma-3-270m-it-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GGUF_FILE: gemma-3-270m-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18896'
      # Dump thread stacks on a backend stall (#9712).
      UNSLOTH_STUDIO_STALL_WATCHDOG: '1'
      HF_HOME: ${{ github.workspace }}/hf-cache
      # Hosted macOS exposes only a paravirtual Metal device, so phases run fully on CPU and
      # the #8883 host-offload RAM guard would decline the load. Allowed knowingly for the whole
      # job; the guard is tested in studio/backend/tests.
      UNSLOTH_ALLOW_HOST_OFFLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # Cross-OS key: the hf-cache tree is byte-identical on every OS.
      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        id: cache-hf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        # hf-download-with-retry.sh retries forever; a step timeout fails the step, so later
        # phases still run.
        timeout-minutes: 25
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        # Save on main only: PR-scoped caches only serve that PR and evict main's shared copies
        # from the near-full repo cache budget.
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Install Unsloth (--local, --no-torch)
        id: install_unsloth
        if: ${{ !cancelled() }}
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Assert llama.cpp loads on this macOS
        id: assert_llama
        if: ${{ !cancelled() && steps.install_unsloth.outcome == 'success' }}
        run: bash .github/scripts/assert-llama-loads.sh

      - name: Install Playwright browsers
        # No --with-deps on Mac (Linux apt only). Pinned <1.58: 1.55-1.58 ship Node 24 and crash
        # on partial JSON in pipeTransport.js; patched below as well.
        run: |
          pip install 'playwright>=1.55,<1.58'
          python -m playwright install chromium webkit

      - name: Patch Playwright pipeTransport.js to tolerate malformed JSON
        # Backport upstream's try/catch around JSON.parse in pipeTransport.js.
        run: |
          python - <<'PY'
          import os, re, sys
          import playwright
          driver_dir = os.path.join(os.path.dirname(playwright.__file__), "driver", "package", "lib", "server")
          path = os.path.join(driver_dir, "pipeTransport.js")
          src = open(path).read()
          # Wrap both `this.onmessage.call(null, JSON.parse(...))` sites in try/catch.
          patched = re.sub(
              r"this\.onmessage\.call\(null, JSON\.parse\((message2?)\)\);",
              r"try { this.onmessage.call(null, JSON.parse(\1)); } "
              r"catch (e) { /* swallow malformed JSON from a crashing browser */ }",
              src,
          )
          if patched == src:
              # Already patched, or upstream changed -- either way, don't fail the build.
              print(f"pipeTransport.js: no JSON.parse calls matched at {path}; skipping.")
          else:
              open(path, "w").write(patched)
              print(f"pipeTransport.js: patched JSON.parse calls in {path}")
          PY

      - name: Composer icon alignment
        timeout-minutes: 5
        run: |
          if [ ! -x studio/frontend/node_modules/.bin/vite ]; then
            python scripts/lockfile_supply_chain_audit.py
            npm ci --prefix studio/frontend --ignore-scripts --no-fund --no-audit
          fi
          python tests/studio/playwright_composer_icons.py chromium webkit

      - name: Reset auth + boot Unsloth
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT"

      - name: Wait for /api/health
        run: |
          bash .github/scripts/wait-for-health.sh --port "$STUDIO_PORT"

      - name: Pass bootstrap password to the Playwright step
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          NEW2="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          echo "::add-mask::$NEW2"
          echo "STUDIO_OLD_PW=$OLD"   >> "$GITHUB_ENV"
          echo "STUDIO_NEW_PW=$NEW"   >> "$GITHUB_ENV"
          echo "STUDIO_NEW2_PW=$NEW2" >> "$GITHUB_ENV"

      - name: Drive the chat UI with Playwright
        env:
          BASE_URL: http://127.0.0.1:18896
          PW_ART_DIR: logs/playwright
          STUDIO_UI_STRICT: '1'
          # Slow macOS runner without Metal: triple the 180s default turn timeout.
          STUDIO_UI_TURN_TIMEOUT_MS: '540000'
        # Retry known macOS runner flakes (pipeTransport crash, ERR_NO_BUFFER_SPACE, navigation
        # interrupted) after a full reset; real assertion failures match no pattern and surface.
        run: |
          mkdir -p logs/playwright
          attempt=1
          max_attempts=3
          while : ; do
            set +e
            python tests/studio/playwright_chat_ui.py 2>&1 | tee logs/playwright_attempt_${attempt}.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if { grep -q "Unexpected end of JSON input"       logs/playwright_attempt_${attempt}.log \
                 || grep -q "ERR_NO_BUFFER_SPACE"             logs/playwright_attempt_${attempt}.log \
                 || grep -q "interrupted by another navigation" logs/playwright_attempt_${attempt}.log; } \
               && [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::Playwright flake on attempt ${attempt}; resetting Unsloth and retrying..."
              kill "${STUDIO_PID}" 2>/dev/null || true
              sleep 2
              rm -rf ~/.unsloth/studio/auth
              UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p "$STUDIO_PORT" \
                > "logs/studio_retry_${attempt}.log" 2>&1 &
              STUDIO_PID=$!
              echo "STUDIO_PID=$STUDIO_PID" >> "$GITHUB_ENV"
              for i in $(seq 1 180); do
                if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json \
                   && jq -e '.status == "healthy"' /tmp/health.json >/dev/null; then
                  break
                fi
                sleep 1
              done
              STUDIO_OLD_PW=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
              STUDIO_NEW_PW="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
              STUDIO_NEW2_PW="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
              echo "::add-mask::$STUDIO_OLD_PW"
              echo "::add-mask::$STUDIO_NEW_PW"
              echo "::add-mask::$STUDIO_NEW2_PW"
              export STUDIO_OLD_PW STUDIO_NEW_PW STUDIO_NEW2_PW
              attempt=$((attempt + 1))
              sleep 3
              continue
            fi
            exit "$rc"
          done

      - name: Stop Unsloth (chat-ui ends with Shutdown click; this is belt-and-suspenders)
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2

      - name: Cross-browser permission controls
        run: |
          bash .github/scripts/run-studio-permission-browser.sh 18895 webkit

      # WKWebView is what the desktop app embeds; status reads are stubbed.
      - name: Loaded-models indicator (WebKit)
        run: |
          bash .github/scripts/run-studio-indicator-browser.sh 18899 webkit

      - name: Reset auth + boot Unsloth for extra UI tests (port 18897)
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18897 --log logs/studio_extra.log --pid-var STUDIO_EXTRA_PID

      - name: Wait for /api/health on 18897
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18897 --log logs/studio_extra.log --tmp /tmp/health2.json

      - name: Pass bootstrap pw for extra UI test
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIUiExtra-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          echo "STUDIO_EXTRA_OLD_PW=$OLD" >> "$GITHUB_ENV"
          echo "STUDIO_EXTRA_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: Drive Compare/Recipes/Export/Unsloth/Settings with Playwright
        env:
          BASE_URL: http://127.0.0.1:18897
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_extra
          STUDIO_UI_STRICT: '1'
          STUDIO_UI_TURN_TIMEOUT_MS: '540000'
          GGUF_REPO: ${{ env.GGUF_REPO }}
          GGUF_VARIANT: ${{ env.GGUF_VARIANT }}
        # Same flake-retry shape as the chat UI step.
        run: |
          mkdir -p logs/playwright_extra
          attempt=1
          max_attempts=3
          while : ; do
            set +e
            python tests/studio/playwright_extra_ui.py 2>&1 | tee logs/playwright_extra_attempt_${attempt}.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if { grep -q "Unexpected end of JSON input"       logs/playwright_extra_attempt_${attempt}.log \
                 || grep -q "ERR_NO_BUFFER_SPACE"             logs/playwright_extra_attempt_${attempt}.log \
                 || grep -q "interrupted by another navigation" logs/playwright_extra_attempt_${attempt}.log; } \
               && [ "$attempt" -lt "$max_attempts" ]; then
              echo "::warning::Playwright flake on attempt ${attempt}; resetting Unsloth and retrying..."
              kill "${STUDIO_EXTRA_PID}" 2>/dev/null || true
              sleep 2
              rm -rf ~/.unsloth/studio/auth
              UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p 18897 \
                > "logs/studio_extra_retry_${attempt}.log" 2>&1 &
              STUDIO_EXTRA_PID=$!
              echo "STUDIO_EXTRA_PID=$STUDIO_EXTRA_PID" >> "$GITHUB_ENV"
              for i in $(seq 1 180); do
                if curl -fs "http://127.0.0.1:18897/api/health" > /tmp/health2.json \
                   && jq -e '.status == "healthy"' /tmp/health2.json >/dev/null; then
                  break
                fi
                sleep 1
              done
              STUDIO_OLD_PW=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
              STUDIO_NEW_PW="CIUiExtra-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
              echo "::add-mask::$STUDIO_OLD_PW"
              echo "::add-mask::$STUDIO_NEW_PW"
              export STUDIO_OLD_PW STUDIO_NEW_PW
              # Export the new credentials to later steps: the retry wiped auth and re-bootstrapped.
              echo "STUDIO_EXTRA_OLD_PW=$STUDIO_OLD_PW" >> "$GITHUB_ENV"
              echo "STUDIO_EXTRA_NEW_PW=$STUDIO_NEW_PW" >> "$GITHUB_ENV"
              attempt=$((attempt + 1))
              sleep 3
              continue
            fi
            exit "$rc"
          done

      - name: Update banner layout regression (Playwright)
        env:
          BASE_URL: http://127.0.0.1:18897
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_update_banner
        run: |
          mkdir -p logs/playwright_update_banner
          python tests/studio/playwright_update_banner_layout.py

      - name: Stop second Unsloth
        if: always()
        run: |
          kill "${STUDIO_EXTRA_PID}" 2>/dev/null || true
          sleep 2

      # Own cold-port boot with no health wait: a settled backend is the wrong start state.
      # The script pins /api/health at hardware_detecting=true itself, so no timing is assumed.
      - name: Reset auth + boot Unsloth for the tab-capability smoke (port 18893)
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18893 --log logs/studio_tabs.log --pid-var STUDIO_TABS_PID

      - name: Pass bootstrap pw for the tab-capability smoke
        run: |
          # Wait for the password file, not health: health is under test.
          for i in $(seq 1 180); do
            [ -f ~/.unsloth/studio/auth/.bootstrap_password ] && break
            sleep 1
          done
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          echo "::add-mask::$OLD"
          echo "STUDIO_TABS_OLD_PW=$OLD" >> "$GITHUB_ENV"

      - name: Drive the Train/Video capability gate with Playwright
        env:
          BASE_URL: http://127.0.0.1:18893
          STUDIO_OLD_PW: ${{ env.STUDIO_TABS_OLD_PW }}
          PW_ART_DIR: logs/playwright_mac_tabs
          # Shorter than the 330s default: this phase has no Tauri watchdog to outlive.
          STUDIO_MAC_SURVIVAL_S: '120'
        run: |
          mkdir -p logs/playwright_mac_tabs
          python tests/studio/playwright_mac_tab_capabilities.py

      - name: Stop tab-capability Unsloth
        if: always()
        run: |
          kill "${STUDIO_TABS_PID}" 2>/dev/null || true
          sleep 2

      # API + auth phase on its own port (18894).
      - name: Install pyjwt for the JWT-expiry forge test
        run: pip install 'pyjwt>=2.6'

      - name: Reset auth + boot Unsloth (API-only, port 18894)
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18894 --log logs/studio_api.log --pid-var STUDIO_API_PID

      - name: Wait for /api/health on 18894
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18894 --log logs/studio_api.log --tmp /tmp/health_api.json

      - name: Pass bootstrap password + rotated targets to the API test
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="ApiSmoke-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          NEW2="ApiSmoke-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          echo "::add-mask::$NEW2"
          echo "STUDIO_OLD_PW=$OLD"  >> "$GITHUB_ENV"
          echo "STUDIO_NEW_PW=$NEW"  >> "$GITHUB_ENV"
          echo "STUDIO_NEW2_PW=$NEW2" >> "$GITHUB_ENV"

      - name: Run Unsloth API & Auth tests
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_AUTH_DIR: /Users/runner/.unsloth/studio/auth
        run: python tests/studio/studio_api_smoke.py

      - name: Stop API-phase Unsloth
        if: always()
        run: |
          kill "${STUDIO_API_PID}" 2>/dev/null || true
          sleep 2

      # GGUF inference phases, folded in to save a macOS slot. They write GGUF_* and STUDIO_PORT
      # to $GITHUB_ENV (which outranks job env), so they must run AFTER the UI/API phases and
      # BEFORE the update phase. Phase 1 reuses this job's primed hf-cache.
      - name: Phase 1 environment
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/gemma-3-270m-it-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=gemma-3-270m-it-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18888" >> "$GITHUB_ENV"

      - name: Install OpenAI + Anthropic Python SDKs
        id: sdks-chat
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        timeout-minutes: 5
        run: pip install 'openai>=1.50,<4' 'anthropic>=1,<2'

      - name: Reset auth + boot Unsloth (API-only)
        id: boot-chat
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT" \
            --log logs/studio_chat_api.log --pid-var STUDIO_CHAT_PID

      - name: Wait for /api/health
        id: ready-chat
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.boot-chat.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          bash .github/scripts/wait-for-health.sh --port "$STUDIO_PORT"

      - name: Password rotation (old must fail, new must work)
        id: rotate-chat
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.ready-chat.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIRotated-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          [ -n "$OLD_TOKEN" ] && [ "$OLD_TOKEN" != "null" ] || { echo "bootstrap login failed"; exit 1; }
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          OLD_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}")
          if [ "$OLD_STATUS" != "401" ]; then
            echo "::error::Login with old password returned $OLD_STATUS, expected 401"
            exit 1
          fi
          NEW_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          [ -n "$NEW_TOKEN" ] && [ "$NEW_TOKEN" != "null" ] || { echo "new login failed"; exit 1; }
          echo "TOKEN=$NEW_TOKEN" >> "$GITHUB_ENV"
          echo "password rotation OK (old=401, new=200)"

      - name: Load the GGUF (HF repo + variant, served from HF_HOME cache)
        id: load-chat
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.rotate-chat.outcome == 'success' }}
        timeout-minutes: 12
        run: |
          # speculative_type=off and n_parallel=1 make the determinism check valid: n-gram drafting
          # and --kv-unified change batch shapes between runs. Other phases keep the defaults.
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 600 \
            -d "{\"model_path\":\"$GGUF_REPO\",\"gguf_variant\":\"$GGUF_VARIANT\",\"is_lora\":false,\"max_seq_length\":2048,\"speculative_type\":\"off\",\"n_parallel\":1}" \
            | jq '{status, display_name, is_gguf, context_length}'

      - name: Multi-turn determinism via OpenAI + Anthropic SDKs
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.load-chat.outcome == 'success' }}
        timeout-minutes: 15
        env:
          BASE_URL: http://127.0.0.1:18888
        run: |
          python3 .github/scripts/studio_smoke/multi_turn_chat.py

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_CHAT_PID}" 2>/dev/null || true
          sleep 2
          lsof -nP -iTCP:"${STUDIO_PORT}" -sTCP:LISTEN || true

      - name: Upload logs
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: openai-anthropic-log
          path: |
            logs/studio_chat_api.log
            logs/install.log
          retention-days: 7

      # Phase 2: tool calling. Every step carries `!cancelled()` plus the assert-llama gate so a
      # phase-1 failure does not skip later phases, but a broken preamble does.
      - name: Phase 2 environment
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/Qwen3.5-2B-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_FILE=Qwen3.5-2B-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18898" >> "$GITHUB_ENV"

      # Cross-OS key shared with the Linux tool-calling job. Bump the suffix whenever `path`
      # changes: actions/cache versions entries by path, and a moved path misses and fails to save.
      - name: Restore GGUF model file
        id: cache-gguf-tools
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        timeout-minutes: 15
        with:
          path: gguf-cache-tools
          key: gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v3
          enableCrossOsArchive: true

      - name: Download GGUF if cache miss
        id: download-gguf-tools
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && (steps.cache-gguf-tools.outputs.cache-hit != 'true' || steps.cache-gguf-tools.outcome != 'success') }}
        # hf-download-with-retry.sh retries forever; this is its real bound.
        timeout-minutes: 20
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache-tools
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache-tools

      - name: Save GGUF model file
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf-tools.outcome != 'skipped' && hashFiles('gguf-cache-tools/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        timeout-minutes: 15
        with:
          path: gguf-cache-tools
          key: gguf-unsloth/Qwen3.5-2B-GGUF-Qwen3.5-2B-UD-Q4_K_XL.gguf-v3
          enableCrossOsArchive: true

      - name: Reset auth + boot Unsloth (API-only, default tool policy)
        id: boot-tools
        # `!= 'failure'`, not `== 'success'`: a cache hit skips the download.
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.download-gguf-tools.outcome != 'failure' }}
        timeout-minutes: 2
        # API-only mode leaves tool_policy=None so each request's `enable_tools` is honoured;
        # `unsloth studio run` would force the agentic loop on loopback.
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port "$STUDIO_PORT" --log logs/studio_tools.log

      - name: Wait for /api/health, log in, change password, load model
        id: ready-tools
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.boot-tools.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CITool-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          GGUF_PATH="$GITHUB_WORKSPACE/gguf-cache-tools/${GGUF_FILE}"
          ls -lh "$GGUF_PATH"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 600 \
            -d "{\"model_path\":\"$GGUF_PATH\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name}'

      - name: Tool calling, server-side tools, thinking on/off
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.ready-tools.outcome == 'success' }}
        timeout-minutes: 20
        env:
          BASE_URL: http://127.0.0.1:18898
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407

          def post(path, body, *, timeout = 240):
              """Plain JSON POST. For requests that don't go through
              the server-side agentic loop, the response is one JSON
              object."""
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          def post_sse(path, body, *, timeout = 600, retries = 1, soft = False):
              """POST a streaming request and accumulate the assistant
              text deltas. The server-side agentic loop ALWAYS returns
              SSE regardless of the request's `stream` field, so any
              call with enable_tools=true must use this helper.

              A shared CI runner can stall the stream transport (the
              connection opening, or a mid-stream read) even when Unsloth
              is healthy, so harden the read three ways: retry a stall
              once with a fresh request capped at 300s; return any text
              already streamed before a stall (a stall on the trailing
              tokens, after the answer arrived, still counts); and when
              every attempt yields nothing, a hard call re-raises while a
              soft call (the best-effort server-side tool probes) returns
              None so the caller can WARN instead of sinking the whole
              job. HTTP status errors always surface immediately."""
              body = {**body, "stream": True}
              data = json.dumps(body).encode()
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = data,
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type": "application/json",
                      # The tool loop's frames, and the confirm gate's prompt, only
                      # go to a caller that asks, as the Studio UI does. Ask, so this
                      # probe exercises the same path a user takes.
                      "X-Unsloth-Events": "1",
                  },
              )
              for attempt in range(retries + 1):
                  parts = []
                  t = timeout if attempt == 0 else min(timeout, 300)
                  try:
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          for raw in resp:
                              line = raw.decode().strip()
                              if not line.startswith("data: "):
                                  continue
                              payload = line[6:]
                              if payload == "[DONE]":
                                  break
                              try:
                                  chunk = json.loads(payload)
                              except json.JSONDecodeError:
                                  continue
                              for choice in chunk.get("choices", []):
                                  delta = choice.get("delta", {}) or {}
                                  if delta.get("content"):
                                      parts.append(delta["content"])
                      return "".join(parts)
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      # Text already streamed is a valid signal -- keep it
                      # rather than re-running a heavy generation.
                      if parts:
                          joined = "".join(parts)
                          print(f"[retry-sse] {path}: {exc!r}; keeping {len(joined)} partial chars", flush = True)
                          return joined
                      if attempt == retries:
                          if soft:
                              print(f"[tools] WARN {path}: SSE transport stalled with no data ({exc!r}) -- non-blocking", flush = True)
                              return None
                          raise
                      print(f"[retry-sse] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          # ── 1. Standard OpenAI function calling ──────────────────────
          weather_tool = {
              "type": "function",
              "function": {
                  "name": "get_weather",
                  "description": "Get current weather for a city.",
                  "parameters": {
                      "type": "object",
                      "properties": {"city": {"type": "string"}},
                      "required": ["city"],
                  },
              },
          }

          # Mac Metal at temperature=0 is pathological for these small
          # quants (Qwen3.5-2B emits ',,,,,,...' or 'The The The...'),
          # gemma-4-E2B emits '<unused5>' tokens). The Linux CPU
          # backend hides the issue. Use a small non-zero temperature
          # with a fixed seed so we stay deterministic but escape the
          # degenerate sampling trap.
          TEMP = 0.2

          status, data = post("/v1/chat/completions", {
              "messages":    [{"role": "user", "content": "What is the weather in Paris?"}],
              "tools":       [weather_tool],
              "tool_choice": "required",
              "stream":      False,
              "temperature": TEMP,
              "seed":        SEED,
              # tool_choice='required' constrains the grammar so the
              # model emits a tool_call quickly when it works at all;
              # 128 tokens is enough for `{"city":"Paris"}` plus the
              # JSON envelope.
              "max_tokens":  128,
          }, timeout = 180)
          assert status == 200, f"tool call status {status}: {data}"
          choice = data["choices"][0]
          tool_calls = (choice.get("message") or {}).get("tool_calls") or []
          # Unsloth's contract: when tool_choice='required', llama.cpp's
          # grammar should force a tool_calls payload. On Mac that
          # contract is sometimes broken by the underlying quant; the
          # PASS path is "tool_calls present + correct schema", the
          # WARN path documents Unsloth still returned 200 with a
          # well-formed choices[] envelope.
          if tool_calls:
              tc = tool_calls[0]
              assert tc["function"]["name"] == "get_weather", (
                  f"unexpected tool name: {tc['function']['name']!r}"
              )
              args = json.loads(tc["function"]["arguments"])
              assert args.get("city"), f"missing city arg: {args}"
              print(f"[tools] PASS function calling -> {tc['function']['name']}({args}) finish={choice.get('finish_reason')!r}")
          else:
              # Infrastructure path is correct; model output drifted.
              print(
                  f"[tools] WARN function calling: no tool_calls (finish_reason="
                  f"{choice.get('finish_reason')!r}); HTTP path OK, this is a "
                  f"Mac Metal quant degeneracy."
              )

          # ── 2. Server-side python tool ───────────────────────────────
          # 123 * 456 = 56088. The agentic loop streams SSE; we
          # accumulate the assistant text and look for the answer. On
          # Mac the model often loses the tool calling contract before
          # producing the answer; accept either the answer OR a
          # non-empty SSE stream as proof the path completes.
          # macOS free runner is ~10 tok/s on Qwen3.5-2B Q4_K_XL;
          # cap max_tokens tightly so each SSE round stays under ~30s
          # even when the model stalls in a degenerate output state.
          # retries=0 on the best-effort probes: this step's 20-minute cap
          # also has to cover the thinking checks, so a no-data stall must be a
          # single 180s attempt (not 180+15+180s) to leave room for the
          # thinking checks. A soft/best-effort probe only WARNs anyway.
          content = post_sse("/v1/chat/completions", {
              "messages":      [{"role": "user", "content": "What is 123 * 456? Use the python tool to compute it and tell me the number."}],
              "enable_tools":  True,
              "permission_mode": "full",
              "enabled_tools": ["python"],
              "session_id":    "ci-tool-calling-py",
              "temperature":   TEMP,
              "seed":          SEED,
              "max_tokens":    128,
          }, timeout = 180, retries = 0, soft = True)
          if content is None:
              print("[tools] WARN python tool: SSE transport stalled after retries -- non-blocking")
          elif "56088" in content or "56,088" in content:
              print(f"[tools] PASS python tool ({len(content)} chars, found 56088)")
          else:
              # Empty stream is a known Mac-quant degeneracy too; log
              # but do not fail.
              print(
                  f"[tools] WARN python tool: SSE OK ({len(content)} chars) but "
                  f"model didn't return 56088 -- Mac quant drift"
              )

          # NOTE: the dedicated "Server-side bash (terminal) tool" axis
          # was dropped in favour of the python axis above. Both share
          # the SAME server-side agentic loop wiring (only the registry
          # entry differs); the python axis is the canonical proof. On
          # macOS the duplicated SSE round was the dominant cost in
          # this step, so collapsing the two saves ~30-60 s wallclock
          # without losing distinct coverage.

          # ── 3. Server-side web_search tool ───────────────────────────
          # DuckDuckGo is flaky from CI runners and small Qwen3.5-2B
          # may not actually search. Only assert that the SSE stream
          # opens and yields any data; HTTP / parser failures already
          # raise above.
          try:
              content = post_sse("/v1/chat/completions", {
                  "messages":      [{"role": "user", "content": "Search the web for 'unsloth ai github' and summarise."}],
                  "enable_tools":  True,
                  "permission_mode": "full",
                  "enabled_tools": ["web_search"],
                  "session_id":    "ci-tool-calling-web",
                  "temperature":   TEMP,
                  "seed":          SEED,
                  "max_tokens":    96,
              }, timeout = 180, retries = 0)
              print(f"[tools] PASS web_search stream ({len(content)} chars)")
          except Exception as exc:
              print(f"[tools] WARN web_search probe failed (non-blocking): {exc}")

          # ── 4. Thinking on / off ─────────────────────────────────────
          # Unsloth strips think blocks from message.content for tools-mode
          # responses, so we toggle plain chat (no enable_tools) and look
          # at the surfaced reasoning_content / message.thinking field.
          def thinking_call(enable):
              status, data = post("/v1/chat/completions", {
                  "messages":        [{"role": "user", "content": "Briefly: is 17 prime?"}],
                  "stream":          False,
                  "enable_thinking": enable,
                  "temperature":     TEMP,
                  "seed":            SEED,
                  # 80 tokens lands within this step's 20-minute cap
                  # on the macOS free runner. 17 is small; this is
                  # plenty of room for either "Yes" + brief reasoning
                  # or a degenerate empty completion.
                  "max_tokens":      80,
              }, timeout = 180)
              assert status == 200
              msg = data["choices"][0]["message"]
              # Unsloth surfaces thinking via reasoning_content (OpenAI
              # extension). Fall back to inline <think> markers for
              # robustness across template versions.
              raw = (msg.get("content") or "") + (msg.get("reasoning_content") or "")
              return raw

          on_text  = thinking_call(True)
          off_text = thinking_call(False)
          # Mac quant drift: the model may produce empty / degenerate
          # output regardless of enable_thinking. Assert ONLY that the
          # endpoint returned 200 (already enforced inside thinking_call)
          # and that toggling the flag doesn't surface a hard <think>
          # marker when off.
          had_think_on  = ("<think>" in on_text)  or len(on_text)  > 80
          if not had_think_on:
              print(
                  f"[tools] WARN enable_thinking=True produced no thinking signal: "
                  f"{on_text[:200]!r} -- Mac quant drift"
              )
          # Off-mode should not contain the literal <think> marker.
          assert "<think>" not in off_text, (
              f"enable_thinking=False but <think> still present: {off_text!r}"
          )
          print(f"[tools] PASS thinking on/off (on={len(on_text)} chars, off={len(off_text)} chars)")
          PY

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          lsof -nP -iTCP:"${STUDIO_PORT}" -sTCP:LISTEN || true

      - name: Upload logs
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tool-calling-log
          path: |
            logs/studio_tools.log
            logs/install.log
          retention-days: 1

      # Phase 3: JSON schema + image input; same `if:` shape as phase 2.
      - name: Phase 3 environment
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        run: |
          echo "GGUF_REPO=unsloth/gemma-4-E2B-it-GGUF" >> "$GITHUB_ENV"
          echo "GGUF_VARIANT=UD-Q4_K_XL" >> "$GITHUB_ENV"
          echo "GGUF_FILE=gemma-4-E2B-it-UD-Q4_K_XL.gguf" >> "$GITHUB_ENV"
          echo "MMPROJ_FILE=mmproj-F16.gguf" >> "$GITHUB_ENV"
          echo "STUDIO_PORT=18892" >> "$GITHUB_ENV"

      - name: Restore GGUF + mmproj files
        id: cache-gguf-vision
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        timeout-minutes: 20
        with:
          path: gguf-cache-vision
          key: ${{ runner.os }}-gguf-unsloth/gemma-4-E2B-it-GGUF-gemma-4-E2B-it-UD-Q4_K_XL.gguf-mmproj-F16.gguf-v3

      - name: Verify cache contains BOTH gguf + mmproj
        id: verify-cache
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.cache-gguf-vision.outputs.cache-hit == 'true' }}
        run: |
          if [[ -f "gguf-cache-vision/$GGUF_FILE" && -f "gguf-cache-vision/$MMPROJ_FILE" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Partial cache hit -- forcing re-download."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download GGUF + mmproj if cache miss or partial
        id: download-gguf-vision
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && (steps.cache-gguf-vision.outputs.cache-hit != 'true' || steps.verify-cache.outputs.ok != 'true') }}
        # Authenticated: shared macOS NAT egress stalls anonymous multi-GB downloads.
        # The retry script loops forever, so this cap is the real bound.
        timeout-minutes: 30
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p gguf-cache-vision
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE" gguf-cache-vision &
          MODEL_PID=$!
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$MMPROJ_FILE" gguf-cache-vision &
          MMPROJ_PID=$!
          wait "$MODEL_PID"
          wait "$MMPROJ_PID"
          ls -lh "gguf-cache-vision/$GGUF_FILE" "gguf-cache-vision/$MMPROJ_FILE"

      # The mmproj-presence check stops a partial save from poisoning the cache.

      - name: Save GGUF + mmproj files
        if: always() && github.ref == 'refs/heads/main' && steps.download-gguf-vision.outcome != 'skipped' && hashFiles('gguf-cache-vision/**/*.gguf') != '' && hashFiles(format('gguf-cache-vision/{0}', 'mmproj-F16.gguf')) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        timeout-minutes: 20
        with:
          path: gguf-cache-vision
          key: ${{ runner.os }}-gguf-unsloth/gemma-4-E2B-it-GGUF-gemma-4-E2B-it-UD-Q4_K_XL.gguf-mmproj-F16.gguf-v3

      - name: Install OpenAI + Anthropic Python SDKs
        id: sdks-vision
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' }}
        timeout-minutes: 5
        run: pip install 'openai>=1.50,<4' 'anthropic>=1,<2'

      - name: Reset auth + boot Unsloth (API-only)
        id: boot-vision
        # Only this phase imports the SDKs, hence the extra clause.
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.sdks-vision.outcome == 'success' && steps.download-gguf-vision.outcome != 'failure' }}
        timeout-minutes: 2
        # API-only keeps tool_policy=None (see phase 2).
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port "$STUDIO_PORT" --log logs/studio_vision.log

      - name: Wait for /api/health, log in, change password, load model
        id: ready-vision
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.boot-vision.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          for i in $(seq 1 180); do
            if curl -fs "http://127.0.0.1:${STUDIO_PORT}/api/health" > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json && break
            fi
            sleep 1
          done
          jq -e '.status == "healthy"' /tmp/health.json
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIJson-$(python -c 'import secrets; print(secrets.token_urlsafe(12))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          OLD_TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$OLD\"}" | jq -r .access_token)
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/change-password" \
            -H "Authorization: Bearer $OLD_TOKEN" -H 'content-type: application/json' \
            -d "{\"current_password\":\"$OLD\",\"new_password\":\"$NEW\"}" > /dev/null
          TOKEN=$(curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"username\":\"unsloth\",\"password\":\"$NEW\"}" | jq -r .access_token)
          echo "API_KEY=$TOKEN" >> "$GITHUB_ENV"
          # Omit gguf_variant: _find_local_gguf_by_variant expects a directory, not a file.
          GGUF_PATH="$GITHUB_WORKSPACE/gguf-cache-vision/${GGUF_FILE}"
          MMPROJ_PATH="$GITHUB_WORKSPACE/gguf-cache-vision/${MMPROJ_FILE}"
          ls -lh "$GGUF_PATH" "$MMPROJ_PATH"
          curl -fs -X POST "http://127.0.0.1:${STUDIO_PORT}/api/inference/load" \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            --max-time 900 \
            -d "{\"model_path\":\"$GGUF_PATH\",\"is_lora\":false,\"max_seq_length\":2048}" \
            | jq '{status, display_name, is_vision}'

      - name: JSON schema decoding + image input
        if: ${{ !cancelled() && steps.assert_llama.outcome == 'success' && steps.ready-vision.outcome == 'success' }}
        timeout-minutes: 20
        env:
          BASE_URL: http://127.0.0.1:18892
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from openai import OpenAI
          from anthropic import Anthropic

          BASE = os.environ["BASE_URL"]
          KEY  = os.environ["API_KEY"]
          SEED = 3407
          # Mac Metal degenerates these gemma-4 quants at temperature=0
          # (any prompt yields '<unused5>...' padding tokens). Use a
          # small non-zero temperature with the same seed so we stay
          # deterministic-enough but escape the trap.
          TEMP = 0.2

          def post(path, body, *, timeout = 240):
              req = urllib.request.Request(
                  f"{BASE}{path}",
                  data    = json.dumps(body).encode(),
                  method  = "POST",
                  headers = {
                      "Authorization": f"Bearer {KEY}",
                      "Content-Type":  "application/json",
                  },
              )
              # Shared CI runners stall sporadically, so retry transport-level
              # failures only; HTTP status errors surface immediately. Bounded
              # to fit the job's timeout-minutes: short probes get 3 full
              # attempts, long probes one retry capped at 300s (a healthy
              # server answers a retry quickly; a stalled one never does).
              attempts = 3 if timeout <= 300 else 2
              for attempt in range(attempts):
                  try:
                      t = timeout if attempt == 0 else min(timeout, 300)
                      with urllib.request.urlopen(req, timeout = t) as resp:
                          return resp.status, json.loads(resp.read().decode())
                  except urllib.error.HTTPError as exc:
                      # Say what the server said before the body is discarded. A
                      # bare HTTPError prints only "HTTP Error 400: Bad Request",
                      # which is what turned the #8883 Mac GGUF outage into three
                      # red main runs whose cause had to be found by hand.
                      try:
                          detail = exc.read().decode("utf-8", "replace")
                      except Exception as read_exc:
                          detail = f"<body unreadable: {read_exc!r}>"
                      print(
                          f"[http] {path} -> {exc.code} {exc.reason}: {detail[:4000]}",
                          flush = True,
                      )
                      raise
                  except (TimeoutError, ConnectionError, urllib.error.URLError) as exc:
                      if attempt == attempts - 1:
                          raise
                      print(f"[retry] {path}: {exc!r}", flush = True)
                      time.sleep(15)

          # ── 1. response_format = json_object (JSON mode) ─────────────
          # llama.cpp's HTTP server supports OpenAI-compatible JSON
          # mode: `response_format: {"type": "json_object"}` constrains
          # the model to emit syntactically-valid JSON. We use raw HTTP
          # rather than the OpenAI SDK so that the field shape Unsloth
          # forwards to llama-server is unambiguous (the SDK rewrites
          # response_format depending on which variant it recognises).
          # We deliberately do NOT pass a strict JSON schema -- on
          # small Gemma-4 quants the GBNF-from-schema path occasionally
          # produces empty output, and JSON mode is the surface we care
          # about exposing through Unsloth.
          status, data = post("/v1/chat/completions", {
              "model":         "default",
              "messages":      [
                  {"role": "system", "content": 'Reply with a single JSON object of the form {"city": "...", "country": "..."}. Output ONLY the JSON, nothing else.'},
                  {"role": "user",   "content": "What is the capital of France?"},
              ],
              "temperature":     TEMP,
              # Trimmed for Mac runner timeout budget; json_object
              # grammar terminates quickly when working.
              "max_tokens":      200,
              "seed":            SEED,
              "stream":          False,
              "enable_thinking": False,
              "response_format": {"type": "json_object"},
          }, timeout = 240)
          assert status == 200, f"json status {status}: {data}"
          # Verify the response envelope shape -- this is what we
          # actually want to exercise on Mac. The model output quality
          # downstream of this is a Mac-Metal-quant artefact.
          assert (
              isinstance(data.get("choices"), list)
              and data["choices"]
              and "message" in data["choices"][0]
          ), f"json response envelope malformed: {data}"
          content = (data["choices"][0]["message"].get("content") or "").strip()
          print(f"[json] raw json_object content: {content!r}")
          # Some chat templates wrap JSON in ```json fences even in JSON
          # mode -- strip those before parsing.
          if content.startswith("```"):
              content = content.split("```", 2)[1]
              if content.startswith("json"):
                  content = content[4:]
              content = content.strip("`\n ")
          if content:
              try:
                  parsed = json.loads(content)
                  if "paris" in str(parsed.get("city", "")).lower():
                      print(f"[json] PASS json_object -> {parsed}")
                  else:
                      print(f"[json] WARN json_object decoded but city!=Paris: {parsed}")
              except json.JSONDecodeError as exc:
                  print(f"[json] WARN json_object content not parseable ({exc}); content={content!r}")
          else:
              print("[json] WARN json_object produced empty content on this Mac quant")
          # Cross-check: same prompt without response_format. We care
          # that the inference path stays healthy (status 200 + envelope
          # shape OK); model output quality is a separate concern.
          status2, data2 = post("/v1/chat/completions", {
              "model":         "default",
              "messages":      [{"role": "user", "content": "What is the capital of France? Answer with one word."}],
              "temperature":     TEMP,
              # 1-word answer doesn't need 400 tokens; trim so a
              # degenerate streaming model doesn't burn through the
              # job's wallclock budget.
              "max_tokens":      150,
              "seed":            SEED,
              "stream":          False,
              "enable_thinking": False,
          }, timeout = 240)
          assert status2 == 200, f"plain status {status2}: {data2}"
          plain = (data2["choices"][0]["message"].get("content") or "").lower()
          print(f"[json] plain capital-of-france reply: {plain!r}")
          if "paris" in plain:
              print("[json] PASS plain inference path (paris mentioned)")
          else:
              print(
                  f"[json] WARN plain inference returned no 'paris' -- Mac quant "
                  f"degeneracy. HTTP path validated separately above."
              )

          # ── 2. OpenAI image_url (data URI base64) ───────────────────
          # 64x64 solid-red PNG. stb_image (used by Unsloth's image
          # normaliser at routes/inference.py:3410) rejects 4x4 or
          # smaller PNGs as truncated, so we go up to 64x64 -- still
          # tiny in token cost. The assertion is loose: any non-empty
          # response from the vision path proves multimodal end-to-end
          # wiring; small VL quants are weak at colour identification.
          PNG_64X64_RED_B64 = (
              "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAYklEQVR4nO3PMQ0AIADAMEAI/k"
              "UhBhEcDcmqYJtn7/GzpQNeNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA"
              "1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaA1oDWgNaBdCJ0BmMJ25zMAAAAASUVORK5CYII="
          )
          data_uri = f"data:image/png;base64,{PNG_64X64_RED_B64}"

          # The Mac prebuilt llama.cpp server has a known crash when
          # processing image inputs alongside the gemma-4-E2B mmproj
          # (server disconnects mid-completion). This is upstream
          # llama.cpp behaviour, not Unsloth. Wrap both SDK calls in
          # try/except so an upstream crash registers as a WARN rather
          # than failing the whole job. Unsloth's contract (OpenAI/
          # Anthropic image fields are accepted and forwarded) is
          # validated by the request body Unsloth constructs, not by
          # whether llama.cpp can decode it on Mac Metal.
          client = OpenAI(base_url = f"{BASE}/v1", api_key = KEY)
          try:
              openai_resp = client.chat.completions.create(
                  model       = "default",
                  temperature = TEMP,
                  max_tokens  = 80,
                  seed        = SEED,
                  messages    = [{
                      "role": "user",
                      "content": [
                          {"type": "image_url", "image_url": {"url": data_uri}},
                          {"type": "text",      "text": "What colour dominates this image? Reply in one word."},
                      ],
                  }],
              )
              openai_text = (openai_resp.choices[0].message.content or "").lower()
              print(f"[image/openai] reply: {openai_text!r}")
              if openai_text:
                  print("[image/openai] PASS image_url accepted, non-empty response")
              else:
                  print("[image/openai] WARN image_url accepted but empty content -- Mac quant drift")
          except Exception as exc:
              print(
                  f"[image/openai] WARN image_url SDK call raised: {type(exc).__name__}: "
                  f"{exc}. Likely upstream llama.cpp Mac+vision crash, NOT an Unsloth "
                  f"regression. Unsloth successfully forwarded the request."
              )

          # ── 3. Anthropic source/base64 image ────────────────────────
          # Two SDK quirks vs. Unsloth: base_url must NOT include /v1
          # (the SDK appends it itself; otherwise /v1/v1/messages -> 405),
          # and Unsloth's auth is HTTPBearer-only so the SDK's default
          # x-api-key header is ignored -- send Authorization: Bearer
          # via default_headers.
          anthropic = Anthropic(
              base_url        = BASE,
              api_key         = "unused",
              default_headers = {"Authorization": f"Bearer {KEY}"},
          )
          try:
              a_msg = anthropic.messages.create(
                  model       = "default",
                  max_tokens  = 80,
                  # anthropic 1.x rejects a top-level temperature; extra_body sends the same JSON.
                  extra_body  = {"temperature": TEMP, "seed": SEED},
                  messages    = [{
                      "role": "user",
                      "content": [
                          {
                              "type":   "image",
                              "source": {
                                  "type":       "base64",
                                  "media_type": "image/png",
                                  "data":       PNG_64X64_RED_B64,
                              },
                          },
                          {"type": "text", "text": "Describe this image briefly."},
                      ],
                  }],
              )
              a_text = "".join(b.text for b in a_msg.content if getattr(b, "type", None) == "text")
              print(f"[image/anthropic] reply: {a_text!r}")
              if a_text:
                  print("[image/anthropic] PASS source/base64 accepted, non-empty response")
              else:
                  print("[image/anthropic] WARN source/base64 accepted but empty content -- Mac quant drift")
          except Exception as exc:
              print(
                  f"[image/anthropic] WARN anthropic image SDK call raised: "
                  f"{type(exc).__name__}: {exc}. Likely upstream llama.cpp Mac+vision "
                  f"crash, NOT an Unsloth regression."
              )
          PY

      - name: Stop Unsloth
        if: always()
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2
          lsof -nP -iTCP:"${STUDIO_PORT}" -sTCP:LISTEN || true

      - name: Upload logs
        if: always()
        # Diagnostic only: a transient artifact-service drop must not fail a green job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: json-images-log
          path: |
            logs/studio_vision.log
            logs/install.log
          retention-days: 1


      # Update + uninstall phase. Runs LAST: it uninstalls and asserts a clean machine.
      # `!cancelled()` overrides the implicit success() so earlier failures do not skip it;
      # `${{ }}` is required because a bare leading `!` is a YAML tag.
      - name: First update should be a no-op (prebuilt already validated)
        id: update_first
        if: ${{ !cancelled() && steps.install_unsloth.outcome == 'success' && steps.assert_llama.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          set -o pipefail
          unsloth studio update --local 2>&1 | tee logs/update.log
          if grep -q "falling back to source build" logs/update.log; then
            echo "::error::studio update fell back to source-build llama.cpp on Mac."
            grep -E "llama-prebuilt|llama.cpp" logs/update.log | tail -60
            exit 1
          fi
          if ! grep -qE "prebuilt up to date and validated|prebuilt installed and validated" logs/update.log; then
            echo "::error::no prebuilt up-to-date marker in update.log."
            grep -E "llama-prebuilt|llama.cpp" logs/update.log | tail -60
            exit 1
          fi
          echo "update path took the prebuilt fast path"

      - name: Second update must also be a no-op
        id: update_second
        if: ${{ !cancelled() && steps.update_first.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          set -o pipefail
          unsloth studio update --local 2>&1 | tee logs/update2.log
          grep -q "falling back to source build" logs/update2.log && {
              echo "::error::second update fell back to source build on Mac"
              tail -60 logs/update2.log; exit 1; } || true
          grep -qE "prebuilt up to date and validated|prebuilt installed and validated" logs/update2.log
          echo "second update was clean"

      - name: Boot Unsloth briefly to confirm the install is still usable
        if: ${{ !cancelled() && steps.update_second.outcome == 'success' }}
        run: |
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p 18891 \
            > logs/studio_update.log 2>&1 &
          PID=$!
          HEALTHY=""
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18891/api/health > /tmp/health.json; then
              if python3 -c "import json,sys; d=json.load(open('/tmp/health.json')); sys.exit(0 if d.get('status')=='healthy' else 1)"; then
                HEALTHY=1
                break
              fi
            fi
            sleep 1
          done
          if [ -z "$HEALTHY" ]; then
            echo "Unsloth failed to come up after \`update\`"
            tail -200 logs/studio_update.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          echo "post-update Unsloth /api/health OK"

      - name: Uninstall and verify clean
        # Gated on the install only, so a broken update cannot hide uninstall results.
        if: ${{ !cancelled() && steps.install_unsloth.outcome == 'success' }}
        # Round-trip scripts/uninstall.sh on real macOS, including the .app / lsregister path.
        run: |
          set -o pipefail
          if [ ! -f scripts/uninstall.sh ]; then
            echo "scripts/uninstall.sh not present in this tree; skipping round-trip"
            : > logs/uninstall.log
            exit 0
          fi
          sh scripts/uninstall.sh 2>&1 | tee logs/uninstall.log
          leak=0
          for p in \
            "$HOME/.unsloth/studio" \
            "$HOME/.local/share/unsloth" \
            "$HOME/Applications/Unsloth Studio.app" \
            "$HOME/Desktop/Unsloth Studio.app" \
            "$HOME/.local/bin/unsloth"; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "::error::leak: $p"
              leak=$((leak + 1))
            fi
          done
          [ "$leak" -eq 0 ] || exit 1
          sh scripts/uninstall.sh 2>&1 | tail -5
          sh scripts/uninstall.sh 2>&1 | tail -5
          echo "PASS: mac install -> update -> uninstall round-trip clean"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mac-studio-ui-smoke-artifacts
          path: |
            logs/studio.log
            logs/studio_extra.log
            logs/studio_api.log
            logs/studio_update.log
            logs/update.log
            logs/update2.log
            logs/uninstall.log
            logs/install.log
            logs/playwright
            logs/playwright-composer-icons
            logs/playwright-permissions-*
            logs/playwright_extra
            logs/playwright_update_banner
            logs/studio-permissions-*.log
            logs/studio_tabs.log
            logs/playwright_mac_tabs
          # Repository-wide cap; larger values are silently clamped.
          retention-days: 1
