# Refuses `pull_request_target` (fork YAML runs with base-repo secrets) and cache keys
# shared between PR workflows and publish (a fork PR can poison what publish restores).
# Its pull_request trigger must NEVER gain a paths filter (enforced by
# scripts/lint_workflow_triggers.py). Fail-closed.

name: Workflow trigger lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-trigger-lint:
    name: workflow-trigger lint (pull_request_target / cache-poisoning)
    runs-on: ubuntu-latest
    # ~2 min at -n 4; headroom for slow runners.
    timeout-minutes: 15
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        # Pinned: tests/security asserts on the lint script's subprocess exit semantics.
        run: pip install pyyaml==6.0.2 pytest==9.0.3 pytest-xdist vermin

      - name: Lint workflow triggers + cache keys
        run: python3 scripts/lint_workflow_triggers.py

      # Static floor check (syntax and stdlib symbols via vermin) since PRs only execute the
      # newest interpreter.
      - name: Backend still runs on the oldest interpreter the matrix claims
        run: python3 scripts/lint_backend_python_floor.py

      # One pytest invocation (conftest is expensive to import), -n 4 fixed rather than `auto`,
      # which spawns a worker per core. tests/security rides along. Not in Lint CI, which installs
      # shellcheck from apt, so its harden-runner has to permit escalation and an apt
      # mirror; a security gate there would run under a weaker harden-runner policy.
      # Every module here reads a workflow file, so it belongs in this unfiltered job
      # (tests/studio/test_workflow_guards_run_unfiltered.py).
      - name: Workflow guard suites
        run: |
          python3 -m pytest -q -n 4 \
            tests/studio/test_absorbed_lanes_still_run.py \
            tests/studio/test_agent_guides_verdicts.py \
            tests/studio/test_apt_steps_are_bounded.py \
            tests/studio/test_backend_ci_matrix.py \
            tests/studio/test_backend_ci_parallel_isolation.py \
            tests/studio/test_cache_budget_discipline.py \
            tests/studio/test_cached_paths_hold_no_credentials.py \
            tests/studio/test_actions_are_pinned_to_commits.py \
            tests/studio/test_local_actions_are_in_path_filters.py \
            tests/studio/test_chat_ui_shards_cover_everything.py \
            tests/studio/test_ui_shard_engines.py \
            tests/studio/test_zoo_suite_parallel_isolation.py \
            tests/studio/test_core_setup_zoo_revision_notice.py \
            tests/studio/test_ci_parallel_browser_results.py \
            tests/studio/test_ci_shell_suite_coverage.py \
            tests/studio/test_pip_cache_naming.py \
            tests/studio/test_compile_caches_are_per_worker.py \
            tests/studio/test_browser_simulations_retry_once.py \
            tests/studio/test_step_scripts_get_the_secrets_they_read.py \
            tests/studio/test_composer_browser_tmpdir_is_short.py \
            tests/studio/test_composer_rtl_bidi_attribute.py \
            tests/studio/test_en_catalog.py \
            tests/studio/test_frontend_dep_removal.py \
            tests/studio/test_frontend_dist_cache.py \
            tests/studio/test_gguf_smoke_phases_stay_independent.py \
            tests/studio/test_indicator_browsers_run_in_parallel.py \
            tests/studio/test_inference_smoke_http_diagnostics.py \
            tests/studio/test_install_matrix_selection.py \
            tests/studio/test_install_phase_timing.py \
            tests/studio/test_installer_av_shapes.py \
            tests/studio/test_installers_npm_ci.py \
            tests/studio/test_mac_bundled_job_phases.py \
            tests/studio/test_mac_host_offload_optin.py \
            tests/studio/test_settings_smoke_covers_every_tab.py \
            tests/studio/test_playwright_install_avoids_with_deps.py \
            tests/studio/test_macos_slots_per_commit.py \
            tests/studio/test_main_runs_survive_merge_bursts.py \
            tests/studio/test_pull_requests_cancel_superseded_runs.py \
            tests/studio/test_push_filters_match_pull_request_filters.py \
            tests/studio/test_probe_cost_claim_is_measured.py \
            tests/studio/test_merge_ref_age_is_reported.py \
            tests/studio/test_pester_bootstrap_hardening.py \
            tests/studio/test_playwright_suites_run_in_ci.py \
            tests/studio/test_sdk_installs_are_major_bounded.py \
            tests/studio/test_short_job_absorption.py \
            tests/studio/test_smoke_workflows_share_one_script.py \
            tests/studio/test_stt_model_search_locator_contract.py \
            tests/studio/test_studio_smokes_do_not_trigger_on_the_training_library.py \
            tests/studio/test_uv_cache_discipline.py \
            tests/studio/test_version_compat_bundle.py \
            tests/studio/test_windows_small_checks_stay_on_their_image.py \
            tests/studio/test_windows_sac_probe.py \
            tests/studio/test_windows_ui_lanes_are_isolated.py \
            tests/studio/test_workflow_guards_run_unfiltered.py \
            tests/studio/test_wsl_shortcut_script_is_valid_powershell.py \
            tests/test_wheel_smoke_publish_guard.py \
            tests/security \
            --ignore=tests/security/test_custom_dtype_no_eval.py \
            --ignore=tests/security/test_custom_dtype_wire_format.py \
            --ignore=tests/security/test_mapper_probe_no_exec.py \
            --ignore=tests/security/test_inherited_custom_dtype_is_neutralized.py


  # The four security suites the job above must --ignore (they import torch and
  # transformers). They run here per tests/studio/test_short_job_absorption.py. CPU torch
  # is enough: they never touch a device.
  security-regression-suites:
    name: security suites (torch-dependent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: block
          disable-sudo: true
          # Tests are network-free: tests/security/conftest.py blocks sockets.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            download.pytorch.org:443
            download-r2.pytorch.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install CPU torch + transformers
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            torch
          # unsloth-zoo: `unsloth/__init__.py` raises without it. triton: imported at module scope
          # and not supplied by the CPU torch wheel.
          python -m pip install --quiet transformers peft pytest unsloth-zoo triton

      # Named one by one: testpaths is tests/security, so a bare pytest would widen silently.
      # UNSLOTH_ALLOW_CPU=1 allows importing without a device; UNSLOTH_ZOO_DISABLE_GPU_INIT is not a
      # substitute (it skips binding DEVICE_TYPE, so compiler.py fails to import).
      - name: Run the torch-dependent security suites
        env:
          UNSLOTH_ALLOW_CPU: '1'
        run: |
          python -m pytest -q \
            tests/security/test_custom_dtype_no_eval.py \
            tests/security/test_custom_dtype_wire_format.py \
            tests/security/test_mapper_probe_no_exec.py \
            tests/security/test_inherited_custom_dtype_is_neutralized.py
