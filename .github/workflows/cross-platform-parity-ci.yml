concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs in the group, so a merge burst keeps only the tip.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  parity:
    name: parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # No macOS leg: these tests have no macOS-specific logic (the risk is Windows cp1252), and macOS
        # concurrency is capped at 5. The non-Windows shell steps cover Intel XPU paths no Mac reaches.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # The CLI import chain test_installer_profile_hardening.py pulls in; rich is imported directly
      # by unsloth_cli. No torch: UNSLOTH_NO_TORCH keeps the suite off it.
      - run: python -m pip install -U pip pytest typer pyyaml pydantic click rich
      # -rs: a platform-gated case that silently stopped running still reports green.
      - name: Cross-platform parity tests
        env:
          UNSLOTH_NO_TORCH: '1'
        run: >-
          python -m pytest
          tests/python/test_cross_platform_parity.py
          tests/python/test_windows_python_venv_hardening.py
          tests/python/test_windows_setup_output_encoding.py
          tests/python/test_windows_setup_download_progress.py
          tests/python/test_windows_installer_resolver_fallback.py
          tests/python/test_installer_helper_declaration_order.py
          tests/python/test_pwsh_runner_encoding.py
          tests/python/test_compiler_watch_temp_scan.py
          tests/python/test_installer_embedded_nvidia_probe.py
          tests/test_installer_skip_autostart.py
          tests/test_installer_system32_guard.py
          tests/test_installer_interactive_prompts.py
          tests/test_installer_systemd.py
          tests/test_installer_profile_hardening.py
          tests/studio/install/test_keep_install_backcompat_9979.py
          -q -rs
      - name: PowerShell rollback lifecycle tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_install_rollback_lifecycle.ps1
      - name: Intel registry fallback tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_intel_registry_fallback.ps1
      - name: Setup XPU pre-report tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_setup_xpu_runtime_prereport.ps1
      - name: XPU arm64 torchaudio tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_xpu_arm64_torchaudio.ps1
      # The spaced-path checks run only on Windows.
      - name: Torch overrides merge tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_torch_overrides_merge.ps1
      # pwsh 7 cannot reproduce the 5.1 half of #8335, so those checks are deliberately source shapes.
      - name: AMD venv repair loop tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_amd_venv_repair_loop.ps1
      # Windows PowerShell 5.1, which the CLI launches setup.ps1 with: 7 returns `.Count = 1` for a
      # single CimInstance where 5.1 returns `$null`.
      - name: AMD venv repair loop tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_amd_venv_repair_loop.ps1
      - name: AMD GPU-name arch table tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_amd_name_arch_r9700.ps1
      # The 5.1 leg compiles the P/Invoke helper with the .NET Framework compiler setup.ps1 uses.
      - name: NVIDIA driver-library inventory tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_nvidia_library_inventory.ps1
      - name: NVIDIA driver-library inventory tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_nvidia_library_inventory.ps1
      # Both legs: 5.1 is the host the Desktop app launches the installer in.
      - name: nvidia-smi discovery tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_nvidia_smi_discovery.ps1
      - name: nvidia-smi discovery tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_nvidia_smi_discovery.ps1
      # The 5.1 leg matters: Constrained Language Mode is one policy that makes the emitted rung decline.
      - name: NVIDIA Python probe parity tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_nvidia_python_probe_parity.ps1
      - name: NVIDIA Python probe parity tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_nvidia_python_probe_parity.ps1
      # Both legs: the alias mechanism (junction vs symlink) and .NET's FileShare.None enforcement differ.
      - name: Install lock alias-exclusion tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_install_lock_excludes_aliases.ps1
      # Both legs: the lexical fallback differs between Windows PowerShell 5.1 and pwsh 7.
      - name: Early Python path resolver tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_early_python_path_resolver.ps1
      - name: Early Python path resolver tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_early_python_path_resolver.ps1
      # 5.1 too: the runner builds the command line by hand there (no ArgumentList).
      - name: Early Python process image tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_early_python_process_image.ps1
      - name: Early Python process image tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_early_python_process_image.ps1
      - name: Early Python icon refresh tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_early_python_icon_refresh.ps1
      - name: Early Python icon refresh tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_early_python_icon_refresh.ps1
      - name: Install lock alias-exclusion tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_install_lock_excludes_aliases.ps1
      - name: NVIDIA adapter presence tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_nvidia_adapter_presence.ps1
      - name: NVIDIA presence XPU update route tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_nvidia_presence_xpu_timeout.ps1
      - name: NVIDIA adapter presence tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_nvidia_adapter_presence.ps1
      - name: NVIDIA presence XPU update route tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -File tests\studio\test_nvidia_presence_xpu_timeout.ps1
      # Application Control denials (1260) are simulated; the enforced leg is in the AppLocker workflow.
      - name: Application Control CLI fallback tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_application_control_cli_fallback.ps1
      - name: Uninstaller prebuilt parity tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_uninstall_prebuilt_parity.ps1
      # The runner is an administrator, so this covers the symlink kind, not just the junction.
      - name: Uninstaller reparse stop-root tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_uninstall_reparse_stop_roots.ps1
      - name: Uninstaller ownership gate tests
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_uninstall_legacy_layout_gate.ps1
      - name: Uninstaller uv cache note tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/studio/test_uninstall_uv_cache_note.ps1
      - name: Path resolver degradation tests
        if: runner.os == 'Linux'
        run: pwsh -NoProfile -File tests/studio/test_path_resolver_degrades.ps1
      - name: POSIX rollback lifecycle tests
        if: runner.os == 'Linux'
        run: sh tests/sh/test_install_rollback_lifecycle.sh
      - name: POSIX uninstaller ownership gate tests
        if: runner.os == 'Linux'
        run: bash tests/sh/test_uninstall_legacy_layout_gate.sh
      # bash, not sh: the helper under test is extracted from install.sh.
      - name: install.sh XPU flavor probe tests
        if: runner.os != 'Windows'
        run: bash tests/sh/test_install_sh_xpu_flavor_probe.sh
      - name: setup.sh XPU fast-path + summary tests
        if: runner.os != 'Windows'
        run: |
          bash tests/sh/test_setup_xpu_fastpath_escape.sh
          bash tests/sh/test_setup_xpu_posix_summary.sh
