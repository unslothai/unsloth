# Verifies `unsloth studio update --local` is idempotent and keeps the validated prebuilt.

name: Unsloth Update CI

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/uninstall.sh'
      - 'studio/setup.sh'
      - 'studio/install_python_stack.py'
      - 'studio/install_llama_prebuilt.py'
      - 'studio/install_whisper_prebuilt.py'
      - 'studio/install_audio_cpp_prebuilt.py'
      - 'studio/install_sd_cpp_prebuilt.py'
      - 'studio/install_node_prebuilt.py'
      - 'studio/install_manifest.py'
      - 'studio/prebuilt_core.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/audio_cpp_prebuilt_pins.json'
      - 'studio/setup.ps1'
      - 'install.ps1'
      - 'studio/backend/requirements/**'
      # setup.sh/setup.ps1 run npm against these trees on every update.
      - 'studio/frontend/package.json'
      - 'studio/frontend/package-lock.json'
      - 'studio/backend/core/data_recipe/oxc-validator/package.json'
      - 'studio/backend/core/data_recipe/oxc-validator/package-lock.json'
      - 'studio/backend/core/data_recipe/oxc-validator/.npmrc'
      - 'tests/studio/install/test_update_idempotency.py'
      - 'tests/studio/install/idempotency_proxy.py'
      - 'unsloth_cli/commands/studio.py'
      - 'unsloth_cli/__init__.py'
      - 'unsloth_cli/_system_dir_guard.py'
      - 'pyproject.toml'
      - '.github/workflows/studio-update-smoke.yml'
      # Modules that decide whether the second update reports the prebuilt as validated.
      - 'studio/backend/__init__.py'
      - 'studio/backend/utils/__init__.py'
      - 'studio/backend/utils/auth_safe.py'
      - 'studio/backend/utils/prebuilt/__init__.py'
      - 'studio/backend/utils/prebuilt/llama_backend.py'
      - 'studio/backend/vendor/truststore/**'
      - 'studio/backend/utils/wheel_utils.py'
      - 'studio/backend/utils/uv_path_safety.py'
      - 'studio/backend/utils/mlx_repair.py'
      - 'studio/nvidia_probe.py'
      - 'unsloth_cli/*.py'
      - 'unsloth_cli/commands/*.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'tests/_shared/**'
      - 'tests/studio/install/conftest.py'
      - '.github/scripts/retry-with-apt-lock.sh'
      # The install step in this workflow is `uses:` on that composite action.
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
  push:
    branches: [main]
    # Same list as pull_request, to spare the macOS slots.
    paths:
      - 'install.sh'
      - 'scripts/uninstall.sh'
      - 'studio/setup.sh'
      - 'studio/install_python_stack.py'
      - 'studio/install_llama_prebuilt.py'
      - 'studio/install_whisper_prebuilt.py'
      - 'studio/install_audio_cpp_prebuilt.py'
      - 'studio/install_sd_cpp_prebuilt.py'
      - 'studio/install_node_prebuilt.py'
      - 'studio/install_manifest.py'
      - 'studio/prebuilt_core.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/audio_cpp_prebuilt_pins.json'
      - 'studio/setup.ps1'
      - 'install.ps1'
      - 'studio/backend/requirements/**'
      # setup.sh/setup.ps1 run npm against these trees on every update.
      - 'studio/frontend/package.json'
      - 'studio/frontend/package-lock.json'
      - 'studio/backend/core/data_recipe/oxc-validator/package.json'
      - 'studio/backend/core/data_recipe/oxc-validator/package-lock.json'
      - 'studio/backend/core/data_recipe/oxc-validator/.npmrc'
      - 'tests/studio/install/test_update_idempotency.py'
      - 'tests/studio/install/idempotency_proxy.py'
      - 'unsloth_cli/commands/studio.py'
      - 'unsloth_cli/__init__.py'
      - 'unsloth_cli/_system_dir_guard.py'
      - 'pyproject.toml'
      - '.github/workflows/studio-update-smoke.yml'
      # Modules that decide whether the second update reports the prebuilt as validated.
      - 'studio/backend/__init__.py'
      - 'studio/backend/utils/__init__.py'
      - 'studio/backend/utils/auth_safe.py'
      - 'studio/backend/utils/prebuilt/__init__.py'
      - 'studio/backend/utils/prebuilt/llama_backend.py'
      - 'studio/backend/vendor/truststore/**'
      - 'studio/backend/utils/wheel_utils.py'
      - 'studio/backend/utils/uv_path_safety.py'
      - 'studio/backend/utils/mlx_repair.py'
      - 'studio/nvidia_probe.py'
      - 'unsloth_cli/*.py'
      - 'unsloth_cli/commands/*.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'tests/_shared/**'
      - 'tests/studio/install/conftest.py'
      - '.github/scripts/retry-with-apt-lock.sh'
      # The install step in this workflow is `uses:` on that composite action.
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main GitHub still cancels PENDING runs when a newer one queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  update-idempotency:
    name: Unsloth Updating Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps for llama.cpp prebuilt
        # Bounded and retried: a hung apt step is reported as `cancelled` with no reason.
        # update + install retry as one unit; two long attempts, since slow mirrors are common.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      # Node 24 / npm 11 meets setup.sh's floor, so this job covers the system-Node path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          # No pip cache: everything goes through uv, and setup-python's post-step would fail.

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: A second update does nothing, and proves it
        # Measured updates: a CONNECT proxy is the only route out, so "downloaded nothing" is a
        # byte count, and the install is diffed. Damage-and-repair cases run BEFORE the
        # manifest-removal step.
        timeout-minutes: 30
        env:
          UNSLOTH_IDEMPOTENCY_E2E: '1'
          UNSLOTH_IDEMPOTENCY_ARTIFACTS: ${{ github.workspace }}/logs/idempotency
          # Explicit in case the install ever stops being editable.
          STUDIO_LOCAL_REPO: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs
          python -m pip install --quiet pytest
          python -m pytest tests/studio/install/test_update_idempotency.py -v -s \
            2>&1 | tee logs/idempotency.log

      - name: First update should be a no-op (prebuilt already validated)
        # The second run must take the "prebuilt up to date and validated" path.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          set -o pipefail
          unsloth studio update --local 2>&1 | tee logs/update.log
          if grep -q "falling back to source build" logs/update.log; then
            echo "::error::studio update fell back to source-build llama.cpp on a fresh install. setup.sh idempotency regressed."
            grep -E "llama-prebuilt|llama.cpp" logs/update.log | tail -60
            exit 1
          fi
          if ! grep -qE "prebuilt up to date and validated|prebuilt installed and validated" logs/update.log; then
            echo "::error::no prebuilt up-to-date marker in update.log. Did setup.sh skip the prebuilt path on update?"
            grep -E "llama-prebuilt|llama.cpp" logs/update.log | tail -60
            exit 1
          fi
          echo "update path took the prebuilt fast path"

      - name: Second update must also be a no-op
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          set -o pipefail
          unsloth studio update --local 2>&1 | tee logs/update2.log
          grep -q "falling back to source build" logs/update2.log && {
              echo "::error::second update fell back to source build"
              tail -60 logs/update2.log; exit 1; } || true
          grep -qE "prebuilt up to date and validated|prebuilt installed and validated" logs/update2.log
          echo "second update was clean"

      - name: Boot Unsloth briefly to confirm the install is still usable
        run: |
          mkdir -p logs
          UNSLOTH_API_ONLY=1 unsloth studio -H 127.0.0.1 -p 18891 \
            > logs/studio.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18891/api/health > /tmp/health.json; then
              jq -e '.status == "healthy"' /tmp/health.json
              break
            fi
            sleep 1
          done
          if ! jq -e '.status == "healthy"' /tmp/health.json 2>/dev/null; then
            echo "Unsloth failed to come up after `update`"
            tail -200 logs/studio.log
            kill "$PID" 2>/dev/null || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          echo "post-update Unsloth /api/health OK"

      - name: A complete install reports itself complete
        run: |
          set -o pipefail
          unsloth studio verify-install
          unsloth studio desktop-capabilities --json | tee /tmp/caps.json
          jq -e '.studio_install_ok == true' /tmp/caps.json
          jq -e '.desktop_manageability_version >= 2' /tmp/caps.json

      - name: An incomplete install must not report itself ready
        # The manifest is written last, so removing it reproduces a killed install.
        run: |
          set -o pipefail
          # `python` on PATH is setup-python's, not the managed venv.
          MANIFEST="$HOME/.unsloth/studio/unsloth_studio/unsloth_install_manifest.json"
          test -f "$MANIFEST" || { echo "::error::installer never wrote $MANIFEST"; exit 1; }
          rm -f "$MANIFEST"
          unsloth studio desktop-capabilities --json | tee /tmp/caps_bad.json
          jq -e '.studio_install_ok == false' /tmp/caps_bad.json
          if unsloth studio verify-install; then
            echo "::error::verify-install passed on an install with no manifest"
            exit 1
          fi
          echo "incomplete install correctly reported not-ready"

      - name: Update repairs an incomplete install
        # `--local` bypasses the PyPI version compare; the non-local fast path is covered by
        # tests/studio/install/test_setup_fast_path_guard.py.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          unsloth studio update --local 2>&1 | tee logs/update_repair.log
          unsloth studio verify-install
          unsloth studio desktop-capabilities --json | jq -e '.studio_install_ok == true'
          echo "update repaired the incomplete install"

      - name: Uninstall and verify clean
        # Round-trip through scripts/uninstall.sh to catch new install locations it misses.
        run: |
          set -o pipefail
          if [ ! -f scripts/uninstall.sh ]; then
            echo "scripts/uninstall.sh not present in this tree; skipping round-trip"
            : > logs/uninstall.log
            exit 0
          fi
          sh scripts/uninstall.sh 2>&1 | tee logs/uninstall.log
          leak=0
          for p in \
            "$HOME/.unsloth/studio" \
            "$HOME/.unsloth/whisper.cpp" \
            "$HOME/.unsloth/audio.cpp" \
            "$HOME/.unsloth/.llama.cpp.install.lock" \
            "$HOME/.unsloth/.node.install.lock" \
            "$HOME/.unsloth/.whisper.cpp.install.lock" \
            "$HOME/.unsloth/.audio.cpp.install.lock" \
            "$HOME/.local/share/unsloth" \
            "$HOME/Desktop/Unsloth Studio.desktop" \
            "$HOME/.local/bin/unsloth"; do
            if [ -e "$p" ] || [ -L "$p" ]; then
              echo "::error::leak: $p"
              ls -la "$p" 2>&1 | head -3
              leak=$((leak + 1))
            fi
          done
          # Nothing but Unsloth writes under ~/.unsloth, so anything left was missed.
          if [ -d "$HOME/.unsloth" ]; then
            echo "::error::leak: ~/.unsloth survived the uninstall"
            find "$HOME/.unsloth" | head -40
            leak=$((leak + 1))
          fi
          [ "$leak" -eq 0 ] || exit 1
          sh scripts/uninstall.sh 2>&1 | tail -5
          sh scripts/uninstall.sh 2>&1 | tail -5
          echo "PASS: install -> update -> uninstall round-trip clean"

      - name: Upload update logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studio-update-log
          path: |
            logs/install.log
            logs/update.log
            logs/update2.log
            logs/idempotency.log
            logs/idempotency/**/update.log
            logs/idempotency/**/proxy.jsonl
            logs/studio.log
            logs/uninstall.log
          retention-days: 7

  idempotency-macos:
    name: Unsloth Updating Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Below setup.sh's Node floor on purpose, so this job covers the bundled-Node path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20.18.0'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: A second update does nothing, and proves it
        timeout-minutes: 30
        env:
          UNSLOTH_IDEMPOTENCY_E2E: '1'
          UNSLOTH_IDEMPOTENCY_ARTIFACTS: ${{ github.workspace }}/logs/idempotency
          STUDIO_LOCAL_REPO: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p logs
          python -m pip install --quiet pytest
          python -m pytest tests/studio/install/test_update_idempotency.py -v -s \
            2>&1 | tee logs/idempotency.log

      - name: Upload macOS idempotency logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studio-update-idempotency-macos-log
          path: |
            logs/install.log
            logs/idempotency.log
            logs/idempotency/**/update.log
            logs/idempotency/**/proxy.jsonl
          retention-days: 7

  idempotency-windows:
    name: Unsloth Updating Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Node 22 / npm 10 is below setup.ps1's floor, so this covers the bundled-Node path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # install.ps1 preserves the UV_CACHE_DIR the action exports.
      - name: Restore the uv download cache
        id: uv-cache
        uses: ./.github/actions/uv-cache-restore

      - name: Install Unsloth (--local, --no-torch)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          # A child process, so install.ps1's [Console]::Out output reaches Tee-Object.
          $child = '$ErrorActionPreference = ''Stop''; $ProgressPreference = ''SilentlyContinue''; & ./install.ps1 --local --no-torch; exit $LASTEXITCODE'
          # Timestamps go to the step log only; logs/install.log keeps raw output.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          pwsh -NoProfile -ExecutionPolicy Bypass -Command $child 2>&1 |
            Tee-Object -FilePath logs/install.log |
            ForEach-Object { '[{0,4:N0}s] {1}' -f $sw.Elapsed.TotalSeconds, $_ }
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }

      - name: Save the uv download cache
        uses: ./.github/actions/uv-cache-save
        with:
          cache-hit: ${{ steps.uv-cache.outputs.cache-hit }}
          key: ${{ steps.uv-cache.outputs.key }}

      - name: A second update does nothing, and proves it
        timeout-minutes: 40
        shell: pwsh
        env:
          UNSLOTH_IDEMPOTENCY_E2E: '1'
          UNSLOTH_IDEMPOTENCY_ARTIFACTS: ${{ github.workspace }}\logs\idempotency
          STUDIO_LOCAL_REPO: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          $ErrorActionPreference = 'Continue'
          python -m pip install --quiet pytest
          python -m pytest tests/studio/install/test_update_idempotency.py -v -s 2>&1 |
            Tee-Object -FilePath logs/idempotency.log
          if ($LASTEXITCODE -ne 0) { throw "the idempotency harness failed ($LASTEXITCODE)" }

      - name: Upload Windows idempotency logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studio-update-idempotency-windows-log
          path: |
            logs/install.log
            logs/idempotency.log
            logs/idempotency/**/update.log
            logs/idempotency/**/proxy.jsonl
          retention-days: 7
