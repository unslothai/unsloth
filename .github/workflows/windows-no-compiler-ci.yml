# Behavioural check that the installer runs no compiler: audits 4688 process creation and
# fails on csc/vbc/cvtres or a DLL dropped in a temp dir. A positive control (one
# Add-Type) must fire both detectors first. The shell leg measures the released
# setup.ps1; the desktop leg uses --local and requires the overlay in the log.

name: Windows No Compiler CI

on:
  pull_request:
    paths:
      - 'install.ps1'
      - 'studio/setup.ps1'
      - 'scripts/uninstall.ps1'
      # install.sh generates PowerShell for the WSL shortcut, which can run Add-Type on Windows.
      - 'install.sh'
      - 'studio/src-tauri/src/install.rs'
      - 'studio/src-tauri/src/process.rs'
      - 'tests/studio/test_installer_av_shapes.py'
      # The watcher implements both detectors.
      - '.github/scripts/Watch-ForCompiler.ps1'
      # Its Windows-only ACL control needs a Windows runner.
      - 'tests/python/test_compiler_watch_temp_scan.py'
      # Reached by the installers this workflow triggers on.
      - 'studio/nvidia_probe.py'
      - 'studio/prebuilt_core.py'
      - 'studio/setup.sh'
      - 'studio/backend/utils/**'
      - 'pyproject.toml'
      - 'studio/backend/requirements/**'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - '.github/workflows/windows-no-compiler-ci.yml'
      # The desktop leg hands setup to this checkout's CLI, which spawns PowerShell.
      - 'unsloth_cli/*.py'
      - 'unsloth_cli/commands/*.py'
  push:
    branches: [main]
    paths:
      - 'install.ps1'
      - 'studio/setup.ps1'
      - 'scripts/uninstall.ps1'
      - 'install.sh'
      - 'studio/src-tauri/src/install.rs'
      - 'studio/src-tauri/src/process.rs'
      - 'tests/studio/test_installer_av_shapes.py'
      - '.github/scripts/Watch-ForCompiler.ps1'
      - 'tests/python/test_compiler_watch_temp_scan.py'
      - 'studio/nvidia_probe.py'
      - 'studio/prebuilt_core.py'
      - 'studio/setup.sh'
      - 'studio/backend/utils/**'
      - 'pyproject.toml'
      - 'studio/backend/requirements/**'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - '.github/workflows/windows-no-compiler-ci.yml'
      # The desktop leg hands setup to this checkout's CLI, which spawns PowerShell.
      - 'unsloth_cli/*.py'
      - 'unsloth_cli/commands/*.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  no-compiler-under-the-installer:
    name: the installer spawns no C# compiler
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Outside any user profile, so paths do not depend on whose profile ran.
      UNSLOTH_STUDIO_HOME: 'C:\Users\Public\no-compiler-home'
      UNSLOTH_EVIDENCE: 'C:\Users\Public\no-compiler-evidence'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enable process creation auditing with command lines
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:UNSLOTH_EVIDENCE | Out-Null

          # 4688 with command lines distinguishes "csc.exe ran" from "csc.exe ran for us".
          auditpol /set /subcategory:"Process Creation" /success:enable | Out-Null
          $auditKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
          New-Item -Path $auditKey -Force | Out-Null
          New-ItemProperty -Path $auditKey -Name 'ProcessCreationIncludeCmdLine_Enabled' `
              -Value 1 -PropertyType DWord -Force | Out-Null

          # Large enough that installer noise cannot roll the window off the Security log.
          wevtutil sl Security /ms:268435456

          $state = auditpol /get /subcategory:"Process Creation"
          $state | Tee-Object -FilePath "$env:UNSLOTH_EVIDENCE\auditpol.txt"
          # auditpol returns an array, and -notmatch on an array filters; join to one string.
          if (($state | Out-String) -notmatch 'Process Creation\s+Success') {
              throw "process creation auditing did not turn on; this job cannot measure anything"
          }

      - name: Positive control -- the detector must see a real compile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.github\scripts\Watch-ForCompiler.ps1"

          $probe = {
              # The only Add-Type in CI, here to prove the detector works.
              Add-Type -TypeDefinition 'public static class UnslothCompilerProbe { public static int N() { return 1; } }'
              [UnslothCompilerProbe]::N() | Out-Null
          }
          $seen = Invoke-WithCompilerWatch -Name 'positive-control' -Action $probe `
              -EvidenceRoot $env:UNSLOTH_EVIDENCE

          if (-not $seen.Compilers) {
              throw ("the positive control compiled a type and no compiler process was recorded. " +
                     "The detector is broken, so a clean result later would mean nothing.")
          }
          if (-not $seen.TempLibraries) {
              throw ("the positive control compiled a type and no temporary DLL was recorded. " +
                     "The temporary-directory half of the detector is broken.")
          }
          Write-Host ("detector verified: {0} compiler process(es), {1} temporary DLL(s)" -f `
              $seen.Compilers.Count, $seen.TempLibraries.Count)

      - name: Require the installer to run without a compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.github\scripts\Watch-ForCompiler.ps1"

          $install = {
              # Spawn a child powershell.exe as the desktop does. Not --tauri, which refuses the pinned
              # UNSLOTH_STUDIO_HOME.
              New-Item -ItemType Directory -Force -Path logs | Out-Null
              # 'Continue' around the child only: under 'Stop' any stderr line raises NativeCommandError.
              $outer = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                  -File "$env:GITHUB_WORKSPACE\install.ps1" --no-torch *>&1 |
                  Tee-Object -FilePath "$env:UNSLOTH_EVIDENCE\install.log"
              $exit = $LASTEXITCODE
              $ErrorActionPreference = $outer
              $global:LASTEXITCODE = 0
              if ($exit -ne 0) { throw "install.ps1 exited $exit" }
          }
          $seen = Invoke-WithCompilerWatch -Name 'installer' -Action $install `
              -EvidenceRoot $env:UNSLOTH_EVIDENCE

          # Interpolated, not -f: the format operator binds tighter than concatenation.
          if ($seen.Compilers) {
              $seen.Compilers | ForEach-Object { Write-Host "COMPILER: $_" }
              throw ("the installer spawned $($seen.Compilers.Count) compiler process(es). This is " +
                     "the chain that was blocked in the field: a windowless PowerShell launching " +
                     "csc.exe and dropping a DLL in TEMP. Nothing in the installer declares a " +
                     "native method any more: reach the entry point through a child interpreter " +
                     "and ctypes, as the path resolver and the GPU inventory do.")
          }
          if ($seen.TempLibraries) {
              $seen.TempLibraries | ForEach-Object { Write-Host "TEMP DLL: $_" }
              throw ("the installer left $($seen.TempLibraries.Count) compiler artefact(s) in a " +
                     "temporary directory. Even without a compiler process this is the artefact " +
                     "half of the same shape. Cleaning one up does not clear it: the watcher " +
                     "records the creation.")
          }
          Write-Host "no compiler, no temporary DLL"

      - name: Require the desktop mode to run without a compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . "$env:GITHUB_WORKSPACE\.github\scripts\Watch-ForCompiler.ps1"

          # --tauri is what the launcher passes. --local makes this leg measure this checkout's
          # setup.ps1; a run that fell back to the release is void.
          $desktop = {
              Remove-Item Env:\UNSLOTH_STUDIO_HOME -ErrorAction SilentlyContinue
              # 'Continue' around the child only: under 'Stop' any stderr line raises NativeCommandError.
              $outer = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass `
                  -File "$env:GITHUB_WORKSPACE\install.ps1" --tauri --local --no-torch *>&1 |
                  Tee-Object -FilePath "$env:UNSLOTH_EVIDENCE\install-tauri.log"
              $exit = $LASTEXITCODE
              $ErrorActionPreference = $outer
              $global:LASTEXITCODE = 0
              # Not gated on exit 0: only whether a compiler ran matters.
              Write-Host "install.ps1 --tauri exited $exit"
              # Gated on reaching the work: the STEP line is printed after the install lock is taken.
              $log = ""
              if (Test-Path "$env:UNSLOTH_EVIDENCE\install-tauri.log") {
                  $log = Get-Content -Raw "$env:UNSLOTH_EVIDENCE\install-tauri.log"
              }
              if ($log -notmatch 'Checking system dependencies') {
                  throw ("the desktop-mode install stopped before it reached any install " +
                         "work (exit $exit), so this measurement is void rather than clean.")
              }
              # Printed by the --local overlay; without it setup came from the released package.
              if ($log -notmatch 'overlaying local repo') {
                  throw ("the local overlay never ran (exit $exit), so the setup.ps1 that " +
                         "executed was not the one in this checkout. Void, not clean.")
              }
              $setup = Join-Path $env:GITHUB_WORKSPACE 'studio\setup.ps1'
              "path=$setup" | Out-File "$env:UNSLOTH_EVIDENCE\setup-measured.txt" -Encoding utf8
              "sha256=$((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash)" |
                  Out-File "$env:UNSLOTH_EVIDENCE\setup-measured.txt" -Encoding utf8 -Append
          }
          $seen = Invoke-WithCompilerWatch -Name 'installer-tauri' -Action $desktop `
              -EvidenceRoot $env:UNSLOTH_EVIDENCE

          if ($seen.Compilers) {
              $seen.Compilers | ForEach-Object { Write-Host "COMPILER: $_" }
              throw "the desktop-mode installer spawned $($seen.Compilers.Count) compiler process(es)."
          }
          if ($seen.TempLibraries) {
              $seen.TempLibraries | ForEach-Object { Write-Host "TEMP DLL: $_" }
              throw "the desktop-mode installer wrote $($seen.TempLibraries.Count) DLL(s) into a temporary directory."
          }
          Write-Host "desktop mode: no compiler, no temporary DLL"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-no-compiler
          path: 'C:\Users\Public\no-compiler-evidence'
          if-no-files-found: warn

      - name: Restore auditing
        if: always()
        shell: powershell
        run: |
          auditpol /set /subcategory:"Process Creation" /success:disable | Out-Null
          $auditKey = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Audit'
          Remove-ItemProperty -Path $auditKey -Name 'ProcessCreationIncludeCmdLine_Enabled' `
              -ErrorAction SilentlyContinue
          exit 0
