# Reports the VirusTotal delta against the reported install.ps1 baseline on three axes:
# engine verdicts, Sigma rules and YARA rules. GET only: uploading a fresh sample can
# create the detection. An unknown hash is VOID (exit 3), never clean. Dispatch only.

name: "VirusTotal: installer delta against the reported baseline"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "File to hash and look up"
        required: false
        default: 'install.ps1'
      baseline_sha256:
        description: "Override the baseline hash (default: install.ps1 at 1ad44677d)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  delta:
    name: how does this candidate compare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline commit is verified against this repo's history.
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the comparison can still report a regression
        run: |
          set -euo pipefail
          # Self-test before spending quota.
          python scripts/virustotal_delta.py --self-test

      # Separate step: needs git history, and a shallow clone should skip rather than fail.
      - name: Confirm the baseline is the file the reporter ran
        run: |
          set -euo pipefail
          if ! git cat-file -e 1ad44677d^{commit} 2>/dev/null; then
            echo "::warning::1ad44677d is not in this clone, so the baseline could not be reverified"
            exit 0
          fi
          got="$(git show 1ad44677d:install.ps1 | sha256sum | cut -d' ' -f1)"
          want="$(python -c 'import sys; sys.path.insert(0, "scripts"); import virustotal_delta as v; print(v.BASELINE_SHA256)')"
          echo "history $got"
          echo "constant $want"
          if [ "$got" != "$want" ]; then
            echo "::error::the recorded baseline hash is not install.ps1 at 1ad44677d. Every delta reported against it was against the wrong file."
            exit 1
          fi
          echo "baseline reverified against history"

      - name: Compare
        id: compare
        env:
          # The script reads VT_API_KEY; the repository secret is VIRUS_TOTAL_API_TOKEN.
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_API_TOKEN }}
          TARGET: ${{ inputs.path }}
          BASELINE: ${{ inputs.baseline_sha256 }}
        run: |
          set -euo pipefail
          args=(--candidate "${TARGET:-install.ps1}" --summary "$RUNNER_TEMP/vt-delta.md")
          if [ -n "$BASELINE" ]; then args+=(--baseline-sha256 "$BASELINE"); fi
          set +e
          python scripts/virustotal_delta.py "${args[@]}"
          code=$?
          set -e
          case "$code" in
            0) echo "VERDICT: not worse than the baseline." ;;
            2) echo "::error::VERDICT: worse than the baseline on at least one axis." ;;
            3) echo "::error::VERDICT: VOID. Nothing was compared." ;;
            *) echo "::error::VERDICT: the tool itself failed (exit $code)." ;;
          esac
          exit "$code"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virustotal-delta
          path: ${{ runner.temp }}/vt-delta.md
          if-no-files-found: warn
          # Clearance is per hash and vendor round trips outlast a week.
          retention-days: 90
