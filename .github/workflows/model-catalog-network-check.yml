# Checks that every catalog repo id, filename and `gated` flag still resolves on the Hub.
# Schedule + manual only: it depends on huggingface.co, so it must never fail a PR.

name: Model catalog network check

on:
  schedule:
    - cron: '19 6 * * *'
  workflow_dispatch:

concurrency:
  # Event is in the group so a manual dispatch and the nightly cannot coalesce.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  catalog-network:
    name: catalog entries must still be downloadable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      # No `npm ci`: the check is a standalone node script with no dependencies.
      - name: Catalog entries must still resolve on the Hub
        run: npm run catalog:check:network
