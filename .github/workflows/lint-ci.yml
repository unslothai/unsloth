# Whole-repo, multi-language source-lint gate. Runs on every PR
# (no path filter) because each step is sub-second to a few seconds
# and together they catch a class of breakage the focused build
# workflows would miss:
#
#   - Python syntax + ruff + leftover debugger calls (across 350+
#     committed .py files, not just studio/backend).
#   - Shell `bash -n` parse for every committed *.sh.
#   - `yaml.safe_load` and `json.loads` round-trip for every
#     committed YAML / JSON config.
#
# TypeScript and Rust are NOT duplicated here on purpose:
#   - Unsloth Frontend CI runs `npm run typecheck` (= `tsc --noEmit`)
#     and `npm run build` (vite/swc) on every studio/frontend/**
#     change, which is a full TS AST + type check.
#   - Unsloth Tauri CI runs `tauri build --debug --no-bundle` on
#     every studio/src-tauri/** or studio/frontend/** change, which
#     compiles the Rust crate (= cargo check + cargo build).
# Each is a stricter check than a parse-only step would be, so a
# fast-fail duplicate here would only burn cache; the dedicated
# workflows already block merges on Rust / TS regressions.

name: Lint CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Latest-only on a PR branch. On main this does less than it reads like: it stops
  # a RUNNING main job being killed, but GitHub cancels any PENDING run in the group
  # the moment a newer one is queued, so a merge burst still leaves only the tip.
  # See studio-backend-ci.yml, which is grouped per commit on main for that reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  source-lint:
    name: Source lint (Python + shell + YAML + JSON + safety nets)
    runs-on: ubuntu-latest
    # Real work here is well under a minute; the budget is sized for the apt step
    # below, which is bounded at 13 minutes of worst-case retries. Raised from 5,
    # where the job timeout was doing the bounding -- and doing it badly, since a
    # job that runs out of budget is reported as "cancelled" with no reason given
    # and every remaining step skipped. The step timeout says which step and why.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          # No cache. This job installs three linters and nothing else, so the ~9 MB it
          # would store is not worth a slot in a budget the model downloads are competing
          # for. It used to share one key with every other Python 3.12 job in the repo,
          # and whichever ran first won it: in practice this one, leaving a 9 MB entry
          # that Core then restored before downloading 3.2 GB anyway.

      # Pin ruff to match .pre-commit-config.yaml so a CI-only ruff
      # bump cannot disagree with what pre-commit accepted.
      # codespell is pinned for the same reason: a reviewer should
      # never see a typo report appear and disappear depending on
      # which codespell version the runner happened to install.
      - run: pip install 'ruff==0.15.12' 'pyyaml>=6' 'codespell>=2.3,<3'

      # Two short jobs that used to hold a runner slot each, absorbed onto this one.
      #
      #   Unsloth load-orchestrator CI :: test   33 s, its own slot
      #   Lockfile supply-chain audit :: audit     6 s, its own slot
      #
      # Both are pure read-only checks: no server, no port, no install of Unsloth, no
      # state outside the workspace. They are launched here in the BACKGROUND and
      # collected in the last step of this job, so they overlap the ~65 s of lint below
      # and cost no wall clock at all rather than being appended to it. ubuntu-latest has
      # four cores and the lint steps are single-threaded, so the capacity is there.
      #
      # Each lane gets its own venv. That is the only isolation this needs, and it is
      # load-bearing: the lane installs fastapi/httpx/pytest while the foreground steps
      # are using the interpreter that `pip install` above populated, and two concurrent
      # pip installs into one site-packages is a genuine race rather than a theoretical
      # one. Nothing else is shared -- no ports are bound and no files are written outside
      # each lane's own log.
      #
      # This job has no path filter, so it runs on every commit, which means absorbing a
      # narrower-triggered job here can only ever REDUCE the slots a commit takes: the
      # absorbed work now runs on commits that would not have triggered it, but on a
      # runner that was already going to exist.
      - name: Start the absorbed suites (background)
        run: |
          set -euo pipefail
          mkdir -p logs .lanes

          # Written on exit with the lane's status, and read by the collect step. A lane
          # that dies without writing one is reported as a failure there rather than
          # silently passing, which is the failure mode that makes backgrounding risky.
          # `</dev/null >/dev/null 2>&1` on the SUBSHELL is not tidiness, it is what makes
          # this step return immediately. A background child inherits the step's stdout
          # and stderr pipes, and the runner does not consider a step finished while a
          # writer still holds them: without this the launch blocks for as long as the
          # lane runs, which is precisely the overlap the backgrounding exists to buy.
          # Measured: 4.0 s to launch a 4 s lane before, 0.0 s after.
          #
          # The inner redirect to the log applies to the command itself and takes
          # precedence, so nothing is lost -- the lane's output is replayed by the
          # collect step.
          lane() {
            name="$1"; shift
            (
              rc=0
              "$@" > "logs/lane-$name.log" 2>&1 || rc=$?
              echo "$rc" > ".lanes/$name.rc"
            ) < /dev/null > /dev/null 2>&1 &
          }

          lane load-orchestrator bash .github/scripts/lane-load-orchestrator.sh .lanes/venv-load-orchestrator
          lane lockfile-audit bash .github/scripts/lane-lockfile-audit.sh

          echo "launched 2 background lanes"

      # Bounded and retried, because this step is why the job's own timeout used to
      # be the failure mechanism: on 2026-08-19 it sat in apt for 5 minutes, the job
      # hit `timeout-minutes: 5`, and GitHub scored the result "cancelled" with no
      # reason and skipped all fifteen checks below it. A lint run that reports
      # nothing about lint is worse than a red one.
      #
      # update and install are one unit: retrying the install alone after a stalled
      # update just re-reads the same broken package list.
      - name: Linux deps for shellcheck
        # Two long attempts, not three short ones. 150s killed apt mid-`update`
        # against a mirror that was degraded rather than dead, and every attempt
        # then hit the same wall -- three kills and no result. The bound exists to
        # stop an infinite hang, not to race a slow mirror.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends shellcheck || { apt-get update -qq && apt-get install -y --no-install-recommends shellcheck; }'

      - name: Python AST/syntax check (every committed .py must compile)
        # python -m compileall uses the same parser the interpreter
        # uses, so anything broken here would also crash at
        # `import X` on a user's machine. Sub-second across 350+
        # files. Hard gate.
        run: |
          python -m compileall -q -j 0 \
            unsloth unsloth_cli studio tests cli.py unsloth-cli.py

      - name: Python ruff check (whole repo)
        # The narrow rule set in pyproject.toml [tool.ruff.lint]
        # selects E9 / F63 / F7 / F82 -- syntax errors, broken
        # comparisons, undefined names. The whole repo passes today,
        # so this is a hard gate.
        run: |
          ruff check unsloth unsloth_cli studio tests cli.py unsloth-cli.py

      - name: Import-hoist verifier self-test
        # scripts/verify_import_hoist.py is a scope-aware (LEGB) AST
        # resolver that gates import-hoisting / alias-rename refactors
        # against two bugs ruff and pyflakes both miss:
        #   1. dangling alias  -- `from a import b as _b` hoisted to
        #      `from a import b` but a leftover `_b` reference now
        #      resolves to nothing (or to some other module-level `_b`).
        #   2. rename clash    -- `_b -> b` silently re-points at a
        #      different object already named `b` in that scope.
        # This step runs the tool's 8 negative-control cases so a
        # regression in the verifier itself fails before we trust it on
        # a diff. Hermetic, stdlib-only, sub-second. Hard gate.
        run: |
          python scripts/verify_import_hoist.py --self-test

      - name: Import-hoist / alias-rename safety (changed Python files)
        # Runs the verifier in compare mode on every in-place-modified
        # .py in the PR: parses each file BEFORE (base branch) and AFTER
        # (this diff), resolves every name load, and fails on a BLOCKER
        # (dangling alias / rename clash / re-pointed import). INFO
        # findings (a helper relocated to another file) do not fail.
        #
        # --diff-filter=M (in-place edits only) is deliberate: that is
        # exactly where a hoist refactor lives, and it skips brand-new
        # files whose re-export imports would otherwise look "unused".
        #
        # Diff the merge-base against the PR HEAD, and pin BOTH ends
        # explicitly.
        #
        # The base tip is the wrong BEFORE: a two-dot diff against it
        # re-lints every file the base branch changed after the PR
        # branched, comparing newer base code (BEFORE) against the PR's
        # older snapshot (AFTER) - a time-reversed comparison that flags
        # the base branch's own refactors as blockers.
        #
        # `HEAD` is the wrong AFTER for the same reason. On a
        # pull_request event the checkout is refs/pull/N/merge, i.e.
        # merge(PR head, base tip), so `$MERGE_BASE..HEAD` still spans
        # every base commit since the branch point and reintroduces the
        # exact false positives the merge-base was chosen to avoid.
        # Naming the PR head SHA makes the range the PR's own commits
        # and nothing else.
        #
        # Both endpoints are fetched by SHA so the shallow
        # (fetch-depth: 1) clone is preserved; the verifier reads each
        # revision with `git show REF:path` and never needs a checkout.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(gh api \
            "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --jq .merge_base_commit.sha)
          # A fork PR's head is not on origin as a branch, but it is
          # always reachable as refs/pull/N/head.
          git fetch --no-tags --depth=1 origin "$MERGE_BASE"
          git fetch --no-tags --depth=1 origin \
            "refs/pull/${{ github.event.pull_request.number }}/head"
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=M \
              "$MERGE_BASE" "$HEAD_SHA" -- '*.py' \
              | grep -vE '(^|/)(unsloth_compiled_cache|node_modules|build|dist)/' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "no in-place-modified Python files to check"
            exit 0
          fi
          printf 'merge base: %s\n' "$MERGE_BASE"
          printf 'pr head:    %s\n' "$HEAD_SHA"
          printf 'checking %d file(s):\n' "${#CHANGED[@]}"
          printf '  %s\n' "${CHANGED[@]}"
          python scripts/verify_import_hoist.py \
            --before "$MERGE_BASE" --after "$HEAD_SHA" "${CHANGED[@]}"

      - name: Duplicate-definition verifier self-test
        # scripts/lint_duplicate_definitions.py refuses a name bound twice in one
        # scope: two top-level copies of a def / class / constant, or a name
        # imported twice. That is what a bad merge resolution leaves behind, and
        # every other check here passes it -- compileall parses both copies, the
        # ruff rule set (E9 / F63 / F7 / F82) has no F811, and the two copies
        # usually differ only in their comments.
        # Runs the tool's self-test cases, positive and negative, so a regression in the
        # rule fails before we trust it on a diff. Stdlib-only, sub-second.
        run: |
          python scripts/lint_duplicate_definitions.py --self-test

      - name: Duplicate definitions (changed Python files)
        # Same merge-base reasoning as the import-hoist step above: diff the merge
        # base against the PR head SHA so the range is the PR's own commits and
        # not every base commit since the branch point.
        #
        # --diff-filter=ACMRT, not M: a bad resolution can just as easily land in a
        # file the PR adds, and a rename that also edits the file is reported as R
        # (R093 and so on), which an ACM filter would drop. T is there because a path
        # that changes TYPE -- a symlink replaced by a regular .py file -- is reported
        # as neither M nor A, so the newly active source reached the verifier as no
        # path at all and the step passed having checked nothing.
        #
        # The verifier scans BOTH revisions and compares findings by identity, so a
        # duplicate that was already in the file is printed and ignored while one
        # this PR introduced fails. Comparing added LINES instead would miss the
        # case where the new copy is inserted ABOVE the old one, since the finding
        # is reported at the second, unchanged definition. There are 37 pre-existing
        # findings on main today; they are a separate cleanup, not a reason to leave
        # the gate off. Four of those are only visible once each control-flow branch is
        # scanned on its own: a repeated `from unsloth import is_bfloat16_supported`
        # inside one `if __name__ == "__main__":` block in four of the saving tests.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(gh api \
            "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --jq .merge_base_commit.sha)
          git fetch --no-tags --depth=1 origin "$MERGE_BASE"
          # refs/pull/N/head moves. On a rerun of an older run, or if the branch
          # advanced since the event, that ref is no longer $HEAD_SHA, and a depth-1
          # clone would not have the pinned commit at all. Fetch the ref first (it is
          # what makes the SHA reachable on a fork PR), then the SHA itself, then
          # REFUSE to continue if it is still missing. The old shape hid exactly this:
          # git diff failed, the pipeline's `|| true` produced an empty file list, and
          # the step reported success having checked nothing.
          git fetch --no-tags --depth=1 origin \
            "refs/pull/${{ github.event.pull_request.number }}/head"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA" 2>/dev/null || true
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::head commit $HEAD_SHA is not available locally; refusing to skip the check"
            exit 1
          fi
          # -z / -d '', because core.quotePath defaults on: a non-ASCII path comes out of a
          # line-oriented git diff as "caf\303\251.py", whose suffix is .py" rather than
          # .py, so the verifier would skip it and report success having checked nothing.
          mapfile -d '' -t CHANGED < <(
            git diff -z --name-only --diff-filter=ACMRT \
              "$MERGE_BASE" "$HEAD_SHA" -- '*.py' \
              | grep -zvE '(^|/)(unsloth_compiled_cache|node_modules|build|dist)/' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "no changed Python files to check"
            exit 0
          fi
          printf 'merge base: %s\n' "$MERGE_BASE"
          printf 'pr head:    %s\n' "$HEAD_SHA"
          printf 'checking %d file(s)\n' "${#CHANGED[@]}"
          python scripts/lint_duplicate_definitions.py \
            --before "$MERGE_BASE" --after "$HEAD_SHA" "${CHANGED[@]}"

      - name: No silent llama-server parallel-slot downgrades
        # #7717 clamped --parallel to 1 whenever MTP resolved, costing batched
        # callers 4x throughput. Launch fewer slots only for a real capability
        # or VRAM limit, marked '# allow-slot-clamp: <reason>'. Self-test first,
        # so a regression in the rule fails before we trust it on the tree.
        run: |
          python scripts/lint_no_parallel_clamp.py --self-test
          python scripts/lint_no_parallel_clamp.py

      - name: No leftover debugger / pdb / breakpoint calls
        # Catches the "I'll just stick a breakpoint() here" mistake
        # before it ships. AST-based so commented-out debugger
        # markers don't false-positive (a bare grep would; there
        # are three commented `# breakpoint()` markers in
        # unsloth/models/rl* today). Sub-second.
        run: |
          python <<'PY'
          import ast, pathlib, sys

          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "unsloth_compiled_cache", "node_modules",
                        "unsloth.egg-info"}

          bad = []
          scanned = 0
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              scanned += 1
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8", errors="replace"))
              except SyntaxError:
                  continue   # compileall step above already failed this
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  fn = node.func
                  if isinstance(fn, ast.Name) and fn.id == "breakpoint":
                      bad.append((path, node.lineno, "breakpoint()"))
                  elif (isinstance(fn, ast.Attribute) and fn.attr == "set_trace"
                        and isinstance(fn.value, ast.Name)
                        and fn.value.id in {"pdb", "ipdb"}):
                      bad.append((path, node.lineno, f"{fn.value.id}.set_trace()"))

          if bad:
              for path, lineno, what in bad:
                  print(f"::error file={path},line={lineno}::leftover {what} -- remove before merging")
              sys.exit(1)
          print(f"no leftover debugger calls (scanned {scanned} files)")
          PY

      - name: License-header drift (informational; whole repo)
        # Three header families are accepted across the repo:
        #   1. SPDX one-liner: `# SPDX-License-Identifier: ...`
        #      Used across studio/ (AGPL-3.0-only) and a few new
        #      files elsewhere.
        #   2. Apache-2.0 long form, marker phrase
        #      "Licensed under the Apache License". Used across
        #      unsloth/ and unsloth_cli/.
        #   3. GNU long form, marker phrase "General Public License".
        #      That single substring covers GPL, LGPL ("GNU Lesser
        #      General Public License") and AGPL ("GNU Affero
        #      General Public License") preambles, all three of
        #      which appear in unsloth/kernels/* (LGPL/AGPL) without
        #      the SPDX line.
        # Empty files (mainly empty __init__.py) are skipped.
        # Surfaced as a warning; cleaning up the actual misses is a
        # follow-up PR, not a CI fix.
        continue-on-error: true
        run: |
          python <<'PY'
          import pathlib

          ACCEPTED = (
              "SPDX-License-Identifier",        # any SPDX line
              "Licensed under the Apache License",  # Apache-2.0 long form
              "General Public License",         # GPL / LGPL / AGPL long form
          )
          # "vendor" is upstream third-party source: it carries its own licence.
          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "unsloth_compiled_cache", "node_modules",
                        "unsloth.egg-info", "vendor"}

          studio_missing = []
          other_missing  = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if not text.strip():
                  continue  # empty __init__.py etc.
              head = "\n".join(text.splitlines()[:25])
              if any(marker in head for marker in ACCEPTED):
                  continue
              if "studio" in path.parts:
                  studio_missing.append(path)
              else:
                  other_missing.append(path)

          total = len(studio_missing) + len(other_missing)
          if total == 0:
              print("every committed .py has a recognised license header")
          else:
              print(f"::warning::{total} Python files have no recognised license "
                    f"header (SPDX / Apache-2.0 / GNU long form): "
                    f"studio={len(studio_missing)}, other={len(other_missing)}")
              for path in (studio_missing + other_missing)[:30]:
                  print(f"  {path}")
              if total > 30:
                  print(f"  ... and {total - 30} more")
          PY

      - name: Shell scripts parse cleanly (`bash -n`)
        # Same idea as Python's compileall: parse-only check that
        # every committed *.sh would not blow up at `bash script.sh`
        # invocation time on a release box. tests/sh/ is the largest
        # cluster (the install.sh shape tests).
        run: |
          shopt -s globstar
          fail=0
          for f in $(git ls-files '*.sh'); do
              if ! bash -n "$f"; then
                  echo "::error file=$f::shell parse error"
                  fail=1
              fi
          done
          if [ "$fail" -ne 0 ]; then
              exit 1
          fi
          n=$(git ls-files '*.sh' | wc -l)
          echo "$n shell scripts parse cleanly"

      - name: YAML files parse cleanly (yaml.safe_load)
        # Catches truncated workflow files, broken indents in
        # dependabot.yml / pre-commit configs, etc. Includes
        # .github/workflows/*.yml so a typo in the file we just
        # added shows up immediately.
        run: |
          python <<'PY'
          import pathlib, sys, yaml

          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "node_modules", "unsloth_compiled_cache",
                        "unsloth.egg-info"}

          bad = []
          scanned = 0
          for path in sorted(list(pathlib.Path(".").rglob("*.yml"))
                             + list(pathlib.Path(".").rglob("*.yaml"))):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              scanned += 1
              try:
                  with path.open("r", encoding="utf-8") as fh:
                      list(yaml.safe_load_all(fh))
              except Exception as exc:
                  bad.append((path, exc))

          if bad:
              for path, exc in bad:
                  print(f"::error file={path}::YAML parse failed: {exc}")
              sys.exit(1)
          print(f"{scanned} YAML files parse cleanly")
          PY

      - name: JSON files parse cleanly (json.loads)
        # Catches malformed package.json, biome.json, etc. Skips:
        #   - huge npm/bun lockfiles (machine-generated, slow to
        #     parse, no value).
        #   - tsconfig*.json: TypeScript convention is JSONC (JSON
        #     with `/* ... */` comments), which standard json.loads
        #     rejects. Strip-and-validate would need json5 or a
        #     hand-rolled comment scrubber for marginal value, since
        #     `tsc --noEmit` already validates these in Frontend CI.
        run: |
          python <<'PY'
          import fnmatch, json, pathlib, sys

          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "node_modules", "unsloth_compiled_cache",
                        "unsloth.egg-info"}
          SKIP_NAMES = {"package-lock.json", "bun.lock"}
          SKIP_PATTERNS = ("tsconfig*.json",)

          bad = []
          scanned = 0
          for path in sorted(pathlib.Path(".").rglob("*.json")):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              if path.name in SKIP_NAMES:
                  continue
              if any(fnmatch.fnmatch(path.name, pat) for pat in SKIP_PATTERNS):
                  continue
              scanned += 1
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append((path, exc))

          if bad:
              for path, exc in bad:
                  print(f"::error file={path}::JSON parse failed: {exc}")
              sys.exit(1)
          print(f"{scanned} JSON files parse cleanly")
          PY

      - name: codespell typo check (informational)
        # Catches typos in code, comments, and docs across the repo.
        # Skips lockfiles, generated assets, binary artefacts, and
        # the LICENSE files (US/UK spelling drift in legal text is
        # not ours to second-guess). The ignore-words-list pulls
        # out short identifiers + valid technical terms that
        # codespell's default dictionary would otherwise flag
        # (e.g. `ans` as a math-quiz variable name in
        # tests/utils/aime_eval.py, `parm`/`parms` in PyTorch
        # nn.Module idioms). Non-blocking until the surfaced typos
        # are fixed; drop continue-on-error after the cleanup.
        continue-on-error: true
        run: |
          codespell \
            --skip='*.lock,*.lockb,*.json,*.svg,*.png,*.jpg,*.jpeg,*.gif,*.ico,*.woff*,*.ttf,*.eot,*.zip,*.gz,*.gguf,*.safetensors,*.bin,node_modules,.git,build,dist,unsloth_compiled_cache,unsloth.egg-info,target,studio/frontend/dist,*.pyc,*-licenses.txt,LICENSE*' \
            --ignore-words-list='ans,bu,hel,fo,te,ot,hist,ned,sav,recurser,datas,nin,parm,parms,checkin,nd,fr,inout,donot,uint' \
            --quiet-level=2

      - name: shellcheck on committed *.sh (informational)
        # Goes beyond `bash -n` (which only parses): catches subtle
        # shell bugs like unquoted variable expansions, useless
        # `cat`, command substitutions inside `[[`, etc. The
        # install/setup scripts are critical-path so the signal is
        # worth surfacing. Non-blocking until install.sh's
        # hand-rolled patterns get cleaned up; drop continue-on-error
        # afterwards.
        continue-on-error: true
        run: |
          # Exclude SC1090 ("source not followable") -- legitimate
          # for installer scripts that source files at runtime
          # paths shellcheck cannot resolve statically.
          # SC2034 ("variable assigned but never used") fires on
          # the export-only assignment idiom we use in install.sh.
          shellcheck -e SC1090,SC2034 $(git ls-files '*.sh')

      - name: ruff format drift (informational)
        # The canonical formatter is scripts/run_ruff_format.py
        # = ruff format + scripts/enforce_kwargs_spacing.py, so plain
        # `ruff format --check` reports the kwarg-spacing diff as
        # drift. Surface the count for visibility but keep
        # non-blocking until the custom pipeline is wired in here.
        continue-on-error: true
        run: |
          ruff format --check unsloth unsloth_cli studio tests cli.py unsloth-cli.py

      # Collects the two lanes launched before the lint steps. This step is the whole
      # reason the backgrounding is safe: without it a lane's failure would be invisible
      # and the absorbed jobs would be silently deleted rather than moved.
      #
      # `always()` so a lane failure is still reported when a lint step above failed
      # first, and a missing .rc file is a failure rather than a pass, which covers a
      # lane that was killed or never started.
      - name: Collect the absorbed suites
        if: always()
        run: |
          set -uo pipefail
          rc=0
          for name in load-orchestrator lockfile-audit; do
            # The lanes are children of an earlier step's shell, not of this one, so
            # `wait` cannot see them; poll for the sentinel instead. 240s is well beyond
            # the 33s and 6s these take, and the job timeout bounds it regardless.
            waited=0
            while [ ! -f ".lanes/$name.rc" ] && [ "$waited" -lt 240 ]; do
              sleep 2
              waited=$((waited + 2))
            done
            echo "::group::$name"
            cat "logs/lane-$name.log" 2>/dev/null || echo "(no log produced)"
            echo "::endgroup::"
            if [ ! -f ".lanes/$name.rc" ]; then
              echo "::error::$name never finished (no exit status after ${waited}s)"
              rc=1
              continue
            fi
            lane_rc=$(cat ".lanes/$name.rc")
            if [ "$lane_rc" != "0" ]; then
              echo "::error::$name failed with exit status $lane_rc"
              rc=1
            else
              echo "$name passed"
            fi
          done
          exit "$rc"
