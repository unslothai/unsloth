# Whole-repo lint gate, no path filter (every step is seconds). TS and Rust are covered by the
# Frontend and Tauri workflows; only the duplicate-import rule is duplicated here because it is fast.

name: Lint CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On main this only protects a RUNNING job; GitHub still drops pending runs in the group.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  source-lint:
    name: Source lint (Python + shell + YAML + JSON + safety nets)
    runs-on: ubuntu-latest
    # Sized for the bounded apt step below; a step timeout names the failing step, a job timeout does not.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          # No cache: ~9 MB of linters is not worth a slot in the shared cache budget.

      # Pin ruff to match .pre-commit-config.yaml so a CI-only ruff bump cannot disagree with
      # pre-commit. codespell is pinned so typo reports do not flip with its version.
      - run: pip install 'ruff==0.15.12' 'pyyaml>=6' 'codespell>=2.3,<3'

      # Absorbed read-only suites run in the background, overlapping lint, and are collected in the
      # last step. Each lane has its own venv: concurrent pip installs into one site-packages race.
      - name: Start the absorbed suites (background)
        run: |
          set -euo pipefail
          mkdir -p logs .lanes

          # The .rc file is read by the collect step; a lane that never writes one counts as failed.
          # Redirecting the subshell's stdio is required: the runner waits on inherited pipes otherwise.
          lane() {
            name="$1"; shift
            (
              rc=0
              "$@" > "logs/lane-$name.log" 2>&1 || rc=$?
              echo "$rc" > ".lanes/$name.rc"
            ) < /dev/null > /dev/null 2>&1 &
          }

          lane load-orchestrator bash .github/scripts/lane-load-orchestrator.sh .lanes/venv-load-orchestrator
          lane lockfile-audit bash .github/scripts/lane-lockfile-audit.sh

          echo "launched 2 background lanes"

      # Bounded and retried so a stalled apt fails this step instead of cancelling the whole job.
      # update and install retry together: retrying install alone re-reads the same broken list.
      - name: Linux deps for shellcheck
        # Two long attempts, not three short ones: a degraded mirror needs time, the bound only stops hangs.
        timeout-minutes: 15
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends shellcheck || { apt-get update -qq && apt-get install -y --no-install-recommends shellcheck; }'

      - name: Python AST/syntax check (every committed .py must compile)
        run: |
          python -m compileall -q -j 0 \
            unsloth unsloth_cli studio tests cli.py unsloth-cli.py

      - name: Dynamic-execution gate self-test
        run: python scripts/lint_exec_literals.py --self-test

      - name: No exec, eval or compile of a value that is not written out
        run: python scripts/lint_exec_literals.py

      - name: Scanner-shape gate self-test
        run: python scripts/lint_av_shapes.py --self-test

      # New lines only; existing ones live in scripts/av_shapes_baseline.json.
      - name: No new code shapes that heuristic scanners quarantine
        run: python scripts/lint_av_shapes.py

      - name: Risky-loader gate self-test
        run: python scripts/lint_risky_loaders.py --self-test

      # Dynamic imports, trust_remote_code turned on in code, unpinned code fetches and
      # unsafe deserialization. Existing sites live in scripts/risky_loaders_baseline.json.
      - name: No new risky loader call sites
        run: python scripts/lint_risky_loaders.py

      - name: Python ruff check (whole repo)
        run: |
          ruff check unsloth unsloth_cli studio tests cli.py unsloth-cli.py

      - name: Import-hoist verifier self-test
        # Self-test the import-hoist verifier (dangling alias, rename clash) before trusting it on a diff.
        run: |
          python scripts/verify_import_hoist.py --self-test

      - name: Import-hoist / alias-rename safety (changed Python files)
        # Diff merge-base..PR head SHA, both fetched by SHA: the base tip or the merge ref HEAD would
        # pull in base-branch commits and flag their refactors. -M only: hoist refactors are in-place edits.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(gh api \
            "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --jq .merge_base_commit.sha)
          # A fork PR's head is only reachable as refs/pull/N/head.
          git fetch --no-tags --depth=1 origin "$MERGE_BASE"
          git fetch --no-tags --depth=1 origin \
            "refs/pull/${{ github.event.pull_request.number }}/head"
          mapfile -t CHANGED < <(
            git diff --name-only --diff-filter=M \
              "$MERGE_BASE" "$HEAD_SHA" -- '*.py' \
              | grep -vE '(^|/)(unsloth_compiled_cache|node_modules|build|dist)/' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "no in-place-modified Python files to check"
            exit 0
          fi
          printf 'merge base: %s\n' "$MERGE_BASE"
          printf 'pr head:    %s\n' "$HEAD_SHA"
          printf 'checking %d file(s):\n' "${#CHANGED[@]}"
          printf '  %s\n' "${CHANGED[@]}"
          python scripts/verify_import_hoist.py \
            --before "$MERGE_BASE" --after "$HEAD_SHA" "${CHANGED[@]}"

      - name: Duplicate-definition verifier self-test
        # Rejects a name bound twice in one scope (bad merge resolution); ruff's rule set has no F811.
        # Self-test first so a rule regression fails before we trust it.
        run: |
          python scripts/lint_duplicate_definitions.py --self-test

      - name: Duplicate definitions (changed Python files)
        # Same merge-base reasoning as the import-hoist step above: diff the merge
        # base against the PR head SHA so the range is the PR's own commits and
        # not every base commit since the branch point.
        #
        # --diff-filter=ACMRT, not M: a bad resolution can just as easily land in a
        # file the PR adds, and a rename that also edits the file is reported as R
        # (R093 and so on), which an ACM filter would drop. T is there because a path
        # that changes TYPE -- a symlink replaced by a regular .py file -- is reported
        # as neither M nor A, so the newly active source reached the verifier as no
        # path at all and the step passed having checked nothing.
        #
        # The verifier scans BOTH revisions and compares findings by identity, so a
        # duplicate that was already in the file is printed and ignored while one
        # this PR introduced fails. Comparing added LINES instead would miss the
        # case where the new copy is inserted ABOVE the old one, since the finding
        # is reported at the second, unchanged definition. The whole-tree step below
        # catches pre-existing ones.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(gh api \
            "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --jq .merge_base_commit.sha)
          git fetch --no-tags --depth=1 origin "$MERGE_BASE"
          # refs/pull/N/head moves, so fetch it and then the pinned SHA, and refuse if it is still missing
          # rather than diffing an empty file list.
          git fetch --no-tags --depth=1 origin \
            "refs/pull/${{ github.event.pull_request.number }}/head"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA" 2>/dev/null || true
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::head commit $HEAD_SHA is not available locally; refusing to skip the check"
            exit 1
          fi
          # NUL-separated: core.quotePath would quote non-ASCII paths and hide their .py suffix.
          mapfile -d '' -t CHANGED < <(
            git diff -z --name-only --diff-filter=ACMRT \
              "$MERGE_BASE" "$HEAD_SHA" -- '*.py' \
              | grep -zvE '(^|/)(unsloth_compiled_cache|node_modules|build|dist)/' || true
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "no changed Python files to check"
            exit 0
          fi
          printf 'merge base: %s\n' "$MERGE_BASE"
          printf 'pr head:    %s\n' "$HEAD_SHA"
          printf 'checking %d file(s)\n' "${#CHANGED[@]}"
          python scripts/lint_duplicate_definitions.py \
            --before "$MERGE_BASE" --after "$HEAD_SHA" "${CHANGED[@]}"

      - name: Duplicate definitions (whole tree)
        # The diff-scoped step passes pre-existing findings, so the backlog regrew
        # to 38 while it was the only gate. Runs on push too.
        run: |
          python scripts/lint_duplicate_definitions.py \
            unsloth unsloth_cli studio scripts tests cli.py unsloth-cli.py

      - name: No silent llama-server parallel-slot downgrades
        # Launch fewer llama-server slots only for a real capability
        # or VRAM limit, marked '# allow-slot-clamp: <reason>'. Self-test first,
        # so a regression in the rule fails before we trust it on the tree.
        run: |
          python scripts/lint_no_parallel_clamp.py --self-test
          python scripts/lint_no_parallel_clamp.py

      - name: No duplicate TypeScript import bindings
        # A duplicated TS import (TS2300) breaks every frontend build and eslint is not run in CI.
        # Self-test first.
        run: |
          python scripts/lint_no_duplicate_ts_imports.py --self-test
          python scripts/lint_no_duplicate_ts_imports.py

      - name: No leftover debugger / pdb / breakpoint calls
        # AST-based so commented-out `# breakpoint()` markers do not match.
        run: |
          python <<'PY'
          import ast, pathlib, sys

          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "unsloth_compiled_cache", "node_modules",
                        "unsloth.egg-info"}

          bad = []
          scanned = 0
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              scanned += 1
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8", errors="replace"))
              except SyntaxError:
                  continue   # compileall step above already failed this
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  fn = node.func
                  if isinstance(fn, ast.Name) and fn.id == "breakpoint":
                      bad.append((path, node.lineno, "breakpoint()"))
                  elif (isinstance(fn, ast.Attribute) and fn.attr == "set_trace"
                        and isinstance(fn.value, ast.Name)
                        and fn.value.id in {"pdb", "ipdb"}):
                      bad.append((path, node.lineno, f"{fn.value.id}.set_trace()"))

          if bad:
              for path, lineno, what in bad:
                  print(f"::error file={path},line={lineno}::leftover {what} -- remove before merging")
              sys.exit(1)
          print(f"no leftover debugger calls (scanned {scanned} files)")
          PY

      - name: License-header drift (informational; whole repo)
        # Three header families are accepted across the repo:
        #   1. SPDX one-liner: `# SPDX-License-Identifier: ...`
        #   2. Apache-2.0 long form, marker phrase
        #      "Licensed under the Apache License". Used across unsloth/.
        #   3. GNU long form, marker phrase "General Public License", which covers GPL, LGPL and
        #      AGPL preambles (unsloth/kernels/*) without the SPDX line.
        # Empty files are skipped. Warning only until existing misses are cleaned up.
        continue-on-error: true
        run: |
          python <<'PY'
          import pathlib

          ACCEPTED = (
              "SPDX-License-Identifier",        # any SPDX line
              "Licensed under the Apache License",  # Apache-2.0 long form
              "General Public License",         # GPL / LGPL / AGPL long form
          )
          # "vendor" is upstream third-party source: it carries its own licence.
          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "unsloth_compiled_cache", "node_modules",
                        "unsloth.egg-info", "vendor"}

          studio_missing = []
          other_missing  = []
          for path in sorted(pathlib.Path(".").rglob("*.py")):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if not text.strip():
                  continue  # empty __init__.py etc.
              head = "\n".join(text.splitlines()[:25])
              if any(marker in head for marker in ACCEPTED):
                  continue
              if "studio" in path.parts:
                  studio_missing.append(path)
              else:
                  other_missing.append(path)

          total = len(studio_missing) + len(other_missing)
          if total == 0:
              print("every committed .py has a recognised license header")
          else:
              print(f"::warning::{total} Python files have no recognised license "
                    f"header (SPDX / Apache-2.0 / GNU long form): "
                    f"studio={len(studio_missing)}, other={len(other_missing)}")
              for path in (studio_missing + other_missing)[:30]:
                  print(f"  {path}")
              if total > 30:
                  print(f"  ... and {total - 30} more")
          PY

      - name: Shell scripts parse cleanly (`bash -n`)
        run: |
          shopt -s globstar
          fail=0
          for f in $(git ls-files '*.sh'); do
              if ! bash -n "$f"; then
                  echo "::error file=$f::shell parse error"
                  fail=1
              fi
          done
          if [ "$fail" -ne 0 ]; then
              exit 1
          fi
          n=$(git ls-files '*.sh' | wc -l)
          echo "$n shell scripts parse cleanly"

      - name: YAML files parse cleanly (yaml.safe_load)
        run: |
          python <<'PY'
          import pathlib, sys, yaml

          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "node_modules", "unsloth_compiled_cache",
                        "unsloth.egg-info"}

          bad = []
          scanned = 0
          for path in sorted(list(pathlib.Path(".").rglob("*.yml"))
                             + list(pathlib.Path(".").rglob("*.yaml"))):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              scanned += 1
              try:
                  with path.open("r", encoding="utf-8") as fh:
                      list(yaml.safe_load_all(fh))
              except Exception as exc:
                  bad.append((path, exc))

          if bad:
              for path, exc in bad:
                  print(f"::error file={path}::YAML parse failed: {exc}")
              sys.exit(1)
          print(f"{scanned} YAML files parse cleanly")
          PY

      - name: JSON files parse cleanly (json.loads)
        # Skips lockfiles and tsconfig*.json (JSONC, already validated by tsc in Frontend CI).
        run: |
          python <<'PY'
          import fnmatch, json, pathlib, sys

          SKIP_PARTS = {".venv", "venv", "build", "dist", ".git",
                        "node_modules", "unsloth_compiled_cache",
                        "unsloth.egg-info"}
          SKIP_NAMES = {"package-lock.json", "bun.lock"}
          SKIP_PATTERNS = ("tsconfig*.json",)

          bad = []
          scanned = 0
          for path in sorted(pathlib.Path(".").rglob("*.json")):
              if any(part in SKIP_PARTS for part in path.parts):
                  continue
              if path.name in SKIP_NAMES:
                  continue
              if any(fnmatch.fnmatch(path.name, pat) for pat in SKIP_PATTERNS):
                  continue
              scanned += 1
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append((path, exc))

          if bad:
              for path, exc in bad:
                  print(f"::error file={path}::JSON parse failed: {exc}")
              sys.exit(1)
          print(f"{scanned} JSON files parse cleanly")
          PY

      - name: codespell typo check (informational)
        # Skips lockfiles, generated/binary assets and LICENSE files. The ignore-words-list holds terms
        # codespell's default dictionary would otherwise flag
        # (e.g. `ans`, `parm`). Non-blocking until existing typos are fixed.
        continue-on-error: true
        run: |
          codespell \
            --skip='*.lock,*.lockb,*.json,*.svg,*.png,*.jpg,*.jpeg,*.gif,*.ico,*.woff*,*.ttf,*.eot,*.zip,*.gz,*.gguf,*.safetensors,*.bin,node_modules,.git,build,dist,unsloth_compiled_cache,unsloth.egg-info,target,studio/frontend/dist,*.pyc,*-licenses.txt,LICENSE*' \
            --ignore-words-list='ans,bu,hel,fo,te,ot,hist,ned,sav,recurser,datas,nin,parm,parms,checkin,nd,fr,inout,donot,uint' \
            --quiet-level=2

      - name: shellcheck on committed *.sh (informational)
        # Non-blocking until install.sh's existing patterns are cleaned up.
        continue-on-error: true
        run: |
          # SC1090: runtime-sourced paths cannot be followed. SC2034: install.sh's export-only assignments.
          shellcheck -e SC1090,SC2034 $(git ls-files '*.sh')

      - name: ruff format drift (informational)
        # Plain `ruff format --check` disagrees with scripts/run_ruff_format.py (kwarg spacing), so
        # non-blocking until that pipeline is wired in.
        continue-on-error: true
        run: |
          ruff format --check unsloth unsloth_cli studio tests cli.py unsloth-cli.py

      # Collects the background lanes; always(), and a missing .rc file counts as a failure.
      - name: Collect the absorbed suites
        if: always()
        run: |
          set -uo pipefail
          rc=0
          for name in load-orchestrator lockfile-audit; do
            # The lanes belong to another step's shell, so `wait` cannot see them; poll the sentinel.
            waited=0
            while [ ! -f ".lanes/$name.rc" ] && [ "$waited" -lt 240 ]; do
              sleep 2
              waited=$((waited + 2))
            done
            echo "::group::$name"
            cat "logs/lane-$name.log" 2>/dev/null || echo "(no log produced)"
            echo "::endgroup::"
            if [ ! -f ".lanes/$name.rc" ]; then
              echo "::error::$name never finished (no exit status after ${waited}s)"
              rc=1
              continue
            fi
            lane_rc=$(cat ".lanes/$name.rc")
            if [ "$lane_rc" != "0" ]; then
              echo "::error::$name failed with exit status $lane_rc"
              rc=1
            else
              echo "$name passed"
            fi
          done
          exit "$rc"
