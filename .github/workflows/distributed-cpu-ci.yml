# The multi-rank (gloo / FSDP2 / TP / PP / CP) shards of Repo tests (CPU), split out of
# studio-backend-ci.yml so they run only when something they import changes. They import
# unsloth, torch and sibling test modules, not studio, yet Backend CI's path list matched
# about 99% of commits, so they ran (and queued) on every Studio PR. The paths below are
# their import closure (tests/test_ci_repo_cpu_shards.py checks it stays covered). unsloth_zoo
# comes from git main, so the nightly run catches zoo drift that no path here can see.

name: Distributed CPU CI

on:
  pull_request:
    paths:
      - 'unsloth/**'
      # The multi-rank suites and the sibling test modules they import.
      - 'tests/test_fsdp*.py'
      - 'tests/test_*gloo*.py'
      - 'tests/test_tp_*.py'
      - 'tests/test_pp*.py'
      - 'tests/test_parallel*.py'
      - 'tests/test_block_swap_auto_ddp.py'
      - 'tests/test_context_parallel_rl.py'
      - 'tests/test_gc_skip_auto.py'
      - 'tests/test_native_resume_old_torch.py'
      - 'tests/test_ulysses_hybrid.py'
      # test_gguf_packed_parallel_gloo.py imports its GGUF writer and reference blocks from here.
      - 'tests/test_gguf_packed_lora.py'
      - 'tests/_*.py'
      - 'tests/_shared/**'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'pyproject.toml'
      # The install's requirements.
      - 'studio/backend/requirements/**'
      - '.github/actions/merge-ref-age/**'
      - '.github/workflows/distributed-cpu-ci.yml'
  push:
    branches: [main]
    paths:
      - 'unsloth/**'
      # The multi-rank suites and the sibling test modules they import.
      - 'tests/test_fsdp*.py'
      - 'tests/test_*gloo*.py'
      - 'tests/test_tp_*.py'
      - 'tests/test_pp*.py'
      - 'tests/test_parallel*.py'
      - 'tests/test_block_swap_auto_ddp.py'
      - 'tests/test_context_parallel_rl.py'
      - 'tests/test_gc_skip_auto.py'
      - 'tests/test_native_resume_old_torch.py'
      - 'tests/test_ulysses_hybrid.py'
      # test_gguf_packed_parallel_gloo.py imports its GGUF writer and reference blocks from here.
      - 'tests/test_gguf_packed_lora.py'
      - 'tests/_*.py'
      - 'tests/_shared/**'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'pyproject.toml'
      # The install's requirements.
      - 'studio/backend/requirements/**'
      - '.github/actions/merge-ref-age/**'
      - '.github/workflows/distributed-cpu-ci.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  # Same contract as studio-backend-ci.yml: on a PR a new push cancels the old run; on main a
  # running run finishes and only the newest pending one is kept
  # (tests/studio/test_main_runs_survive_merge_bursts.py).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  distributed-cpu-tests:
    # tests/conftest.py mocks torch.cuda.is_available for the import chain.
    name: Repo tests (CPU, ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Fork gloo ranks from a per-worker zygote that already imported unsloth (tests/_shared/rank_zygote.py).
      # rank_zygote: '0' opts out: fsdp2's ranks skip the conftest so forking gained nothing, and
      # gloo-tp-env lost a rank at init_process_group in 2 of 8 staging runs with forked ranks.
      UNSLOTH_TEST_RANK_ZYGOTE: ${{ matrix.rank_zygote || '1' }}
      # `split: k/n` runs part k of the selection, weighted by tests/_shared/shard_durations.json.
      UNSLOTH_TEST_SPLIT: ${{ matrix.split || '' }}
      UNSLOTH_TEST_RANK_ZYGOTE_STATS: /tmp/unsloth_rank_zygote_stats
      PYTEST_ADDOPTS: --durations=40
    strategy:
      # The multi-rank shards of Backend CI's Repo tests (CPU), moved here unchanged. Together with
      # studio-backend-ci.yml's repo-cpu-tests matrix every tests/ file lands in exactly one shard
      # (tests/test_ci_repo_cpu_shards.py reads both). fail-fast off to show every red shard.
      fail-fast: false
      matrix:
        include:
          # Native FSDP2's gloo tests spawn 2 to 4 ranks each: about ten minutes of this
          # runner on their own, which pushed the catch-all to the 2100 s step cap. They run
          # beside it instead.
          # They then grew to 2092 s of the same cap on their own (364 tests by 2026-10-28)
          # and were interrupted after passing, so they are split in two by file name: native_d
          # onwards is about 55% of the measured time, everything else about 45%. Each glob
          # must match a file, or bash hands pytest the literal pattern
          # (tests/test_ci_repo_cpu_shards.py checks both).
          - shard: fsdp2-1
            split: 1/2
            rank_zygote: '0'
            selection: >-
              tests/test_fsdp2_[!n]*.py
              tests/test_fsdp2_n[!a]*.py
              tests/test_fsdp2_native_[abc]*.py
          - shard: fsdp2-2
            split: 2/2
            rank_zygote: '0'
            selection: >-
              tests/test_fsdp2_[!n]*.py
              tests/test_fsdp2_n[!a]*.py
              tests/test_fsdp2_native_[abc]*.py
          # fsdp2-native then ran up to 1752 s of the cap (2026-11-26), so it is split by file name again:
          # d to r is 46% of its measured test time (881 of 1896 s on 4 workers), s onwards 54%. The
          # letters are spelled out so the split does not depend on the runner's collation.
          - shard: fsdp2-native-1
            split: 1/2
            selection: >-
              tests/test_fsdp2_native_[defghijklmnopqr]*.py
          - shard: fsdp2-native-2
            split: 2/2
            selection: >-
              tests/test_fsdp2_native_[defghijklmnopqr]*.py
          - shard: fsdp2-native-sz-1
            split: 1/2
            selection: >-
              tests/test_fsdp2_native_[!abcdefghijklmnopqr]*.py
          - shard: fsdp2-native-sz-2
            split: 2/2
            selection: >-
              tests/test_fsdp2_native_[!abcdefghijklmnopqr]*.py
          # The other multi-rank gloo suites (tensor, pipeline and context parallel, float8 and
          # fp8 under FSDP2) did the same again: with them the catch-all hit the 2100 s cap and was
          # interrupted at 74 to 98% on most runs. Locally on 4 cores they are 578 s of the
          # catch-all's 1258 s. The two globs are every *gloo* file except test_fs*, which is
          # fsdp2's: an explicit file root cannot be filtered by --ignore, so the split is done in
          # the globs themselves. A *gloo* file starting with d, i, m, s or u is rest-2's
          # (tests/test_[dimsu]*.py), so the first glob leaves those letters out.
          # #19527's test_cp_router_aux_gloo.py then made the test_cp_* files 59% of gloo's test time
          # (1510 of 2573 s measured), and gloo hit the cap at 287 tests on 2026-11-25. They get a
          # shard of their own; test_c[!p]* keeps test_context_parallel_*, and a test_cp[!_]* gloo
          # file matches neither and is reported dropped.
          # Ten expert parallel files and test_layout_portable_resume_gloo.py (2026-11-24 to 26) then
          # took gloo to its cap again on main (ddfe1bcd97, 70% at 2100 s); its passing runs were up
          # to 1588 s. They are 959 of the shard's 1889 s measured one file at a time, so they get
          # gloo-ep. test_lo* stays in gloo; a test_l[!ao]* gloo file matches neither and is reported dropped.
          - shard: gloo-1
            split: 1/3
            selection: >-
              tests/test_[!cdefilmpstu]*gloo*.py
              tests/test_c[!p]*gloo*.py
              tests/test_f[!s]*gloo*.py
              tests/test_lo*gloo*.py
              tests/test_parallel_[!c]*gloo*.py
          - shard: gloo-2
            split: 2/3
            selection: >-
              tests/test_[!cdefilmpstu]*gloo*.py
              tests/test_c[!p]*gloo*.py
              tests/test_f[!s]*gloo*.py
              tests/test_lo*gloo*.py
              tests/test_parallel_[!c]*gloo*.py
          - shard: gloo-3
            split: 3/3
            selection: >-
              tests/test_[!cdefilmpstu]*gloo*.py
              tests/test_c[!p]*gloo*.py
              tests/test_f[!s]*gloo*.py
              tests/test_lo*gloo*.py
              tests/test_parallel_[!c]*gloo*.py
          - shard: gloo-ep-1
            split: 1/3
            selection: >-
              tests/test_e*gloo*.py
              tests/test_la*gloo*.py
          - shard: gloo-ep-2
            split: 2/3
            selection: >-
              tests/test_e*gloo*.py
              tests/test_la*gloo*.py
          - shard: gloo-ep-3
            split: 3/3
            selection: >-
              tests/test_e*gloo*.py
              tests/test_la*gloo*.py
          - shard: gloo-cp-files-1
            split: 1/2
            selection: >-
              tests/test_cp_*gloo*.py
          - shard: gloo-cp-files-2
            split: 2/2
            selection: >-
              tests/test_cp_*gloo*.py
          # Gloo hit its 2100 s cap after 17886, 17930, DeepSeek-V4.1 tests; non-native TP files
          # split off.
          - shard: gloo-tp-env-1
            split: 1/4
            rank_zygote: '0'
            selection: >-
              tests/test_tp_[!n]*gloo*.py
          - shard: gloo-tp-env-2
            split: 2/4
            rank_zygote: '0'
            selection: >-
              tests/test_tp_[!n]*gloo*.py
          - shard: gloo-tp-env-3
            split: 3/4
            rank_zygote: '0'
            selection: >-
              tests/test_tp_[!n]*gloo*.py
          - shard: gloo-tp-env-4
            split: 4/4
            rank_zygote: '0'
            selection: >-
              tests/test_tp_[!n]*gloo*.py
          # Issue 16407 grew the cp gloo file to a third of the shard; each gloo test spawns 2 to 8
          # ranks, four at once peaked near 20 GB on a 16 GB runner, so 2 workers; test_p[!ap]*
          # matches no shard.
          # gloo-cp then ran up to 1937 s of its 2100 s cap (2026-11-26). Its pipeline parallel tests, 37% of the
          # file's test time (379 of 1015 s measured with 2 workers), moved to test_parallel_cp_pipeline_gloo.py
          # and run beside it, also on 2 workers. A test_parallel_c[!p]* or test_parallel_cp_[!cp]* gloo file
          # matches neither shard and is reported dropped.
          - shard: gloo-cp-1
            split: 1/3
            workers: 2
            selection: >-
              tests/test_parallel_cp_c*gloo*.py
          - shard: gloo-cp-2
            split: 2/3
            workers: 2
            selection: >-
              tests/test_parallel_cp_c*gloo*.py
          - shard: gloo-cp-3
            split: 3/3
            workers: 2
            selection: >-
              tests/test_parallel_cp_c*gloo*.py
          - shard: gloo-cp-pipeline
            workers: 2
            selection: >-
              tests/test_parallel_cp_p*gloo*.py
          # Pipeline parallel growth (15655, 15656, 16167, 16417) hit the 2100 s cap, so TP and PP
          # split; a gloo file named test_t[!p]* or test_tp[!_]* matches no shard and is reported
          # dropped.
          - shard: gloo-tp-1
            split: 1/2
            selection: >-
              tests/test_tp_n*gloo*.py
          - shard: gloo-tp-2
            split: 2/2
            selection: >-
              tests/test_tp_n*gloo*.py
          # gloo-pp then ran 1324 to 1764 s of its 2100 s cap on a 4 vCPU runner (2026-11-25) and was
          # interrupted at about 2095 s with some 200 of 223 tests done on slower ones; four workers
          # spawning 2 to 4 ranks each oversubscribe the runner. test_pp_env_gloo.py is 64% of the
          # shard's test time (1681 of 2640 s measured), so it gets a runner of its own. Any other
          # test_pp_e* or test_pp[!_]* gloo file matches neither shard and is reported dropped.
          - shard: gloo-pp-1
            split: 1/4
            selection: >-
              tests/test_pp_[!e]*gloo*.py
              tests/test_pp_env_[!g]*gloo*.py
          - shard: gloo-pp-2
            split: 2/4
            selection: >-
              tests/test_pp_[!e]*gloo*.py
              tests/test_pp_env_[!g]*gloo*.py
          - shard: gloo-pp-3
            split: 3/4
            selection: >-
              tests/test_pp_[!e]*gloo*.py
              tests/test_pp_env_[!g]*gloo*.py
          - shard: gloo-pp-4
            split: 4/4
            selection: >-
              tests/test_pp_[!e]*gloo*.py
              tests/test_pp_env_[!g]*gloo*.py
          - shard: gloo-pp-env-1
            split: 1/3
            selection: >-
              tests/test_pp_env_gloo.py
          - shard: gloo-pp-env-2
            split: 2/3
            selection: >-
              tests/test_pp_env_gloo.py
          - shard: gloo-pp-env-3
            split: 3/3
            selection: >-
              tests/test_pp_env_gloo.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # No pip cache, node or ruff-unsloth here, unlike Backend CI's repo-cpu-tests: uv installs every
      # package below without reading pip's cache, which then only served `pip install uv` and took 5 to
      # 16 s to restore, and no multi-rank test runs node or ruff. All 31 jobs paid for each step. The
      # install itself stays identical to Backend CI's (tests/test_ci_repo_cpu_shards.py).
      - name: Install uv (the installer of the next step)
        run: pip install uv

      # Backend CI's install minus sentence-transformers (tests/test_ci_repo_cpu_shards.py checks the rest is
      # identical). It is there for tests/test_st_modules_json_trust_gate.py, not a multi-rank test, and the
      # scikit-learn and scipy it pulls in are imported by transformers in every process: about 2.7 of 13.5
      # CPU s per `import unsloth`, which every rank of every test here pays.
      - name: Install deps (shared shape with backend pytest job)
        env:
          # uv installs exactly what pip installed here (same packages and versions, checked by
          # comparing pip freeze): unsafe-best-match picks across both indexes the way pip's
          # --extra-index-url does, and bytecode is compiled like pip's. uv's cache stays in the
          # runner's temp dir: it is never saved, so the pip cache family keeps what it held.
          UV_INDEX_STRATEGY: unsafe-best-match
          UV_COMPILE_BYTECODE: '1'
          UV_LINK_MODE: copy
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          # No uv.toml or user config may add an index or change how it resolves.
          UV_NO_CONFIG: '1'
        run: |
          python -m pip install --upgrade pip
          uv pip install --system -r studio/backend/requirements/studio.txt
          uv pip install --system \
            python-multipart aiofiles sqlalchemy cryptography psutil \
            pyyaml jinja2 mammoth unpdf requests typer \
            'numpy<3' 'pytest<9.2' pytest-asyncio pytest-xdist pytest-timeout httpx
          # pytest<9.2: see the first install step. pytest-timeout names a hung test instead of a `cancelled` job.
          # torchvision: unsloth_zoo.vision_utils imports it at module scope.
          uv pip install --system --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11' 'torchvision<0.26' 'torchaudio<2.11'
          uv pip install --system 'transformers>=4.51,<=5.18.0'
          # bitsandbytes: hard import in unsloth/models/_utils.py; recent versions import on CPU.
          uv pip install --system 'bitsandbytes>=0.45'
          # zoo from git main (needed by the conftest preload), with deps so triton is installed.
          for attempt in 1 2 3; do
            if uv pip install --system "unsloth_zoo @ git+https://github.com/unslothai/unsloth-zoo"; then
              break
            fi
            [ "$attempt" -eq 3 ] && { echo "::error::unsloth_zoo install failed after 3 attempts"; exit 1; }
            sleep $((5 * attempt))
          done
          uv pip install --system -e . --no-deps

      - name: Repo tests (CPU, auto-discovered)
        env:
          # tests/python/* import install_python_stack from studio/.
          PYTHONPATH: ${{ github.workspace }}/studio
          UNSLOTH_COMPILE_DISABLE: '1'
        # Spoofing and load_freeze files run isolated below: hardware-spoof files mutate module
        # globals. The outer timeout must fire before the job cap. --timeout-method=thread: see the backend shards.
        run: |
          timeout --signal=INT --kill-after=60 2100 \
          python -m pytest ${{ matrix.selection }} -q -rs --tb=short -n ${{ matrix.workers || 4 }} --dist loadgroup --max-worker-restart=0 --timeout=330 --timeout-method=thread -o faulthandler_timeout=300 \
            -m 'not server and not e2e'

      - name: How the ranks started (forked from the zygote, or spawned again and why)
        if: always()
        run: python tests/_shared/rank_zygote.py --summary /tmp/unsloth_rank_zygote_stats

      - name: Processes the kernel killed for memory
        if: failure()
        run: sudo dmesg -T | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true

      - name: Why a failure here might already be fixed on the base branch
        # Only on failure; the action reports when the base branch moved since the merge ref.
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/merge-ref-age
