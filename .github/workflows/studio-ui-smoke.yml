# End-to-end Unsloth chat UI smoke via Playwright + Chromium against a
# headless Linux runner. Boots Unsloth with the smallest GGUF
# (gemma-3-270m-it UD-Q4_K_XL, ~254 MiB), drives the actual frontend
# bundle, and asserts the full bootstrap-password / change-password /
# send-message / persist-on-reload journey works end to end.
#
# This is the only workflow that catches regressions in the wiring
# between the React frontend and the FastAPI backend, e.g. assistant-ui
# version drift, /api/auth response shape changes, runtime-provider
# regressions, or chat-history persistence breaking. Backend-only and
# frontend-only CI happily pass while the actual user-visible UI is
# broken (cf. the 2026.5.1 chat-history release).

name: Unsloth UI CI

on:
  pull_request:
    paths:
      - 'studio/**'
      - 'unsloth/**'
      - 'unsloth_cli/**'
      - 'install.sh'
      - 'pyproject.toml'
      # The Playwright test files themselves -- a PR that ONLY edits
      # the test must still trigger UI CI.
      - 'tests/studio/**'
      - '.github/scripts/run-studio-permission-browser.sh'
      - '.github/scripts/run-studio-indicator-browser.sh'
      - '.github/workflows/studio-ui-smoke.yml'
      # Every server boot in this workflow shells out to that script, so an edit
      # to it changes what this workflow actually runs.
      - '.github/scripts/boot-studio-api-only.sh'
      # Same for the /api/health wait that runs after a boot.
      - '.github/scripts/wait-for-health.sh'
      # The install step in this workflow is `uses:` on that composite action,
      # so an edit to the action changes what this workflow actually runs.
      - '.github/actions/install-unsloth-local/action.yml'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Unique per commit on main, so a merge burst cannot cancel a pending run
  # before it starts. See the note below for what this is buying.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # On a PR branch: latest-only, which is what cancel-in-progress buys.
  #
  # On main it buys less than it looks like. GitHub cancels any PENDING run in a
  # concurrency group as soon as a newer one is queued, and cancel-in-progress
  # governs only runs that are already EXECUTING ("any existing pending job or
  # workflow in the same concurrency group will be canceled", workflow-syntax docs).
  # So a burst of merges leaves only the tip's run alive: on 2026-08-17 four merges
  # in 37 minutes cancelled three consecutive main runs of this workflow and none
  # completed. Detection survives on the tip, since the tree is cumulative;
  # per-commit attribution does not.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ui-smoke:
    name: Chat UI Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Was 30, for one job that ran everything below in sequence and landed at 22m30s of
    # its previous 25, taking the banner step over the edge and leaving the three image
    # steps unrun. Each shard now carries a quarter of that.
    timeout-minutes: 20
    strategy:
      # Four shards, split where the job already split itself.
      #
      # This is 11 Playwright scripts run one after another against four Studios booted
      # one after another, and at 22.1 minutes on average it was the largest job in the
      # repo. The setup every shard has to repeat is small -- checkout, Linux deps,
      # Install Unsloth, Playwright browsers, about 2.6 minutes -- so splitting it is
      # nearly all profit in wall-clock, which is the thing being optimised. Runner
      # minutes go up. That is the trade, taken deliberately.
      #
      # The boundaries are the Studio instances, not an even division of scripts: a
      # Studio boot, its health wait, its bootstrap password and the scripts that drive
      # it have to stay on one machine. So `chat` takes 18892 and the cross-browser
      # permission pass, `extra` and `banner` each boot their own 18894 (the two banner
      # engines alone were 7.25 of the 17.6 minutes, which is why they are a shard), and
      # `picker` takes 18898 and 18896, which are small and adjacent.
      #
      # In-machine parallelism is deliberately NOT used here. These are separate runners,
      # so each still boots one Studio at a time and nothing competes for RAM.
      fail-fast: false
      matrix:
        shard: [chat, extra, banner, picker]
    env:
      GGUF_REPO: unsloth/gemma-3-270m-it-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GGUF_FILE: gemma-3-270m-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18892'
      HF_HOME: ${{ github.workspace }}/hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev jq

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Static reads, so it runs first and fails fast; nothing else runs it.
      - name: Playwright locator contract (static)
        if: matrix.shard == 'chat'
        run: |
          python -m pip install --quiet 'pytest>=8'
          python -m pytest tests/studio/test_stt_model_search_locator_contract.py -q

      # Cross-OS shared entry. The tree under `hf-cache` is byte-identical on
      # Linux, macOS and Windows, so the key carries no `runner.os`, and
      # enableCrossOsArchive lets Windows (which tars with --force-local) join it.
      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        id: cache-hf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        # Save on main only. Caches created on a PR ref are scoped to that
        # merge ref -- per GitHub's docs they "can only be restored by re-runs
        # of the pull request" -- while every PR *can* restore from the default
        # branch. So a PR-scoped save helps almost nothing and competes for the
        # 10GB per-repo budget, and when that budget is exceeded GitHub evicts
        # by least-recently-used, which deletes main's copies that all PRs share.
        # This repo was measured at 33.3GB across 30 caches, 3.3x over, with the
        # same 4.6GB model held four times on four different PR refs and no copy
        # on main at all. That is the thrash loop: PR misses -> downloads ->
        # saves its own copy -> evicts main's -> next PR misses.
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Pin the Playwright version so the browser cache has a key
        id: pw
        run: |
          pip install 'playwright>=1.45'
          echo "version=$(python -c 'import playwright; from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Three browser engines, downloaded on every job, on every run, uncached. It was
      # 0.75 minutes when one job needed them; with four shards it is four times that,
      # and it sits on the critical path of each one.
      #
      # Keyed on the resolved Playwright version because that is what decides which
      # browser builds are wanted: a floating '>=1.45' that resolves higher must not hit
      # a cache holding the older engines.
      - name: Restore the Playwright browser cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-cfw-v1

      - name: Install Playwright browsers
        # --with-deps stays unconditional: the apt side installs system libraries OUTSIDE
        # the cached directory, so a restored cache without it gives browsers that cannot
        # start. Only the download is skipped, which is the part that costs.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium firefox webkit
          else
            python -m playwright install --with-deps chromium firefox webkit
          fi

      - name: Reset auth + boot Unsloth
        if: matrix.shard == 'chat'
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT"

      - name: Wait for /api/health
        if: matrix.shard == 'chat'
        # The 180 s deadline lives in wait-for-health.sh, along with the
        # reason for it: a cold runner with venv warm-up + lazy imports
        # has been seen to exceed 60 s.
        run: |
          bash .github/scripts/wait-for-health.sh --port "$STUDIO_PORT"

      - name: Pass bootstrap password to the Playwright step
        if: matrix.shard == 'chat'
        # The Playwright test does its OWN /change-password through the
        # UI (Setup your account / Choose a new password), then loads
        # the model via page.evaluate against /api/inference/load with
        # the JWT it got from change-password. So the only thing we
        # have to hand it is the bootstrap password (so it can verify
        # post-rotation that the OLD bootstrap pw now returns 401).
        #
        # NEW + NEW2 are generated freshly per CI run via secrets.token_urlsafe
        # rather than hardcoded. If a workflow gets compromised, the
        # attacker can't replay a known-good rotated password against
        # any future / parallel Unsloth install -- the rotated value
        # only ever exists for the lifetime of this single job, masked
        # in the log via ::add-mask::.
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          NEW2="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          echo "::add-mask::$NEW2"
          echo "STUDIO_OLD_PW=$OLD"   >> "$GITHUB_ENV"
          echo "STUDIO_NEW_PW=$NEW"   >> "$GITHUB_ENV"
          echo "STUDIO_NEW2_PW=$NEW2" >> "$GITHUB_ENV"

      - name: Drive the chat UI with Playwright
        if: matrix.shard == 'chat'
        env:
          BASE_URL: http://127.0.0.1:18892
          # The test file lives in the repo so it can be run locally
          # against a freshly-installed Unsloth (BASE_URL=...; STUDIO_OLD_PW=
          # $(cat ~/.unsloth/studio/auth/.bootstrap_password); python ...).
          PW_ART_DIR: logs/playwright
          # Strict mode: in CI a missing button / nav / dialog must
          # FAIL the test. Locally the test still runs against partial
          # Unsloth installs without STUDIO_UI_STRICT.
          STUDIO_UI_STRICT: '1'
        run: |
          mkdir -p logs/playwright
          python tests/studio/playwright_chat_ui.py

      - name: Stop Unsloth (chat-ui ends with Shutdown click; this is belt-and-suspenders)
        if: (always()) && (matrix.shard == 'chat')
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2

      - name: Cross-browser permission controls
        if: matrix.shard == 'chat'
        run: |
          bash .github/scripts/run-studio-permission-browser.sh 18893 firefox
          bash .github/scripts/run-studio-permission-browser.sh 18893 webkit
          bash .github/scripts/run-studio-permission-browser.sh 18893 chromium chrome

      # The chat UI test ends by clicking the Shutdown menuitem, which
      # leaves the server dead. The extra UI test (Compare / Recipes /
      # Export / Unsloth / Settings) needs a fresh Unsloth, so we boot a
      # second one on a different port. Boot is fast (~3-5s on the
      # warm install we already did) so this adds little wall time.
      - name: Reset auth + boot Unsloth for extra UI tests (port 18894)
        if: matrix.shard == 'extra' || matrix.shard == 'banner'
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18894 --log logs/studio_extra.log --pid-var STUDIO_EXTRA_PID

      - name: Wait for /api/health on 18894
        if: matrix.shard == 'extra' || matrix.shard == 'banner'
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18894 --log logs/studio_extra.log --tmp /tmp/health2.json

      - name: Pass bootstrap pw for extra UI test
        if: matrix.shard == 'extra' || matrix.shard == 'banner'
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIUiExtra-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          echo "STUDIO_EXTRA_OLD_PW=$OLD" >> "$GITHUB_ENV"
          echo "STUDIO_EXTRA_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: Drive Compare/Recipes/Export/Unsloth/Settings with Playwright
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_extra
          STUDIO_UI_STRICT: '1'
          GGUF_REPO: ${{ env.GGUF_REPO }}
          GGUF_VARIANT: ${{ env.GGUF_VARIANT }}
        run: |
          mkdir -p logs/playwright_extra
          python tests/studio/playwright_extra_ui.py

      - name: Per-chat settings persistence (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_thread_settings
        run: |
          mkdir -p logs/playwright_thread_settings
          python tests/studio/playwright_thread_scoped_settings.py

      - name: UI font size scaling regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_fontscale
        run: |
          mkdir -p logs/playwright_fontscale
          python tests/studio/playwright_ui_font_scale.py

      - name: Update banner layout regression (Playwright)
        if: matrix.shard == 'banner'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_update_banner
        run: |
          mkdir -p logs/playwright_update_banner
          python tests/studio/playwright_update_banner_layout.py

      # Firefox and WebKit at the viewports that reproduce, and nothing else:
      # the card's floor and the action row's wrap threshold are measurements,
      # and the three engines do not agree on font metrics or on whether a
      # scrollbar takes width out of the box it sits on. WebKit is the closest
      # this runner gets to Safari. Cut down to `spot` because a third full
      # pass would spend minutes re-answering the first pass's questions.
      - name: Update banner layout, other engines (Playwright)
        if: matrix.shard == 'banner'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_update_banner
          STUDIO_UI_BANNER_SCOPE: spot
        run: |
          for engine in firefox webkit; do
            STUDIO_PLAYWRIGHT_BROWSER="$engine" \
              python tests/studio/playwright_update_banner_layout.py
          done

      - name: Image model full-footprint selector regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_image_footprint
        run: |
          mkdir -p logs/playwright_image_footprint
          python tests/studio/playwright_image_model_footprint.py

      - name: Image staged-download cancel/retry regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_image_cancel_retry
        run: |
          mkdir -p logs/playwright_image_cancel_retry
          python tests/studio/playwright_image_download_cancel_retry.py

      # Same drive with the checkpoint absent, so the plan stages two entries instead of one and
      # the queue's ordering and cancellation are covered as well as the single-entry path.
      - name: Image staged-download cancel/retry regression, cold checkpoint (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_image_cancel_retry_cold
          PW_CHECKPOINT_CACHED: "0"
        run: |
          mkdir -p logs/playwright_image_cancel_retry_cold
          python tests/studio/playwright_image_download_cancel_retry.py

      - name: Stop second Unsloth
        if: (always()) && (matrix.shard == 'extra' || matrix.shard == 'banner')
        run: |
          kill "${STUDIO_EXTRA_PID}" 2>/dev/null || true
          sleep 2

      # Model-picker per-model-config regression (PR #7207 re-land of #6647).
      # Fourth Unsloth on its own port; loads the tiny GGUF and drives the
      # picker's run-settings surface: Context Length persists across a reload,
      # Reset clears the stored override (never pins it), and the infra models
      # (RAG embedder + llama.cpp probe) stay hidden from the picker.
      - name: Reset auth + boot Unsloth for model-config tests (port 18898)
        if: matrix.shard == 'picker'
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18898 --log logs/studio_modelcfg.log --pid-var STUDIO_MODELCFG_PID

      - name: Wait for /api/health on 18898
        if: matrix.shard == 'picker'
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18898 --log logs/studio_modelcfg.log --tmp /tmp/health4.json

      - name: Pass bootstrap pw for model-config test
        if: matrix.shard == 'picker'
        run: |
          NEW="CIModelCfg-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$NEW"
          echo "STUDIO_MODELCFG_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: Drive model-picker per-model-config with Playwright
        if: matrix.shard == 'picker'
        env:
          BASE_URL: http://127.0.0.1:18898
          STUDIO_NEW_PW: ${{ env.STUDIO_MODELCFG_NEW_PW }}
          PW_ART_DIR: logs/playwright_modelcfg
          STUDIO_UI_STRICT: '1'
          GGUF_REPO: ${{ env.GGUF_REPO }}
          GGUF_VARIANT: ${{ env.GGUF_VARIANT }}
          STUDIO_MODEL_HINT: gemma-3-270m
        run: |
          mkdir -p logs/playwright_modelcfg
          python tests/studio/playwright_model_config.py

      - name: Stop fourth Unsloth
        if: (always()) && (matrix.shard == 'picker')
        run: |
          kill "${STUDIO_MODELCFG_PID}" 2>/dev/null || true
          sleep 2

      # IME + multilingual paste regression (issue #5318 / PR #5327).
      # Third Unsloth on its own port so a hang here cannot poison the
      # earlier UI tests. No GGUF -- the bug surface is the composer.
      - name: Reset auth + boot Unsloth for IME / i18n tests (port 18896)
        if: matrix.shard == 'picker'
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18896 --log logs/studio_ime.log --pid-var STUDIO_IME_PID

      - name: Wait for /api/health on 18896
        if: matrix.shard == 'picker'
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18896 --log logs/studio_ime.log --tmp /tmp/health3.json

      - name: Pass bootstrap pw for IME / i18n test
        if: matrix.shard == 'picker'
        # IME smoke does the change-password against the bootstrap that
        # Unsloth's frontend injects into the page, so it only needs the
        # NEW password.
        run: |
          NEW="CIIme-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$NEW"
          echo "STUDIO_IME_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: Drive IME + multilingual paste regression with Playwright
        if: matrix.shard == 'picker'
        env:
          BASE_URL: http://127.0.0.1:18896
          STUDIO_NEW_PW: ${{ env.STUDIO_IME_NEW_PW }}
          PW_ART_DIR: logs/playwright_ime
          STUDIO_UI_STRICT: '1'
        run: |
          mkdir -p logs/playwright_ime
          python tests/studio/playwright_chat_ime_i18n.py

      - name: Stop third Unsloth
        if: (always()) && (matrix.shard == 'picker')
        run: |
          kill "${STUDIO_IME_PID}" 2>/dev/null || true
          sleep 2
          # Capture backend + llama-server logs (all three Studios share this
          # dir) so a stray 500 has a server-side traceback.
          mkdir -p logs/server-logs
          cp -r ~/.unsloth/studio/logs/. logs/server-logs/ 2>/dev/null || true

      - name: Upload Playwright artifacts
        # Always upload so a green run's screenshots stay reviewable --
        # catches "passed but the UI is silently broken" regressions.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Per shard: artifacts are immutable within a run, so four cells uploading one
          # name means the first wins and the other three fail the step. It carries
          # if: always() and no continue-on-error, so that would turn passing UI runs red.
          name: studio-ui-smoke-artifacts-${{ matrix.shard }}
          path: |
            logs/studio.log
            logs/studio_extra.log
            logs/studio_modelcfg.log
            logs/studio_ime.log
            logs/install.log
            logs/server-logs/
            logs/playwright
            logs/playwright-permissions-*
            logs/playwright_extra
            logs/playwright_thread_settings
            logs/playwright_fontscale
            logs/playwright_update_banner
            logs/playwright_image_footprint
            logs/playwright_image_cancel_retry
            logs/playwright_image_cancel_retry_cold
            logs/playwright_modelcfg
            logs/playwright_ime
            logs/studio-permissions-*.log
          # 1 day, matching the repository-wide cap. A larger value here is
          # silently clamped to that cap today, so stating 7 only invites the
          # artifacts to re-inflate if the cap is ever raised.
          retention-days: 1

  ui-indicator:
    name: Loaded-models indicator (cross-browser)
    runs-on: ubuntu-latest
    # Its own job, not a step in ui-smoke, because it was 853s of that job's 30
    # minute limit -- three browser engines at ~4.7 minutes each -- and it pushed
    # the five Playwright steps after it past the limit. Those steps did not fail;
    # they never ran, on any PR, while the job reported a plain red timeout that
    # said nothing about the PR. That is the second time this workflow has lost
    # steps that way (the limit already went 25 -> 30 for the same reason), so
    # this time the work moves off the critical path instead of the limit moving
    # again.
    #
    # No HF cache and no GGUF here: the suite stubs the four /status reads with
    # page.route, so it needs no model, no GPU and no llama.cpp build. That is
    # also what lets it replay the AMD / Apple / CPU-only payload shapes this
    # runner never sees. What it does need is a real browser: the indicator
    # restores an absolute viewport position from localStorage, and a stored
    # position from a wider screen once left the card off screen with its own
    # drag handle and collapse button unreachable, which only a real layout and
    # a real ResizeObserver can catch.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev jq
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Pin the Playwright version so the browser cache has a key
        id: pw
        run: |
          pip install 'playwright>=1.45'
          echo "version=$(python -c 'import playwright; from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Three browser engines, downloaded on every job, on every run, uncached. It was
      # 0.75 minutes when one job needed them; with four shards it is four times that,
      # and it sits on the critical path of each one.
      #
      # Keyed on the resolved Playwright version because that is what decides which
      # browser builds are wanted: a floating '>=1.45' that resolves higher must not hit
      # a cache holding the older engines.
      - name: Restore the Playwright browser cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-cfw-v1

      - name: Install Playwright browsers
        # --with-deps stays unconditional: the apt side installs system libraries OUTSIDE
        # the cached directory, so a restored cache without it gives browsers that cannot
        # start. Only the download is skipped, which is the part that costs.
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium firefox webkit
          else
            python -m playwright install --with-deps chromium firefox webkit
          fi

      - name: Cross-browser loaded-models indicator
        run: |
          bash .github/scripts/run-studio-indicator-browser.sh 18899 chromium
          bash .github/scripts/run-studio-indicator-browser.sh 18899 firefox
          bash .github/scripts/run-studio-indicator-browser.sh 18899 webkit

      - name: Upload Playwright artifacts
        # Always, so a green run's screenshots stay reviewable: this suite is
        # about what the card LOOKS like, and it can pass while it looks wrong.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studio-ui-indicator-artifacts
          path: |
            logs/playwright-indicator-*
            logs/studio-indicator-*.log
          retention-days: 1
