# End-to-end chat UI smoke via Playwright against a headless Linux Unsloth.

name: Unsloth UI CI

on:
  pull_request:
    paths:
      # Not studio/** or unsloth/**: the install is --no-torch and src-tauri is never built.
      - 'studio/backend/**'
      - 'studio/frontend/**'
      - 'studio/setup.sh'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'unsloth_cli/**'
      - 'install.sh'
      - 'pyproject.toml'
      # Directory glob asserted by test_stt_model_search_locator_contract.py.
      # Only the tests/ files the jobs execute.
      - 'tests/studio/playwright_*.py'
      - 'tests/studio/_playwright_robust.py'
      - 'tests/studio/test_stt_model_search_locator_contract.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'tests/_shared/**'
      - '.github/scripts/run-studio-permission-browser.sh'
      - '.github/scripts/run-studio-indicator-browser.sh'
      # Reached by the installers this workflow triggers on.
      - 'studio/nvidia_probe.py'
      - '.github/workflows/studio-ui-smoke.yml'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/retry-with-apt-lock.sh'
      # The install step in this workflow is `uses:` on that composite action.
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
  push:
    branches: [main]
    paths:
      - 'studio/backend/**'
      - 'studio/frontend/**'
      - 'studio/setup.sh'
      - 'studio/install_*.py'
      - 'studio/node_prebuilt_pins.json'
      - 'studio/prebuilt_core.py'
      - 'studio/install_manifest.py'
      - 'unsloth_cli/**'
      - 'install.sh'
      - 'pyproject.toml'
      # Only the tests/ files the jobs execute.
      - 'tests/studio/playwright_*.py'
      - 'tests/studio/_playwright_robust.py'
      - 'tests/studio/test_stt_model_search_locator_contract.py'
      - 'tests/conftest.py'
      - 'tests/__init__.py'
      - 'tests/_shared/**'
      - '.github/scripts/run-studio-permission-browser.sh'
      - '.github/scripts/run-studio-indicator-browser.sh'
      - 'studio/nvidia_probe.py'
      - '.github/workflows/studio-ui-smoke.yml'
      - '.github/scripts/boot-studio-api-only.sh'
      - '.github/scripts/wait-for-health.sh'
      - '.github/scripts/hf-download-with-retry.sh'
      - '.github/scripts/retry-with-apt-lock.sh'
      - '.github/actions/install-unsloth-local/action.yml'
      - '.github/actions/frontend-dist-restore/action.yml'
      - '.github/actions/frontend-dist-save/action.yml'
      - '.github/actions/uv-cache-restore/action.yml'
      - '.github/actions/uv-cache-save/action.yml'
  workflow_dispatch:

concurrency:
  # Unique per commit on main, so a merge burst cannot cancel a pending run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # GitHub cancels PENDING runs in a group regardless; cancel-in-progress only governs
  # executing ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ui-smoke:
    name: Chat UI Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Do not tighten: a timeout is for hangs, and runner stalls would turn into red builds.
    timeout-minutes: 30
    strategy:
      # Shard boundaries are the Unsloth instances: a boot, its password and its scripts stay
      # on one runner. One Unsloth at a time per runner.
      fail-fast: false
      matrix:
        # Must stay a list: test_chat_ui_shards_cover_everything reads it.
        shard: [chat, extra]
        # include: entries add engines to existing shards. `extra` is chromium-only, so it skips
        # webkit's ~100 MB of apt (test_ui_shard_engines.py).
        include:
          - shard: chat      # permission controls + banner "other engines" drive all three
            engines: chromium firefox webkit
            engine_key: cfw
          - shard: extra
            engines: chromium
            engine_key: c
    env:
      GGUF_REPO: unsloth/gemma-3-270m-it-GGUF
      GGUF_VARIANT: UD-Q4_K_XL
      GGUF_FILE: gemma-3-270m-it-UD-Q4_K_XL.gguf
      STUDIO_PORT: '18892'
      HF_HOME: ${{ github.workspace }}/hf-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps
        # Bounded and retried: an apt stall is silent and the run reports `cancelled`.
        # The job's 30 stays the backstop.
        timeout-minutes: 20
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        # One call: retrying install after a stalled update re-reads the same broken lists.
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Playwright locator contract (static)
        if: matrix.shard == 'chat'
        run: |
          python -m pip install --quiet 'pytest>=8'
          python -m pytest tests/studio/test_stt_model_search_locator_contract.py -q

      # Cross-OS key: the hf-cache tree is byte-identical on every OS.
      - name: Restore HF_HOME for ${{ env.GGUF_REPO }}
        id: cache-hf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Prime HF_HOME with the GGUF
        id: prime-hf
        if: steps.cache-hf.outputs.cache-hit != 'true' || steps.cache-hf.outcome != 'success'
        env:
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          HF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}
        run: |
          python -m pip install --upgrade huggingface_hub
          mkdir -p hf-cache
          bash .github/scripts/hf-download-with-retry.sh "$GGUF_REPO" "$GGUF_FILE"
          bash .github/scripts/hf-download-with-retry.sh ggml-org/models tinyllamas/stories260K.gguf

      - name: Save HF_HOME for ${{ env.GGUF_REPO }}
        # Save on main only: PR-scoped caches only serve that PR and evict main's shared copies
        # from the near-full repo cache budget.
        if: always() && github.ref == 'refs/heads/main' && steps.prime-hf.outcome == 'success' && hashFiles('hf-cache/**/*.gguf') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: hf-cache
          key: hf-${{ env.GGUF_REPO }}-${{ env.GGUF_VARIANT }}-v3
          enableCrossOsArchive: true

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code; public GGUF still downloads.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Pin the Playwright version so the browser cache has a key
        id: pw
        run: |
          pip install 'playwright>=1.45,<2'
          echo "version=$(python -c 'import playwright; from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved Playwright version, which decides the browser builds.
      - name: Restore the Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.engine_key }}-v2

      - name: Restore the apt archive cache (webkit's .deb set)
        id: apt-cache
        # Caches the .debs for the engines' system libraries, keyed on the runner image.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: apt-archives-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ matrix.engine_key }}-v1

      - name: Install Playwright browsers
        id: pw-install
        # CDN download and apt are separate helper calls, each with its own retry budget:
        # 2 x 300s plus lock wait, twice, fits the job's 30.
        timeout-minutes: 25
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '300'
          # install-deps runs its own `apt-get update`; apt's internal retries are invisible and
          # charged to our budget, so the outer attempt loop owns resilience.
          APT_ACQUIRE_RETRIES: '0'
        run: |
          # No --with-deps: it runs its own unbounded `apt-get update`.
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install ${{ matrix.engines }}
          fi

          # Probe whether the system libraries are actually missing before running apt.
          probe() {
            python - "$@" <<'PY'
          import sys
          from playwright.sync_api import sync_playwright

          missing = []
          with sync_playwright() as p:
              for name in sys.argv[1:]:
                  try:
                      browser = getattr(p, name).launch()
                      browser.close()
                  except Exception as exc:
                      missing.append(f"{name}: {type(exc).__name__}")
          if missing:
              print("engines that will not start: " + "; ".join(missing))
              sys.exit(1)
          print("all three engines launch; system libraries are present")
          PY
          }

          if probe ${{ matrix.engines }}; then
            echo "::notice::skipped playwright install-deps; the runner image already has the libraries"
          else
            echo "system libraries are missing, installing them"
            # Reuse last run's .debs; apt re-fetches any that do not match its index.
            if [ -d "${{ github.workspace }}/.apt-archives" ]; then
              sudo cp "${{ github.workspace }}"/.apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
              echo "seeded $(ls "${{ github.workspace }}"/.apt-archives/*.deb 2>/dev/null | wc -l) cached .deb files"
            fi
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install-deps ${{ matrix.engines }}
            mkdir -p "${{ github.workspace }}/.apt-archives"
            sudo cp /var/cache/apt/archives/*.deb "${{ github.workspace }}/.apt-archives/" 2>/dev/null || true
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/.apt-archives" || true
            # Fail loudly here rather than as an opaque per-test timeout later.
            probe ${{ matrix.engines }}
          fi

      # Main only, and only after the install succeeded: the key is immutable, so a partial
      # download saved once would break every later run.
      - name: Save the apt archive cache
        if: >-
          github.ref == 'refs/heads/main'
          && steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Save the Playwright browser cache
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.pw-cache.outputs.cache-hit != 'true'
          && steps.pw-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.engine_key }}-v2

      - name: Drive MTP companion download visibility
        if: matrix.shard == 'extra'
        env:
          PW_SIDE: AFTER
          PW_ART_DIR: logs/playwright_mtp
        run: |
          # A restored dist does not include the dependencies for the Vite fixture.
          if [ ! -x studio/frontend/node_modules/.bin/vite ]; then
            npm ci --prefix studio/frontend
          fi
          python -m pip install 'pillow>=10,<13'
          export PW_BACKEND_PYTHON="$HOME/.unsloth/studio/unsloth_studio/bin/python"
          python tests/studio/playwright_mtp_download_visibility.py

      - name: Reset auth + boot Unsloth
        if: matrix.shard == 'chat'
        run: |
          # Wipe (not reset-password): the boot below must re-seed a fresh .bootstrap_password.
          bash .github/scripts/boot-studio-api-only.sh --port "$STUDIO_PORT"

      - name: Wait for /api/health
        if: matrix.shard == 'chat'
        run: |
          bash .github/scripts/wait-for-health.sh --port "$STUDIO_PORT"

      - name: Pass bootstrap password to the Playwright step
        if: matrix.shard == 'chat'
        # The test rotates the password itself; NEW/NEW2 are random per run and masked.
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          NEW2="CIUi-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          echo "::add-mask::$NEW2"
          echo "STUDIO_OLD_PW=$OLD"   >> "$GITHUB_ENV"
          echo "STUDIO_NEW_PW=$NEW"   >> "$GITHUB_ENV"
          echo "STUDIO_NEW2_PW=$NEW2" >> "$GITHUB_ENV"

      - name: Drive the chat UI with Playwright
        if: matrix.shard == 'chat'
        env:
          BASE_URL: http://127.0.0.1:18892
          PW_ART_DIR: logs/playwright
          # Strict mode: in CI a missing control must fail the test.
          STUDIO_UI_STRICT: '1'
        run: |
          mkdir -p logs/playwright
          python tests/studio/playwright_chat_ui.py

      - name: Stop Unsloth (chat-ui ends with Shutdown click; this is belt-and-suspenders)
        if: (always()) && (matrix.shard == 'chat')
        run: |
          kill "${STUDIO_PID}" 2>/dev/null || true
          sleep 2

      - name: Cross-browser permission controls
        if: matrix.shard == 'chat'
        run: |
          bash .github/scripts/run-studio-permission-browser.sh 18893 firefox
          bash .github/scripts/run-studio-permission-browser.sh 18893 webkit
          bash .github/scripts/run-studio-permission-browser.sh 18893 chromium chrome

      # The chat test ends by clicking Shutdown, so boot a second Unsloth.
      - name: Reset auth + boot Unsloth for extra UI tests (port 18894)
        if: matrix.shard == 'extra' || matrix.shard == 'chat'
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18894 --log logs/studio_extra.log --pid-var STUDIO_EXTRA_PID

      - name: Wait for /api/health on 18894
        if: matrix.shard == 'extra' || matrix.shard == 'chat'
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18894 --log logs/studio_extra.log --tmp /tmp/health2.json

      - name: Pass bootstrap pw for extra UI test
        if: matrix.shard == 'extra' || matrix.shard == 'chat'
        run: |
          OLD=$(cat ~/.unsloth/studio/auth/.bootstrap_password)
          NEW="CIUiExtra-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$OLD"
          echo "::add-mask::$NEW"
          echo "STUDIO_EXTRA_OLD_PW=$OLD" >> "$GITHUB_ENV"
          echo "STUDIO_EXTRA_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: Drive Compare/Recipes/Export/Unsloth/Settings with Playwright
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_extra
          STUDIO_UI_STRICT: '1'
          GGUF_REPO: ${{ env.GGUF_REPO }}
          GGUF_VARIANT: ${{ env.GGUF_VARIANT }}
        run: |
          mkdir -p logs/playwright_extra
          python tests/studio/playwright_extra_ui.py

      - name: MCP arguments end to end (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_mcp_arguments
          STUDIO_UI_STRICT: '1'
        run: |
          mkdir -p logs/playwright_mcp_arguments
          studio_home="${UNSLOTH_STUDIO_HOME:-$HOME/.unsloth/studio}"
          export STUDIO_MCP_PYTHON="$studio_home/unsloth_studio/bin/python"
          test -x "$STUDIO_MCP_PYTHON"
          python tests/studio/playwright_mcp_arguments.py

      - name: Per-chat settings persistence (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_thread_settings
        run: |
          mkdir -p logs/playwright_thread_settings
          python tests/studio/playwright_thread_scoped_settings.py

      - name: UI font size scaling regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_fontscale
        run: |
          mkdir -p logs/playwright_fontscale
          python tests/studio/playwright_ui_font_scale.py

      # Not in the chat shard: that one ends by clicking Shutdown.
      - name: Chat width presets (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_chat_width
        run: |
          mkdir -p logs/playwright_chat_width
          python tests/studio/playwright_chat_width.py

      - name: Multi-account switch flow (Playwright)
        if: matrix.shard == 'extra'
        env:
          STUDIO_E2E_URL: http://127.0.0.1:18894
          STUDIO_E2E_OWNER_PASSWORD: ${{ env.STUDIO_EXTRA_NEW_PW }}
        run: |
          python tests/studio/playwright_multi_account.py

      - name: Update banner layout regression (Playwright)
        if: matrix.shard == 'chat'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_update_banner
        run: |
          mkdir -p logs/playwright_update_banner
          python tests/studio/playwright_update_banner_layout.py

      # Font metrics and scrollbar width differ per engine; WebKit approximates Safari.
      - name: Update banner layout, other engines (Playwright)
        if: matrix.shard == 'chat'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_update_banner
          STUDIO_UI_BANNER_SCOPE: spot
        run: |
          for engine in firefox webkit; do
            STUDIO_PLAYWRIGHT_BROWSER="$engine" \
              python tests/studio/playwright_update_banner_layout.py
          done

      - name: Image model full-footprint selector regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_image_footprint
        run: |
          mkdir -p logs/playwright_image_footprint
          python tests/studio/playwright_image_model_footprint.py

      - name: Image staged-download cancel/retry regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_image_cancel_retry
        run: |
          mkdir -p logs/playwright_image_cancel_retry
          python tests/studio/playwright_image_download_cancel_retry.py
          PW_DOWNLOAD_ONLY=1 PW_ART_DIR="$PW_ART_DIR/download-only" python tests/studio/playwright_image_download_cancel_retry.py

      - name: Image staged-download cancel/retry regression, cold checkpoint (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_image_cancel_retry_cold
          PW_CHECKPOINT_CACHED: "0"
        run: |
          mkdir -p logs/playwright_image_cancel_retry_cold
          python tests/studio/playwright_image_download_cancel_retry.py
          PW_DOWNLOAD_ONLY=1 PW_ART_DIR="$PW_ART_DIR/download-only" python tests/studio/playwright_image_download_cancel_retry.py

      - name: Image download queue regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          PW_ART_DIR: logs/playwright_image_download_queue
        run: |
          PW_ART_DIR="$PW_ART_DIR/queue" python tests/studio/playwright_image_download_queue.py
          PW_ART_DIR="$PW_ART_DIR/load" PW_LOAD_SECOND=1 python tests/studio/playwright_image_download_queue.py
          PW_ART_DIR="$PW_ART_DIR/late-plan" PW_LOAD_SECOND=1 PW_HOLD_FIRST_PLAN=1 python tests/studio/playwright_image_download_queue.py
          PW_ART_DIR="$PW_ART_DIR/late-filename" PW_RESOLVE_FIRST=1 python tests/studio/playwright_image_download_queue.py
          PW_ART_DIR="$PW_ART_DIR/late-quant" PW_LOAD_SECOND=1 PW_HOLD_FIRST_PLAN=1 PW_DIFFERENT_QUANT=1 python tests/studio/playwright_image_download_queue.py

      - name: Image text encoder precision regression (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_image_text_encoder
        run: |
          mkdir -p logs/playwright_image_text_encoder
          PW_ART_DIR="$PW_ART_DIR/applied" python tests/studio/playwright_image_text_encoder.py
          PW_ART_DIR="$PW_ART_DIR/completion-first" PW_COMPLETION_FIRST=1 \
            python tests/studio/playwright_image_text_encoder.py
          PW_ART_DIR="$PW_ART_DIR/declined" PW_DECLINE=1 \
            python tests/studio/playwright_image_text_encoder.py

      - name: Tool activity collapse regression (Playwright)
        if: matrix.shard == 'extra'
        run: |
          if [ ! -x studio/frontend/node_modules/.bin/vite ]; then
            npm install -g npm@^11 --no-fund --no-audit
            V=$(npm -v)
            case "$V" in
              11.1[6-9].*|11.[2-9][0-9].*|1[2-9].*) echo "npm $V has allowScripts" ;;
              *) echo "::error::npm $V lacks allowScripts (need >=11.16)"; exit 1 ;;
            esac
            npm --prefix studio/frontend ci --strict-allow-scripts --no-fund --no-audit
          fi
          python tests/studio/playwright_tool_activity.py --json

      # The backend log budget cannot see new frontend polling; only a browser can.
      # Last in the shard: it idles two minutes and rotates the bootstrap password.
      - name: Every polled path is declared in the log budget (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18894
          STUDIO_OLD_PW: ${{ env.STUDIO_EXTRA_OLD_PW }}
          STUDIO_NEW_PW: ${{ env.STUDIO_EXTRA_NEW_PW }}
          PW_ART_DIR: logs/playwright_declared_polls
        run: |
          mkdir -p logs/playwright_declared_polls
          python tests/studio/playwright_declared_polls.py

      - name: Stop second Unsloth
        if: (always()) && (matrix.shard == 'extra' || matrix.shard == 'chat')
        run: |
          kill "${STUDIO_EXTRA_PID}" 2>/dev/null || true
          sleep 2

      # Model-picker per-model-config regression on its own port.
      - name: Reset auth + boot Unsloth for model-config tests (port 18898)
        if: matrix.shard == 'extra'
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18898 --log logs/studio_modelcfg.log --pid-var STUDIO_MODELCFG_PID

      - name: Wait for /api/health on 18898
        if: matrix.shard == 'extra'
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18898 --log logs/studio_modelcfg.log --tmp /tmp/health4.json

      - name: Pass bootstrap pw for model-config test
        if: matrix.shard == 'extra'
        run: |
          NEW="CIModelCfg-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$NEW"
          echo "STUDIO_MODELCFG_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: Drive model-picker per-model-config with Playwright
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18898
          STUDIO_NEW_PW: ${{ env.STUDIO_MODELCFG_NEW_PW }}
          PW_ART_DIR: logs/playwright_modelcfg
          STUDIO_UI_STRICT: '1'
          GGUF_REPO: ${{ env.GGUF_REPO }}
          GGUF_VARIANT: ${{ env.GGUF_VARIANT }}
          STUDIO_MODEL_HINT: gemma-3-270m
        run: |
          mkdir -p logs/playwright_modelcfg
          python tests/studio/playwright_model_config.py

      # Reuses the fourth instance and its GGUF; estimate-memory is intercepted in the browser.
      - name: Estimated Memory Usage row (Playwright)
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18898
          STUDIO_LOGIN_PW: ${{ env.STUDIO_MODELCFG_NEW_PW }}
          PW_ART_DIR: logs/playwright_memory_estimate
          STUDIO_UI_STRICT: '1'
          GGUF_REPO: ${{ env.GGUF_REPO }}
          GGUF_VARIANT: ${{ env.GGUF_VARIANT }}
        run: |
          mkdir -p logs/playwright_memory_estimate
          python tests/studio/playwright_memory_estimate.py

      - name: Stop fourth Unsloth
        if: (always()) && (matrix.shard == 'extra')
        run: |
          kill "${STUDIO_MODELCFG_PID}" 2>/dev/null || true
          sleep 2

      # IME + multilingual paste regression on its own port; no GGUF needed.
      - name: Reset auth + boot Unsloth for IME / i18n tests (port 18896)
        if: matrix.shard == 'extra'
        run: |
          bash .github/scripts/boot-studio-api-only.sh \
            --port 18896 --log logs/studio_ime.log --pid-var STUDIO_IME_PID

      - name: Wait for /api/health on 18896
        if: matrix.shard == 'extra'
        run: |
          bash .github/scripts/wait-for-health.sh \
            --port 18896 --log logs/studio_ime.log --tmp /tmp/health3.json

      - name: Pass bootstrap pw for IME / i18n test
        if: matrix.shard == 'extra'
        run: |
          NEW="CIIme-$(python -c 'import secrets; print(secrets.token_urlsafe(16))')"
          echo "::add-mask::$NEW"
          echo "STUDIO_IME_NEW_PW=$NEW" >> "$GITHUB_ENV"

      - name: Drive IME + multilingual paste regression with Playwright
        if: matrix.shard == 'extra'
        env:
          BASE_URL: http://127.0.0.1:18896
          STUDIO_NEW_PW: ${{ env.STUDIO_IME_NEW_PW }}
          PW_ART_DIR: logs/playwright_ime
          STUDIO_UI_STRICT: '1'
        run: |
          mkdir -p logs/playwright_ime
          python tests/studio/playwright_chat_ime_i18n.py

      - name: Stop third Unsloth
        if: (always()) && (matrix.shard == 'extra')
        run: |
          kill "${STUDIO_IME_PID}" 2>/dev/null || true
          sleep 2

      # Every shard has its own ~/.unsloth/studio/logs, so capture them per shard.
      - name: Capture the backend and llama-server logs
        if: always()
        run: |
          mkdir -p logs/server-logs
          cp -r ~/.unsloth/studio/logs/. logs/server-logs/ 2>/dev/null || true

      - name: Upload Playwright artifacts
        # Always upload so a green run's screenshots stay reviewable.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          # Per-shard name: artifact names are immutable within a run.
          name: studio-ui-smoke-artifacts-${{ matrix.shard }}
          path: |
            logs/studio.log
            logs/studio_extra.log
            logs/studio_modelcfg.log
            logs/studio_ime.log
            logs/install.log
            logs/server-logs/
            logs/playwright
            logs/playwright_mtp
            logs/playwright-permissions-*
            logs/playwright_extra
            logs/playwright_mcp_arguments
            logs/playwright_thread_settings
            logs/playwright_fontscale
            logs/playwright_update_banner
            logs/playwright_image_footprint
            logs/playwright_image_cancel_retry
            logs/playwright_image_cancel_retry_cold
            logs/playwright_image_download_queue
            logs/playwright_image_text_encoder
            logs/playwright_modelcfg
            logs/playwright_memory_estimate
            logs/playwright_ime
            logs/studio-permissions-*.log
          # Repository-wide cap; larger values are silently clamped.
          retention-days: 1

  ui-indicator:
    name: Loaded-models indicator (cross-browser)
    runs-on: ubuntu-latest
    # Own job: three engines would push later ui-smoke steps past its limit. Stubs the
    # /status reads, so no model or GPU is needed, but a real browser layout is.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps
        # Bounded and retried: an apt stall is silent and the run reports `cancelled`.
        # The job's 30 stays the backstop.
        timeout-minutes: 20
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '360'
        # One call: retrying install after a stalled update re-reads the same broken lists.
        run: |
          bash .github/scripts/retry-with-apt-lock.sh sudo sh -c \
            'apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq || { apt-get update && apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev jq; }'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Unsloth (--local, --no-torch)
        uses: ./.github/actions/install-unsloth-local
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          # Withheld on PR: this step runs checked-out PR code.
          hf-token: ${{ github.event_name != 'pull_request' && secrets.HF_TOKEN || '' }}

      - name: Pin the Playwright version so the browser cache has a key
        id: pw
        run: |
          pip install 'playwright>=1.45,<2'
          echo "version=$(python -c 'import playwright; from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      # Keyed on the resolved Playwright version, which decides the browser builds.
      - name: Restore the Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-cfw-v2

      - name: Restore the apt archive cache (webkit's .deb set)
        id: apt-cache
        # Caches the .debs for the engines' system libraries, keyed on the runner image.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: apt-archives-${{ runner.os }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-cfw-v1

      - name: Install Playwright browsers
        id: pw-install
        # CDN download and apt are separate helper calls, each with its own retry budget:
        # 2 x 300s plus lock wait, twice, fits the job's 30.
        timeout-minutes: 25
        env:
          RETRY_ATTEMPTS: '2'
          RETRY_ATTEMPT_TIMEOUT: '300'
          # install-deps runs its own `apt-get update`; apt's internal retries are invisible and
          # charged to our budget, so the outer attempt loop owns resilience.
          APT_ACQUIRE_RETRIES: '0'
        run: |
          # No --with-deps: it runs its own unbounded `apt-get update`.
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" != "true" ]; then
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install chromium firefox webkit
          fi

          # Probe whether the system libraries are actually missing before running apt.
          probe() {
            python - "$@" <<'PY'
          import sys
          from playwright.sync_api import sync_playwright

          missing = []
          with sync_playwright() as p:
              for name in sys.argv[1:]:
                  try:
                      browser = getattr(p, name).launch()
                      browser.close()
                  except Exception as exc:
                      missing.append(f"{name}: {type(exc).__name__}")
          if missing:
              print("engines that will not start: " + "; ".join(missing))
              sys.exit(1)
          print("all three engines launch; system libraries are present")
          PY
          }

          if probe chromium firefox webkit; then
            echo "::notice::skipped playwright install-deps; the runner image already has the libraries"
          else
            echo "system libraries are missing, installing them"
            # Reuse last run's .debs; apt re-fetches any that do not match its index.
            if [ -d "${{ github.workspace }}/.apt-archives" ]; then
              sudo cp "${{ github.workspace }}"/.apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true
              echo "seeded $(ls "${{ github.workspace }}"/.apt-archives/*.deb 2>/dev/null | wc -l) cached .deb files"
            fi
            bash .github/scripts/retry-with-apt-lock.sh \
              python -m playwright install-deps chromium firefox webkit
            mkdir -p "${{ github.workspace }}/.apt-archives"
            sudo cp /var/cache/apt/archives/*.deb "${{ github.workspace }}/.apt-archives/" 2>/dev/null || true
            sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/.apt-archives" || true
            # Fail loudly here rather than as an opaque per-test timeout later.
            probe chromium firefox webkit
          fi

      # Main only, and only after the install succeeded: the key is immutable, so a partial
      # download saved once would break every later run.
      - name: Save the apt archive cache
        if: >-
          github.ref == 'refs/heads/main'
          && steps.apt-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Save the Playwright browser cache
        if: >-
          always() && github.ref == 'refs/heads/main'
          && steps.pw-cache.outputs.cache-hit != 'true'
          && steps.pw-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        continue-on-error: true
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-cfw-v2

      - name: Cross-browser loaded-models indicator
        # Engines run in parallel, each with its own port and UNSLOTH_STUDIO_HOME, since the
        # script wipes auth/ per boot. Each home symlinks the shared venv (the CLI requires
        # unsloth_studio/bin/python under it). Safe only because this suite needs no model.
        run: |
          mkdir -p logs
          installed_home="${UNSLOTH_STUDIO_HOME:-$HOME/.unsloth/studio}"
          test -x "$installed_home/unsloth_studio/bin/python" \
            || { echo "::error::no studio venv under $installed_home"; exit 1; }
          pids=""
          for spec in "18899 chromium" "18900 firefox" "18901 webkit"; do
            port="${spec% *}"
            engine="${spec#* }"
            home="${{ github.workspace }}/.studio-indicator-$engine"
            mkdir -p "$home"
            ln -sfn "$installed_home/unsloth_studio" "$home/unsloth_studio"
            UNSLOTH_STUDIO_HOME="$home" \
              bash .github/scripts/run-studio-indicator-browser.sh "$port" "$engine" \
              >"logs/indicator-$engine.out" 2>&1 &
            pids="$pids $!:$engine"
          done
          # Wait on all engines so one failure does not hide another.
          rc=0
          for entry in $pids; do
            if ! wait "${entry%%:*}"; then
              echo "::error::loaded-models indicator failed in ${entry##*:}"
              rc=1
            fi
          done
          for f in logs/indicator-*.out; do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Upload Playwright artifacts
        # Always: the suite is visual and can pass while it looks wrong.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: studio-ui-indicator-artifacts
          path: |
            logs/playwright-indicator-*
            logs/studio-indicator-*.log
            logs/indicator-*.out
          retention-days: 1
