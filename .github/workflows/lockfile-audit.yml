# Fast supply-chain audit of checked-in npm/cargo lockfiles (scripts/lockfile_supply_chain_audit.py).
# Blocks IOC strings, known-bad pins, broken lockfiles and provenance/integrity failures; --strict blocks warnings.

name: Lockfile supply-chain audit

# Per-commit runs live in the Lint CI lane (same lane-lockfile-audit.sh). The nightly stays: it re-audits
# unchanged lockfiles against newly published advisories.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

concurrency:
  # The event is part of the group so a scheduled run and a push to main cannot
  # coalesce. Both resolve to refs/heads/main, and the default queue: single keeps
  # only one pending run, so without this a merge burst silently drops the nightly:
  # cancel-in-progress protects the running run, never the pending one.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Latest-only on a PR branch. On main, cancel-in-progress is false so a RUNNING run is
  # never killed, and a newer push replaces only the PENDING one: a merge burst runs the
  # commit already executing plus the tip. See studio-backend-ci.yml for the trade.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: lockfile supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Run lockfile supply-chain audit
        run: bash .github/scripts/lane-lockfile-audit.sh
