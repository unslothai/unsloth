# Fast supply-chain audit of checked-in npm/cargo lockfiles (scripts/lockfile_supply_chain_audit.py).
# Blocks IOC strings, known-bad pins, broken lockfiles and provenance/integrity failures; --strict blocks warnings.

name: Lockfile supply-chain audit

# Per-commit runs live in the Lint CI lane (same lane-lockfile-audit.sh). The nightly stays: it re-audits
# unchanged lockfiles against newly published advisories.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

concurrency:
  # The event is in the group so a merge burst on main cannot drop the scheduled run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: lockfile supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Run lockfile supply-chain audit
        run: bash .github/scripts/lane-lockfile-audit.sh
