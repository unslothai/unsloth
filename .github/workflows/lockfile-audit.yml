#
# Fast, focused supply-chain audit of every checked-in lockfile.
#
# Runs scripts/lockfile_supply_chain_audit.py on PRs that touch any
# npm or cargo lockfile, on push to main, and on a daily schedule so
# newly-published IOCs surface even when no PR opens.
#
# Default behavior blocks public indicator-of-compromise strings,
# known-malicious pinned versions, structurally broken lockfiles, and
# provenance/integrity failures (non-registry resolved URL or cargo
# source, missing integrity hash or cargo checksum) -- the pre-install
# fetches this gate stops before `npm ci` runs lifecycle scripts.
# Lesser anomalies warn; --strict escalates them to blocking.
#
# This workflow is intentionally separate from security-audit.yml:
#   - security-audit.yml is the umbrella job (pip-audit + npm audit +
#     cargo audit + OSV + Semgrep + secret scanning + SBOM + ...);
#     it takes ~25 minutes and runs only when dep manifests change.
#   - lockfile-audit.yml is a ~30 second pure-Python parse + grep on
#     the lockfiles themselves; it runs on every PR that even nudges
#     a lockfile so reviewers always see the audit result inline.

name: Lockfile supply-chain audit

# Per-commit runs are gone: this audit now runs as a background lane inside Lint CI,
# which already occupies a runner on every commit, so it costs a slot there instead of
# holding one of its own for ~6s of work. Both call
# .github/scripts/lane-lockfile-audit.sh, so there is one definition.
#
# The nightly schedule is deliberately KEPT. It is not the same check: it re-audits the
# lockfiles as they stand against advisories published since the last commit, which no
# commit-triggered run can do.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

concurrency:
  # The event is part of the group so a scheduled run and a push to main cannot
  # coalesce. Both resolve to refs/heads/main, and the default queue: single keeps
  # only one pending run, so without this a merge burst silently drops the nightly:
  # cancel-in-progress protects the running run, never the pending one.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  # Latest-only on a PR branch. On main this does less than it reads like: it stops
  # a RUNNING main job being killed, but GitHub cancels any PENDING run in the group
  # the moment a newer one is queued, so a merge burst still leaves only the tip.
  # See studio-backend-ci.yml, which is grouped per commit on main for that reason.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  audit:
    name: lockfile supply-chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # One definition, shared with the Lint CI lane that runs this on every commit.
      - name: Run lockfile supply-chain audit
        run: bash .github/scripts/lane-lockfile-audit.sh
