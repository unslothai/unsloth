# VAE tile seam guard: studio/backend/tests/test_vae_tile_geometry.py checks the tile grid every
# image / video family's VAE decodes with on Studio's low-VRAM tiers (tile >= 32 latents, overlap
# >= 16, no sliver edge tile). It needs the pinned diffusers, which Backend CI does not install
# (there the test would skip), so it runs here, CPU only, no weights: the VAEs are built on the
# meta device from their vae/config.json.
#
# Triggers: any inference source change (a new family, a tile override), the diffusers pins (an
# upgrade that changes diffusers' tile defaults) and the test itself.

name: Studio VAE seam guard

on:
  pull_request:
    paths:
      - 'studio/backend/core/inference/**'
      - 'studio/backend/requirements/diffusers-*.txt'
      - 'studio/backend/requirements/studio.txt'
      - 'studio/backend/tests/test_vae_tile_geometry.py'
      - 'studio/backend/tests/fixtures/vae_tile_configs.json'
      - '.github/workflows/studio-vae-seam-guard.yml'
  push:
    branches: [main]
    paths:
      - 'studio/backend/core/inference/**'
      - 'studio/backend/requirements/diffusers-*.txt'
      - 'studio/backend/requirements/studio.txt'
      - 'studio/backend/tests/test_vae_tile_geometry.py'
      - 'studio/backend/tests/fixtures/vae_tile_configs.json'
      - '.github/workflows/studio-vae-seam-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Unique per commit on main, so a merge burst cannot cancel a main run; superseded PR pushes are cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seam-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11'
          pip install -r studio/backend/requirements/studio.txt
          # The diffusers Studio installs (the release pin, then the pinned main commit on top, which
          # carries Qwen-Image-2.1); the guard reads diffusers' own tile defaults from it.
          pip install -r studio/backend/requirements/diffusers-pin.txt
          pip install -r studio/backend/requirements/diffusers-main.txt
          pip install pytest pytest-timeout

      - name: Seam guard
        working-directory: studio/backend
        run: python -m pytest tests/test_vae_tile_geometry.py -q -rxXs --tb=short --timeout=600
