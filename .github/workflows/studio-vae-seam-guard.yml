# Backend CI does not install the pinned diffusers, so the guard would only skip there.

name: Studio VAE seam guard

on:
  pull_request:
    paths:
      - 'studio/backend/core/inference/**'
      - 'studio/backend/requirements/diffusers-*.txt'
      - 'studio/backend/requirements/studio.txt'
      - 'studio/backend/tests/test_vae_tile_geometry.py'
      - 'studio/backend/tests/fixtures/vae_tile_configs.json'
      - 'studio/backend/tests/test_diffusion_autoopt_parity.py'
      - 'studio/backend/tests/fixtures/diffusion_autoopt_parity.json'
      - '.github/workflows/studio-vae-seam-guard.yml'
  push:
    branches: [main]
    paths:
      - 'studio/backend/core/inference/**'
      - 'studio/backend/requirements/diffusers-*.txt'
      - 'studio/backend/requirements/studio.txt'
      - 'studio/backend/tests/test_vae_tile_geometry.py'
      - 'studio/backend/tests/fixtures/vae_tile_configs.json'
      - 'studio/backend/tests/test_diffusion_autoopt_parity.py'
      - 'studio/backend/tests/fixtures/diffusion_autoopt_parity.json'
      - '.github/workflows/studio-vae-seam-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR pushes are cancelled; on main a running run finishes and a burst runs the tip (see studio-backend-ci.yml).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seam-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies (CPU only)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
            'torch>=2.4,<2.11'
          pip install -r studio/backend/requirements/studio.txt
          # As Studio installs it: the release, then the main commit only while that line is uncommented.
          pip install -r studio/backend/requirements/diffusers-pin.txt
          if grep -Eq '^[[:space:]]*[^#[:space:]]' studio/backend/requirements/diffusers-main.txt; then
            pip install -r studio/backend/requirements/diffusers-main.txt
          fi
          pip install pytest pytest-timeout

      - name: Seam guard
        working-directory: studio/backend
        run: python -m pytest tests/test_vae_tile_geometry.py -q -rxXs --tb=short --timeout=600

      # Backend CI has no diffusers, so the auto-optimizer parity fixture is checked here.
      - name: Diffusion auto-optimizer parity
        working-directory: studio/backend
        run: python -m pytest tests/test_diffusion_autoopt_parity.py -q -rxXs --tb=short --timeout=600
