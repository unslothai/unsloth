# Disposable repro workflow. Delete after validation.

name: "HF-Progress-Repro"

on:
  push:
    branches:
      - "fix/hf-progress-repro-ci"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Targeted repro"
    runs-on: "windows-latest"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: "Install focused repro dependencies"
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest structlog huggingface-hub==1.27.0

      - name: "Verify Hugging Face process-unique partial naming"
        shell: pwsh
        run: |
          python -c "import huggingface_hub, inspect; from huggingface_hub import file_download; source = inspect.getsource(file_download._download_to_tmp_and_move); assert 'uuid.uuid4().hex[:8]' in source; assert '.incomplete' in source; print(f'huggingface_hub={huggingface_hub.__version__} process_unique_partial=True')"

      - name: "Verify Studio reports process-unique partial progress"
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'studio/backend'
          python -m pytest -q studio/backend/hub/tests/test_process_unique_incomplete_repro.py --tb=short
