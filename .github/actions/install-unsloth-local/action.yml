# The POSIX `install.sh --local --no-torch` bootstrap, which 13 jobs across 8
# workflows ran with a byte-identical body. Extracted so the invocation has one
# definition: the `set -o pipefail` + `tee` idiom is easy to get subtly wrong
# (without pipefail the step reports the exit status of `tee`, not of
# install.sh, and a failed install passes), and a flag or log-path change
# previously had to be applied to 13 places consistently.
#
# Deliberately NOT parameterised beyond the two tokens. This action is "the
# standard local no-torch install", not a general installer wrapper: giving it
# an `args` input would let call sites drift apart again, which is the thing it
# exists to prevent. The Windows `install.ps1` path is a different script with a
# different body and stays separate.
#
# Composite actions cannot read the `secrets` context, so both tokens are
# explicit inputs that each caller passes. That is not boilerplate for its own
# sake: it keeps the PR-withholding decision visible at the call site, where it
# belongs, rather than hidden behind a default.
#
# Keep `id`, `if`, `timeout-minutes` and `continue-on-error` on the CALLER's
# step. They are step-level keys on the `uses:` step, so `steps.<id>.outcome`
# gating in the caller keeps working unchanged; the caller sees this action as a
# single step and cannot inspect the steps inside it.

name: Install Unsloth (--local, --no-torch)
description: >-
  Run the checked-out install.sh in --local --no-torch mode, teeing the
  installer output to logs/install.log. Requires actions/checkout to have run.

inputs:
  gh-token:
    description: >-
      Token for installer calls that hit the GitHub API (release lookups for the
      llama.cpp prebuilt). Normally secrets.GITHUB_TOKEN.
    required: true
  hf-token:
    description: >-
      Hugging Face token, or the empty string to run unauthenticated. Callers
      that can reach this step on a pull_request event should withhold it,
      because this step executes checked-out PR code; public models still
      download without it. The idiom every such caller uses is a conditional on
      github.event_name that yields secrets.HF_TOKEN off pull_request and an
      empty string on it (see any call site). Callers whose job cannot run on
      pull_request, such as a workflow_dispatch-only job, may pass it
      unconditionally.

      Do not write that conditional out as a literal template expression here.
      GitHub evaluates expression syntax inside an action manifest, including
      inside these description strings, and neither the github nor the secrets
      context exists at manifest-parse time, so an example written out in full
      fails the whole action with "Unrecognized named-value: 'github'".
    required: false
    default: ''

runs:
  using: composite
  steps:
    # This step is the single largest cost in CI: 92s median across 39 job runs
    # in one sample, which is more total time than any test. All of it is uv
    # resolving and DOWNLOADING the same wheels, in every job, every run, because
    # uv's cache is per-runner and nothing carried it between them.
    #
    # A download cache is the safest kind there is. uv's is content-addressed by
    # URL and hash, so a stale entry cannot serve wrong content -- the worst it can
    # do is miss. Nothing about which packages get installed changes; they just are
    # not fetched twice. That is the difference between this and caching the venv,
    # which would have to reason about an editable overlay, a moving
    # `unsloth-zoo @ git+main`, and absolute paths baked into console scripts.
    #
    # UV_CACHE_DIR is set explicitly rather than relying on ~/.cache/uv, so the
    # path is the same on Linux and macOS and one cache config covers both. It is
    # exported into the environment so install.sh, studio/setup.sh and every uv
    # call underneath inherit it.
    - name: Point uv's cache somewhere cacheable
      shell: bash
      run: |
        echo "UV_CACHE_DIR=${{ github.workspace }}/.uv-cache" >> "$GITHUB_ENV"
        mkdir -p "${{ github.workspace }}/.uv-cache"

    # Keyed on what decides the resolution, with a prefix fallback: a near-miss
    # still supplies almost every wheel, which is most of the win. A download cache
    # wants restore-keys for exactly this reason, where a venv cache must not have
    # them.
    - name: Restore the uv download cache
      id: uv-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      continue-on-error: true
      with:
        path: ${{ github.workspace }}/.uv-cache
        key: uv-${{ runner.os }}-${{ hashFiles('studio/backend/requirements/**', 'pyproject.toml') }}
        restore-keys: |
          uv-${{ runner.os }}-

    # The frontend build is the other half of this step, and unlike the wheels it is
    # not a download at all. Measured over 13 distinct Linux jobs on main, using the
    # elapsed-second prefix below: a median 36s of a 74s install, 49% of it, and
    # 468s per commit spent producing byte-identical output. The uv cache above
    # already hits exactly (`Cache hit for: uv-Linux-<hash>`, one 31 kB straggler),
    # so what is left is compute, and the only way to stop paying it 13 times is to
    # not do it 13 times.
    #
    # studio/setup.sh decides whether to rebuild by mtime: it looks for anything
    # under frontend/ (maxdepth 1, minus bun.lock), frontend/src or frontend/public
    # NEWER than frontend/dist, and skips the build when it finds nothing. So the key
    # hashes exactly those three path groups. A hit then means the build inputs are
    # byte-identical, which is a strictly stronger statement than the mtime test it
    # rides on, and the restored dist is correct by construction rather than by luck.
    #
    # tests/studio/test_frontend_dist_cache.py pins the key against the paths setup.sh
    # actually reads, because the two drifting apart is silent: the cache would keep
    # hitting and start serving a dist built from inputs no longer in the key.
    #
    # bun.lock is IN the key even though the staleness check excludes it. The check
    # has to exclude it because the install regenerates it and it would self-trigger
    # every run; the cache has no such problem, and a lockfile change means different
    # dependencies and so a different bundle. That is deliberate and makes the cache
    # safer than the check.
    - name: Restore the built frontend
      id: fe-dist
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      continue-on-error: true
      with:
        path: studio/frontend/dist
        # NO restore-keys, deliberately, and the opposite of the uv cache above. A
        # near-miss download cache still supplies most of the wheels, which is most of
        # the win. A near-miss dist is a bundle built from different source: wrong, not
        # partial. Only an exact match may be served.
        key: fe-dist-${{ runner.os }}-${{ hashFiles('studio/frontend/*', 'studio/frontend/src/**', 'studio/frontend/public/**') }}

    - name: Make the restored frontend outrank its sources
      if: steps.fe-dist.outputs.cache-hit == 'true'
      shell: bash
      run: |
        # actions/cache restores through tar, which preserves the ORIGINAL mtimes. A
        # dist restored that way is older than the checkout that just wrote every
        # source file, so setup.sh's `find -newer dist` would find the whole tree
        # newer and rebuild anyway -- the cache would cost a download and save
        # nothing, while looking like it worked. Touching the directory is what makes
        # the hit count, and it is honest because the key already proved the inputs
        # are byte-identical.
        #
        # The directory only: the staleness check compares against `frontend/dist`
        # itself, not its contents.
        if [ ! -d studio/frontend/dist ]; then
          echo "::error::the frontend dist cache reported a hit but restored no directory"
          exit 1
        fi
        touch studio/frontend/dist
        echo "restored a prebuilt frontend; setup.sh will report it up to date"

    - name: Refuse a frontend cache key that hashes nothing
      shell: bash
      env:
        FE_KEY: ${{ hashFiles('studio/frontend/*', 'studio/frontend/src/**', 'studio/frontend/public/**') }}
      run: |
        # hashFiles returns the empty string when a glob matches no file, which would
        # collapse every commit onto one key and serve an arbitrary dist. That is the
        # one way this cache can be actively wrong rather than merely useless, and it
        # would be invisible: the restore succeeds and the build is skipped.
        if [ -z "$FE_KEY" ]; then
          echo "::error::hashFiles matched no frontend sources, so the dist cache key is degenerate. The frontend layout moved; update the key and tests/studio/test_frontend_dist_cache.py together."
          exit 1
        fi

    - name: Install Unsloth (--local, --no-torch)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh-token }}
        HF_TOKEN: ${{ inputs.hf-token }}
      run: |
        mkdir -p logs
        set -o pipefail
        # Elapsed-seconds prefix, added to the STEP LOG only.
        #
        # This is the largest step in most jobs that run it -- ~90s median on Linux,
        # 268-292s on Windows, ~118s on macOS, across 40 jobs -- and its output carries
        # no timestamps anywhere, so which phase spends that time cannot be read off a
        # CI log. Guessing has already been misleading: a no-op `unsloth studio update`
        # over a complete install costs MORE than the full install it follows, which is
        # the opposite of what a download-bound install does.
        #
        # Done here rather than in install.sh on purpose. install.sh, install.ps1 and
        # studio/setup.* are user-facing scripts and stay untouched; this is a display
        # filter over a stream CI already pipes, so it adds no switch to maintain, no
        # environment variable for the installers to interpret, and nothing that can
        # behave differently for a real user than it does here.
        #
        # Downstream of `tee` deliberately: logs/install.log keeps byte-for-byte what
        # install.sh wrote, so the ~30 places that read or grep that artifact see no
        # change at all. $SECONDS is the step's own clock and survives into the pipeline
        # subshell. The `|| [ -n "$line" ]` tail emits a final unterminated line, which
        # a bare `read` loop would swallow.
        bash install.sh --local --no-torch 2>&1 \
          | tee logs/install.log \
          | while IFS= read -r line || [ -n "$line" ]; do
              printf '[%4ds] %s\n' "$SECONDS" "$line"
            done

    # Save on main only, like every other cache in this repo, and for the reason
    # the HF and Playwright caches record: a PR-scoped entry can only be restored
    # by re-runs of that same PR, while every PR can restore from the default
    # branch. Saving on PRs would spend the 50 GiB budget -- measured at 99.3% full
    # once already -- evicting main's copy, which is the one everyone reads.
    #
    # `uv cache prune --ci` first: uv keeps built wheels AND unpacked source
    # artifacts, and only the former are worth carrying between runners. Without it
    # this key grows without bound across 39 jobs and re-opens the eviction thrash
    # the GGUF caches were fixed for.
    # Main only, the rule every cache in this repo follows: a PR-scoped entry can only
    # be restored by re-runs of that same PR while still counting against the shared
    # budget, evicting the copy every PR can read.
    - name: Save the built frontend
      if: github.ref == 'refs/heads/main' && steps.fe-dist.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      continue-on-error: true
      with:
        path: studio/frontend/dist
        key: ${{ steps.fe-dist.outputs.cache-primary-key }}

    - name: Save the uv download cache
      if: always() && github.ref == 'refs/heads/main' && steps.uv-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # Best effort: an older uv without `prune --ci` must not fail the install
        # that has already succeeded.
        uv cache prune --ci 2> /dev/null || true
        du -sh "${{ github.workspace }}/.uv-cache" 2> /dev/null || true

    - name: Save the uv download cache (upload)
      if: always() && github.ref == 'refs/heads/main' && steps.uv-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      continue-on-error: true
      with:
        path: ${{ github.workspace }}/.uv-cache
        key: uv-${{ runner.os }}-${{ hashFiles('studio/backend/requirements/**', 'pyproject.toml') }}
