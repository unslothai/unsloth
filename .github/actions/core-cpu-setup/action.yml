# Shared CPU install preamble for both Core matrix jobs; one copy keeps their environments identical.
# Callers keep checkout, setup-python and the pip cache restore/save steps:
#   - actions/checkout, because `uses: ./.github/actions/...` cannot resolve
#     before the repository is on disk.
#   - setup-python, which the pip cache restore needs first.
#   - the pip cache pair, which tests read off the job's own step list.

name: Core CPU setup
description: >-
  Install the CPU test environment shared by every Core matrix cell: node 22, uv,
  the matrix-resolved transformers + TRL pins, torch CPU, unsloth (editable) and
  a shallow unsloth_zoo checkout installed editable. Requires actions/checkout,
  actions/setup-python and the pip cache restore to have run first.

inputs:
  transformers-spec:
    description: >-
      The matrix cell's `transformers` requirement, or the literal
      `__from_pyproject__` sentinel to take whatever pyproject.toml pins.
    required: true
  trl-spec:
    description: >-
      The matrix cell's `trl` requirement, or `__from_pyproject__` as above.
    required: true
  unsloth-zoo-ref:
    description: unsloth_zoo git ref to clone and install editable.
    required: true

runs:
  using: composite
  steps:
    # Node 22 is needed by a test that runs `node --experimental-strip-types`.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'

    - name: Install uv (some unsloth_zoo dev tooling expects it on PATH)
      shell: bash
      run: pip install uv

    - name: Resolve matrix specs (handle __from_pyproject__ sentinel)
      # Resolve the pyproject sentinel to real transformers/trl specs from the optional extras.
      # RESOLVED_* go to $GITHUB_ENV so later steps in the calling job see them too.
      shell: bash
      env:
        MATRIX_TRANSFORMERS_SPEC: ${{ inputs.transformers-spec }}
        MATRIX_TRL_SPEC: ${{ inputs.trl-spec }}
      run: |
        set -euxo pipefail
        python <<'PY' >> "$GITHUB_ENV"
        import os, re, tomllib
        spec_t = os.environ["MATRIX_TRANSFORMERS_SPEC"]
        spec_r = os.environ["MATRIX_TRL_SPEC"]

        def _pkg_name(spec: str) -> str:
            m = re.match(r"\s*([A-Za-z0-9_.-]+)", spec)
            return (m.group(1).lower() if m else "")

        if spec_t == "__from_pyproject__" or spec_r == "__from_pyproject__":
            with open("pyproject.toml", "rb") as f:
                doc = tomllib.load(f)
            proj = doc.get("project", {})
            # Try top-level deps first, then all optional extras.
            all_deps: list[str] = list(proj.get("dependencies", []))
            for _name, dep_list in proj.get("optional-dependencies", {}).items():
                all_deps.extend(dep_list)

            if spec_t == "__from_pyproject__":
                spec_t = next((x for x in all_deps if _pkg_name(x) == "transformers"),
                              "transformers")
            if spec_r == "__from_pyproject__":
                spec_r = next((x for x in all_deps if _pkg_name(x) == "trl"),
                              "trl")
        print(f"RESOLVED_TRANSFORMERS_SPEC={spec_t}")
        print(f"RESOLVED_TRL_SPEC={spec_r}")
        PY
        grep RESOLVED_ "$GITHUB_ENV" || true

    - name: Install runtime deps (mirrors studio-backend-ci.yml + mlx-ci.yml)
      # protobuf + sentencepiece: needed by tests/saving. triton: imported at module scope by unsloth.
      shell: bash
      run: |
        set -euxo pipefail
        python -m pip install --upgrade pip
        pip install -r studio/backend/requirements/studio.txt
        # CPU torch first, or peft/accelerate/datasets pull the ~2.3 GB CUDA build from PyPI.
        pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple \
          'torch>=2.4,<2.11' 'torchvision<0.26'
        pip install \
          python-multipart aiofiles sqlalchemy cryptography \
          pyyaml jinja2 mammoth unpdf requests typer \
          'numpy<3' pytest==9.0.3 pytest-asyncio pytest-xdist pytest-timeout httpx \
          protobuf sentencepiece triton \
          psutil packaging tqdm safetensors datasets \
          'peft>=0.18,<0.20' 'accelerate>=0.34,<2' \
          ipython hf_transfer
        # hf_transfer: declared by unsloth and unsloth_zoo, both installed --no-deps.
        pip install "$RESOLVED_TRANSFORMERS_SPEC"
        pip install "$RESOLVED_TRL_SPEC"
        # bitsandbytes: hard import in unsloth/models/_utils.py.
        pip install 'bitsandbytes>=0.45'
        # --no-deps so pip does not replace the CPU torch installed above.
        pip install -e . --no-deps
        echo "::group::Installed transformers + trl + torch + unsloth versions"
        pip show transformers
        pip show trl
        pip show torch
        pip show unsloth
        echo "::endgroup::"

    - name: Clone unsloth_zoo @ ${{ inputs.unsloth-zoo-ref }}
      # Use `pip show`, not `import unsloth_zoo`, which raises on a GPU-less runner.
      shell: bash
      env:
        UNSLOTH_ZOO_REF: ${{ inputs.unsloth-zoo-ref }}
      run: |
        set -euxo pipefail
        # Retry for transient github.com 500s. fetch + checkout because the ref may be a commit SHA,
        # which `clone --branch` rejects.
        for attempt in 1 2 3; do
          rm -rf "$RUNNER_TEMP/unsloth-zoo"
          if git init -q "$RUNNER_TEMP/unsloth-zoo" \
            && git -C "$RUNNER_TEMP/unsloth-zoo" remote add origin \
              https://github.com/unslothai/unsloth-zoo \
            && git -C "$RUNNER_TEMP/unsloth-zoo" fetch -q --depth=1 origin "$UNSLOTH_ZOO_REF" \
            && git -C "$RUNNER_TEMP/unsloth-zoo" checkout -q FETCH_HEAD; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::git clone unsloth-zoo failed after 3 attempts"
            exit 1
          fi
          delay=$((5 * attempt))
          echo "::warning::clone failed (attempt $attempt/3), retrying in ${delay}s..."
          sleep "$delay"
        done
        pip install -e "$RUNNER_TEMP/unsloth-zoo" --no-deps
        pip show unsloth_zoo

        # Warn-only: `|| true` must stay inside the substitution under set -e, and timeout covers a hang.
        head="$( { timeout 15 git ls-remote https://github.com/unslothai/unsloth-zoo refs/heads/main 2>/dev/null || true; } | cut -f1 )"
        pinned="$(git -C "$RUNNER_TEMP/unsloth-zoo" rev-parse HEAD)"
        echo "unsloth_zoo revision under test: $pinned"
        if [ -n "$head" ] && [ "$head" != "$pinned" ]; then
          echo "::warning title=unsloth_zoo is not at main::Testing $pinned; unslothai/unsloth-zoo main is now $head. If this run pinned unsloth_zoo_ref deliberately, that is expected and re-running keeps the pin. Otherwise either main advanced between the resolve job and this step, or this is a --failed re-run that kept the revision resolved on the first attempt; for the latter, re-run ALL jobs to pick up main."
        fi
