# On failure, report how far the base has moved past this run's merge ref; re-runs reuse it.
# Never changes the job result.

name: Report the age of this run's merge ref
description: >-
  On a pull_request run, emit a notice saying how many commits the base branch
  has gained since this run's merge ref was built. Advisory only: it never fails,
  and never changes the outcome of the job it sits in.

runs:
  using: composite
  steps:
    - name: Compare the merge ref's base against the branch tip
      shell: bash
      env:
        # checkout uses persist-credentials: false, so gh needs the token; compare needs only contents: read.
        GH_TOKEN: ${{ github.token }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -u
        if [ -z "${BASE_SHA:-}" ] || [ -z "${BASE_REF:-}" ]; then
          exit 0
        fi
        # Ask the API, not the shallow clone.
        behind=$(gh api "repos/${REPOSITORY}/compare/${BASE_SHA}...${BASE_REF}" --jq '.ahead_by' 2>/dev/null) || behind=""
        case "${behind}" in
          ''|*[!0-9]*)
            exit 0
            ;;
        esac
        if [ "${behind}" -eq 0 ]; then
          exit 0
        fi
        echo "::notice title=This run's merge ref is ${behind} commit(s) behind ${BASE_REF}::A pull_request run tests a merge of this branch into ${BASE_REF} as it stood when the run was created, and ${BASE_REF} has gained ${behind} commit(s) since. If this failure was fixed on ${BASE_REF} in that window, the fix is not in this run, and re-running will not pick it up because a re-run replays the same merge commit. Push to the branch to have the merge ref rebuilt. This notice does not mean the failure is spurious."
