---
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Path / scans only .github/workflows; .github/actions must move in one PR or SHAs diverge.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      # Semver cooldown knobs are rejected for github-actions; only default-days applies.
      default-days: 7
    groups:
      # Groups must cover the whole action (sub-paths are separate names); first match wins.
      codeql-action:
        patterns: ["github/codeql-action*"]
      cache-action:
        patterns: ["actions/cache*"]
      actions:
        patterns: ["*"]
        # One PR per action across both directories; a test requires one SHA per action.
        group-by: dependency-name
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # No bun entry: /studio/frontend has no bun.lock, so it would silently no-op.

  - package-ecosystem: "npm"
    directory: "/studio/backend/core/data_recipe/oxc-validator"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      npm-oxc-validator:
        patterns: ["*"]
      npm-oxc-validator-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Hand-kept pyproject.toml: one update rewrites every copy; version PRs off, security open.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    # pyproject.toml pins torch/torchvision per CUDA extra and transformers, datasets, bitsandbytes
    # via != exclusions; Dependabot rewrites whole specifiers (#13833 and 14469 collapsed every
    # cuXXX-torchYYY extra to torch==2.14.1), so move them by hand; advisories still alert.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "torchaudio"
      - dependency-name: "xformers"
      - dependency-name: "bitsandbytes"
      - dependency-name: "transformers"
      - dependency-name: "datasets"
      # Hand-kept torchcodec (audio-torch extra); huggingface-hub 1.x on 3.10+, 0.36.2 on 3.9.
      - dependency-name: "torchcodec"
      - dependency-name: "huggingface-hub"
      # A major bump (huggingface-hub 2.x, pymupdf4llm 0.3 -> 1.x) needs its own review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/studio/src-tauri"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    # GTK3 held at 0.18: newer glib/gdk-pixbuf break native_clipboard.rs; security alerts only.
    ignore:
      - dependency-name: "glib"
        versions: [">= 0.19"]
      - dependency-name: "gdk-pixbuf"
        versions: [">= 0.19"]
      # Same GTK3 family: the direct cairo-rs dep turns on png only for gtk's 0.18; a second
      # cairo-rs (0.22) leaves gtk without png, so browser_capture.rs stops compiling (#13837).
      - dependency-name: "cairo-rs"
        versions: [">= 0.19"]
      # gio: only the proxy resolver gtk builds; 0.19+ adds a second glib next to gtk's 0.18.
      - dependency-name: "gio"
        versions: [">= 0.19"]
      # deep-link 2.6.2 struct literal breaks rust-ini 0.21.3 (E0063, Linux); lift when fixed.
      - dependency-name: "rust-ini"
        versions: [">= 0.21.2"]
      # Lone windows-core bumps add a second copy: move it with webview2-com 0.62 (Cargo.toml).
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-tauri:
        patterns: ["*"]
      cargo-tauri-security:
        applies-to: security-updates
        patterns: ["*"]

  # Version updates suppressed (limit 0); security PRs still flow and are not capped by the limit.
  - package-ecosystem: "npm"
    directory: "/studio/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      npm-frontend-security:
        applies-to: security-updates
        patterns: ["*"]
...
