---
version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only scans .github/workflows. The composite actions under
    # .github/actions pin the same actions (setup-node, cache) and must
    # move in the same PR, or two SHAs of one action end up in the tree.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      # Semver cooldown knobs are rejected for github-actions; only default-days applies.
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        # One PR per action across both directories; tests/studio/
        # test_actions_are_pinned_to_commits.py wants one SHA per action.
        group-by: dependency-name
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # No bun entry: /studio/frontend has no bun.lock, so it would silently no-op.

  - package-ecosystem: "npm"
    directory: "/studio/backend/core/data_recipe/oxc-validator"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      npm-oxc-validator:
        patterns: ["*"]
      npm-oxc-validator-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # pyproject.toml is a hand-kept matrix: many packages are split by Python version or
    # accelerator (typer / fastapi / uvicorn / gguf for 3.9, triton / flash-attn wheel URLs),
    # and a version update rewrites every copy of a requirement at once. Version-update PRs
    # stay off, as for /studio/frontend; security PRs have their own limit and still open.
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    # pyproject.toml pins these by hand: torch / torchvision per CUDA extra (with the
    # matching +cuXXX tag and xformers wheel), and transformers / datasets / bitsandbytes
    # to tested windows with `!=` exclusions. Dependabot rewrites each whole specifier
    # (#13833, #14469 collapsed every cuXXX-torchYYY extra to plain torch==2.14.1), so
    # these move with the version matrix by hand. Advisories still show as alerts.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "torchaudio"
      - dependency-name: "xformers"
      - dependency-name: "bitsandbytes"
      - dependency-name: "transformers"
      - dependency-name: "datasets"
      # Also hand-kept: torchcodec per audio-torch extra (matched to each torch line), and
      # huggingface-hub split by Python version (1.x needs 3.10+, 3.9 stays on 0.36.2).
      - dependency-name: "torchcodec"
      - dependency-name: "huggingface-hub"
      # A major bump (huggingface-hub 2.x, pymupdf4llm 0.3 -> 1.x) needs its own review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/studio/src-tauri"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    # gtk-rs GTK3 bindings are frozen at 0.18; newer glib/gdk-pixbuf break native_clipboard.rs.
    # This also suppresses security PRs above 0.18, leaving alerts only.
    ignore:
      - dependency-name: "glib"
        versions: [">= 0.19"]
      - dependency-name: "gdk-pixbuf"
        versions: [">= 0.19"]
      # Same GTK3 family: the direct cairo-rs dep exists only to turn on the
      # `png` feature of gtk's own cairo-rs 0.18. A second cairo-rs (0.22)
      # leaves gtk's copy without `png` and browser_capture.rs stops
      # compiling (`write_to_png` not found), as in #13837.
      - dependency-name: "cairo-rs"
        versions: [">= 0.19"]
      # gio is only used for the proxy resolver gtk already builds; 0.19+
      # adds a second glib next to gtk's 0.18.
      - dependency-name: "gio"
        versions: [">= 0.19"]
      # tauri-plugin-deep-link 2.6.2 builds rust-ini's ParseOption as a
      # struct literal, and 0.21.3 added fields to it, so Linux stops
      # compiling (E0063). Lift once deep-link builds against 0.21.3.
      - dependency-name: "rust-ini"
        versions: [">= 0.21.2"]
      # windows-core must match the copy webview2-com and tauri build on
      # (Cargo.toml: "Keep these versions aligned with Tauri's WebView2
      # controller bindings"); a lone windows-core bump puts a second copy
      # next to webview2-com's 0.62. Move it by hand with webview2-com.
      - dependency-name: "windows-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-tauri:
        patterns: ["*"]
      cargo-tauri-security:
        applies-to: security-updates
        patterns: ["*"]

  # Version updates suppressed (limit 0); security PRs still flow and are not capped by the limit.
  - package-ecosystem: "npm"
    directory: "/studio/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      npm-frontend-security:
        applies-to: security-updates
        patterns: ["*"]
...
