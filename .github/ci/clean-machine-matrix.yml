# The legs of .github/workflows/clean-machine-install-ci.yml, one list per matrix job.
# `pr: true` legs run on pull_request; everything runs nightly, on push to main and on
# workflow_dispatch. The `select` job strips `pr`, so a leg's other keys are exactly what
# the steps read as `matrix.<key>`. macOS is capped at five concurrent jobs account-wide
# and the full set (20 jobs, 7 macOS) never once finished on a PR before the next push
# cancelled it, so the subset keeps one leg per claim and defers OS/arch-only legs.
# tests/studio/test_install_matrix_selection.py pins the counts and the keys.

macos:
  # `overlay` decides whether this ref's Python is under test; the pipe legs stay on the
  # released package on purpose.
  # The reported failure, in the `curl | sh` shape users run, with torch as a consumer
  # gets: the only leg that can see a truncated script or a curl: (56) from an early exit.
  - {os: macos-15, mode: mask,  delivery: pipe,  flags: '',           experimental: false, overlay: false, pr: true}
  - {os: macos-15, mode: mask,  delivery: file,  flags: '',           experimental: false, overlay: true,  pr: true}
  # What the desktop app runs: no tty, stdin closed, TAURI markers on, legacy ~/.unsloth.
  - {os: macos-15, mode: mask,  delivery: tauri, flags: '',           experimental: false, overlay: true,  pr: false}
  # Toolchain present but logged: uv's managed-libpython self-ID patch is the one call
  # allowed. No overlay: setuptools-scm's editable build would call git itself.
  - {os: macos-15, mode: trace, delivery: file,  flags: '',           experimental: false, overlay: false, pr: true}
  # --no-torch is the one macOS path that can still want a compiler (no guaranteed cp313
  # arm64 sentencepiece wheel), so probe it apart from the default path.
  - {os: macos-15, mode: mask,  delivery: file,  flags: '--no-torch', experimental: true,  overlay: true,  pr: false}
  # The next macOS image, same asserts as the macos-15 file leg.
  - {os: macos-26, mode: mask,  delivery: file,  flags: '',           experimental: true,  overlay: true,  pr: false}
  # Intel pins python 3.12 and its /usr/bin/git is not CLT-provided, so it survives
  # masking. Informational only.
  - {os: macos-15-intel, mode: mask, delivery: file, flags: '',       experimental: true,  overlay: true, allow_working: 'git', pr: false}

linux:
  # Root + apt: _smart_apt_install self-heals from an image with no curl, git, gcc or
  # cmake. Nightly only: the nonroot leg below proves everything this one does and more.
  - label: ubuntu2404-root
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    pr: false
  # The arm64 dimension of the root leg.
  - label: ubuntu2404-arm-root
    image: ubuntu:24.04
    runner: ubuntu-24.04-arm
    experimental: false
    overlay: true
    pr: false
  # No elevation, but WITH the transport the one-liner needs: no elevation path anywhere
  # on the image, no toolchain, ca-certificates + curl and nothing else. Since #7547 the
  # optional set never escalates, so this must install end to end off prebuilt llama.cpp.
  # overlay: true because the RELEASED install_python_stack.py has no "skip triton kernels
  # when git is missing" guard and would die at the final step on release lag alone.
  - label: ubuntu2404-nonroot
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    nonroot: true
    pr: true
  # The same premise with the OTHER transport. install.sh falls back to wget everywhere it
  # prefers curl (729-738, 1019-1027, 3064-3067) and calls the transport missing only when
  # BOTH are gone (2077-2079), so a wget-only box (Debian netinst default) is supported on
  # paper and had never been run: the row above provisions curl, which won every probe.
  - label: ubuntu2404-nonroot-wget
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    nonroot: true
    wget_only: true
    pr: false
  # No elevation AND no transport, so failing is correct: pin the exact message and prove
  # it actionable rather than a bare `curl: (56)`. No overlay: it never reaches a venv.
  - label: ubuntu2404-nonroot-notransport
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: false
    nonroot: true
    no_transport: true
    pr: true
  # Non-apt: hard-fails at install.sh:2034 today. Tolerate the install STEP, not the job:
  # job-level continue-on-error would swallow the outcome assertion too.
  - label: fedora41
    image: fedora:41
    runner: ubuntu-latest
    experimental: false
    overlay: true
    tolerate_install_failure: true
    pr: false

windows:
  - os: windows-latest
    winget: 'visible'
    experimental: false
    overlay: true
    pr: true
  # The no-winget path (LTSC / Server / managed corporate) falls back to python.org +
  # astral.sh and is where Ensure-VCRedist silently does not run, leaving torch unable to
  # load: hence the explicit `import torch` assert below. #7549 relaxed setup.ps1's
  # unconditional git gate (1750-1759), and the assert proves it took the relaxed branch
  # rather than passing on git leaking back onto PATH.
  - os: windows-latest
    winget: 'masked'
    experimental: false
    overlay: true
    pr: false
  # Windows on ARM gets a native ARM64 CPython and torchaudio publishes no win_arm64 wheel
  # (nor do pyarrow and hf-transfer), so PyTorch could not resolve until #7549 made the
  # installer prefer an emulated x64 interpreter (install.ps1:1160-1253, 1335-1353). The
  # assert below checks that outcome, not the log line announcing it.
  - os: windows-11-arm
    winget: 'visible'
    experimental: false
    overlay: true
    pr: false

windows_container_install:
  # The consumer path: install.ps1 from this ref, unsloth from PyPI, so studio/setup.ps1
  # comes out of the RELEASED wheel rather than this ref's. Both rows gate.
  - overlay: false
    pr: false
  # This ref's studio/setup.ps1 and install_python_stack.py, via UNSLOTH_CI_SOURCE_OVERLAY
  # (install.ps1:2643); without it a branch changing setup.ps1 proves nothing. On PRs too:
  # the only environment with no preinstalled VC++ runtime.
  - overlay: true
    pr: true
