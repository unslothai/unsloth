# The legs of .github/workflows/clean-machine-install-ci.yml, one list per matrix job.
#
# `pr: true` legs run on every pull_request that touches an installer. Everything runs
# on the nightly schedule, on push to main and on workflow_dispatch. The `select` job in
# the workflow reads this file and hands each job its `include` list, with `pr` stripped,
# so a leg's other keys are exactly what the job steps read through `matrix.<key>`.
#
# Why a subset on PRs: the full set is 20 jobs, 7 of them macOS, and macOS is capped at
# five concurrent jobs account-wide. On the 20 PRs audited before this file existed the
# full set never once finished; every run was cancelled by the next push while its
# macOS legs were still queued, which also starved every other macOS job in the org.
# The PR subset keeps one leg per claim the workflow makes (the reported dependency
# gate with this ref's Python under test, the trace/dylib-patch contract, the nonroot
# Linux install, the no-transport diagnostics, the Windows scrub) and leaves the
# dimensions that only vary the OS, the arch or the delivery shape to the nightly.
#
# tests/studio/test_install_matrix_selection.py pins the counts and the keys.

# ── macOS: the reported failure ────────────────────────────────────────────
macos:
  # `overlay` decides whether this ref's Python is under test at all; see the workflow
  # header. The pipe legs stay on the released package on purpose.
  #
  # The reported failure, in the shape users run it, with torch because that is
  # what a consumer gets.
  # Nightly only: pipe delivery differs from file delivery only in how the script
  # arrives (`curl | sh` truncation, curl: (56) on an early exit).
  - {os: macos-15, mode: mask,  delivery: pipe,  flags: '',           experimental: false, overlay: false, pr: false}
  - {os: macos-15, mode: mask,  delivery: file,  flags: '',           experimental: false, overlay: true,  pr: true}
  # What the desktop app runs: no tty, stdin closed, TAURI markers on.
  # Nightly only: the invocation shape and the legacy ~/.unsloth root.
  - {os: macos-15, mode: mask,  delivery: tauri, flags: '',           experimental: false, overlay: true,  pr: false}
  # Toolchain present but logged: uv may make exactly one kind of developer-tool
  # call, its managed-libpython self-ID patch. No overlay: the editable build calls
  # git itself (setuptools-scm), planting evidence unrelated to the consumer path.
  - {os: macos-15, mode: trace, delivery: file,  flags: '',           experimental: false, overlay: false, pr: true}
  # --no-torch is the one macOS path that can still want a compiler
  # (sentencepiece has no guaranteed cp313 arm64 wheel), so probe it apart from
  # the default path rather than let it hide the gate under test.
  # Nightly only: the --no-torch flag and the "torch genuinely absent" assert.
  - {os: macos-15, mode: mask,  delivery: file,  flags: '--no-torch', experimental: true,  overlay: true,  pr: false}
  # Nightly only: the next macOS image, same asserts as the macos-15 file leg.
  - {os: macos-26, mode: mask,  delivery: file,  flags: '',           experimental: true,  overlay: true,  pr: false}
  # Intel pins python 3.12 and its /usr/bin/git is not CLT-provided, so it
  # survives masking. Informational only.
  # Nightly only: the Intel SKIP_TORCH path and the non-CLT git.
  - {os: macos-15-intel, mode: mask, delivery: file, flags: '',       experimental: true,  overlay: true, allow_working: 'git', pr: false}

# ── Linux: genuinely clean containers ──────────────────────────────────────
linux:
  # Root + apt: install.sh's _smart_apt_install should self-heal from a base
  # image with no curl, git, gcc or cmake at all.
  # Nightly only: the root self-heal path; the nonroot leg below makes every claim
  # this one does and adds the elevation proof on top.
  - label: ubuntu2404-root
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    pr: false
  # Nightly only: the arm64 dimension of the root leg.
  - label: ubuntu2404-arm-root
    image: ubuntu:24.04
    runner: ubuntu-24.04-arm
    experimental: false
    overlay: true
    pr: false
  # No elevation, but WITH the transport the advertised one-liner needs: not
  # root, no sudo anywhere on the image, no toolchain, ca-certificates + curl and
  # nothing else. Since #7547 the optional set (cmake, git, build-essential,
  # libcurl4-openssl-dev) never escalates, so this must install end to end off
  # prebuilt llama.cpp, and until now nothing proved it.
  #
  # Gating, and overlay: true for the reason fedora41 is: the RELEASED
  # install_python_stack.py has no "skip triton kernels when git is missing"
  # guard, so without the overlay the run reaches the final step and dies there
  # on pure release lag (staging run 30421021166: venv, frontend, torch and
  # extras all fine, then `Installing triton kernels (pip) failed`).
  - label: ubuntu2404-nonroot
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    nonroot: true
    pr: true
  # The same premise with the OTHER transport. install.sh's download() prefers
  # curl and falls back to wget (729-738), _http_get does the same for the
  # connectivity probe (1019-1027), the Radeon listing repeats it (3064-3067),
  # and _check_linux_deps calls the transport missing only when BOTH are gone
  # (2077-2079). So a box with wget and no curl -- a Debian netinst default, and
  # every image where curl was deliberately removed -- is supported on paper and
  # had never been run: the nonroot row above provisions ca-certificates AND
  # curl, so curl won every probe and the wget branch was only ever reasoned from
  # the code. This row asserts everything that one does, plus curl proved absent
  # for the whole run rather than merely unused.
  # Nightly only: the wget-only transport branch.
  - label: ubuntu2404-nonroot-wget
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    nonroot: true
    wget_only: true
    pr: false
  # No elevation AND no transport. apt is the only way to get curl and reaching
  # apt needs elevation, so failing is correct; the point is to pin the exact
  # message and prove it is actionable rather than a bare `curl: (56)`. No
  # overlay: it never reaches a venv to overlay into. Dies at the elevation gate,
  # so it costs seconds: the cheapest proof that install.sh's early diagnostics
  # still work.
  - label: ubuntu2404-nonroot-notransport
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: false
    nonroot: true
    no_transport: true
    pr: true
  # Non-apt: today this hard-fails at install.sh:2034. Expected; forces the
  # decision on whether dnf/pacman/zypper get supported. Tolerate the install
  # step, not the job, exactly as the no-transport row does: job-level
  # continue-on-error would swallow the outcome assertion too, leaving it
  # unable to fail the run.
  # Nightly only: the non-apt outcome pin.
  - label: fedora41
    image: fedora:41
    runner: ubuntu-latest
    experimental: false
    overlay: true
    tolerate_install_failure: true
    pr: false

# ── Windows: the consumer path with the toolchain scrubbed ─────────────────
windows:
  - os: windows-latest
    winget: 'visible'
    experimental: false
    overlay: true
    pr: true
  # The no-winget path (LTSC / Server / managed corporate machines) falls back to
  # python.org + astral.sh and is untested today. It is also where Ensure-VCRedist
  # silently does not run, leaving torch unable to load, hence the explicit
  # `import torch` assert below. It used to stop at setup.ps1's unconditional "Git
  # is required but could not be installed automatically" gate -- no winget, no way
  # to fetch git -- and was a pinned known failure until #7549 relaxed that gate to
  # the --local and llama.cpp source paths that really use git (setup.ps1:1750-1759).
  # The row now gates like any other; the assert below proves it took the relaxed
  # branch rather than passing on git leaking back onto PATH.
  # Nightly only: the no-winget fallback and the relaxed git gate.
  - os: windows-latest
    winget: 'masked'
    experimental: false
    overlay: true
    pr: false
  # Windows on ARM gets a native ARM64 CPython, and torchaudio has never published a
  # win_arm64 wheel (nor have pyarrow and hf-transfer, which datasets pulls in), so
  # the PyTorch step could not resolve and install.ps1 stopped at "Failed to install
  # PyTorch". Pinned until #7549 made the installer prefer an x64 interpreter on an
  # ARM64 host and bootstrap one when only ARM64 exists (install.ps1:1160-1253,
  # 1335-1353); x64 wheels run fine emulated. The row now gates, and the assert
  # below checks the outcome that fix must produce, not the log line announcing it.
  # Nightly only: the ARM64 x64-interpreter preference and torchaudio resolution.
  - os: windows-11-arm
    winget: 'visible'
    experimental: false
    overlay: true
    pr: false

# ── Windows Server Core container: no Store, no winget, no VC++ runtime ────
windows_container_install:
  # The consumer path: install.ps1 from this ref, unsloth from PyPI, so
  # studio/setup.ps1 comes out of the RELEASED wheel rather than this ref's. That is
  # the difference from the overlay row below; both are expected to install end to
  # end and both gate.
  # Nightly only: the released-wheel consumer path in the container.
  - overlay: false
    pr: false
  # This ref's studio/setup.ps1 and install_python_stack.py, via
  # UNSLOTH_CI_SOURCE_OVERLAY (install.ps1:2643). Without it a branch changing
  # setup.ps1 gets a green run proving nothing about the change.
  # Nightly only: the only environment with no preinstalled VC++ runtime, so the
  # direct-download fallback is proved here and nowhere else. The probe job it
  # depends on is skipped with it on PRs.
  - overlay: true
    pr: false
