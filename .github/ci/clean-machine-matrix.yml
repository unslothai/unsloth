# `pr: true` legs run on pull_request; all run nightly, on main and on dispatch.
# Counts and keys are pinned by tests/studio/test_install_matrix_selection.py.

macos:
  # `overlay` decides whether this ref's Python is under test; pipe legs use the released package.
  - {os: macos-15, mode: mask,  delivery: pipe,  flags: '',           experimental: false, overlay: false, pr: true}
  - {os: macos-15, mode: mask,  delivery: file,  flags: '',           experimental: false, overlay: true,  pr: true}
  # What the desktop app runs: no tty, stdin closed, TAURI markers on.
  - {os: macos-15, mode: mask,  delivery: tauri, flags: '',           experimental: false, overlay: true,  pr: false}
  # No overlay: setuptools-scm's editable build would call git itself.
  - {os: macos-15, mode: trace, delivery: file,  flags: '',           experimental: false, overlay: false, pr: true}
  # --no-torch may still need a compiler on macOS (no guaranteed cp313 arm64 sentencepiece wheel).
  - {os: macos-15, mode: mask,  delivery: file,  flags: '--no-torch', experimental: true,  overlay: true,  pr: false}
  - {os: macos-26, mode: mask,  delivery: file,  flags: '',           experimental: true,  overlay: true,  pr: false}
  # Intel's /usr/bin/git is not CLT-provided, so it survives masking.
  - {os: macos-15-intel, mode: mask, delivery: file, flags: '',       experimental: true,  overlay: true, allow_working: 'git', pr: false}

linux:
  - label: ubuntu2404-root
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    pr: false
  - label: ubuntu2404-arm-root
    image: ubuntu:24.04
    runner: ubuntu-24.04-arm
    experimental: false
    overlay: true
    pr: false
  # overlay: true because the released install_python_stack.py lacks the missing-git triton guard.
  - label: ubuntu2404-nonroot
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    nonroot: true
    pr: true
  # Same premise with wget as the only transport.
  - label: ubuntu2404-nonroot-wget
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: true
    nonroot: true
    wget_only: true
    pr: false
  # No elevation and no transport: failing is correct; this pins the error message.
  - label: ubuntu2404-nonroot-notransport
    image: ubuntu:24.04
    runner: ubuntu-latest
    experimental: false
    overlay: false
    nonroot: true
    no_transport: true
    pr: true
  # Non-apt fails today. Tolerate the install step, not the job, or the outcome assertion is swallowed too.
  - label: fedora41
    image: fedora:41
    runner: ubuntu-latest
    experimental: false
    overlay: true
    tolerate_install_failure: true
    pr: false

windows:
  - os: windows-latest
    winget: 'visible'
    experimental: false
    overlay: true
    pr: true
  # The no-winget path skips Ensure-VCRedist, hence the explicit `import torch` assert.
  - os: windows-latest
    winget: 'masked'
    experimental: false
    overlay: true
    pr: false
  # Windows on ARM must end up on an emulated x64 interpreter; the assert checks that outcome.
  - os: windows-11-arm
    winget: 'visible'
    experimental: false
    overlay: true
    pr: false

windows_container_install:
  # Consumer path: studio/setup.ps1 comes from the released wheel.
  - overlay: false
    pr: false
  # This ref's setup.ps1 via UNSLOTH_CI_SOURCE_OVERLAY; without it a setup.ps1 change proves nothing.
  - overlay: true
    pr: true
