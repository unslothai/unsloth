# `pr: true` legs run on pull_request. Every leg is a hard gate.
# Counts and keys are pinned by tests/studio/test_install_matrix_selection.py.

interrupt:
  # Kill on a printed marker, never a delay: timed waits landed in the wrong phase.
  - {os: macos-15, label: studio-deps, marker: 'Unsloth Studio deps', pr: true}
  # No venv leg: that phase is shorter than any poll interval.
  - {os: macos-15, label: torch,       marker: '\[TAURI:STEP\] Installing PyTorch', pr: false}
  - {os: macos-15, label: unsloth,     marker: '\[TAURI:STEP\] Installing Unsloth', pr: false}
  - {os: macos-15, label: setup,       marker: '\[TAURI:STEP\] Running Unsloth setup', pr: false}
  - {os: macos-15, label: unsloth-extras, marker: 'unsloth extras', pr: false}
  - {os: macos-15, label: data-designer,  marker: 'data designer deps', pr: false}
  - {os: ubuntu-latest, label: studio-deps, marker: 'Unsloth Studio deps', pr: false}
  - {os: ubuntu-latest, label: torch, marker: '\[TAURI:STEP\] Installing PyTorch', pr: true}

interrupt_windows:
  # install.ps1 parses `--no-torch`; `-SkipTorch` is silently dropped.
  - {label: studio-deps, marker: 'Unsloth Studio deps', installArgs: '--tauri --no-torch --local', pr: false}
  - {label: torch, marker: 'Installing PyTorch', installArgs: '--tauri --local', pr: false}
