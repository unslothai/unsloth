[project.urls]
homepage = "https://unsloth.ai"
documentation = "https://unsloth.ai/docs"
repository = "https://github.com/unslothai/unsloth"

[tool.ruff]
target-version = "py311"
line-length = 100
force-exclude = true
extend-exclude = [
    "*chat_templates.py",
    "*ollama_template_mappers.py",
    "*_auto_install.py",
    "*mapper.py",
    # Vendored upstream source: reformatting it would break the digest test.
    "studio/backend/vendor/",
    "unsloth/_vendor/",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = [
    "E402",
    "E722",
    "F403",
    "F405",
    "F811",
    "F821",
    "F841",
    "F401",
    "E731",
    "E741",
    "F601",
    "E712",
]

[tool.ruff.format]

[tool.pytest.ini_options]
# A bare `pytest` must not pick up the GPU-heavy tests; CI runs tests/security explicitly.
testpaths = ["tests/security"]
pythonpath = ["."]

# Markers make the slow, checkpoint-downloading tests opt-in under `pytest tests/`.
markers = [
    "gpu: needs a real accelerator, and usually downloads a checkpoint to use it",
    "slow: minutes rather than seconds, and covered again more cheaply elsewhere",
    "reads_real_pip_config: opts out of the hermetic pip config stub, for the few tests that drive that read themselves",
    "native_mxc: needs native Windows, the pinned Microsoft WXC executable, and a working MXC ProcessContainer backend",
]

# CI runs these with `-m 'gpu or slow'`; live Studio tests need `-m server`.
addopts = "-m 'not gpu and not slow and not server and not native_mxc'"
