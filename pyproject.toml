[build-system]
requires = [
    # setuptools 83+ needs Python 3.10, and we still support 3.9 source installs.
    "setuptools==84.1.0; python_version >= '3.10'",
    "setuptools==82.0.1; python_version < '3.10'",
    "setuptools-scm==9.2.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "unsloth"
dynamic = ["version"]
description = "2-5X faster training, reinforcement learning & finetuning"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "Apache-2.0"
keywords = ["ai", "llm", "reinforcement learning", "machine learning", "artificial intelligence", "pytorch"]
authors = [
    {email = "info@unsloth.ai"},
    {name = "Unsloth AI team"},
]
maintainers = [
    {name = "Daniel Han", email = "daniel@unsloth.ai"},
    {name = "Michael Han", email = "info@unsloth.ai"},
]
classifiers = [
    "Programming Language :: Python",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "unsloth_zoo>=2026.10.11",
    "wheel>=0.42.0",
    "packaging",
    # Ceiling tracks the newest torch an extra pins: the cu126/cu130-torch2140 leaves ask
    # for 2.14.0, and Studio installs torch 2.13 on the cu130 route, which a <2.13.0 base
    # would downgrade on the next `unsloth studio update`.
    "torch>=2.4.0,<2.15.0",
    "torchvision",
    "numpy",
    "tqdm",
    "psutil",
    "tyro",
    "protobuf",
    "xformers>=0.0.27.post2 ; ('linux' in sys_platform or sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "bitsandbytes>=0.45.5,!=0.46.0,!=0.48.0",
    "triton>=3.0.0 ; ('linux' in sys_platform)",
    "triton-windows ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "sentencepiece>=0.2.0",
    "datasets>=3.4.1,!=4.0.*,!=4.1.0,!=4.4.*,!=4.5.0,<5.0.0",
    "accelerate>=0.34.1",
    "peft>=0.18.0,!=0.11.0",
    "huggingface_hub>=0.34.0",
    "hf_transfer",
    "diffusers",
    "transformers>=4.52.4,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,!=4.57.0,!=4.57.4,!=4.57.5,!=5.0.0,!=5.1.0,<=5.17.0",
    "trl>=0.18.2,!=0.19.0,<=1.15.0",
    "typer>=0.19.0",
    "rich",
    "pydantic",
    "pyyaml",
    "json5>=0.9.25",
    "nest-asyncio",
    "huggingface-hub>=0.34.0",
    # CLI commands import studio.backend.*, which imports structlog at module level.
    "structlog>=24.1.0",
    "click>=8.0",
    "rich",
    "certifi>=2026.10.19",
]

[project.scripts]
unsloth = "unsloth_cli:app"

[tool.setuptools.dynamic]
version = {attr = "unsloth._version.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"unsloth._vendor.clef" = ["LICENSE", "README.md", "clef_manifest.json"]
unsloth_cli = ["codex_fallback_prompt.md", "pi_subagent.ts"]
studio = [
    "*.sh",
    "*.ps1",
    "*.bat",
    "node_prebuilt_pins.json",
    "lemonade_prebuilt_pins.json",
    "q4nx_converter_pins.json",
    "src-tauri/icons/icon.icns",
    "src-tauri/icons/icon.png",
    "frontend/dist/**/*",
    "frontend/*.json",
    "frontend/*.ts",
    "frontend/*.js",
    "frontend/*.html",
    "frontend/*.yaml",
    "frontend/.git*",
    "backend/requirements/**/*",
    "backend/vendor/**/*",
    "backend/integrations/blender/*.py",
    "backend/plugins/**/*",
    "backend/assets/**/*.jinja",
    "backend/assets/**/*.html",
    # Served locally instead of from a CDN; without them /docs and /redoc render blank.
    "backend/assets/docs_ui/*",
    # Gate verdicts the auto ladder reads: if missing from the wheel, nvfp4 silently drops out.
    "backend/core/inference/nvfp4_gate_record.json",
    "backend/core/data_recipe/oxc-validator/*.json",
    "backend/core/data_recipe/oxc-validator/*.mjs",
    "backend/core/inference/bundled_skills/**/*.md",
    "systemd/*",
]

[tool.setuptools.packages.find]
include = ["unsloth*", "unsloth_cli*", "studio", "studio.backend*"]
exclude = [
    "images*",
    "tests*",
    "studio.backend.tests*",
    "studio.backend.*.tests*",
    "unsloth_cli.tests*",
    "unsloth.kernels.moe.tests*",
    "unsloth_compiled_cache*",
    "*.unsloth_compiled_cache*",
    "*.node_modules",
    "*.node_modules.*",
]

# include-package-data re-ships excluded test packages as parent data (pypa/setuptools#3260);
# only exclude-package-data outranks it.
[tool.setuptools.exclude-package-data]
"studio.backend" = ["tests/*"]
"studio.backend.hub" = ["tests/*"]
# Same for the frontend source tree: setuptools-scm ships every tracked file, but only
# frontend/dist is read at runtime. Keep src-tauri/icons: install.sh reads icons from it.
"studio" = [
    "frontend/public/**",
    "frontend/src/**",
    "frontend/package-lock.json",
    "src-tauri/src/**",
    "src-tauri/linux/**",
    "src-tauri/windows/**",
    "src-tauri/dmg/**",
    "src-tauri/capabilities/**",
    "src-tauri/Cargo.lock",
    "src-tauri/Cargo.toml",
    "src-tauri/build.rs",
    "src-tauri/*.plist",
    "src-tauri/tauri*.json",
]

[project.optional-dependencies]
# Mirrors studio/backend/requirements/studio.txt; test_studio_extra_matches_requirements.py checks drift.
studio = [
    "typer==0.27.1 ; python_version >= '3.10'",
    "typer==0.23.2 ; python_version < '3.10'",
    "fastapi==0.141.1 ; python_version >= '3.10'",
    "fastapi==0.128.8 ; python_version < '3.10'",
    "uvicorn==0.52.1 ; python_version >= '3.10'",
    "uvicorn==0.39.0 ; python_version < '3.10'",
    "pydantic==2.13.4",
    "packaging==26.3",
    "matplotlib==3.10.9",
    # win_arm64 pandas wheels start at 3.0; the 3.11 floor is pandas 3's own requires-python.
    "pandas==2.3.3 ; sys_platform != 'win32' or platform_machine != 'ARM64' or python_version < '3.11'",
    "pandas>=3.0,<4 ; sys_platform == 'win32' and platform_machine == 'ARM64' and python_version >= '3.11'",
    "nest_asyncio==1.6.0",
    "datasets==4.3.0",
    "pyjwt==2.15.1",
    "huggingface-hub>=1.32.0,<2.0 ; python_version >= '3.10'",
    "huggingface-hub==0.36.2 ; python_version < '3.10'",
    "hf-xet>=1.5.2,<2.0 ; python_version >= '3.10' and (platform_machine == 'x86_64' or platform_machine == 'amd64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or platform_machine == 'ARM64')",
    "urllib3>=2.8.0 ; python_version >= '3.10'",
    "urllib3>=2.3.0 ; python_version < '3.10'",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "diceware==1.0.1",
    "json5>=0.9.25",
    "ddgs==9.14.4 ; python_version >= '3.10'",
    "ddgs==9.8.0 ; python_version < '3.10'",
    "cryptography>=42.0.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Windows on ARM: 46.0.7 publishes no win_arm64 wheel and the sdist needs Rust.
    "cryptography>=42.0.0,<=46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "httpx>=0.27.0",
    "fastmcp>=3.0.2",
    "gguf==0.19.0 ; python_version >= '3.10'",
    "gguf==0.18.0 ; python_version < '3.10'",
    "av>=12.3.0",
    # No win_arm64 wheel or sdist; RAG treats a missing sqlite_vec as unavailable.
    "sqlite-vec==0.1.9 ; sys_platform != 'win32' or platform_machine != 'ARM64'",
    # Mirrors studio.txt: pymupdf publishes a win_arm64 wheel from 1.28 only.
    "pymupdf==1.27.2.3 ; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pymupdf>=1.28.2 ; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "pymupdf4llm==0.3.4",
    "python-docx==1.2.0",
    "markdown-it-py>=3.0",
]

# Optional AWS S3 dataset loading; kept out of the default Studio installation.
s3 = ["boto3>=1.34.0"]

triton = [
    # Not raised past 3.0.0: torch 2.6.0 pins triton==3.2.0, so a higher floor makes it unresolvable.
    # Known triton defects are gated in unsloth_zoo/loss_utils.py and unsloth/import_fixes.py.
    "triton>=3.0.0 ; ('linux' in sys_platform)",
    # triton-windows has win_arm64 wheels from 3.8.0.post28, so a floor works here, not a marker.
    "triton-windows ; (sys_platform == 'win32') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
    "triton-windows>=3.8.0.post28 ; (sys_platform == 'win32') and platform_machine == 'ARM64'",
]
huggingface = [
    "unsloth_zoo>=2026.10.11",
    "wheel>=0.42.0",
    "packaging",
    "torchvision",
