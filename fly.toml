# fly.toml app configuration file generated for unsloth on 2026-09-24T18:59:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'unsloth'
primary_region = 'lhr'

[build]
  image = "unsloth/unsloth:studio"

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '8gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 8192

[mounts]
  source = "myapp_data"
  destination = "/data"
  processes = ["disk"] # optional - attach volumes to Machines that belong to one or more process groups
  initial_size = "64gb" # optional - the size of the volume created on first deploy
