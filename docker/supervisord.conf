# Service manager for the full Unsloth image (Dockerfile.studio):
#   studio   Unsloth Studio web UI          port 8000
#   jupyter  JupyterLab for the notebooks   port $JUPYTER_PORT (default 8888)
#   sshd     key-only SSH for cloud hosts   port 22
#
# All log to stdout/stderr so `docker logs` shows Jupyter's startup line and, via the
# one-shot studio-password program, the Studio admin password.

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[program:studio]
; the wrapper applies the initial password only while none is stored, so respawns
; (crash, unsloth-studio-update, docker restart) never hand the CLI a rejected one
command=/usr/local/bin/unsloth-studio-run
directory=/workspace
autostart=true
; a clean exit (0) stays down: that is the bootstrap timeout shutting Studio off
; because the default password was never changed, or /api/shutdown; a restart would
; hand out the same credential with a fresh timer. Crashes still restart.
autorestart=unexpected
exitcodes=0
startretries=3
startsecs=5
environment=HOME="/root",USER="root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One shot: prints the Studio admin credential once Studio has written it.
[program:studio-password]
command=/usr/local/bin/unsloth-studio-password
autostart=true
autorestart=false
startsecs=0
exitcodes=0
environment=HOME="/root",USER="root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:jupyter]
command=jupyter lab --no-browser --ip=0.0.0.0 --port=%(ENV_JUPYTER_PORT)s --allow-root --notebook-dir=/workspace
directory=/workspace
autostart=true
autorestart=true
; HOME pins config lookup to /root/.jupyter (where the launcher wrote the
; password config); without it an unset HOME falls back to token auth.
environment=HOME="/root",USER="root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Optional public Cloudflare quick-tunnel for JupyterLab. Started only when
; UNSLOTH_JUPYTER_CLOUDFLARE=1 (studio_launch.sh exports a 0 default so this
; expands). The trycloudflare URL is printed to docker logs by cloudflared.
[program:jupyter-cloudflare]
command=/usr/local/bin/unsloth-jupyter-tunnel
directory=/workspace
autostart=%(ENV_UNSLOTH_JUPYTER_CLOUDFLARE)s
autorestart=true
startsecs=5
environment=HOME="/root",USER="root"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=%(ENV_UNSLOTH_ENABLE_SSHD)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
