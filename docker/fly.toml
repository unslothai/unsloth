# fly.toml app configuration file generated for unsloth on 2026-09-25T08:01:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'unsloth'
primary_region = 'iad'
swap_size_mb = 8196

[experimental]
  entrypoint = ['/usr/local/bin/unsloth-entrypoint']

[build]

[[mounts]]
  source = 'myapp_data'
  destination = '/data'
  initial_size = '32gb'
  processes = ['disk']

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
