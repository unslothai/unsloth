# pre-commit.ci reads its settings only from this file. autofix_prs is stated because the
# sync-allow-scripts-pins hook depends on it.
ci:
  autofix_prs: true
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore: pre-commit autoupdate"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix
        exclude: '\.ipynb$'
  - repo: local
    hooks:
      - id: ruff-format-with-kwargs
        name: Ruff format with kwarg spacing
        # `python <script>`, not a direct exec: autofix commits can drop the executable bit.
        entry: python scripts/run_ruff_format.py
        language: python
        types: [python]
        # Mirror ruff's [tool.ruff] extend-exclude so this hook does not
        # half-process files ruff itself skips (which produced churn). vendor/ is
        # repeated here because this hook does not read ruff's config.
        exclude: '(chat_templates|ollama_template_mappers|_auto_install|mapper)\.py$|^studio/backend/vendor/|^unsloth/_vendor/'
        additional_dependencies:
          - ruff==0.6.9
      # pre-commit.ci pushes the fix to PR branches (Dependabot's too), so stale pins heal.
      - id: sync-allow-scripts-pins
        name: Sync allowScripts pins with the frontend lockfile
        # `python <script>`, not a direct exec: autofix commits can drop the executable bit.
        entry: python scripts/sync_allow_scripts_pins.py
        args: [--fix]
        language: python
        files: ^studio/frontend/(package\.json|package-lock\.json)$
        pass_filenames: false
