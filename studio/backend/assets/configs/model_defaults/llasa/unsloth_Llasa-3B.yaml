# Model defaults for unsloth/Llasa-3B
# Based on Llasa_TTS_(3B).ipynb and Llasa_TTS_(1B).ipynb
# Also applies to: HKUSTAudio/Llasa-1B
# added inference parameters from unsloth notebook

training:
  max_seq_length: 2048
  # num_epochs: 4
  num_epochs: 0
  learning_rate: 5e-4
  batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 5
  max_steps: 30
  save_steps: 30
  weight_decay: 0.001
  random_seed: 3407
  packing: false
  train_on_completions: true
  gradient_checkpointing: "unsloth"
  optim: "adamw_8bit"
  lr_scheduler_type: "linear"

lora:
  lora_r: 128
  lora_alpha: 128
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "v_proj"
  use_rslora: false
  use_loftq: false
  use_dora: false

logging:
  enable_wandb: false
  wandb_project: "llm-finetuning"
  enable_tensorboard: false
  tensorboard_dir: "runs"
  log_frequency: 10

inference:
  temperature: 1.2
  # 1.0 is nucleus sampling off, which is what a value above 1 was reaching for.
  # top_p is a probability: ChatCompletionRequest is ge=0/le=1 and _SAMPLING_FIELDS
  # is (0.0, 1.0), so 1.2 was recommended to the Chat UI and then 422'd by the very
  # endpoint the UI sends it to, failing every generation on this model.
  top_p: 1.0

