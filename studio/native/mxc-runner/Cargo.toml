[package]
name = "unsloth-mxc-runner"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[features]
default = []
# Enable only with an MXC revision carrying the generic API documented in
# upstream/mxc-ca7ea12-no-dacl-tier.patch. Builds without it compile but refuse
# before spawn, so an unextended dependency cannot silently enable Tier 3.
mxc-no-dacl-api = []
# Deliberately excluded from packaged builds. Fault stages are read only from
# the supervisor process environment and never from a launch request.
mxc-test-failure-injection = []

[dependencies]
mxc-sdk = { git = "https://github.com/microsoft/mxc.git", rev = "ca7ea12ac6bd9f5420d6adecb37e32a8158da476" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
