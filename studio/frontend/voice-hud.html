<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Unsloth voice typing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The overlay window is transparent and has no theme; this entry deliberately
         skips the main shell's theme and reload scripts. The crypto polyfill is
         still needed by the shared modules the overlay imports. -->
    <script src="/crypto-boot.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .vt-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      /* 176x44 pill centred in a 248x96 window: the 26px vertical and 36px side
         margins clear the shadow, so it is never clipped by the window bounds. */
      .vt-pill {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 176px;
        height: 44px;
        padding: 0 16px 0 8px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 999px;
        background: rgba(17, 19, 24, 0.94);
        box-shadow:
          0 6px 16px rgba(0, 0, 0, 0.42),
          0 1px 3px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        color: #e8eaee;
        animation: vt-in 140ms ease-out;
      }
      .vt-logo {
        position: relative;
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        cursor: pointer;
        pointer-events: auto;
        outline: none;
      }
      .vt-logo img,
      .vt-stop {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        transition:
          opacity 140ms ease,
          transform 140ms ease;
      }
      .vt-logo img {
        object-fit: cover;
        -webkit-user-drag: none;
      }
      .vt-stop {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ef4444;
        color: #fff;
        opacity: 0;
        transform: scale(0.7);
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.22);
      }
      .vt-stop svg {
        width: 10px;
        height: 10px;
        display: block;
      }
      .vt-logo:hover img,
      .vt-logo:focus-visible img {
        opacity: 0;
        transform: scale(0.7);
      }
      .vt-logo:hover .vt-stop,
      .vt-logo:focus-visible .vt-stop {
        opacity: 1;
        transform: scale(1);
      }
      .vt-logo:active .vt-stop {
        background: #dc2626;
      }
      .vt-wave {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 28px;
      }
      .vt-bar {
        width: 3px;
        height: 4px;
        border-radius: 999px;
        background: var(--vt-accent);
        will-change: height, opacity;
      }
      .vt-time {
        flex: 0 0 auto;
        min-width: 38px;
        text-align: right;
        color: #cbd0d8;
        font-family:
          "JetBrains Mono", "Cascadia Mono", "SF Mono", ui-monospace, Menlo,
          Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      @keyframes vt-in {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .vt-pill {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/voice-hud-main.tsx"></script>
  </body>
</html>
