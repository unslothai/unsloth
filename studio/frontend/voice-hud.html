<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Unsloth voice typing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The overlay window is transparent and has no theme; this entry deliberately
         skips the main shell's theme and reload scripts. The crypto polyfill is
         still needed by the shared modules the overlay imports. -->
    <script src="/crypto-boot.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .vt-stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        pointer-events: none;
      }
      /* 336x52 inside a 400x128 window: the side and vertical margins clear the
         blur radius, so the shadow is never clipped by the transparent bounds. */
      .vt-pill {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 336px;
        height: 52px;
        padding: 0 14px 0 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        background: rgba(15, 17, 21, 0.92);
        box-shadow:
          0 10px 26px rgba(0, 0, 0, 0.5),
          0 2px 6px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
        color: #e8eaee;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        animation: vt-in 150ms ease-out;
      }
      .vt-dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--vt-accent);
        box-shadow: 0 0 0 4px
          color-mix(in srgb, var(--vt-accent) 18%, transparent);
      }
      .vt-recording .vt-dot,
      .vt-preparing .vt-dot {
        animation: vt-pulse 1.4s ease-in-out infinite;
      }
      .vt-wave {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 2.5px;
        height: 24px;
        color: var(--vt-accent);
      }
      .vt-bar {
        width: 2.5px;
        border-radius: 999px;
        background: currentColor;
        transition: height 65ms ease-out;
      }
      .vt-preparing .vt-bar,
      .vt-transcribing .vt-bar {
        animation: vt-idle 1.05s ease-in-out infinite;
      }
      .vt-done .vt-bar {
        opacity: 0.75;
      }
      .vt-copy {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #9ca3af;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.01em;
      }
      .vt-copy-live {
        color: #f3f4f6;
      }
      .vt-done .vt-copy {
        color: #a7f3d0;
      }
      .vt-time {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: flex-end;
        min-width: 34px;
        color: #cbd0d8;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .vt-check {
        display: block;
        width: 16px;
        height: 16px;
        color: var(--vt-accent);
      }
      .vt-esc {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
      }
      .vt-esc kbd {
        padding: 3px 5px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.06);
        color: #8f96a3;
        font: 600 9.5px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }
      @keyframes vt-in {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes vt-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @keyframes vt-idle {
        0%,
        100% {
          transform: scaleY(0.35);
        }
        50% {
          transform: scaleY(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .vt-pill {
          animation: none;
        }
        .vt-dot,
        .vt-bar {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/voice-hud-main.tsx"></script>
  </body>
</html>
