# Bun configuration for the frontend.

[install]
# Node tooling in this repository expects a hoisted tree.
linker = "hoisted"

[fmt]
# Matches the previous Prettier output.
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
quoteProps = "as-needed"
trailingComma = "all"
arrowParens = "always"
bracketSpacing = true
bracketSameLine = false
endOfLine = "lf"
insertFinalNewline = true
